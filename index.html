    else if(targetId === 'entries'){
      const d = normYmd(get(row,'date')) || (normMonth(get(row,'date')) ? normMonth(get(row,'date')) + '-01' : null);
      if(!d) return;
      const h = Number(String(get(row,'hours')).replace(/[^\d.]/g,''));
      const a = Number(String(get(row,'audience')).replace(/[^\d.]/g,''));
      newEntry(P, { date:d, dateMode:'day', type:'work', title:get(row,'title'),
        detail:get(row,'detail') || null,
        hours:isFinite(h) && h > 0 ? h : null,
        audience:isFinite(a) && a > 0 ? a : null });
    }
    n++;
  });
  return n;
}


/* ---------- 활동 유형 ----------
   본업 밖 활동이 많은 사람은 자문·강의·위원이 성격이 전혀 다르다.
   한 덩어리로 두면 20건이 시간순으로 늘어서서 무엇을 하는 사람인지 안 보인다. */
const PROJECT_KINDS = ['자문·심의', '강의·교육', '위원·평가', '수주 과제', '사이드 프로젝트', '기타'];

/**
 * 항목 문구에서만 유형을 짐작한다. 못 찾으면 null.
 * 표 제목은 믿지 않는다 — "교육"이라 적힌 표에 자문·심의가 12건 들어 있었다.
 * 그 표가 무엇인지는 만든 사람이 안다. 확인 화면에서 직접 고르게 한다.
 */
function guessProjectKind(name, org, role){
  const t = [name, org, role].filter(Boolean).join(' ');
  if(/심의위원|평가위원|자문위원|운영위원|편집위원|평의원|위원회/.test(t)) return '위원·평가';
  if(/강사|강의|특강|세미나|워크숍|연수|직무교육/.test(t)) return '강의·교육';
  if(/평가|심사|심의|검증/.test(t)) return '위원·평가';
  if(/자문|컨설팅|멘토/.test(t)) return '자문·심의';
  if(/용역|수주|계약/.test(t)) return '수주 과제';
  return null;
}


/**
 * "ROAS 180% → 260%" 같은 한 줄에서 지표를 뽑는다.
 * 사람은 이렇게 적는 게 자연스러운데, 앱은 숫자를 나눠 가져야 계산할 수 있다.
 * 못 알아보면 빈 배열을 돌려준다 — 지어내지 않는다.
 */
function parseMetricText(text){
  const s = String(text || '').trim();
  if(!s) return [];
  const out = [];
  const NUM = '(-?[\\d,.]+)';
  const re = new RegExp(
    '([^,;\\n]{0,20}?)\\s*' + NUM + '\\s*([%가-힣A-Za-z]{0,6}?)\\s*(?:→|->|~>|에서)\\s*' +
    NUM + '\\s*([%가-힣A-Za-z]{0,6})', 'g');
  let m;
  while((m = re.exec(s))){
    const before = Number(String(m[2]).replace(/,/g, ''));
    const after  = Number(String(m[4]).replace(/,/g, ''));
    if(!isFinite(before) || !isFinite(after)) continue;
    out.push({ name: (m[1] || '').trim() || '지표',
               before, after,
               unit: (m[5] || m[3] || '').trim() || null, delta: null });
  }
  return out;
}


/* ===== 02c-pdf.js ===== */
/* ============================================================
   PDF 텍스트 추출
   라이브러리를 쓰지 않는 이유는 앞과 같다 — 파일 하나로 끝나야 한다.

   한글 PDF는 대부분 Type0 글꼴 + Identity-H 인코딩이다.
   본문에 들어 있는 건 글자가 아니라 글리프 번호라서,
   ToUnicode CMap을 읽지 않으면 뜻 모를 기호만 나온다.
   그래서 이 파서의 절반은 CMap 처리다.

   할 수 있는 것: 텍스트 레이어가 있는 PDF에서 글자와 대략의 줄 배치를 꺼내기
   할 수 없는 것: 스캔본(이미지) 판독. 그건 OCR이 필요하고 여기서는 하지 않는다.
   ============================================================ */

const LATIN1 = new TextDecoder('latin1');

async function pdfInflate(bytes){
  if(typeof DecompressionStream === 'undefined')
    throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다');
  for(const fmt of ['deflate', 'deflate-raw']){
    try {
      const ds = new DecompressionStream(fmt);
      const wr = ds.writable.getWriter();
      wr.write(bytes); wr.close();
      const rd = ds.readable.getReader();
      const parts = []; let total = 0;
      for(;;){
        const { done, value } = await rd.read();
        if(done) break;
        parts.push(value); total += value.length;
      }
      const out = new Uint8Array(total);
      let at = 0; parts.forEach(p => { out.set(p, at); at += p.length; });
      return out;
    } catch(e){ /* zlib 헤더가 없으면 raw로 다시 */ }
  }
  throw new Error('스트림 압축 해제 실패');
}

/**
 * 파일 전체를 훑어 `N M obj … endobj`를 모은다. xref가 깨진 파일도 이 방식이면 읽힌다.
 * 스트림 길이는 반드시 /Length 로 자른다.
 * endstream 문자열을 찾아 자르면, 압축 데이터 안에 우연히 그 바이트열이 들어 있을 때
 * 스트림이 일찍 끊겨 압축 해제가 통째로 실패한다 — 실제로 그런 파일이 있었다.
 */
function pdfScanObjects(buf){
  const s = LATIN1.decode(buf);
  const raw = new Map();          // num → { dict, bodyStart, streamAt, endIdx }
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while((m = re.exec(s))){
    const num = +m[1];
    const start = m.index + m[0].length;
    const endIdx = s.indexOf('endobj', start);
    if(endIdx < 0) continue;
    const body = s.slice(start, endIdx);
    const sIdx = body.indexOf('stream');
    raw.set(num, { dict: sIdx >= 0 ? body.slice(0, sIdx) : body,
                   body, start, sIdx, endIdx });
  }

  /* /Length 가 간접 참조인 경우가 흔해서, 객체를 다 모은 뒤에 길이를 푼다. */
  const numOf = n => {
    const o = raw.get(n);
    if(!o) return null;
    const mm = /(-?\d+)/.exec(o.body);
    return mm ? +mm[1] : null;
  };

  const objs = new Map();
  raw.forEach((o, num) => {
    let stream = null;
    if(o.sIdx >= 0){
      let dataStart = o.start + o.sIdx + 6;
      if(s[dataStart] === '\r') dataStart++;
      if(s[dataStart] === '\n') dataStart++;

      const lenv = dictGet(o.dict, 'Length');
      let len = null;
      if(lenv && lenv.num !== undefined) len = lenv.num;
      else if(lenv && lenv.ref !== undefined) len = numOf(lenv.ref);

      let dataEnd = null;
      if(len !== null && len >= 0 && dataStart + len <= buf.length){
        /* 길이대로 자른 뒤 정말 endstream이 뒤따르는지 확인한다 */
        const tail = s.slice(dataStart + len, dataStart + len + 20);
        if(/^[\r\n\s]*endstream/.test(tail)) dataEnd = dataStart + len;
      }
      if(dataEnd === null){
        /* 길이를 못 믿을 때만 마지막 수단으로 문자열을 찾는다 */
        dataEnd = s.lastIndexOf('endstream', o.endIdx);
        if(dataEnd < dataStart) dataEnd = o.endIdx;
        while(dataEnd > dataStart && (s[dataEnd-1] === '\n' || s[dataEnd-1] === '\r')) dataEnd--;
      }
      stream = buf.subarray(dataStart, dataEnd);
    }
    objs.set(num, { dict: o.dict, stream });
  });
  return objs;
}

function dictGet(dict, key){
  const i = dict.indexOf('/' + key);
  if(i < 0) return null;
  let j = i + key.length + 1;
  while(j < dict.length && /\s/.test(dict[j])) j++;
  if(dict[j] === '/'){
    const m = /^\/([^\s/\[\]<>()]+)/.exec(dict.slice(j));
    return m ? { name: m[1] } : null;
  }
  if(dict[j] === '['){
    let depth = 0, k = j;
    for(; k < dict.length; k++){
      if(dict[k] === '[') depth++;
      else if(dict[k] === ']'){ depth--; if(!depth) break; }
    }
    return { array: dict.slice(j+1, k) };
  }
  if(dict[j] === '<' && dict[j+1] === '<'){
    let depth = 0, k = j;
    for(; k < dict.length - 1; k++){
      if(dict[k] === '<' && dict[k+1] === '<'){ depth++; k++; }
      else if(dict[k] === '>' && dict[k+1] === '>'){ depth--; k++; if(!depth) break; }
    }
    return { dict: dict.slice(j+2, k-1) };
  }
  const m = /^(\d+)\s+(\d+)\s+R\b/.exec(dict.slice(j));
  if(m) return { ref: +m[1] };
  const n = /^(-?[\d.]+)/.exec(dict.slice(j));
  if(n) return { num: parseFloat(n[1]) };
  return null;
}

function refsIn(text){
  const out = [];
  const re = /(\d+)\s+\d+\s+R\b/g;
  let m;
  while((m = re.exec(text || ''))) out.push(+m[1]);
  return out;
}

/* ---------- ToUnicode CMap ----------
   <0003> <0020>              한 글자
   <0010> <0012> <0041>       구간 (연속)
   <0010> <0012> [<41><42><43>]  구간 (나열) */
function parseCMap(text){
  const map = new Map();
  const hexToStr = h => {
    let out = '';
    for(let i = 0; i + 3 < h.length + 1; i += 4){
      const c = parseInt(h.substr(i, 4), 16);
      if(!isNaN(c)) out += String.fromCharCode(c);
    }
    return out;
  };

  const charRe = /beginbfchar([\s\S]*?)endbfchar/g;
  let m;
  while((m = charRe.exec(text))){
    const pairRe = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g;
    let p;
    while((p = pairRe.exec(m[1]))) map.set(parseInt(p[1], 16), hexToStr(p[2]));
  }

  const rangeRe = /beginbfrange([\s\S]*?)endbfrange/g;
  while((m = rangeRe.exec(text))){
    const body = m[1];
    const arrRe = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*\[([\s\S]*?)\]/g;
    let r;
    const used = [];
    while((r = arrRe.exec(body))){
      used.push([r.index, r.index + r[0].length]);
      const lo = parseInt(r[1], 16);
      const items = r[3].match(/<([0-9A-Fa-f]+)>/g) || [];
      items.forEach((it, i) => map.set(lo + i, hexToStr(it.replace(/[<>]/g, ''))));
    }
    const seqRe = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g;
    while((r = seqRe.exec(body))){
      if(used.some(([a,b]) => r.index >= a && r.index < b)) continue;
      const lo = parseInt(r[1], 16), hi = parseInt(r[2], 16);
      const base = parseInt(r[3].slice(-4), 16);
      const prefix = r[3].length > 4 ? hexToStr(r[3].slice(0, r[3].length - 4)) : '';
      for(let c = lo; c <= hi && c - lo < 65536; c++)
        map.set(c, prefix + String.fromCharCode(base + (c - lo)));
    }
  }
  return map;
}

/* ---------- 내용 스트림 토큰 ---------- */
function pdfTokens(s){
  const out = [];
  let i = 0;
  while(i < s.length){
    const c = s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c === '%'){ while(i < s.length && s[i] !== '\n') i++; continue; }
    if(c === '('){
      let depth = 1, j = i + 1, buf = '';
      while(j < s.length && depth){
        if(s[j] === '\\'){
          const n = s[j+1];
          const esc = { n:'\n', r:'\r', t:'\t', b:'\b', f:'\f', '(':'(', ')':')', '\\':'\\' };
          if(esc[n] !== undefined){ buf += esc[n]; j += 2; }
          else if(/[0-7]/.test(n)){
            const o = /^[0-7]{1,3}/.exec(s.slice(j+1))[0];
            buf += String.fromCharCode(parseInt(o, 8)); j += 1 + o.length;
          } else if(n === '\n'){ j += 2; }
          else { buf += n; j += 2; }
          continue;
        }
        if(s[j] === '('){ depth++; buf += '('; }
        else if(s[j] === ')'){ depth--; if(depth) buf += ')'; }
        else buf += s[j];
        j++;
      }
      out.push({ t:'str', v:buf, hex:false }); i = j; continue;
    }
    if(c === '<' && s[i+1] !== '<'){
      const j = s.indexOf('>', i);
      out.push({ t:'str', v:s.slice(i+1, j).replace(/\s/g,''), hex:true });
      i = j + 1; continue;
    }
    if(c === '<' && s[i+1] === '<'){ out.push({ t:'op', v:'<<' }); i += 2; continue; }
    if(c === '>' && s[i+1] === '>'){ out.push({ t:'op', v:'>>' }); i += 2; continue; }
    if(c === '[' || c === ']'){ out.push({ t:'op', v:c }); i++; continue; }
    if(c === '/'){
      const m = /^\/([^\s/\[\]<>(){}%]*)/.exec(s.slice(i));
      out.push({ t:'name', v:m[1] }); i += m[0].length; continue;
    }
    const num = /^[-+]?[\d.]+/.exec(s.slice(i));
    if(num && /[\d.\-+]/.test(c)){ out.push({ t:'num', v:parseFloat(num[0]) }); i += num[0].length; continue; }
    const op = /^[A-Za-z'"*]+[01]?/.exec(s.slice(i));
    if(op){ out.push({ t:'op', v:op[0] }); i += op[0].length; continue; }
    i++;
  }
  return out;
}

function decodeShown(raw, hex, cmap, twoByte){
  let codes = [];
  if(hex){
    const step = twoByte ? 4 : 2;
    for(let i = 0; i < raw.length; i += step)
      codes.push(parseInt(raw.substr(i, step).padEnd(step, '0'), 16));
  } else {
    if(twoByte){
      for(let i = 0; i < raw.length; i += 2)
        codes.push((raw.charCodeAt(i) << 8) | (raw.charCodeAt(i+1) || 0));
    } else {
      for(let i = 0; i < raw.length; i++) codes.push(raw.charCodeAt(i));
    }
  }
  return codes.map(c => {
    if(cmap && cmap.has(c)) return cmap.get(c);
    /* CMap이 없으면 1바이트는 라틴 문자로 보는 게 대체로 맞다 */
    return (!twoByte && c >= 32 && c < 127) ? String.fromCharCode(c) : '';
  }).join('');
}

function matMul(m, n){
  return [
    m[0]*n[0] + m[1]*n[2],
    m[0]*n[1] + m[1]*n[3],
    m[2]*n[0] + m[3]*n[2],
    m[2]*n[1] + m[3]*n[3],
    m[4]*n[0] + m[5]*n[2] + n[4],
    m[4]*n[1] + m[5]*n[3] + n[5]
  ];
}

/**
 * 내용 스트림에서 글자와 위치를 뽑는다.
 * 위치는 반드시 CTM까지 곱해서 종이 좌표로 바꾼다.
 * 한글 워드프로세서가 뽑은 PDF는 Y축을 뒤집어 놓는 경우가 많아서,
 * 텍스트 행렬만 보면 줄 순서가 거꾸로 나온다.
 */
function extractTextItems(content, fonts){
  const tk = pdfTokens(content);
  const items = [];
  let tm = [1,0,0,1,0,0], tlm = tm.slice();
  let ctm = [1,0,0,1,0,0];
  const ctmStack = [];
  let cur = null, leading = 0, fsize = 10;
  const stack = [];

  const setFont = name => { cur = fonts[name] || null; };
  const push = (raw, hex) => {
    if(!raw) return;
    const txt = decodeShown(raw, hex, cur && cur.cmap, cur ? cur.twoByte : false);
    if(txt.trim() === '' && txt.indexOf(' ') < 0) return;
    const dev = matMul(tm, ctm);
    const scale = Math.hypot(dev[0], dev[1]) || 1;
    items.push({ x: dev[4], y: dev[5], text: txt, size: fsize * scale });
  };

  for(let i = 0; i < tk.length; i++){
    const t = tk[i];
    if(t.t !== 'op'){ stack.push(t); continue; }
    /* 배열·사전 구분자는 연산자가 아니다. 여기서 스택을 비우면
       [<00>]TJ 에서 문자열이 사라진다 — 실제로 이것 때문에 0줄이 나왔다. */
    if(t.v === '[' || t.v === ']' || t.v === '<<' || t.v === '>>') continue;
    const a = stack;
    switch(t.v){
      case 'q': ctmStack.push(ctm.slice()); break;
      case 'Q': if(ctmStack.length) ctm = ctmStack.pop(); break;
      case 'cm': {
        const ns = a.filter(x => x.t === 'num').slice(-6);
        if(ns.length === 6) ctm = matMul(ns.map(x => x.v), ctm);
        break;
      }
      case 'BT': tm = [1,0,0,1,0,0]; tlm = tm.slice(); break;
      case 'Tf': {
        const nm = a.filter(x => x.t === 'name').pop();
        if(nm) setFont(nm.v);
        const sz = a.filter(x => x.t === 'num').pop();
        if(sz) fsize = Math.abs(sz.v) || 10;
        break;
      }
      case 'TL': { const n = a.filter(x=>x.t==='num').pop(); if(n) leading = n.v; break; }
      case 'Td': case 'TD': {
        const ns = a.filter(x => x.t === 'num').slice(-2);
        if(ns.length === 2){
          if(t.v === 'TD') leading = -ns[1].v;
          tlm = [tlm[0],tlm[1],tlm[2],tlm[3], tlm[4] + ns[0].v, tlm[5] + ns[1].v];
          tm = tlm.slice();
        }
        break;
      }
      case 'Tm': {
        const ns = a.filter(x => x.t === 'num').slice(-6);
        if(ns.length === 6){ tm = ns.map(x => x.v); tlm = tm.slice(); }
        break;
      }
      case 'T*': tlm = [tlm[0],tlm[1],tlm[2],tlm[3], tlm[4], tlm[5] - leading]; tm = tlm.slice(); break;
      case 'Tj': case "'": case '"': {
        if(t.v !== 'Tj'){ tlm = [tlm[0],tlm[1],tlm[2],tlm[3], tlm[4], tlm[5] - leading]; tm = tlm.slice(); }
        const st = a.filter(x => x.t === 'str').pop();
        if(st) push(st.v, st.hex);
        break;
      }
      case 'TJ': {
        a.filter(x => x.t === 'str').forEach(st => push(st.v, st.hex));
        break;
      }
    }
    stack.length = 0;
  }
  return items;
}

/**
 * 세로로 시원하게 비어 있는 띠를 찾아 단을 나눈다.
 * 논문·보고서는 2단 조판이 흔한데, 이걸 무시하고 Y좌표로만 묶으면
 * 왼쪽 칸과 오른쪽 칸이 한 줄로 붙어 문장이 뒤섞인다.
 */
function splitColumns(items){
  if(items.length < 40) return [items];
  const xs = items.map(i => i.x);
  const lo = Math.min(...xs), hi = Math.max(...xs);
  if(hi - lo < 120) return [items];

  const BINS = 60, w = (hi - lo) / BINS;
  const hist = new Array(BINS).fill(0);
  items.forEach(i => hist[Math.min(BINS-1, Math.floor((i.x - lo) / w))]++);

  /* 가운데 40% 구간에서 가장 넓은 빈 띠를 찾는다 */
  let best = null, run = 0, runStart = 0;
  for(let b = Math.floor(BINS*0.3); b < Math.floor(BINS*0.7); b++){
    if(hist[b] === 0){ if(!run) runStart = b; run++; }
    else { if(run && (!best || run > best.n)) best = { at:runStart, n:run }; run = 0; }
  }
  if(run && (!best || run > best.n)) best = { at:runStart, n:run };
  if(!best || best.n * w < 28) return [items];

  const cut = lo + (best.at + best.n / 2) * w;
  const left = items.filter(i => i.x < cut), right = items.filter(i => i.x >= cut);
  /* 한쪽이 너무 적으면 단이 아니라 그림·여백이다 */
  if(left.length < items.length * 0.15 || right.length < items.length * 0.15) return [items];
  return [left, right];
}

/** 위치로 줄을 묶는다. 표 안의 칸은 같은 줄에 나란히 놓는다. */
function itemsToLines(items){
  if(!items.length) return [];
  const cols = splitColumns(items);
  if(cols.length > 1) return cols.reduce((a, c) => a.concat(itemsToLines(c)), []);

  const sorted = items.slice().sort((a,b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  let cur = [sorted[0]];
  for(let i = 1; i < sorted.length; i++){
    /* 큰 제목 글꼴에서 오차를 크게 잡으면 두 줄짜리 제목이 한 줄로 뭉친다 */
    const tol = Math.min(5, Math.max(2, (cur[0].size || 10) * 0.25));
    if(Math.abs(sorted[i].y - cur[0].y) <= tol) cur.push(sorted[i]);
    else { lines.push(cur); cur = [sorted[i]]; }
  }
  lines.push(cur);

  return lines.map(ln => {
    ln.sort((a,b) => a.x - b.x);
    let out = '', lastEnd = null;
    ln.forEach(it => {
      const w = (it.size || 10) * 0.62;
      if(lastEnd !== null){
        const gap = it.x - lastEnd;
        if(gap > w * 1.6) out += '   ';            // 표의 다른 칸
        else if(gap > w * 0.35) out += ' ';        // 낱말 사이
      }
      out += it.text;
      lastEnd = it.x + it.text.length * w;
    });
    return out.replace(/[ ]{4,}/g, '   ').replace(/\s+$/,'').trim();
  }).filter(Boolean);
}

/** PDF → 줄 배열. 텍스트 레이어가 없으면 빈 배열과 함께 이유를 알려준다. */
async function readPdfText(buf){
  const bytes = new Uint8Array(buf);
  const objs = pdfScanObjects(bytes);
  if(!objs.size) throw new Error('PDF 구조를 읽지 못했습니다');

  /* 글꼴 목록을 먼저 만든다 — 이름이 겹치면 나중 것이 이긴다 */
  const fonts = {};
  const fontObjs = [];
  objs.forEach((o, num) => { if(/\/Type\s*\/Font/.test(o.dict)) fontObjs.push([num, o]); });

  for(const [num, o] of fontObjs){
    const twoByte = /\/Subtype\s*\/Type0/.test(o.dict) || /Identity-H/.test(o.dict);
    let cmap = null;
    const tu = dictGet(o.dict, 'ToUnicode');
    if(tu && tu.ref !== undefined){
      const t = objs.get(tu.ref);
      if(t && t.stream){
        try {
          const raw = /\/Flate/.test(t.dict) ? await pdfInflate(t.stream) : t.stream;
          cmap = parseCMap(LATIN1.decode(raw));
        } catch(e){}
      }
    }
    fonts['__obj' + num] = { cmap, twoByte };
  }

  /* 페이지 자원에서 /F1 같은 이름을 실제 글꼴에 잇는다 */
  const pages = [];
  objs.forEach((o, num) => { if(/\/Type\s*\/Page\b/.test(o.dict)) pages.push([num, o]); });

  const resolveFonts = pageDict => {
    const out = {};
    const res = dictGet(pageDict, 'Resources');
    let resText = res && res.dict ? res.dict : null;
    if(res && res.ref !== undefined){
      const r = objs.get(res.ref);
      if(r) resText = r.dict;
    }
    if(!resText) return out;
    const fd = dictGet(resText, 'Font');
    let fontText = fd && fd.dict ? fd.dict : null;
    if(fd && fd.ref !== undefined){
      const f = objs.get(fd.ref);
      if(f) fontText = f.dict;
    }
    if(!fontText) return out;
    const re = /\/([^\s/\[\]<>]+)\s+(\d+)\s+\d+\s+R/g;
    let m;
    while((m = re.exec(fontText))){
      const f = fonts['__obj' + (+m[2])];
      if(f) out[m[1]] = f;
    }
    return out;
  };

  const allLines = [];
  const targets = pages.length ? pages : [...objs.entries()].filter(([, o]) => o.stream);

  for(const [, page] of targets){
    const pageFonts = pages.length ? resolveFonts(page.dict) : fonts;
    const cRef = dictGet(page.dict, 'Contents');
    const ids = cRef && cRef.ref !== undefined ? [cRef.ref]
              : cRef && cRef.array !== undefined ? refsIn(cRef.array)
              : [];
    let content = '';
    for(const id of ids){
      const c = objs.get(id);
      if(!c || !c.stream) continue;
      try {
        const raw = /\/Flate/.test(c.dict) ? await pdfInflate(c.stream) : c.stream;
        content += LATIN1.decode(raw) + '\n';
      } catch(e){}
    }
    if(!content) continue;
    const items = extractTextItems(content, pageFonts);
    allLines.push(...itemsToLines(items));
  }

  if(!allLines.length){
    const hasImage = [...objs.values()].some(o => /\/Subtype\s*\/Image/.test(o.dict));
    throw new Error(hasImage
      ? '글자 레이어가 없습니다. 스캔한 PDF로 보입니다 — 이 앱은 이미지 판독(OCR)을 하지 않습니다.'
      : '글자를 찾지 못했습니다.');
  }
  return allLines;
}

/* ============================================================
   이력서 줄 → 항목 후보
   PDF에서 나오는 건 글자일 뿐 구조가 아니다.
   그래서 앱은 "이 줄은 저서로 보입니다"까지만 하고
   확정은 사람이 한다. 자동으로 밀어 넣으면 틀린 채로 쌓인다.
   ============================================================ */

/** 표에서 뽑힌 글자는 낱말 사이가 벌어져 있다. 한글 단위 앞 공백을 붙여 읽기 좋게 만든다. */
function tidyKo(s){
  return String(s)
    .replace(/\s{2,}/g, ' ')
    .replace(/\(\s+/g, '(').replace(/\s+\)/g, ')')
    .replace(/\[\s+/g, '[').replace(/\s+\]/g, ']')
    .replace(/(\d)\s+(년|월|일|세|가지|권|회|명|차시|급)/g, '$1$2')
    .replace(/(\d)\s+(을|를|이|가|은|는|의|와|과|에|로)(?=\s|$)/g, '$1$2')
    .replace(/\s+([,.])/g, '$1')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function ymFrom(s){
  let m = /(\d{4})\s*[.\-년]\s*(\d{1,2})/.exec(s);
  if(m) return m[1] + '-' + pad(Math.min(12, Math.max(1, +m[2])));
  m = /(\d{4})\s*년/.exec(s);
  if(m) return m[1] + '-01';
  m = /(\d{4})\s*[.\-]/.exec(s);
  return m ? m[1] + '-01' : null;
}

const RESUME_KINDS = [
  ['skip',          '무시'],
  ['experiences',   '경력'],
  ['education',     '학력'],
  ['certifications','자격증'],
  ['publications',  '저서·논문'],
  ['awards',        '수상'],
  ['profile',       '인적 사항']
];

function classifyResumeLine(raw){
  const t = tidyKo(raw);
  if(t.length < 3) return null;
  if(/^-\s*\d+\s*-$/.test(t)) return null;                 // 쪽 번호
  if(/^(이\s*력\s*서|경력기술서|자기소개서)$/.test(t.replace(/\s/g,''))) return null;

  const out = { text:t, kind:'skip', data:{} };

  /* 이름은 민감 정보가 아니다. 생년월일과 한 줄에 있다는 이유로 통째로 버리면
     이력서에 이름이 안 들어간다 — 실제로 그렇게 나왔다. 이름만 건져낸다. */
  const nameM = /(?:^|\s)(?:한\s*글|성\s*명|이\s*름|국\s*문)\s*[:）)]?\s*([가-힣]{2,5})(?=\s|$)/.exec(t);
  if(nameM && !/대학|회사|기관/.test(nameM[1])){
    out.kind = 'profile';
    out.data = { field:'name', value: nameM[1],
                 note:'같은 줄의 생년월일·연락처는 담지 않습니다' };
    return out;
  }

  /* 민감 정보는 그다음으로 걸러낸다.
     전화번호가 날짜 규칙에 걸려 경력으로 둔갑하는 일이 실제로 있었다. */
  if(/(생년월일|주민등록|주민번호|여권|계좌|휴대폰|휴대전화|연\s*락\s*처|전화|e-?mail|이메일|@|\d{3}-\d{3,4}-\d{4})/i.test(t)){
    out.sensitive = true;
    out.data = { note:'연락처·생년월일은 이력서에 필요하지 않아 담지 않습니다' };
    return out;
  }

  /* 표 머리글은 내용이 아니다 */
  const HEADERS = ['자격종목','자격증번호','합격년월일','교부기관','근무기간','회사명','부서',
                   '직위','직급','기간','구분','내용','비고','발령일','학교명','전공','학위',
                   '취득일','발행처','수상명'];
  if(HEADERS.filter(h => t.includes(h)).length >= 2 && !/\d{4}/.test(t)){
    out.data = { note:'표 머리글로 보입니다' };
    return out;
  }

  /* 저서·논문 */
  if(/^\(?\s*(저서|공저|역서|논문|기고|번역)\s*\)?/.test(t) || /발행\s*\)?$/.test(t)){
    const kind = (/(저서|공저|역서|논문|기고|번역)/.exec(t) || [,'저서'])[1];
    const title = t.replace(/^\(?\s*(저서|공저|역서|논문|기고|번역)\s*\)?\s*/, '')
                   .replace(/\s*\(\s*\d{4}[^)]*발행[^)]*\)\s*$/, '')
                   .replace(/\s*\(\s*\d{4}[.\s\d]*\)\s*$/, '').trim();
    out.kind = 'publications';
    out.data = { title, kind, publishedAt: ymFrom(t.slice(t.search(/\(\s*\d{4}/) + 1) || t), role:'단독' };
    if(!out.data.publishedAt) out.data.publishedAt = ymFrom(t);
    return out;
  }

  /* 학력 */
  if(/(대학교|대학원|고등학교|전문대|학위)/.test(t) && /(학사|석사|박사|졸업|수료|중퇴)/.test(t)){
    const school = (/([가-힣A-Za-z]+(?:대학교|대학원|고등학교|전문대))/.exec(t) || [])[1] || null;
    const degree = (/(학사|석사|박사)/.exec(t) || [])[1] || null;
    let major = t.replace(/^\(?\s*학위\s*\)?\s*/, '');
    if(school) major = major.replace(school, '');
    major = major.replace(/(대학교|대학원)/g, '').replace(/(학사|석사|박사)/, '')
                 .replace(/\(\s*\d{4}[^)]*\)/, '').trim();
    out.kind = 'education';
    out.data = { school, degree, major: major || null, end: ymFrom(t) };
    return out;
  }

  /* 자격증 */
  if(/(기사|산업기사|기술사|기능사|자격증|면허|상담사|지도사|\d급)/.test(t) && !/대학|저서/.test(t)){
    const name = (/([가-힣A-Za-z]+(?:기사|산업기사|기술사|기능사|상담사|지도사))/.exec(t) || [])[1]
              || t.split(/\s+/)[0];
    const issuer = (/\(([^)]*(?:공단|협회|원|부|청|위원회)[^)]*)\)/.exec(t) || [])[1]
                || (/([가-힣]+(?:공단|협회|위원회))/.exec(t) || [])[1] || null;
    out.kind = 'certifications';
    out.data = { name, issuer, issuedAt: ymFrom(t) };
    return out;
  }

  /* 경력 — 기간이 있고 소속으로 보이는 말이 있으면 */
  const hasSpan = /\d{4}\s*[.\-년]\s*\d{1,2}[^~]*(~|-|–|부터)/.test(t) || /~\s*(현재|재직)/.test(t);
  if(hasSpan || /^\(\s*현\s*\)/.test(t)){
    const isCurrent = /(현재|재직)/.test(t);
    const body = t.replace(/^\(\s*현\s*\)\s*/, '');
    const start = ymFrom(body);
    let end = null;
    if(!isCurrent){
      const tail = body.slice(body.search(/[~\-–]/) + 1);
      end = ymFrom(tail);
    }
    const clean = body.replace(/\(\s*\d{4}[^)]*\)/g, '').trim();
    const words = clean.split(/\s+/);
    out.kind = 'experiences';
    out.data = {
      org: words.slice(0, Math.max(1, words.length - 1)).join(' ') || clean,
      title: words.length > 1 ? words[words.length - 1] : null,
      start, end, isCurrent
    };
    return out;
  }

  /* 인적 사항 — 민감한 값은 담지 않는다 */
  if(/(현\s*소\s*속|소속)/.test(t)){
    out.kind = 'profile';
    out.data = { field:'headline', value: t.replace(/.*?(소\s*속)\s*/, '').trim() };
    return out;
  }
  if(/현\s*주\s*소|주소/.test(t)){
    const m = /([가-힣]+(?:특별시|광역시|도))\s*([가-힣]+시|[가-힣]+군|[가-힣]+구)?/.exec(t);
    out.kind = 'profile';
    out.data = { field:'location', value: m ? [m[1], m[2]].filter(Boolean).join(' ') : null,
                 note:'상세 주소는 담지 않습니다' };
    return out;
  }
  return out;
}

function classifyResume(lines){
  return lines.map(classifyResumeLine).filter(Boolean);
}

function pdfRowSummary(r){
  const d = r.data || {};
  if(r.kind === 'experiences') return [d.org, d.title, d.start ? d.start + (d.isCurrent ? ' ~ 현재' : d.end ? ' ~ ' + d.end : '') : null].filter(Boolean).join(' · ');
  if(r.kind === 'education') return [d.school, d.major, d.degree, d.end].filter(Boolean).join(' · ');
  if(r.kind === 'certifications') return [d.name, d.issuer, d.issuedAt].filter(Boolean).join(' · ');
  if(r.kind === 'publications') return [d.kind, d.publishedAt].filter(Boolean).join(' · ');
  if(r.kind === 'profile') return d.value || '';
  return '';
}

/* ============================================================
   논문 PDF → 저서·논문 항목
   연구직·전문직에게 논문은 경력의 핵심인데,
   지금까지는 이력서나 업무기록으로만 읽어서 아무 데도 담기지 않았다.

   제목은 조판에 따라 조각이 섞이는 일이 잦다.
   그래서 기계가 확정하지 않고 후보를 여러 개 내놓고 사람이 고른다.
   ============================================================ */

/** 본문이 이미지인 스캔본인지. 워터마크만 텍스트인 파일이 흔하다. */
function looksScanned(lines){
  if(!lines.length) return true;
  const t = lines.map(l => String(l).trim()).filter(Boolean);
  const uniq = new Set(t);
  const watermark = t.filter(l =>
    /Download by IP|Provider:|www\.|Downloaded from|All rights reserved/i.test(l)).length;
  if(t.length < 25 && watermark >= t.length * 0.4) return true;
  return uniq.size < t.length * 0.35;
}

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

/** 파일 이름에서 제목 후보를 만든다. 내려받은 논문은 이름에 제목이 들어 있는 일이 많다. */
function titleFromFilename(name){
  let s = String(name || '').replace(/\.pdf$/i, '');
  s = s.replace(/[_]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
  s = s.replace(/^\d+\s+/, '');
  /* 뒤쪽 서지 꼬리표를 걷어낸다 */
  s = s.replace(/\s*\d+\s*권?\s*\d*\s*호.*$/, '')
       .replace(/\s*\d{2,4}\s*[-–]\s*\d{2,4}.*$/, '')
       .replace(/\s*\d{6}.*$/, '')
       .replace(/\s*\(?(pp?\.?)\s*\d+.*$/i, '')
       .trim();
  return s.length >= 8 ? s : null;
}

function parseDocPaper(lines, filename){
  const txt = l => (l && typeof l === 'object') ? l.text : String(l);
  const L = lines.map(txt).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const head = L.slice(0, 30);
  const all = L.join('\n');
  const out = { warn: [], titleCandidates: [], authors: [] };

  if(looksScanned(L)){
    out.warn.push('본문이 이미지로 보입니다 — 스캔본이면 글자를 꺼낼 수 없습니다. ' +
                  '제목·저자는 직접 채워주세요.');
  }

  /* DOI */
  const doi = /\b(10\.\d{4,9}\/[^\s"'<>,)]+)/.exec(all);
  if(doi) out.identifier = doi[1].replace(/[.,;]$/, '');

  /* 권·호·쪽 */
  let m = /Vol\.?\s*(\d+)\s*,?\s*No\.?\s*(\d+)\s*,?\s*pp?\.?\s*(\d+)\s*[-–~]\s*(\d+)/i.exec(all);
  if(m) out.volume = { vol:+m[1], no:+m[2], from:+m[3], to:+m[4] };
  else {
    m = /제?\s*(\d+)\s*권\s*제?\s*(\d+)\s*호[^\d]{0,6}(\d+)\s*[-–~]\s*(\d+)/.exec(all);
    if(m) out.volume = { vol:+m[1], no:+m[2], from:+m[3], to:+m[4] };
  }

  /* 발행 시점 */
  m = new RegExp('(' + MONTHS.join('|') + ')\\s+(20\\d{2})', 'i').exec(all);
  if(m){
    const mo = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase()) + 1;
    out.publishedAt = m[2] + '-' + pad(mo);
  } else {
    m = /(20\d{2})\s*년\s*(\d{1,2})\s*월/.exec(all);
    if(m) out.publishedAt = m[1] + '-' + pad(+m[2]);
    else {
      m = /\b(20\d{2})\s*\.\s*(\d{1,2})\b/.exec(all);
      if(m) out.publishedAt = m[1] + '-' + pad(+m[2]);
      else { m = /\b(20\d{2})\b/.exec(all); if(m) out.publishedAt = m[1] + '-01'; }
    }
  }

  /* 학술지 */
  const jl = head.find(l => /Journal of|학회지|^J\.\s|Atmospheric|Environment\b/i.test(l) && l.length < 120);
  if(jl){
    let pub = jl.replace(/ISSN.*$/i, '')
      .replace(/Vol\.?\s*\d+.*$/i, '').replace(/제?\s*\d+\s*권.*$/, '')
      .replace(/\b\d{3,4}\s*\(20\d{2}\).*$/, '')
      .replace(/https?:\/\/\S+/g, '').replace(/\s{2,}/g, ' ').trim();
    /* 같은 학술지 이름이 정식명·약칭으로 두 번 붙는 조판이 흔하다 */
    const half = Math.floor(pub.length / 2);
    for(let cut = pub.length - 6; cut > half - 6 && cut > 8; cut--){
      const a = pub.slice(0, cut).trim(), b = pub.slice(cut).trim();
      const norm = x => x.replace(/[^A-Za-z가-힣]/g, '').toLowerCase();
      if(b.length > 6 && norm(a).startsWith(norm(b).slice(0, 6))){ pub = a; break; }
    }
    out.publisher = pub.replace(/[.,;\s]+$/, '');
  }

  /* 저자 — 가운뎃점으로 이어진 한글 이름 줄이 가장 확실하다 */
  const korAuthor = L.slice(0, 24).find(l =>
    /^[가-힣]{2,4}\s*[*†]?\s*(\d|\*)*\s*(·|,|\u00b7)/.test(l) && l.length < 70 && !/대학|학과|청$|센터/.test(l));
  if(korAuthor){
    out.authors = korAuthor.split(/[·,\u00b7]/)
      .map(x => x.replace(/[\d*†\s]/g, '').trim()).filter(x => /^[가-힣]{2,4}$/.test(x));
    out.corresponding = /[*†]/.test(korAuthor)
      ? (korAuthor.split(/[·,\u00b7]/).findIndex(x => /[*†]/.test(x))) : -1;
  }
  if(!out.authors.length){
    const engAuthor = L.slice(0, 26).find(l =>
      /^[A-Z][a-z]+[-\s][A-Z][a-z]+/.test(l) && /[·,]/.test(l) && l.length < 100 && !/University|Depart/i.test(l));
    if(engAuthor) out.authors = engAuthor.split(/[·,\u00b7]/)
      .map(x => x.replace(/[\d*†]/g, '').trim()).filter(x => x.length > 3 && x.length < 30);
  }

  /* 제목 후보 — 파일 이름과 본문 양쪽에서 */
  const fromName = titleFromFilename(filename);
  if(fromName) out.titleCandidates.push({ src:'파일 이름', text:fromName });

  const skip = /ISSN|https?:|Journal of|학회지|Vol\.|Abstract|Keywords|^\d|Received|Accepted|Revised|대학|학과|청$/i;
  const authorIdx = korAuthor ? L.indexOf(korAuthor) : -1;
  const zone = authorIdx > 0 ? L.slice(Math.max(0, authorIdx - 4), authorIdx) : L.slice(1, 6);
  zone.filter(l => l.length >= 10 && l.length < 120 && !skip.test(l))
      .forEach(l => out.titleCandidates.push({ src:'본문', text:l }));

  const engTitle = L.slice(0, 30).find(l =>
    /^[A-Z]/.test(l) && l.length > 25 && l.length < 160 &&
    /\s/.test(l) && !skip.test(l) && (l.match(/[A-Za-z]/g) || []).length > l.length * 0.6);
  if(engTitle) out.titleCandidates.push({ src:'영문', text:engTitle });

  out.title = out.titleCandidates.length ? out.titleCandidates[0].text : '';
  return out;
}

/**
 * 이 문서가 논문인지.
 * 스캔본은 본문이 이미지라 점수가 안 나온다.
 * 그래도 파일 이름에 권·호·쪽이 남아 있으면 논문으로 본다 — 내려받은 파일은 대개 그렇다.
 */
function looksLikePaper(lines, filename){
  const t = lines.map(l => (l && typeof l === 'object') ? l.text : String(l)).join('\n');
  let score = 0;
  const fn = String(filename || '');
  if(/\d+\s*권|\d+\s*호|pp?\.?\s*\d+\s*[-–]\s*\d+|학회지|Journal/i.test(fn)) score += 3;
  if(/\d{2,4}\s*[-–]\s*\d{2,4}/.test(fn) && /\d{6}|20\d{2}/.test(fn)) score += 2;
  if(looksScanned(lines) && score >= 3) return true;
  if(/\b10\.\d{4,9}\//.test(t)) score += 4;              // DOI
  if(/ISSN/i.test(t)) score += 3;
  if(/Journal of|학회지|Atmospheric Environment/i.test(t)) score += 3;
  if(/Abstract/i.test(t)) score += 2;
  if(/Keywords?\s*[:：]/i.test(t)) score += 2;
  if(/References/i.test(t)) score += 1;
  if(/Vol\.?\s*\d+\s*,?\s*No\.?\s*\d+/i.test(t)) score += 2;
  return score >= 6;
}


/* ===== 02d-doclog.js ===== */
/* ============================================================
   문서(PDF·Word) → 업무 기록
   주간보고·업무일지는 대개 이렇게 생겼다.

     [업무]
       · 8/4(월)  파이프라인 오류 대응  (2.5h)
       · 8/5      고객사 미팅
     8/6 (수)
       설비 점검 3건
       보고서 초안 작성

   날짜가 줄마다 붙어 있기도 하고, 머리글로 한 번 나오고
   그 아래 항목들이 딸려 있기도 하다. 둘 다 읽어야 한다.
   ============================================================ */

const DOC_SECTION = /^[\[\(\<【■◆▶●○*\-–—\s]*(업무|작업|강의|강연|교육|참여|참석|회의|미팅|학습|공부|스터디|기타|주요\s*업무|담당\s*업무|추진\s*실적|주요\s*실적)\s*(?:\([^)]*\))?[\]\)\>】\s:：]*$/;

/* 총평·다음주 계획 같은 서술 구역. 여기 아래는 항목이 아니라 문장이다. */
const DOC_SKIP = /^[\[\(\<【■◆▶●○*\-–—\s]*(총평|요약|공유|논의|다음\s*주|다음\s*달|다음\s*해|계획|비고|이슈|목차|소감|끝|이상)/;

/* 문서 제목 — "2026년 8월 1주 주간업무보고" */
const DOC_TITLE = /(주간|월간|연간|분기|주별|월별)\s*.{0,8}(보고|실적|일지|계획)|업무\s*(보고|일지)\s*$/;

/* 집계·머리말 줄. 우리가 만든 보고서를 되읽을 때도 이게 항목으로 잡힌다. */
const DOC_META = /^총\s*[\d,]+\s*건|직전\s*(주간|월간|연간|주|달|해)\s*대비|^\d{4}년\s*\d+\s*주|^(회차|누적|평균)\s|^\[?(요약|주차별|월별|중요\s*표시한\s*일|커리어\s*성과로\s*기록|아래\s*단계)/;

/** 줄에서 날짜를 찾는다. 연도가 없으면 문맥에서 받아온다. */
function docDate(line, baseYear, baseMonth){
  let m = /(\d{4})\s*[.\-년]\s*(\d{1,2})\s*[.\-월]\s*(\d{1,2})/.exec(line);
  if(m) return { ymd: m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]), len: m[0].length, at: m.index };

  m = /(?:^|\s)(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*(?:\([월화수목금토일]\))?(?=\s|$|[.,)])/.exec(line);
  if(m){
    const mo = +m[1], da = +m[2];
    if(mo >= 1 && mo <= 12 && da >= 1 && da <= 31)
      return { ymd: baseYear + '-' + pad(mo) + '-' + pad(da), len: m[0].length, at: m.index };
  }
  m = /(?:^|\s)(\d{1,2})\s*월\s*(\d{1,2})\s*일/.exec(line);
  if(m) return { ymd: baseYear + '-' + pad(+m[1]) + '-' + pad(+m[2]), len: m[0].length, at: m.index };

  m = /(?:^|\s)(\d{1,2})\s*일(?:\s*\([월화수목금토일]\))?(?=\s|$)/.exec(line);
  if(m && baseMonth) return { ymd: baseYear + '-' + pad(baseMonth) + '-' + pad(+m[1]), len: m[0].length, at: m.index };
  return null;
}

/** 그 줄이 날짜 머리글인지 — 날짜를 빼면 거의 남는 게 없는 줄 */
function isDateHeader(line, d){
  if(!d) return false;
  const rest = (line.slice(0, d.at) + line.slice(d.at + d.len))
    .replace(/[\[\]()（）<>【】·•\-–—:：,.\s]|[월화수목금토일]요일?/g, '');
  return rest.length <= 2;
}

/**
 * 문서 줄 → 기록 후보.
 * opts.fallbackWeek — 날짜를 못 찾은 항목을 넣을 주
 */
function parseDocEntries(lines, opts){
  opts = opts || {};
  const fallbackWeek = opts.fallbackWeek || thisWeek();
  const monday = weekMonday(fallbackWeek);

  /* 연·월 실마리를 문서 전체에서 먼저 찾는다 */
  let baseYear = monday ? monday.getFullYear() : new Date().getFullYear();
  let baseMonth = null;
  for(const l of lines){
    const y = /(20\d{2})\s*[년.\-]/.exec(l);
    if(y){ baseYear = +y[1];
      const mo = /(20\d{2})\s*[년.\-]\s*(\d{1,2})\s*[월.\-]/.exec(l);
      if(mo) baseMonth = +mo[2];
      break;
    }
  }

  const out = [], warn = [];
  let curDate = null, curType = 'work', headerCount = 0, undated = 0;
  let skipping = false, lastItem = null, lastIndent = 0;

  lines.forEach(raw => {
    const meta = (raw && typeof raw === 'object') ? raw : null;
    let s = String(meta ? meta.text : raw).replace(/\s+/g, ' ').trim();
    if(!s || s.length < 2) return;
    if(/^-\s*\d+\s*-$/.test(s)) return;                    // 쪽 번호
    if(DOC_TITLE.test(s)) return;                          // 문서 제목
    if(DOC_META.test(s)) return;                           // 집계·머리말

    const sec = (meta && meta.table) ? null : DOC_SECTION.exec(s);
    if(sec){
      const w = sec[1].replace(/\s/g, '');
      curType = TYPE_WORDS[w] || (/실적|업무/.test(w) ? 'work' : curType);
      skipping = false;
      return;
    }
    /* 총평 아래는 문장이지 항목이 아니다. 다음 구역 머리글이 나올 때까지 건너뛴다. */
    if(DOC_SKIP.test(s)){ skipping = true; return; }
    if(skipping) return;

    /* 항목 아래 딸린 설명은 새 항목이 아니다.
       들여쓰기가 더 깊거나 본문 스타일이 다르면 바로 위 항목에 붙인다. */
    if(meta && lastItem){
      const deeper = meta.indent > lastIndent || (meta.indent === lastIndent && !meta.hanging && lastItem._hang);
      const sideStyle = /Meta|Quote|Caption/i.test(meta.style || '');
      if((deeper || sideStyle) && !DOC_SECTION.test(s) && !docDate(s, baseYear, baseMonth)){
        lastItem.detail = (lastItem.detail ? lastItem.detail + ' / ' : '') + s;
        return;
      }
    }

    /* 기호를 먼저 걷어낸 뒤에 날짜를 찾는다.
       순서를 바꾸면 날짜 위치가 어긋나 제목이 잘려 나간다 — 실제로 그랬다. */
    let important = false;
    s = s.replace(/^[·•▪◦○●\-–—*\s]+/, '');
    if(/^[★☆]\s*/.test(s)){ important = true; s = s.replace(/^[★☆]\s*/, ''); }
    if(s.length < 3) return;

    const d = docDate(s, baseYear, baseMonth);
    if(d && isDateHeader(s, d)){ curDate = d.ymd; headerCount++; return; }

    let date = curDate;
    if(d){
      date = d.ymd;
      s = (s.slice(0, d.at) + ' ' + s.slice(d.at + d.len)).replace(/\s+/g, ' ').trim();
      s = s.replace(/^[·•\-–—:()\s]+/, '');
    }

    /* 시간·인원은 주간 일괄 입력과 같은 표기를 쓴다 */
    let hours = null, audience = null;
    let m = /(?:^|\s|\()(\d+(?:\.\d+)?)\s*(?:h|H|시간)(?=\s|\)|$)/.exec(s);
    if(m){ hours = Number(m[1]); s = s.replace(m[0], ' '); }
    m = /(?:^|\s|\()(\d+)\s*명(?=\s|\)|$)/.exec(s);
    if(m){ audience = Number(m[1]); s = s.replace(m[0], ' '); }
    if(/★/.test(s)){ important = true; s = s.replace(/★/g, ''); }

    let type = curType;
    const words = s.trim().split(' ');
    const head = (words[0] || '').replace(/[\[\]():·]/g, '');
    if(TYPE_WORDS[head]){ type = TYPE_WORDS[head]; words.shift(); s = words.join(' '); }

    /* 요일 표기만 걷어낸다. 조건 없이 한 글자를 지우면
       "화성시"가 "성시"가 되고 "수원시"가 "원시"가 된다 — 실제로 그랬다. */
    const title = s.replace(/^(\([월화수목금토일]\)|[월화수목금토일]요일|[월화수목금토일](?=\s))\s*/, '')
                   .replace(/[()\s]+$/, '').replace(/\s{2,}/g, ' ').trim();
    if(title.length < 3) return;

    if(!date){ undated++; date = monday ? ymd(monday) : ymd(new Date()); }

    const item = { date, dateMode: (curDate || d) ? 'day' : 'week',
                   type, title: title.slice(0, 160), detail: null,
                   hours, audience, important };
    if(meta) item._hang = !!meta.hanging;
    out.push(item);
    lastItem = item;
    lastIndent = meta ? meta.indent : 0;
  });

  out.forEach(o => { delete o._hang; });
  if(undated) warn.push(`날짜를 못 찾은 ${undated}건은 ${weekLabel(fallbackWeek)}의 주 단위 기록으로 넣습니다`);
  if(!headerCount && !out.some(e => e.dateMode === 'day'))
    warn.push('문서에서 날짜를 찾지 못했습니다 — 아래에서 주를 골라주세요');

  return { entries: out, warn, baseYear, headerCount };
}

/* ============================================================
   문서 → 보고서
   월간·연간 보고서는 기록이 아니다. 집계는 앱이 다시 계산하면 되고,
   문서에서 건져야 할 건 사람이 쓴 부분 — 총평·이슈·다음 계획이다.
   그걸 버리고 낱개 항목만 긁어오면 문서를 넣은 의미가 없다.
   ============================================================ */

const REP_SECTIONS = [
  ['summary',  /^[\[\(【\s]*(총평|종합\s*의견|소감|평가)/],
  ['issues',   /^[\[\(【\s]*(공유|논의|이슈|건의|애로|특이\s*사항)/],
  ['nextPlan', /^[\[\(【\s]*(다음\s*(주|달|해|월|년|분기)\s*계획|향후\s*계획|차주\s*계획|계획)/]
];

/* 집계 구역 — 앱이 다시 계산하므로 문서에서 가져올 필요가 없다 */
const REP_ROLLUP = /^[\[\(【\s]*(요약|주차별|월별|분기별|아래\s*단계[^|]*|강의\s*실적|커리어\s*성과로\s*기록)\s*(?:\([^)]*\))?[\]\)】\s:：]*$/;

/* 항목이 들어 있는 구역. 주간보고는 총평과 항목을 함께 담고 있어서
   둘 다 건져야 한다 — 항목만 보면 맥락이 없고, 총평만 보면 실적이 없다. */
const REP_ITEMS = /^[\[\(【\s]*(업무|작업|강의|강연|교육|참여|참석|회의|미팅|학습|공부|스터디|기타|주요\s*업무|담당\s*업무|추진\s*실적|주요\s*실적|중요\s*표시한\s*일)\s*(?:\([^)]*\))?[\]\)】\s:：]*$/;

/** 문서에서 어느 기간의 보고서인지 알아낸다. */
function docReportPeriod(lines){
  const head = lines.slice(0, 6).join(' ');
  let unit = /연간/.test(head) ? 'year' : /월간/.test(head) ? 'month'
           : /주간/.test(head) ? 'week' : null;

  const wk = /(\d{4})\s*년?\s*(\d{1,2})\s*주/.exec(head);
  const mo = /(\d{4})\s*[년.\-]\s*(\d{1,2})\s*월/.exec(head);
  const yr = /(\d{4})\s*년/.exec(head);

  if(!unit) unit = wk ? 'week' : mo ? 'month' : yr ? 'year' : null;
  if(!unit) return null;

  if(unit === 'week' && wk)  return { unit, key: wk[1] + '-W' + pad(+wk[2]) };
  if(unit === 'month' && mo) return { unit, key: mo[1] + '-' + pad(+mo[2]) };
  if(unit === 'year' && yr)  return { unit, key: yr[1] };
  /* 단위는 알겠는데 기간을 못 찾은 경우 — 사용자가 고르게 둔다 */
  return { unit, key: null };
}

/**
 * 보고서 문서에서 사람이 쓴 부분과 항목을 갈라낸다.
 * 집계 숫자는 가져오지 않는다 — 원본 기록에서 다시 계산하는 게 항상 맞다.
 */
function parseDocReport(lines){
  const txt = l => (l && typeof l === 'object') ? l.text : String(l);
  const period = docReportPeriod(lines.map(txt));
  const out = { period, summary:'', issues:'', nextPlan:'', items:[], warn:[] };
  const tableRows = [];

  let cur = null, itemMode = false, itemType = 'work', itemDate = null;
  lines.forEach(raw => {
    const meta = (raw && typeof raw === 'object') ? raw : null;
    const s = txt(raw).replace(/\s+/g, ' ').trim();
    if(!s || s.length < 2) return;
    if(/^-\s*\d+\s*-$/.test(s)) return;

    /* 표 안의 글자는 구역 머리글도 서술도 아니다. 집계표의 셀일 뿐이다.
       "총평"이라는 열 이름 하나 때문에 그 아래 표 전체가
       총평으로 빨려 들어간 적이 있다. */
    if(meta && meta.table){ if(itemMode && !cur) tableRows.push(s); return; }

    /* 구역 머리글 판정이 집계줄 판정보다 먼저다.
       순서를 바꾸면 "중요 표시한 일" 머리글이 집계줄로 걸러져
       그 아래 항목을 영영 못 줍는다 — 실제로 그랬다. */
    const sec = REP_SECTIONS.find(([, re]) => re.test(s));
    if(sec){ cur = sec[0]; itemMode = false; return; }

    if(REP_ROLLUP.test(s)){ cur = null; itemMode = false; return; }

    const im = REP_ITEMS.exec(s);
    if(im){
      cur = null; itemMode = true;
      const wname = im[1].replace(/\s/g, '');
      itemType = TYPE_WORDS[wname] || (/실적|업무/.test(wname) ? 'work' : 'work');
      return;
    }

    if(cur){ out[cur] += (out[cur] ? '\n' : '') + s.replace(/^[·•\-–—*\s]+/, ''); return; }
    if(DOC_META.test(s)) return;                 // 집계·머리말 줄

    if(itemMode){
      /* 날짜 머리글은 그 아래 항목들이 물려받아야 하므로 모아서 넘긴다 */
      const dd = docDate(s, (period && period.key || '2026').slice(0,4), null);
      if(dd && isDateHeader(s, dd)){ itemDate = dd.ymd; return; }
      const fw = (period && period.unit === 'week' && period.key) ? period.key
               : (period && period.unit === 'month' && period.key)
                 ? weekKey(period.key + '-15') : thisWeek();
      const pre = [`[${TYPE_LABEL[itemType] || '업무'}]`];
      if(itemDate) pre.push(itemDate);
      const one = parseDocEntries(pre.concat([raw]), { fallbackWeek: fw });
      if(one.entries.length) out.items.push(one.entries[one.entries.length - 1]);
    }
  });

  if(!out.summary && !out.issues && !out.nextPlan)
    out.warn.push('총평·이슈·계획을 찾지 못했습니다 — 업무 기록으로 읽는 편이 나을 수 있습니다');
  if(period && !period.key)
    out.warn.push('어느 기간인지 문서에서 찾지 못했습니다 — 아래에서 골라주세요');
  return out;
}

/** 이력서 / 업무 기록 / 보고서 / 논문 중 무엇인지 */
function guessDocMode(lines, filename){
  if(typeof looksLikePaper === 'function' && looksLikePaper(lines, filename)) return 'paper';
  const arr = lines.map(l => (l && typeof l === 'object') ? l.text : String(l));
  const text = arr.join('\n');
  let resume = 0, log = 0, report = 0;

  if(/이\s*력\s*서|경력기술서|자기소개서/.test(text)) resume += 4;
  resume += (text.match(/\(저서\)|\(학위\)|자격종목|병역사항|최종학력|생년월일/g) || []).length * 2;

  if(/(주간|월간|연간|분기)\s*(업무\s*)?보고/.test(text)) report += 5;
  if(/^[\[\(【\s]*(총평|공유|논의)/m.test(text)) report += 3;
  if(/다음\s*(주|달|해|분기)\s*계획/.test(text)) report += 3;
  if(/^[\[\(【\s]*(주차별|월별|분기별)/m.test(text)) report += 3;

  if(/업무\s*일지|추진\s*실적|일지/.test(text)) log += 3;
  const dated = arr.filter(l => docDate(l, 2026, null)).length;
  log += Math.min(8, Math.floor(dated / 3));
  if(dated >= arr.length * 0.3) log += 3;

  if(report >= 6 && report >= log) return 'report';
  return log > resume ? 'log' : 'resume';
}

/* ============================================================
   기록에 축 붙이기
   같은 앱인데 엑셀로 넣으면 분석이 되고 문서로 넣으면 안 되면,
   결과물이 입력 경로에 따라 달라진다. 그건 도구가 일관적이지 않은 것이다.

   두 가지로 채운다.
   ① 제목이 구분자로 나뉘어 있으면 그 조각을 축에 배정한다
   ② 이 묶음 전체에 공통으로 붙일 값을 지정한다
   ============================================================ */

/** 제목을 구분자로 쪼갠다. "화성시 · 발안산단 · 도장업" 같은 꼴이 흔하다. */
function splitTitleParts(title){
  const s = String(title || '').trim();
  for(const sep of [' · ', ' / ', ' | ', '·', '/', '|']){
    const parts = s.split(sep).map(x => x.trim()).filter(Boolean);
    if(parts.length >= 2) return parts;
  }
  return [s];
}

/** 이 묶음에서 제목이 몇 조각으로 나뉘는지 — 축 배정 화면을 그릴 근거 */
function titleShape(rows){
  const counts = {};
  rows.forEach(r => { const n = splitTitleParts(r.title).length; counts[n] = (counts[n]||0) + 1; });
  const best = Object.keys(counts).map(Number).sort((a,b) => counts[b] - counts[a])[0] || 1;
  return { parts: best, share: Math.round((counts[best] || 0) / Math.max(1, rows.length) * 100) };
}

/**
 * 축을 채운다.
 * assign: 조각 번호 → 축 이름 ('' 이면 그 조각은 제목에 남긴다)
 * common: 전부에 붙일 값
 */
function applyAxesToRows(rows, assign, common, keepTitle){
  rows.forEach(r => {
    const f = Object.assign({}, r.facets || {}, common || {});
    const parts = splitTitleParts(r.title);
    const used = [];
    (assign || []).forEach((axis, i) => {
      if(!axis || !parts[i]) return;
      f[axis] = parts[i];
      used.push(i);
    });
    /* 축으로 옮긴 조각을 제목에서 뺄지는 사람이 정한다.
       빼면 제목이 짧아 읽기 좋고, 두면 원문 그대로 남는다. */
    if(!keepTitle && used.length && used.length < parts.length){
      r.title = parts.filter((_, i) => !used.includes(i)).join(' · ');
    }
    r.facets = f;
  });
  return rows;
}

/* ============================================================
   내보내기 — .xlsx / .docx / .json
   OOXML을 직접 조립한다. 라이브러리를 쓰지 않으므로 파일 하나로 끝난다.

/* ---------- xlsx ---------- */

function sheetXml(rows, widths){
  const cols = (widths || []).map((w,i) =>
    `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const body = rows.map((row, ri) => {
    const cells = row.map((v, ci) => {
      const ref = colName(ci) + (ri + 1);
      if(v === null || v === undefined || v === '') return `<c r="${ref}" s="${ri?2:1}"/>`;
      if(typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="${ri?2:1}"><v>${v}</v></c>`;
      return `<c r="${ref}" s="${ri?2:1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${ri+1}"${ri === 0 ? ' ht="20" customHeight="1"' : ''}>${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><outlinePr summaryBelow="1" summaryRight="1"/></sheetPr>
<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${cols ? '<cols>' + cols + '</cols>' : ''}
<sheetData>${body}</sheetData>
</worksheet>`;
}

function colName(i){
  let s = '';
  i = i + 1;
  while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

const XLSX_STYLES = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2">
<font><sz val="10"/><color theme="1"/><name val="맑은 고딕"/></font>
<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/></font>
</fonts>
<fills count="3">
<fill><patternFill patternType="none"/></fill>
<fill><patternFill patternType="gray125"/></fill>
<fill><patternFill patternType="solid"><fgColor rgb="FF2B4A63"/><bgColor indexed="64"/></patternFill></fill>
</fills>
<borders count="2">
<border><left/><right/><top/><bottom/><diagonal/></border>
<border><left/><right/><top/><bottom style="hair"><color rgb="FFD5DCE0"/></bottom><diagonal/></border>
</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="3">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

function buildXlsx(sheets){
  const files = [];
  const types = ['<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>',
                 '<Default Extension="xml" ContentType="application/xml"/>',
                 '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>',
                 '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
  const sheetTags = [], rels = [];

  sheets.forEach((s, i) => {
    const n = i + 1;
    files.push({ name:`xl/worksheets/sheet${n}.xml`, text: sheetXml(s.rows, s.widths) });
    types.push(`<Override PartName="/xl/worksheets/sheet${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    sheetTags.push(`<sheet name="${xmlEsc(s.name).slice(0,31)}" sheetId="${n}" r:id="rId${n}"/>`);
    rels.push(`<Relationship Id="rId${n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${n}.xml"/>`);
  });
  rels.push(`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`);

  files.push({ name:'[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${types.join('')}</Types>` });
  files.push({ name:'_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>` });
  files.push({ name:'xl/workbook.xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheetTags.join('')}</sheets></workbook>` });
  files.push({ name:'xl/_rels/workbook.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}</Relationships>` });
  files.push({ name:'xl/styles.xml', text: XLSX_STYLES });

  return zipStore(files);
}

/* ---------- 프로필 → 시트 ---------- */
function profileToSheets(P, opts){
  opts = opts || {};
  const orgOf = id => {
    const e = P.experiences.find(x => x.id === id);
    return e ? e.org + (e.title ? ' / ' + e.title : '') : '';
  };

  const exp = [['회사','산업','팀','직함','고용형태','시작','종료','기간(개월)','근무지',
                '직접보고','총괄조직','예산(만원)','매출책임(만원)','규모 메모',
                '담당업무','택한 이유','떠난 이유','경력증명','원천징수','성과 수','신뢰도']];
  P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0)).forEach(e => {
    const sp = spanOf(e), sc = e.scale || {}, tr = e.transition || {}, pf = e.proof || {};
    exp.push([e.org, e.industry, e.team, e.title, e.employmentType,
      e.start, e.isCurrent ? '재직중' : e.end, sp ? sp[1]-sp[0]+1 : null, e.location,
      sc.directReports ?? null, sc.totalOrg ?? null, sc.budgetMan ?? null, sc.revenueMan ?? null, sc.note,
      (e.responsibilities||[]).join('\n'), tr.reasonJoin, tr.reasonLeave,
      pf.employmentCert, pf.payslip,
      P.achievements.filter(a => a.experienceId === e.id).length,
      e.confidence === 'inferred' ? '추론' : '문서 명시']);
  });

  const ach = [['소속','시점','제목','상황','과제','행동','결과','정량 지표','팀 규모','내 역할','역량','근거 수','근거 인용','신뢰도']];
  P.achievements.slice().sort((a,b) => (mi(b.date)||0) - (mi(a.date)||0)).forEach(a => {
    const sc = a.scope || {};
    ach.push([orgOf(a.experienceId), a.date, a.title, a.situation, a.task, a.action, a.result,
      (a.metrics||[]).map(m => `${m.name||''} ${m.before??''}→${m.after??''}${m.unit||''}${m.delta?' ('+m.delta+')':''}`).join('\n'),
      sc.teamSize ?? null, sc.role,
      (a.skillIds||[]).map(id => (P.skills.find(s=>s.id===id)||{}).name).filter(Boolean).join(', '),
      (a.evidence||[]).length,
      (a.evidence||[]).map(v => `"${v.quote||''}" — ${sourceLabel(P, v.sourceId)}${v.location?' '+v.location:''}`).join('\n'),
      a.confidence === 'inferred' ? '추론' : '문서 명시']);
  });

  const skl = [['역량','분류','다른 이름','사용 기간(개월)','첫 사용','최근 사용','경력 수','성과 수','근거 수','상태']];
  P.skills.map(s => ({ s, st: skillStats(P, s) }))
    .sort((a,b) => (b.st.evidenceCount - a.st.evidenceCount) || (b.st.months - a.st.months))
    .forEach(({s, st}) => skl.push([s.name, CAT_LABEL[s.category||'hard']||s.category,
      (s.aliases||[]).join(', '), st.months, st.firstUsed, st.lastUsed,
      st.expCount, st.achCount, st.evidenceCount,
      st.dormant ? '휴면(18개월 이상 미사용)' : (st.evidenceCount ? '' : '근거 없음')]));

  const edu = [['구분','내용','기관','시작','종료·취득','비고']];
  (P.projects||[]).forEach(x => edu.push([x.kind || '활동', x.name, x.org || '',
    x.role || '', x.start || '', [x.end ? '~'+x.end : null, x.description].filter(Boolean).join(' · ')]));
  (P.publications||[]).forEach(x => edu.push([x.kind || '저서', x.title, x.publisher,
    '', x.publishedAt, [x.role, x.identifier].filter(Boolean).join(' · ')]));
  (P.education||[]).forEach(e => edu.push(['학력', (e.major||'') + (e.degree?' '+e.degree:''), e.school, e.start, e.end, e.thesis]));
  (P.certifications||[]).forEach(c => {
    const x = mi(c.expiresAt);
    edu.push(['자격증', c.name, c.issuer, '', c.issuedAt,
      c.expiresAt ? (x !== null && x < nowMi() ? c.expiresAt + ' 만료됨' : c.expiresAt + ' 만료 예정') : '']);
  });
  (P.awards||[]).forEach(a => edu.push(['수상', a.name, a.issuer, '', a.date, a.scope]));
  (P.references||[]).forEach(r => edu.push(['레퍼런스', r.name + (r.relation ? ' (' + r.relation + ')' : ''),
    r.org, '', r.contactable || '미확인', r.note]));

  /* 한 시트에 여러 종류를 뭉치면 사람은 읽어도 앱은 못 되읽는다.
     내보낸 엑셀을 고쳐서 다시 넣는 게 이 도구의 주요 사용법이므로
     종류마다 시트를 따로 둔다. */
  const pub = [['제목','종류','역할','발행','학술지·출판사','식별자','비고']];
  (P.publications||[]).slice()
    .sort((a,b) => (mi(b.publishedAt)||0) - (mi(a.publishedAt)||0))
    .forEach(x => pub.push([x.title, x.kind, x.role, x.publishedAt, x.publisher,
                            x.identifier, x.note]));

  const prj = [['이름','유형','기관','역할','시작','종료','설명']];
  (P.projects||[]).slice()
    .sort((a,b) => (mi(b.start)||0) - (mi(a.start)||0))
    .forEach(x => prj.push([x.name, x.kind, x.org, x.role, x.start, x.end, x.description]));

  const sheets = [
    { name:'경력', rows:exp, widths:[18,14,14,14,10,10,10,11,12,9,9,13,14,24,40,30,30,10,10,8,10] },
    { name:'성과', rows:ach, widths:[20,9,26,30,26,34,26,26,9,9,20,8,40,10] },
    { name:'역량', rows:skl, widths:[20,10,20,14,10,10,8,8,8,22] },
    { name:'저서·논문', rows:pub, widths:[46,10,10,10,26,26,20] },
    { name:'활동', rows:prj, widths:[32,12,20,12,10,10,34] },
    { name:'학력·자격·수상', rows:edu, widths:[10,32,20,10,14,36] }
  ];

  if((P.jobTargets||[]).length){
    const jd = [['공고','구분','요구사항','판정','연결된 역량','메모']];
    const NAME = { strong:'강함', partial:'부분', gap:'공백' };
    P.jobTargets.forEach(j => (j.requirements||[]).forEach(r => jd.push([
      j.company || '무제', r.type === 'preferred' ? '우대' : '자격', r.text, NAME[r.status] || r.status,
      (r.matchedSkillIds||[]).map(id => (P.skills.find(s=>s.id===id)||{}).name).filter(Boolean).join(', '),
      r.note])));
    sheets.push({ name:'공고 매칭', rows:jd, widths:[20,8,48,8,24,30] });
  }

  if((P.entries||[]).length){
    const ent = [['날짜','요일','주차','유형','한 일','내용·결과','소속','시간','인원','역량','중요','성과 기록','분석 축']];
    P.entries.slice().sort((a,b) => (a.date < b.date ? 1 : -1)).forEach(e => {
      const d = parseYmd(e.date);
      ent.push([e.date, e.dateMode === 'week' ? '주 단위' : (d ? DOW[d.getDay()] : ''),
        weekKey(e.date), TYPE_LABEL[e.type] || e.type,
        e.title, e.detail, orgOf(e.experienceId),
        e.hours == null ? null : Number(e.hours),
        e.audience == null ? null : Number(e.audience),
        (e.skillIds||[]).map(id => (P.skills.find(s=>s.id===id)||{}).name).filter(Boolean).join(', '),
        e.important ? '★' : '', e.promotedTo || '',
        Object.entries(e.facets || {}).filter(([,v]) => v).map(([k,v]) => k+': '+v).join(' / ')]);
    });
    sheets.push({ name:'주간 기록', rows:ent, widths:[12,6,11,8,38,44,18,8,8,22,6,10,46] });

    const wk = {};
    P.entries.forEach(e => { const k = weekKey(e.date); if(k) (wk[k] = wk[k] || []).push(e); });
    const st = [['주차','기간'].concat(ENTRY_TYPES.map(t => t[1] + ' 건'))
                 .concat(['총 건수','총 시간','강의 회차','수강 인원','성과 기록'])];
    Object.keys(wk).sort().reverse().forEach(k => {
      const t = tally(wk[k]);
      st.push([k, weekLabel(k).split('  ')[1] || '']
        .concat(ENTRY_TYPES.map(ty => t.byType[ty[0]].count || null))
        .concat([t.count, t.hasHours ? t.hours : null, t.lectures || null,
                 t.audience || null, t.promoted || null]));
    });
    sheets.push({ name:'주별 통계', rows:st, widths:[11,14,7,7,7,7,7,9,9,9,9,9] });
  }

  /* 처우는 명시적으로 요청할 때만 넣는다. 실수로 첨부되면 되돌릴 수 없다. */
  if(opts.includeComp && (P.compensation||[]).length){
    const series = compSeries(P);
    const cmp = [['적용 시점','구분','소속','직함','기본급(만원)','성과급(만원)','기타(만원)','총액(만원)','전기 대비','메모']];
    series.slice().reverse().forEach((c, i, arr) => {
      const prev = arr[i+1];
      const e = P.experiences.find(x => x.id === c.experienceId) || {};
      cmp.push([c.effective, c.kind, e.org, e.title,
        c.base ?? null, c.bonus ?? null, c.other ?? null, c.total,
        prev && prev.total ? Math.round((c.total/prev.total - 1) * 1000)/10 + '%' : null, c.note]);
    });
    const g = compGrowth(series);
    if(g){
      cmp.push([]);
      cmp.push(['합계', `${fmtYm(g.from.effective)} → ${fmtYm(g.to.effective)}`, g.years + '년',
        '', null, null, null, g.to.total, (g.totalPct>0?'+':'') + g.totalPct + '%',
        `연평균 ${(g.cagrPct>0?'+':'') + g.cagrPct}%`]);
    }
    sheets.push({ name:'처우 이력', rows:cmp, widths:[11,10,18,14,13,13,13,13,11,30] });
  }

  /* 분석 축이 있으면 축별 집계도 함께 낸다 */
  const axes = facetAxes(P);
  if(axes.length){
    const an = [['축','값','건수','중요 표시','비율(%)','표기 종류']];
    const keepScope = anaScope, keepAxis = anaAxis;
    anaScope = 'all';
    axes.forEach(a => {
      anaAxis = a.key;
      const t = facetTally(P, a.key);
      t.rows.forEach(r => an.push([a.key, r.value, r.n,
        t.isFlagAxis ? null : (r.imp || null),
        t.isFlagAxis ? null : (r.imp ? r.pct : null),
        r.variants > 1 ? r.allSpellings.join(' / ') : null]));
    });
    anaScope = keepScope; anaAxis = keepAxis;
    sheets.push({ name:'분석', rows:an, widths:[14,40,9,11,10,46] });
  }

  const h = holes(P);
  const chk = [['구분','대상','내용']];
  h.openConf.forEach(c => chk.push(['문서 충돌', findTarget(P, c),
    c.field + ': ' + (c.candidates||[]).map(x => x.value).join(' vs ')]));
  (P.gaps||[]).forEach(g => chk.push(['기록 없는 기간', fmtYm(g.start)+' – '+fmtYm(g.end),
    g.reason ? g.reason + (g.explanation ? ' / ' + g.explanation : '') : '사유 미입력']));
  h.inferred.forEach(x => chk.push(['미확인 추론', x.id, x.title || x.org || '']));
  h.noAction.forEach(a => chk.push(['행동 미기재', a.id, a.title || '']));
  h.noMetric.forEach(a => chk.push(['수치 없음', a.id, a.title || '']));
  h.noEvid.forEach(a => chk.push(['근거 없음', a.id, a.title || '']));
  h.expiredCerts.forEach(c => chk.push(['만료 자격증', c.name, c.expiresAt + ' 만료']));
  P.sources.filter(s => s.extractionQuality && s.extractionQuality !== 'good')
    .forEach(s => chk.push(['문서 판독 불완전', s.filename, s.extractionQuality]));
  if(chk.length === 1) chk.push(['—','','지금은 점검할 항목이 없습니다']);
  sheets.push({ name:'점검', rows:chk, widths:[18,28,60] });

  return sheets;
}

/* ---------- docx ---------- */

function p(text, style, opt){
  opt = opt || {};
  const pPr = [];
  if(style) pPr.push(`<w:pStyle w:val="${style}"/>`);
  if(opt.indent) pPr.push(`<w:ind w:left="${opt.indent}" w:hanging="${opt.hanging||0}"/>`);
  if(opt.after !== undefined) pPr.push(`<w:spacing w:after="${opt.after}"/>`);
  const runs = (Array.isArray(text) ? text : [{t:text}]).map(r => {
    const rPr = [];
    if(r.b) rPr.push('<w:b/>');
    if(r.color) rPr.push(`<w:color w:val="${r.color}"/>`);
    if(r.size) rPr.push(`<w:sz w:val="${r.size}"/><w:szCs w:val="${r.size}"/>`);
    return `<w:r>${rPr.length?`<w:rPr>${rPr.join('')}</w:rPr>`:''}<w:t xml:space="preserve">${xmlEsc(r.t)}</w:t></w:r>`;
  }).join('');
  return `<w:p>${pPr.length?`<w:pPr>${pPr.join('')}</w:pPr>`:''}${runs}</w:p>`;
}
