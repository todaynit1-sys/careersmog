<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커리어 스모그</title>
<style>
:root{
  /* ── 스모그와 또렷함 ────────────────────────────────
     이 앱의 주장은 "기록이 흐리면 이력서도 흐리다"이다.
     그래서 화면도 같은 말을 한다 — 근거가 있으면 또렷하게, 비면 흐리게.
     색을 늘리지 않고 대비와 채도로 말한다. */

  /* 안개. 순회색이 아니라 아주 옅은 흙빛을 섞었다. 실제 스모그가 그렇다. */
  --haze:#EDEEEB;  --haze-deep:#E3E5E1;
  --card:#FFFFFF;

  /* 잉크. 순검정 대신 청록이 도는 짙은 색이라 종이 위에서 덜 뻑뻑하다. */
  --ink:#12171A;   --ink-2:#454E52;  --mute:#7C858A;  --faint:#A9B0B3;

  /* 맑음. 이 앱의 강조색. 파랑은 어느 도구에나 있어서 쓰지 않았다. */
  --clear:#0F5F57;  --clear-deep:#0A4640;  --clear-soft:#E4EFED;

  /* 표지에서 온 코발트는 머리띠에만 남긴다. 오래 보는 화면에는 세다. */
  --cobalt:#1B44C8;  --deep:#1C3A6E;

  --alert:#B23A2E;  --alert-soft:#F7E8E6;
  --warn:#8A6A1F;   --warn-soft:#F6EFDC;
  --ok:#2F6B4F;

  --rule:#CDD2CE;  --rule-soft:#E1E4E0;

  /* 여백은 4의 배수로만. 눈에 안 보여도 줄이 맞는다. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "D2Coding", Menlo, Consolas, monospace;
  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r:4px;  --r-lg:8px;

  /* 깊이는 그림자 대신 얇은 테두리 + 아주 옅은 그림자로. 무겁지 않게. */
  --lift:0 1px 2px rgba(18,23,26,.04), 0 4px 14px rgba(18,23,26,.05);
  --lift-hi:0 2px 6px rgba(18,23,26,.07), 0 10px 30px rgba(18,23,26,.08);
}

/* ── 타이포 스케일 ──────────────────────────────────
   한글 웹폰트를 못 받으므로(오프라인 원칙) 글자체로는 개성을 못 낸다.
   대신 크기·굵기·자간의 대비를 크게 벌려 성격을 만든다. */
.t-display{font-size:31px;line-height:1.12;font-weight:800;letter-spacing:-.035em}
.t-num{font-size:26px;line-height:1;font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.t-h1{font-size:18px;line-height:1.35;font-weight:750;letter-spacing:-.018em}
.t-eyebrow{font-size:10.5px;line-height:1.4;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--haze);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clear);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}

/* ══ 또렷함과 흐림 ═════════════════════════════════
   이 앱의 주장을 화면이 그대로 말하게 한다.
   근거가 붙은 것은 또렷하고, 비어 있는 것은 안개가 낀 것처럼 흐리다.
   색을 새로 만들지 않고 채도와 대비만 낮춘다 — 그게 안개다. */
.hazy{color:var(--mute)}
.hazy .t-num,.hazy b{color:var(--faint);font-weight:700}
.hazy-box{border-style:dashed !important;border-color:var(--rule) !important;
  background:linear-gradient(var(--haze-deep),var(--card))}
.clear-mark{color:var(--clear);font-weight:700}

/* 값이 없는 칸. 빈 줄을 그냥 두면 무엇을 채워야 할지 안 보인다. */
.empty-slot{color:var(--faint);font-style:normal}
.empty-slot::after{content:'—'}

/* ---------- 상단 ----------
   머리띠는 브랜드를 알리는 자리이지 시선을 뺏는 자리가 아니다.
   금속 질감·줄무늬·부채꼴을 걷어내고 색과 여백만 남겼다. */
.masthead{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:40}
.masthead .wrap{padding-top:0;padding-bottom:0}
.topbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
  padding:14px 0 12px;position:relative}

.brand{line-height:1;display:flex;align-items:baseline;gap:8px;cursor:default;
  -webkit-user-select:none;user-select:none}
.brand .en{font-size:23px;font-weight:800;font-style:italic;letter-spacing:-.04em;color:var(--cobalt)}
.brand .ko{font-size:15px;font-weight:800;letter-spacing:-.045em;color:var(--ink)}
.brand small{display:block;font-size:9px;font-weight:700;letter-spacing:.16em;
  color:var(--faint);font-family:var(--mono);margin-top:4px;text-transform:uppercase}
.brandwrap{display:flex;flex-direction:column}

/* 책 띠. 한 줄로 조용히. */
.bookline{background:var(--ink);color:rgba(255,255,255,.86);font-size:11.5px;
  letter-spacing:-.01em}
.bookline .wrap{padding-top:6px;padding-bottom:6px;display:flex;gap:8px;
  flex-wrap:wrap;align-items:center}
.bookline b{color:#fff;font-weight:700}
.bookline em{font-style:normal;color:#fff;font-weight:600;opacity:.75}
.topbar .spacer{flex:1}
.savestate{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;margin-right:4px}
.savestate b{color:var(--ink-2);font-weight:600}

.btn{border:1px solid var(--rule);background:var(--card);padding:6px 13px;
  border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
  transition:border-color .12s, background .12s, color .12s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--clear);border-color:var(--clear);color:#fff}
.btn.primary:hover{background:var(--clear-deep);border-color:var(--clear-deep)}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.warn:hover{background:var(--warn-soft)}
.btn.danger:hover{background:var(--alert);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute);padding:5px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--rule-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);min-width:230px;
  box-shadow:0 10px 26px rgba(22,32,43,.14);padding:5px;display:none;z-index:40}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;
  padding:9px 11px;border-radius:2px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--rule-soft)}
.menu button b{display:block;font-weight:650}
.menu button small{color:var(--mute);font-size:11.5px}
.menu hr{border:none;border-top:1px solid var(--rule-soft);margin:4px 0}

/* ---------- 요약 줄 ---------- */
.ledger{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;
  padding:16px 0;border-bottom:1px solid var(--rule)}
/* 매번 보이는 자리다. 이름이 먼저 눈에 들어오고 숫자가 뒤따라야 한다. */
.whoami{display:block;border:none;background:none;padding:0;margin:0 0 var(--s3);
  cursor:pointer;text-align:left;font-size:26px;font-weight:800;letter-spacing:-.035em;
  line-height:1.15;color:var(--ink)}
.whoami em{display:block;font-style:normal;font-size:13px;font-weight:600;
  letter-spacing:-.01em;color:var(--clear);margin-top:5px}
.whoami:hover em{text-decoration:underline;text-underline-offset:3px}
.whoami em{display:block;font-style:normal;font-size:12.5px;font-weight:500;color:var(--mute);margin-top:1px}
/* 숫자 칸. 총 경력이 가장 크고 나머지는 뒤따른다 —
   전부 같은 크기로 두면 무엇이 중요한지 화면이 말해주지 못한다. */
/* 자식 직계로 한정한다. `.tally div` 로 두면 안쪽 .n/.k 까지 칸이 되어 뭉갠다. */
.tally{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:stretch}
.tally > div{line-height:1.15;padding:9px 14px 8px;border:1px solid var(--rule-soft);
  border-radius:var(--r);background:var(--card);min-width:62px}
.tally > div:first-child{background:var(--ink);border-color:var(--ink);padding-right:18px}
.tally .n{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;background:none;border:none;padding:0}
.tally > div:first-child .n{font-size:21px;color:#fff}
.tally .k{font-size:10.5px;color:var(--mute);letter-spacing:.06em;margin-top:3px;
  background:none;border:none;padding:0}
.tally > div:first-child .k{color:rgba(255,255,255,.62)}
/* 값이 0이면 흐리게. 채워진 것과 빈 것이 한눈에 갈린다. */
.tally > div.zero{opacity:.5}
.tally > div.zero .n{color:var(--faint)}

.holes{border:1px solid var(--warn);border-left-width:3px;background:var(--warn-soft);
  padding:10px 15px;border-radius:var(--r);max-width:520px}
.holes h4{margin:0 0 5px;font-size:10.5px;letter-spacing:.12em;color:var(--warn);
  font-family:var(--mono);text-transform:uppercase;font-weight:700}
.holes ul{margin:0;padding:0;list-style:none;display:flex;gap:var(--s4);flex-wrap:wrap}
.holes li{font-size:12.5px;color:var(--ink-2)}
.holes li b{font-family:var(--mono);color:var(--warn);font-weight:700}
/* 채울 게 없으면 조용히. 아무 일 없다는 말에 시선을 뺏길 이유가 없다. */
.holes.clean{border-color:var(--rule-soft);background:transparent;border-left-color:var(--ok)}
.holes.clean h4{color:var(--mute)}
.holes.clean li{color:var(--mute)}

/* ---------- 보고서 롤업 ---------- */
.stat-cards .dl{font-family:var(--mono);font-size:10.5px;margin-top:3px;color:var(--mute)}
.stat-cards .dl.up{color:var(--ok)}
.stat-cards .dl.down{color:var(--alert)}

.rollup{border-top:1px solid var(--rule-soft)}
.ru{display:grid;grid-template-columns:74px 150px 1fr auto;gap:12px;align-items:baseline;
  padding:9px 2px;border-bottom:1px solid var(--rule-soft)}
.ru-k{font-family:var(--mono);font-size:12.5px;font-weight:700}
.ru-n{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.ru-s{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.ru-s em{font-style:normal;color:var(--rule)}

/* ---------- 단계적 공개 ---------- */
.tab.more{color:var(--cobalt);font-weight:700}
.tab.more:hover{background:var(--rule-soft)}
.nextup{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-14px 0 20px;
  font-size:11.5px;color:var(--mute)}
.nextup:empty{display:none}
.nextup b{color:var(--ink-2);font-weight:700;margin-right:4px}
.nextup i{font-style:normal;color:var(--mute);margin-right:6px}
.nextup b::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--rule);margin-right:5px;vertical-align:2px}

/* ---------- 모바일 빠른 기록 ---------- */
.mq{display:none}
.mq-bar{display:flex;gap:7px;align-items:center;padding:9px 12px;
  background:var(--card);border-top:1px solid var(--rule);
  box-shadow:0 -6px 20px rgba(14,17,22,.10)}
.mq-bar input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:18px;
  padding:9px 14px;font-size:16px;background:#FBFCFD}
.mq-bar input:focus{background:#fff;border-color:var(--cobalt)}
.mq-bar .btn{padding:9px 15px;border-radius:18px;font-size:14px}
.mq-more{display:flex;align-items:center;gap:5px;border:1px solid var(--rule);
  background:#fff;border-radius:18px;padding:8px 11px;font-size:12px;font-weight:600;
  white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.mq-more span{width:8px;height:8px;border-radius:50%}
.mq-more.on{border-color:var(--cobalt);color:var(--cobalt)}

.mq-ext{display:none;padding:11px 12px 3px;background:#F5F7FA;border-top:1px solid var(--rule)}
.mq-ext.on{display:block}
.mq-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.mqc{border:1px solid var(--rule);background:#fff;border-radius:16px;padding:7px 13px;
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:36px}
.mqc.on{border-color:var(--c,var(--cobalt));color:var(--c,var(--cobalt));
  background:#fff;box-shadow:inset 0 0 0 1px var(--c,var(--cobalt))}
.mqc.chk-inline{display:flex;align-items:center;gap:6px;font-weight:500}
.mq-row input[type=number]{flex:1;min-width:110px;border:1px solid var(--rule);
  border-radius:16px;padding:7px 13px;font-size:16px}
.mq-hint{font-size:11.5px;color:var(--mute);margin-left:auto}

/* ---------- 시트 표 배정 ---------- */
.blocks{max-height:52vh;overflow-y:auto}
.blk{border:1px solid var(--rule);border-radius:var(--r);padding:11px 12px;margin-bottom:9px;
  background:#FBFCFD}
.blk.off{opacity:.5;background:#F5F7F9}
.blk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.blk-head b{font-size:14px}
.blk-head span{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.blk-head em{display:block;font-style:normal;font-size:11px;color:var(--warn);margin-top:2px}
.blk-head select{border:1px solid var(--rule);border-radius:var(--r);padding:4px 7px;
  font-size:12.5px;background:#fff;flex:0 0 auto}
.blk-kind{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.blk-kind label{font-size:11px;color:var(--mute);font-weight:700}
.blk-kind select{border:1px solid var(--cobalt);border-radius:var(--r);padding:4px 8px;
  font-size:12.5px;background:#fff;color:var(--cobalt);font-weight:600}
.blk-kind .hint{font-size:11px}
.blk-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:9px}
.blk-map label{display:block;font-size:10.5px;color:var(--mute);font-weight:700;margin-bottom:2px}
.blk-map label b{color:var(--alert)}
.blk-map select{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:4px 6px;font-size:12px;background:#fff}
.blk-prev{margin-top:9px;font-size:11.5px;color:var(--ink-2);
  border-top:1px solid var(--rule-soft);padding-top:7px}
.blk-prev > div{display:flex;gap:10px;padding:1px 0}
.blk-prev span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk-prev .more{color:var(--mute);font-style:italic}

/* ---------- 논문 확인 ---------- */
.paprows{max-height:52vh;overflow-y:auto;border:1px solid var(--rule-soft);border-radius:var(--r)}
.paprow{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:9px 11px;
  border-bottom:1px solid var(--rule-soft)}
.paprow:last-child{border-bottom:none}
.paprow.off{background:#F7F9FA;opacity:.55}
.pp-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.pp-main input,.pp-main select{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:5px 7px;font-size:13px;background:#fff}
.pp-meta{display:grid;grid-template-columns:2fr 100px 110px 100px;gap:5px}
.pp-sub{font-size:11px;color:var(--mute);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis}
.pp-sub em{display:block;font-style:normal;color:var(--warn);margin-top:2px}

/* ---------- PDF 확인 ---------- */
.pdfrows{max-height:46vh;overflow-y:auto;border:1px solid var(--rule-soft);border-radius:var(--r)}
.pdfrow{display:grid;grid-template-columns:96px 1fr 190px;gap:10px;padding:7px 10px;
  border-bottom:1px solid var(--rule-soft);align-items:center;font-size:12.5px}
.pdfrow:last-child{border-bottom:none}
.pdfrow.off{background:#F7F9FA;color:var(--mute)}
.pdfrow select{border:1px solid var(--rule);border-radius:var(--r);padding:3px 5px;font-size:12px}
.pr-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-t em{font-style:normal;color:var(--alert);margin-left:6px;font-size:11.5px}
.pdfrow.off .pr-t{text-decoration:line-through;text-decoration-color:var(--rule)}
.pr-d{font-family:var(--mono);font-size:11px;color:var(--cobalt);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

/* ---------- 축 배정 ---------- */
.axassign{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin-top:12px;
  background:#FBFCFD}
.axassign summary{cursor:pointer;font-size:13px;font-weight:600}
.axassign summary b{font-weight:500;color:var(--cobalt);margin-left:6px;font-size:12px}
.axrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.axrow label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}
.axrow label span{display:block;font-family:var(--sans);font-size:11px;letter-spacing:0;
  text-transform:none;color:var(--ink-2);font-weight:400;margin-top:1px}
.axrow select,.axrow input{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:5px 7px;font-size:12.5px;background:#fff}

/* ---------- 덮어쓰기 / 합치기 ---------- */
.mchoice{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);
  border-radius:var(--r);padding:12px 14px;margin-bottom:9px;cursor:pointer}
.mchoice:hover{border-color:var(--cobalt)}
.mchoice.on{border-color:var(--cobalt);background:#F4F7FE}
.mchoice b{display:block;font-size:14.5px}
.mchoice b span{font-size:10.5px;background:var(--cobalt);color:#fff;border-radius:9px;
  padding:1px 7px;margin-left:6px;vertical-align:2px}
.mchoice > span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.mchoice i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--mute);margin-top:5px}

/* ---------- 문서 미리보기 ---------- */
.docprev{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:#F2F4F6}
.docprev iframe{display:block;width:100%;height:640px;border:0}

/* ---------- 이력서 용도 ---------- */
.purpose-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.purpose{text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:var(--r);
  padding:10px 12px;cursor:pointer}
.purpose:hover{border-color:var(--cobalt)}
.purpose.on{border-color:var(--cobalt);background:#F4F7FE;box-shadow:inset 0 0 0 1px var(--cobalt)}
.purpose b{display:block;font-size:13.5px}
.purpose.on b{color:var(--cobalt)}
.purpose span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.45}

/* ---------- 직군 프리셋 ---------- */
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.preset{text-align:left;border:1px solid var(--rule);background:var(--card);
  border-radius:var(--r);padding:9px 11px;cursor:pointer}
.preset:hover{border-color:var(--cobalt);background:#F7F9FE}
.preset b{display:block;font-size:13.5px;font-weight:700}
.preset span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.45}
.preset i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;
  color:var(--cobalt);margin-top:5px;line-height:1.4}

/* ---------- 샘플 고르기 ---------- */
.samp{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);
  border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.samp:hover{border-color:var(--cobalt);background:#F7F9FE}
.samp b{display:block;font-size:14px;font-weight:700}
.samp span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.55}
.samp i{display:inline-block;font-style:normal;font-family:var(--mono);font-size:11px;
  color:var(--cobalt);margin-top:6px;border:1px solid var(--cobalt);border-radius:2px;padding:1px 6px}

/* ---------- 분석 ---------- */
.axis-sw{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.axis-sw .btn i{font-style:normal;font-family:var(--mono);font-size:10px;
  color:var(--mute);margin-left:5px}
.axis-sw .btn:disabled{background:var(--cobalt);border-color:var(--cobalt);color:#fff;opacity:1}
.axis-sw .btn:disabled i{color:rgba(255,255,255,.7)}

.frow{display:grid;grid-template-columns:1fr 54px 170px 54px 62px;gap:10px;
  padding:7px 2px;border-bottom:1px solid var(--rule-soft);align-items:center;font-size:13px}
.frow.head{font-size:11px;letter-spacing:.05em;color:var(--mute);font-weight:700;
  border-bottom:1px solid var(--rule)}
.frow.rest{color:var(--mute);font-style:italic}
.frow .num{text-align:right}
.frow .fv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fv em{font-style:normal;font-size:10.5px;color:var(--warn);margin-left:6px;
  border:1px solid var(--warn);border-radius:2px;padding:0 4px;cursor:help}
.frow .hot{color:var(--alert);font-weight:700}
.fbar{position:relative;height:9px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.fbar i{position:absolute;left:0;top:0;bottom:0;background:#9DB0DC}
.fbar b{position:absolute;left:0;top:0;bottom:0;background:var(--cobalt)}

/* ---------- 관리자 명부 ---------- */
.stage-bar{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.stage-bar .btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.admin-tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.admin-tools input{flex:1;min-width:180px;border:1px solid var(--rule);border-radius:var(--r);
  padding:6px 10px;font-size:13px}
.admin-tools select{border:1px solid var(--rule);border-radius:var(--r);padding:6px 8px;font-size:12.5px}
.prow{grid-template-columns:26px 1.5fr 92px 78px 96px 56px 66px 1.4fr 52px !important}
.prow.picked{background:#F4F7FE}
.prow .pk{display:flex;align-items:center}
.pw-name i{display:block;font-style:normal;font-size:10.5px;color:var(--cobalt);margin-top:1px}
.stage-sel{border:1px solid var(--rule);border-radius:10px;padding:3px 6px;font-size:11.5px;
  background:#fff;font-weight:600}
.pw-note{border:1px solid transparent;border-radius:var(--r);padding:4px 6px;font-size:12px;
  background:#F7F9FA;width:100%}
.pw-note:focus{border-color:var(--cobalt);background:#fff}

.mtx-scroll,.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mtx,.cmp{border-collapse:collapse;font-size:12.5px;min-width:100%}
.mtx th,.cmp th{background:#22407F;color:#fff;font-size:10.5px;font-weight:700;
  padding:6px 7px;text-align:left;white-space:nowrap}
.mtx td,.cmp td{border-bottom:1px solid var(--rule-soft);padding:5px 7px;vertical-align:top}
.mtx .who b{display:block}
.mtx .who span{font-size:10.5px;color:var(--mute)}
.mtx td.c{text-align:center;font-weight:700}
.mtx td.c.strong{color:var(--ok)}
.mtx td.c.partial{color:var(--warn)}
.mtx td.c.gap{color:var(--rule)}
.mtx td.n{text-align:right;font-family:var(--mono)}
.mtx td.n em{font-style:normal;font-size:10.5px;color:var(--warn);margin-left:4px}
.cmp td.k{color:var(--mute);font-size:11.5px;white-space:nowrap;width:82px}
.cmp td.sk{font-size:11.5px;line-height:1.5;min-width:200px}

/* ---------- 기록 화면 파일 넣기 ---------- */
.dropzone{border:2px dashed var(--rule);border-radius:var(--r-lg);padding:30px 20px;
  text-align:center;background:linear-gradient(180deg,rgba(15,95,87,.03),transparent);
  transition:border-color .12s, background .12s}
.dropzone.on{border-color:var(--clear);background:var(--clear-soft)}
.dropzone b{display:block;font-size:15px;font-weight:700}
/* hidden 속성은 display:none 이라 어떤 자동화·보조기기에서도 잡히지 않는다.
   자리만 없애고 요소는 살려 둔다. */
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
label.btn{display:inline-block}
.dropzone span{display:block;font-size:12.5px;color:var(--mute);margin:5px 0 14px}
.fmt-tip{margin-top:var(--s4);border-top:1px solid var(--rule-soft);padding-top:var(--s3)}
.fmt-tip p{margin:0 0 6px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.fmt-tip b{color:var(--ink)}

/* ---------- 관리자 · 가져오기 ---------- */
.admin-hd{border-left:3px solid var(--alert)}
.prow{display:grid;grid-template-columns:1.6fr 1.5fr 82px 62px 76px 58px 84px 56px;
  gap:10px;padding:10px 2px;border-bottom:1px solid var(--rule-soft);align-items:center;font-size:13px}
.prow.head{font-size:11px;letter-spacing:.05em;color:var(--mute);font-weight:700;
  border-bottom:1px solid var(--rule)}
.prow.head > div:not(:first-child):not(:nth-child(2)){text-align:right}
.pw-name b{display:block;font-weight:700}
.pw-name span{display:block;font-size:11.5px;color:var(--mute);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pw-vis{display:flex;flex-direction:column;gap:3px}
.pw-bar{height:6px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
.pw-bar i{display:block;height:100%}
.pw-vis span{font-family:var(--mono);font-size:11px}
.pw-n{text-align:right;font-family:var(--mono);font-size:12.5px}
.pw-n em{display:block;font-style:normal;font-size:10.5px;color:var(--mute)}
.pw-n.stale{color:var(--alert);font-weight:700}

.drop{border:2px dashed var(--rule);border-radius:var(--r);padding:26px 18px;text-align:center;
  cursor:pointer;background:#FBFCFD}
.drop:hover,.drop.over{border-color:var(--cobalt);background:#F4F7FE}
.drop b{display:block;font-size:14px}
.drop span{display:block;font-size:12px;color:var(--mute);margin-top:4px}

.imp-log{margin-top:14px;border:1px solid var(--rule-soft);border-radius:var(--r);overflow:hidden}
.imp-row{display:grid;grid-template-columns:60px 1fr 1.4fr;gap:10px;padding:7px 11px;
  border-bottom:1px solid var(--rule-soft);font-size:12.5px;align-items:baseline}
.imp-row:last-child{border-bottom:none}
.imp-row .st{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ok)}
.imp-row.skip .st{color:var(--warn)}
.imp-row.bad .st{color:var(--alert)}
.imp-row span:last-child{color:var(--mute)}

/* ---------- 통계 2세대 ---------- */
.unit-sw{display:flex;gap:3px;padding:2px;background:var(--rule-soft);border-radius:var(--r)}
.unit-sw .btn{border-color:transparent;background:transparent}
.unit-sw .btn:disabled{background:var(--cobalt);color:#fff;opacity:1;border-color:var(--cobalt)}

/* 연속 기록. 이 앱에서 가장 격려에 가까운 자리라 유일하게 색을 넉넉히 쓴다. */
.streak{display:grid;grid-template-columns:auto 1fr;gap:var(--s5);align-items:center;
  padding:17px 19px;background:linear-gradient(100deg,var(--clear-soft),var(--card) 72%);
  border:1px solid #BFD8D2;border-radius:var(--r)}
.sk-main{text-align:center;padding-right:var(--s5);border-right:1px solid #BFD8D2}
.sk-main b{display:block;font-family:var(--mono);font-size:42px;font-weight:800;
  letter-spacing:-.05em;line-height:1;color:var(--clear)}
.sk-main span{display:block;font-size:11.5px;color:var(--mute);margin-top:5px}
.sk-side{display:flex;gap:24px;flex-wrap:wrap}
.sk-side b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
.sk-side span{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.streak p{grid-column:2;margin:0;font-size:12.5px;color:var(--ink-2)}

.heat-legend{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;margin-top:var(--s3);
  font-size:12px;color:var(--mute)}
.heat-legend b{color:var(--ink);font-family:var(--mono)}
.heat-legend .scale{display:flex;gap:3px;align-items:center;margin-left:auto}
.heat-legend .scale i{display:inline-block;width:12px;height:12px;border-radius:2px}

.ytable{font-size:13px}
.yrow{display:grid;grid-template-columns:1fr repeat(5,minmax(66px,88px));gap:8px;
  padding:8px 2px;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.yrow span:not(:first-child){text-align:right;font-family:var(--mono)}
.yrow.head{font-family:var(--sans);font-size:11px;letter-spacing:.05em;color:var(--mute);font-weight:700}
.yrow.head span:not(:first-child){font-family:var(--sans)}
.yrow .yk{font-weight:700}
.yrow em{font-style:normal;font-size:10.5px;margin-left:4px}
.yrow em.up{color:var(--ok)}
.yrow em.down{color:var(--alert)}

.store-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.store-stat div{padding:9px 11px;background:#F5F7F9;border:1px solid var(--rule-soft);border-radius:var(--r)}
.store-stat b{display:block;font-size:13px;font-weight:700;line-height:1.3}
.store-stat span{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}

/* ---------- 스모그 지수 ---------- */
.smog-hero{display:grid;grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;
  border-left:3px solid var(--clear);position:relative;overflow:hidden}
/* 카드 위쪽에 아주 옅게 안개를 깔았다. 주제를 한 번 더 말하되 읽기를 방해하지 않는다. */
.smog-hero::before{content:'';position:absolute;inset:0 0 auto 0;height:70%;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,95,87,.045),transparent)}
.smog-hero > *{position:relative}
.smog-gauge{position:relative;width:124px;height:124px;flex:0 0 auto}
.smog-num{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
.smog-num b{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.04em}
.smog-num b i{font-style:normal;font-size:15px;color:var(--mute);margin-left:1px}
.smog-num span{font-size:10.5px;color:var(--mute);margin-top:5px;letter-spacing:.04em}
.smog-say h2{margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.035em}
.smog-say p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}

.ax{padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.ax:last-of-type{border-bottom:none}
.ax-h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.ax-h b{font-size:14px;font-weight:700}
.ax-h span{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700}
.ax-bar{height:7px;background:var(--haze-deep);border-radius:99px;overflow:hidden}
.ax-bar i{border-radius:99px}
.ax-bar i{display:block;height:100%}
.ax-b{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:5px}
.ax-t{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.ax-t button{margin-left:auto;flex:0 0 auto}

.todo-list{margin:0;padding-left:20px;line-height:1.8;font-size:13.5px}
.todo-list b{color:var(--clear)}

.sig{display:grid;grid-template-columns:88px 1fr auto;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.sig:last-of-type{border-bottom:none}
.sig-v{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--alert)}
.sig b{font-size:13.5px}
.sig p{margin:2px 0 0;font-size:12.5px;color:var(--mute);line-height:1.6}

/* ---------- 안내 · 온보딩 ---------- */
.notice{border:1px solid var(--rule);border-left-width:3px;background:var(--card);
  padding:11px 14px;border-radius:var(--r);margin-bottom:16px;font-size:12.5px;
  color:var(--ink-2);line-height:1.65}
.notice.seal{border-color:var(--alert)}
.notice b{color:var(--ink)}
.notice .mono{font-family:var(--mono);font-size:11.5px;background:var(--rule-soft);
  padding:1px 5px;border-radius:2px}

.onb{border-left:3px solid var(--cobalt)}
.onb-steps{display:grid;gap:9px}
.onb-more{margin:10px 0 0;font-size:11.5px;color:var(--mute);line-height:1.6}
.onb-more b{color:var(--cobalt);font-weight:600}
.onb-step{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;
  padding:10px 12px;border:1px solid var(--rule-soft);border-radius:var(--r);background:#FCFDFD}
.onb-step b{font-family:var(--mono);font-size:15px;color:var(--mute);text-align:center}
.onb-step strong{display:block;font-size:14px}
.onb-step span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.onb-step.done{background:#F1F7F3;border-color:#BFD8C8}
.onb-step.done b{color:var(--ok)}

/* ---------- 처우 ---------- */
.crow{display:grid;grid-template-columns:72px 1fr 92px 88px 96px 82px 56px;gap:8px;
  padding:8px 2px;border-bottom:1px solid var(--rule-soft);align-items:baseline;font-size:13px}
.crow.head{font-size:11px;letter-spacing:.05em;color:var(--mute);font-weight:700;
  border-bottom:1px solid var(--rule)}
.crow .num{text-align:right}
.crow .strong{font-weight:700}
.crow .up{color:var(--ok)}
.crow .down{color:var(--alert)}

.fsection{margin:10px 0 -2px;padding-top:12px;border-top:1px solid var(--rule)}
.fsection b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}
.fsection span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.5}

/* ---------- 임베드 ---------- */
body.embed .masthead{border-bottom-width:2px}
body.embed .brand .en{font-size:21px}
body.embed .brand .ko{font-size:14px}
body.embed .brandwrap small{display:none}
body.embed .bookline{display:none}
body.embed .topbar{padding:11px 0 10px}

/* ---------- 모드 · 탭 ---------- */
.modes{display:flex;gap:4px;margin:16px 0 0}
.mode{border:1px solid var(--rule);background:var(--card);color:var(--mute);
  padding:7px 18px;border-radius:var(--r) var(--r) 0 0;border-bottom:none;
  cursor:pointer;font-size:13.5px;font-weight:650}
.mode:hover{color:var(--ink)}
.mode[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mode[aria-selected="true"]::after{content:"";display:block;height:2px;background:var(--cobalt);
  margin:6px -18px -7px}

.tabs{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--rule);flex-wrap:wrap;
  border-top:1px solid var(--rule);background:linear-gradient(#F5F8F9,transparent 60%)}
.tab{border:none;background:none;padding:11px 15px;cursor:pointer;font-size:13.5px;
  font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cobalt)}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:5px}

/* ---------- 공통 ---------- */
.panel{background:var(--card);box-shadow:var(--lift);border:1px solid var(--rule-soft);border-radius:var(--r);padding:20px}
.panel + .panel{margin-top:16px}
h2.sec{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  font-family:var(--mono);font-weight:700;margin:0 0 14px}
.empty{padding:52px 20px;text-align:center;color:var(--mute)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.mono{font-family:var(--mono)}
.hint{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;
  padding:1px 6px;border-radius:2px;border:1px solid var(--rule);color:var(--mute);vertical-align:1px}
.pill.seal{border-color:var(--alert);color:var(--alert);background:var(--alert-soft)}
.pill.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.ok{border-color:var(--ok);color:var(--ok)}

/* ---------- 빠른 기록 ---------- */
.quick{border-color:var(--rule);border-left:3px solid var(--cobalt)}
.quick textarea{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:9px 11px;resize:vertical;background:#FCFDFD;line-height:1.6}
.quick textarea:focus{background:#fff}
.quick-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.quick-row select{flex:1;min-width:170px}
.quick-row input{width:110px;font-family:var(--mono)}
.quick-row select,.quick-row input{border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px}

/* ---------- 주간 기록 ---------- */
.entry-form{display:grid;grid-template-columns:120px 96px 76px 76px 1fr;gap:9px}
.entry-form .ef label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}
.entry-form input,.entry-form select,.entry-form textarea{width:100%;border:1px solid var(--rule);
  border-radius:var(--r);padding:6px 8px;background:#FCFDFD;resize:vertical}
.entry-form input:focus,.entry-form textarea:focus{background:#fff}
.ef-title{grid-column:5 / -1}
.ef-detail{grid-column:1 / 5}
.ef-org{grid-column:5 / -1}
.ef-ax{grid-column:span 1}
.entry-form .ef-ax input{font-size:13px}
.ef-axis-empty,.ef-axis-more{grid-column:1 / -1;margin-top:-2px}
.ef-axis-more{text-align:right}
.ef-act{grid-column:1 / -1;display:flex;gap:14px;align-items:center;justify-content:flex-end;margin-top:2px}

.wk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wk-head h2{flex:1}
.wk-nav{display:flex;gap:5px}
.wk-sum{display:flex;gap:18px;flex-wrap:wrap;padding:10px 12px;background:#F7F9FA;
  border:1px solid var(--rule-soft);border-radius:var(--r);margin-bottom:16px;font-size:13px}
.wk-sum .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.wk-sum b{font-family:var(--mono);margin-left:4px}
.wk-sum i{font-style:normal;font-family:var(--mono);color:var(--mute);margin-left:5px;font-size:11.5px}
.wk-sum .tot{margin-left:auto;color:var(--ink-2)}

.day{margin-bottom:14px}
.day-h{display:flex;align-items:baseline;gap:8px;padding:4px 0 6px;border-bottom:1px solid var(--rule-soft)}
.day-h b{font-family:var(--mono);font-size:13px}
.day-h span{font-size:11.5px;color:var(--mute)}
.day-h i{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}

.ent{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule-soft);align-items:flex-start}
.ent.imp{background:linear-gradient(90deg,#FDF8F7,transparent 40%);margin:0 -6px;padding-left:8px;padding-right:8px}
.ent-type{flex:0 0 auto;font-size:10.5px;font-family:var(--mono);font-weight:700;
  border:1px solid;border-radius:2px;padding:1px 6px;margin-top:2px}
.ent-body{flex:1;min-width:0}
.ent-t{font-weight:600}
.ent-d{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap}
.ent-m{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:3px}
.ent-act{display:flex;gap:2px;flex:0 0 auto}

.grid-week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid-week.grid-tail{grid-template-columns:repeat(3,1fr);margin-top:8px}
.gcell label{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}
.gcell label b{font-size:13px;font-weight:700}
.gcell label span{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.gcell label i{margin-left:auto;font-style:normal;font-family:var(--mono);
  font-size:10px;color:var(--deep)}
.gcell textarea{width:100%;border:1px solid var(--rule);border-radius:var(--r);
  padding:6px 8px;background:#FCFDFD;resize:vertical;font-size:12.5px;line-height:1.55}
.gcell textarea:focus{background:#fff}
.gcell.today label b{color:var(--alert)}
.gcell.today textarea{border-color:var(--alert)}
.gcell.wknd label b,.gcell.wk label b{color:var(--mute);font-weight:600}
.gcell.wk label b{color:var(--deep)}
.gcell.wknd textarea,.gcell.wk textarea{background:#F7F9FA}

.bulk-help{background:#F7F9FA;border:1px solid var(--rule-soft);border-radius:var(--r);
  padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--mute)}
.bulk-help code{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-2);
  background:#fff;border:1px solid var(--rule-soft);border-radius:2px;padding:3px 7px;margin-bottom:4px}
.bulk-help span{display:block;margin-top:7px;line-height:1.6}
.bulk-help b{color:var(--ink-2)}

.bulk-prev{margin-top:12px;border:1px solid var(--cobalt);border-radius:var(--r);overflow:hidden}
.bp-head{background:var(--cobalt);color:#fff;padding:6px 12px;font-size:12px;font-weight:650}
.bp-row{display:grid;grid-template-columns:52px 46px 1fr 92px 120px;gap:8px;
  padding:6px 12px;border-bottom:1px solid var(--rule-soft);align-items:center;font-size:12.5px}
.bp-row:last-child{border-bottom:none}
.bp-d{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.bp-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right}
.bp-w{font-size:11px;color:var(--alert);text-align:right}

.rep-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}

/* ---------- 통계 ---------- */
/* 자식 직계로 한정한다. `.stat-cards div` 로 두면 안쪽 .n/.k 까지 상자가 되어 이중으로 겹친다. */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:var(--s2)}
.stat-cards > div{padding:13px 15px 11px;background:var(--card);
  border:1px solid var(--rule-soft);border-radius:var(--r);position:relative;overflow:hidden}
/* 값이 있는 칸만 위쪽에 옅은 맑음 띠가 생긴다 */
.stat-cards > div::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:var(--clear);opacity:.55}
.stat-cards > div.none::before{background:var(--rule);opacity:1}
.stat-cards .n{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.03em;
  line-height:1.15;font-variant-numeric:tabular-nums;background:none;border:none;padding:0}
.stat-cards > div.none .n{color:var(--faint);font-weight:600}
.stat-cards .k{font-size:11px;color:var(--mute);margin-top:4px;letter-spacing:.02em;
  background:none;border:none;padding:0;line-height:1.35}

/* ---------- 타임라인 ---------- */
.tl-scroll{overflow-x:auto;border-radius:var(--r);background:
  linear-gradient(180deg,rgba(15,95,87,.028),transparent 55%)}
.tl svg{display:block}
.tl text{font-family:var(--sans)}
.tl-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--mute)}
.tl-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;
  background:var(--deep);margin-right:5px}
.tl-legend i.hollow{background:#fff;border:1.5px solid var(--alert)}
.tl-legend i.filled{background:var(--alert);border:1.5px solid var(--alert)}

.roster{margin-top:22px;border-top:1px solid var(--rule-soft)}
/* 첫 칸을 158px 로 고정하고 nowrap 을 걸면, 긴 글이 칸을 뚫고 제목 위로 흘러간다.
   «자문·심의 · 2023.01 · 자문» 이 제목과 겹쳐 읽을 수 없었다.
   minmax 로 최소만 잡고, 넘치면 말줄임한다. */
.roster-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:var(--s3);
  padding:10px 2px;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.roster-row .per{font-family:var(--mono);font-size:12px;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.roster-row .who{min-width:0;overflow-wrap:anywhere}
.roster-row .who b{font-weight:700}
.roster-row .who em{font-style:normal;color:var(--mute)}
.roster-row .dur{font-family:var(--mono);font-size:12px;color:var(--ink-2);
  white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.roster-row.gap{background:repeating-linear-gradient(90deg,transparent,transparent 5px,#F2F5F6 5px,#F2F5F6 10px)}
.roster-row.gap .who{color:var(--mute)}

/* ---------- 역량 ---------- */
.skgroup{margin-bottom:26px}
.skrow{display:grid;grid-template-columns:1fr 170px 170px;gap:12px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--rule-soft)}
.skrow .nm{font-weight:600}
.skrow .nm span{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.skbar{height:7px;background:var(--rule-soft);border-radius:1px;position:relative;overflow:hidden}
.skbar i{position:absolute;left:0;top:0;bottom:0;background:var(--deep);display:block}
.skmeta{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-align:right;white-space:nowrap}

/* ---------- 성과 ---------- */
.ach{border:1px solid var(--rule-soft);border-radius:var(--r);margin-bottom:12px;background:var(--card)}
.ach.holey{border-left:3px solid var(--alert)}
.ach-head{display:flex;gap:8px;align-items:center;padding:11px 14px;cursor:pointer}
.ach-head .ttl{font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ach-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.ach-body{display:none;grid-template-columns:1fr 300px;gap:20px;padding:4px 14px 16px;
  border-top:1px solid var(--rule-soft)}
.ach.open .ach-body{display:grid}
.fld{margin-bottom:11px}
.fld label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:3px}
.fld textarea,.fld input,.fld select{width:100%;border:1px solid var(--rule);
  border-radius:var(--r);padding:6px 8px;background:#FCFDFD;resize:vertical}
.fld textarea:focus,.fld input:focus{background:#fff}
.fld.blank label{color:var(--alert)}
.fld.blank textarea,.fld.blank input{border-color:var(--alert);background:#FDF8F7}
.fhint{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.metric-row{display:grid;grid-template-columns:1fr 70px 70px 62px 28px;gap:6px;margin-bottom:5px}
.evidence{background:#F7F9FA;border:1px solid var(--rule-soft);border-radius:var(--r);padding:11px 12px}
.evidence h5{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);font-weight:700}
.ev{border-left:2px solid var(--alert);padding:2px 0 2px 9px;margin-bottom:10px}
.ev q{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ev cite{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mute);
  font-style:normal;margin-top:3px}
.ev-none{font-size:12.5px;color:var(--alert)}

/* ---------- 칩 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);
  border-radius:12px;padding:3px 10px;font-size:12.5px;cursor:pointer;background:#fff;
  text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip:has(input:checked){border-color:var(--deep);background:#EFF4F7;color:var(--ink);font-weight:600}
.chip input{margin:0}

/* ---------- 이력서 ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pickrow{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--rule-soft);align-items:flex-start}
.pickrow input{margin-top:4px}
.pickrow .t{flex:1}
.pickrow .t small{display:block;color:var(--mute);font-family:var(--mono);font-size:11px}
.out{width:100%;min-height:330px;border:1px solid var(--rule);border-radius:var(--r);
  padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.7;background:#FCFDFD}

/* ---------- 공고 ---------- */
.req{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.req .st{font-family:var(--mono);font-weight:700;font-size:15px;width:18px;text-align:center}
.st.strong{color:var(--ok)} .st.partial{color:var(--warn)} .st.gap{color:var(--alert)}
.req .why{font-size:12px;color:var(--mute);margin-top:2px}
.req select{border:1px solid var(--rule);border-radius:var(--r);padding:3px 6px;font-size:12px}
.tally-line{font-family:var(--mono);font-size:13px;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--rule)}

/* ---------- 점검 ---------- */
.conf{border:1px solid var(--rule);border-radius:var(--r);padding:13px;margin-bottom:11px}
.conf .q{font-weight:650;margin-bottom:8px}
.cands{display:flex;gap:9px;flex-wrap:wrap}
.cand{border:1px solid var(--rule);border-radius:var(--r);padding:6px 11px;cursor:pointer;background:#fff}
.cand:hover{border-color:var(--ink-2)}
.cand.sel{border-color:var(--ok);background:#F1F7F3}
.cand b{font-family:var(--mono)}
.cand small{display:block;color:var(--mute);font-size:11px}

/* ---------- 모달 ---------- */
#modal{position:fixed;inset:0;background:rgba(22,32,43,.42);display:none;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:60}
#modal.on{display:flex}
.sheet{background:var(--card);border-radius:var(--r);width:100%;max-width:660px;
  padding:22px 24px;box-shadow:0 20px 60px rgba(22,32,43,.28)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:17px;font-weight:700;flex:1}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--rule-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .span2{grid-column:1 / -1}
.chk{display:flex;align-items:center;gap:7px;padding:7px 0;font-weight:500}
.chk input{margin:0}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);border-left:3px solid var(--cobalt);
  color:#fff;padding:9px 18px;border-radius:var(--r);font-size:13px;opacity:0;
  pointer-events:none;transition:opacity .18s;z-index:80}
.toast.on{opacity:1}

/* 모바일에서는 기록 탭에서만 하단 바가 뜬다 */
/* ══ 좁은 화면 ═════════════════════════════════════
   PC가 본체다. 여기서는 **보고 간단히 적는 것**만 잘 되면 된다.
   표 편집·열 매핑·관리자처럼 손이 많이 가는 일은 PC에서 하도록 안내한다.
   반쯤 되는 화면을 억지로 밀어 넣으면 양쪽 다 나빠진다. */
@media (max-width:760px){
  /* 하단 입력바가 가리지 않도록 본문에만 여백을 준다.
     .wrap 전체에 주면 머리띠까지 밀려 검은 띠가 화면 절반을 먹는다. */
  body[data-view-tab="log"] .mq{display:block;position:fixed;left:0;right:0;bottom:0;z-index:45}
  body[data-view-tab="log"] main.wrap{padding-bottom:150px}
  body[data-view-tab="log"] .toast{bottom:96px}

  /* iOS는 16px 미만 입력창에서 화면을 확대해버린다 */
  input,select,textarea{font-size:16px}
  .btn{min-height:38px}
  .btn.sm{min-height:32px}
  .wrap{padding:0 14px}
  main.wrap{padding-bottom:70px}

  /* ── 머리 ──
     좁은 화면에서 버튼 여섯 개를 늘어놓으면 다섯 줄을 먹는다.
     자주 쓰는 둘만 남기고 나머지는 PC에서. */
  .masthead{position:static}
  .topbar{gap:6px;padding:9px 0 8px;flex-wrap:nowrap;align-items:center}
  .topbar .savestate{display:none}
  .topbar .spacer{flex:1}
  /* 로고가 줄바꿈되면 세로로 쪼개져 머리가 길어진다 */
  .brand{flex:0 0 auto;white-space:nowrap}
  .brand .en{font-size:17px}
  .brand .ko{display:none}
  .brandwrap small{display:none}
  .brandwrap{flex:0 0 auto}
  #btnProfileTop,#btnSnaps,#btnPaste,#btnSample,#btnLoad{display:none}
  .topbar .btn{padding:6px 10px;font-size:12.5px}
  .bookline{display:none}

  /* 하단 입력줄도 화면 안에 들어와야 한다 */
  .mq .wrap{padding:0 10px}
  .mq .btn{padding:8px 12px}
  .mq input{min-width:0}

  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:10px 11px}
  .modes{gap:4px}

  /* ── 신원 ── 이름과 총 경력이면 충분하다 */
  .ledger{display:block}
  .whoami{font-size:20px;margin-bottom:var(--s2)}
  .tally{gap:5px}
  .tally > div{padding:6px 10px 5px;min-width:0}
  .tally .n{font-size:15px}
  .tally > div:first-child .n{font-size:17px}
  .tally .k{font-size:9px}
  .holes{margin-top:var(--s3);max-width:none}

  .two,.grid2,.grid3{grid-template-columns:1fr !important}
  .smog-hero{grid-template-columns:1fr;gap:var(--s4);justify-items:center;text-align:center}
  .panel{padding:14px}

  /* 넓은 표는 가로로 넘긴다. 줄여서 뭉개는 것보다 낫다. */
  .mtx-scroll,.cmp-scroll,.tl-scroll,.gridwrap,.docprev{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .docprev iframe{height:420px}

  /* ── 손이 많이 가는 화면은 PC로 ── */
  .pc-only{display:none !important}
  .pc-note{display:block;font-size:12px;color:var(--warn);background:var(--warn-soft);
    border:1px solid var(--warn);border-radius:var(--r);padding:9px 12px;margin-bottom:var(--s3)}
}
@media (min-width:761px){ .pc-note{display:none} }

@media (max-width:860px){
  .prow{grid-template-columns:26px 1fr auto !important;gap:6px}
  .prow > div:nth-child(n+4):nth-child(-n+7){display:none}
  .prow .pw-note{grid-column:2 / -1}
  .pp-meta{grid-template-columns:1fr 1fr}
  .preset-grid,.purpose-grid{grid-template-columns:1fr}
  .pdfrow{grid-template-columns:84px 1fr;gap:6px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="masthead"><div class="wrap">
  <header class="topbar">
    <div class="brandwrap">
      <div class="brand" role="button" tabindex="-1" title=""><span class="en">Career Smog</span><span class="ko">커리어 스모그</span></div>

        <button id="expJson" role="menuitem"><b>JSON — 원본</b>

        <hr>
        <button id="expXlsx" role="menuitem"><b>Excel (.xlsx)</b>

        <button id="expXlsxComp" role="menuitem"><b>Excel — 처우 포함</b>
          <small>연봉 이력까지. 전달 대상을 꼭 확인하세요</small></button>
        <button id="expTemplate" role="menuitem"><b>빈 입력 서식 (.xlsx)</b>

        <hr>
        <button id="expDocx" role="menuitem"><b>Word 이력서 (.docx)</b>
          <small>연락처 포함. 직접 지원할 때</small></button>
        <button id="expDocxAnon" role="menuitem"><b>Word 이력서 — 전달용</b>
          <small>연락처를 뺀 판본. 헤드헌터를 거쳐 나갈 때</small></button>
      </div>
    </div>
  </header>

</div></div>

<div class="bookline"><div class="wrap">
  <span><b>AI 시대! 살아남는 직장인은 무엇이 다른가</b></span>
  <span>— 이대성 『커리어 스모그』와 <em>함께 만드는</em> 경력 관리 도구</span>
</div></div>

<div class="wrap">
  <section class="ledger" id="ledger"></section>
  <nav class="modes" id="modes"></nav>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="nextup" id="nextup"></div>
  <main id="view"></main>
</div>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   커리어 스모그 — Phase 1 단일 HTML
   저장소는 어댑터 뒤에 숨긴다. UI 코드는 localStorage를 직접 부르지 않는다.
   ============================================================ */
/* ===== 01-core.js ===== */
/* ---------- 1. 저장소 어댑터 (PRD 3.3) -------------------------------
   UI는 이 인터페이스만 호출한다. Phase 2에서 SupabaseAdapter를 추가하고
   pickAdapter()만 바꾸면 이행이 끝난다.
--------------------------------------------------------------------- */
class StorageAdapter {
  constructor(){ this.slot = null; }
  async load(){ throw new Error('구현 필요'); }
  async save(profile){ throw new Error('구현 필요'); }
  async listVersions(){ return []; }        // [{id, savedAt, label, bytes}]
  async loadVersion(id){ return null; }
  async snapshot(profile, label){ return null; }
  async dropVersion(id){ }
  async getMeta(k){ return null; }          // 프로필 바깥의 부가 정보(마지막 내보낸 시각 등)
  async setMeta(k, v){ }
  get label(){ return '알 수 없음'; }
  get durable(){ return false; }
  get multiSlot(){ return false; }
  slots(){ return []; }
  addSlot(label){ return null; }
  switchSlot(id){ return false; }
  renameSlot(id, label){}
  removeSlot(id){}
  wipeAll(){}
  /* slot은 일반 속성이다. 여기서 getter로 두면 하위 클래스가 대입할 수 없다. */
  setSlotMeta(){ return false; }

}

class LocalStorageAdapter extends StorageAdapter {
  static available(){
    try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); return true; }
    catch(e){ return false; }
  }
  constructor(){
    super();
    this.NS = 'career-smog';
    this.MAX_VERSIONS = 12;
    this.migrateFlatKeys();
    this.slot = this.activeSlot();
  }

  /* 슬롯 도입 이전(1.1)에는 키가 평평했다. 한 번만 옮겨 담고 흔적을 지운다. */
  migrateFlatKeys(){
    const old = localStorage.getItem(this.NS + ':current');
    if(!old) return;
    const slots = this.slots();
    if(!slots.length){
      const id = 's' + Date.now();
      localStorage.setItem(this.NS + ':' + id + ':current', old);
      const oldMeta = localStorage.getItem(this.NS + ':meta');
      if(oldMeta) localStorage.setItem(this.NS + ':' + id + ':meta', oldMeta);
      this.setSlots([{ id, label:'내 이력', updatedAt:new Date().toISOString() }]);
      localStorage.setItem(this.NS + ':active', id);
    }
    localStorage.removeItem(this.NS + ':current');
    localStorage.removeItem(this.NS + ':meta');
  }

  slots(){
    try { return JSON.parse(localStorage.getItem(this.NS + ':slots') || '[]'); }
    catch(e){ return []; }
  }
  setSlots(list){ localStorage.setItem(this.NS + ':slots', JSON.stringify(list)); }

  activeSlot(){
    let id = localStorage.getItem(this.NS + ':active');
    const slots = this.slots();
    if(!id || !slots.some(s => s.id === id)){
      if(slots.length){ id = slots[0].id; }
      else {
        id = 's' + Date.now();
        this.setSlots([{ id, label:'내 이력', updatedAt:new Date().toISOString() }]);
      }
      localStorage.setItem(this.NS + ':active', id);
    }
    return id;
  }
  k(suffix){ return this.NS + ':' + this.slot + ':' + suffix; }

  addSlot(label){
    const id = 's' + Date.now();
    const list = this.slots();
    list.push({ id, label: label || '새 이력', updatedAt:new Date().toISOString() });
    this.setSlots(list);
    return id;
  }
  switchSlot(id){
    if(!this.slots().some(s => s.id === id)) return false;
    localStorage.setItem(this.NS + ':active', id);
    this.slot = id;
    return true;
  }
  renameSlot(id, label){
    const list = this.slots();
    const s = list.find(x => x.id === id);
    if(s){ s.label = label; this.setSlots(list); }
  }
  removeSlot(id){
    Object.keys(localStorage).filter(k => k.startsWith(this.NS + ':' + id + ':'))
      .forEach(k => localStorage.removeItem(k));
    const list = this.slots().filter(s => s.id !== id);
    this.setSlots(list);
    if(this.slot === id){
      localStorage.removeItem(this.NS + ':active');
      this.slot = this.activeSlot();
    }
  }
  /** 남의 기기에 데이터를 남기지 않으려면 이 버튼이 반드시 필요하다. */
  wipeAll(){
    Object.keys(localStorage).filter(k => k.startsWith(this.NS + ':'))
      .forEach(k => localStorage.removeItem(k));
    this.slot = this.activeSlot();
  }

  async load(){
    const raw = localStorage.getItem(this.k('current'));
    return raw ? JSON.parse(raw) : null;
  }
  async save(profile){
    localStorage.setItem(this.k('current'), JSON.stringify(profile));
    const list = this.slots();
    const s = list.find(x => x.id === this.slot);
    if(s){
      s.updatedAt = new Date().toISOString();
      if(profile.profile && profile.profile.name && s.label === '내 이력') s.label = profile.profile.name;
      this.setSlots(list);
    }
  }
  async getMeta(key){
    try { return (JSON.parse(localStorage.getItem(this.k('meta')) || '{}'))[key] ?? null; }
    catch(e){ return null; }
  }
  async setMeta(key, v){
    let m = {};
    try { m = JSON.parse(localStorage.getItem(this.k('meta')) || '{}'); } catch(e){}
    m[key] = v;
    localStorage.setItem(this.k('meta'), JSON.stringify(m));
  }

  /* ---- 저장점 ----
     되돌릴 수 있어야 사람이 마음 놓고 고친다.
     오래된 것부터 버리고, 저장 공간이 모자라면 더 버려서라도 최신은 남긴다. */
  async listVersions(){
    try { return JSON.parse(localStorage.getItem(this.k('versions')) || '[]'); }
    catch(e){ return []; }
  }
  async snapshot(profile, label){
    const list = await this.listVersions();
    const id = 'v' + Date.now();
    const body = JSON.stringify(profile);
    list.unshift({ id, savedAt: new Date().toISOString(), label: label || '자동', bytes: body.length });

    while(list.length > this.MAX_VERSIONS){
      localStorage.removeItem(this.k('v:' + list.pop().id));
    }
    for(let attempt = 0; attempt < 6; attempt++){
      try {
        localStorage.setItem(this.k('v:' + id), body);
        localStorage.setItem(this.k('versions'), JSON.stringify(list));
        return id;
      } catch(e){
        const old = list.pop();                      // 공간 부족 → 가장 오래된 저장점을 버린다
        if(!old || list.length === 0) throw e;
        localStorage.removeItem(this.k('v:' + old.id));
      }
    }
    return null;
  }
  async loadVersion(id){
    const raw = localStorage.getItem(this.k('v:' + id));
    return raw ? JSON.parse(raw) : null;
  }
  async dropVersion(id){
    const list = (await this.listVersions()).filter(v => v.id !== id);
    localStorage.removeItem(this.k('v:' + id));
    localStorage.setItem(this.k('versions'), JSON.stringify(list));
  }
  get label(){ return '이 브라우저에 자동 저장'; }
  get durable(){ return true; }
  get multiSlot(){ return true; }
}

class MemoryAdapter extends StorageAdapter {
  constructor(){ super(); this._p = null; this._m = {}; this._v = []; this._vd = {}; }
  async load(){ return this._p; }
  async save(profile){ this._p = profile; }
  async getMeta(k){ return this._m[k] ?? null; }
  async setMeta(k, v){ this._m[k] = v; }
  async listVersions(){ return this._v; }
  async snapshot(profile, label){
    const id = 'v' + Date.now();
    const body = JSON.stringify(profile);
    this._v.unshift({ id, savedAt:new Date().toISOString(), label: label || '자동', bytes: body.length });
    this._vd[id] = body;
    while(this._v.length > 12){ delete this._vd[this._v.pop().id]; }
    return id;
  }
  async loadVersion(id){ return this._vd[id] ? JSON.parse(this._vd[id]) : null; }
  async dropVersion(id){ this._v = this._v.filter(v => v.id !== id); delete this._vd[id]; }
  get label(){ return '자동 저장 꺼짐 — 내보내기로 보관하세요'; }
  get durable(){ return false; }
  get multiSlot(){ return false; }
  wipeAll(){ this._p = null; this._m = {}; this._v = []; this._vd = {}; }
}
