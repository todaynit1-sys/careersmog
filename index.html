/** 처우는 넣지 않는다. 남의 연봉을 한 파일에 모으는 건 사고의 시작이다. */
function buildTeamXlsx(list){
  const sum = [['이름','단계','메모','태그','소개','가시도','스모그','총 경력(개월)','경력 수','성과 수',
                '수치 근거','출처','기록 수','총 시간','강의 회차','누적 수강',
                '연속(주)','최근 기록','최대 조직']];
  list.forEach(r => {
    const P = r.profile;
    const { visibility, axes } = smogScore(P);
    const t = tally(P.entries || []);
    const st = streaks(P, 'week');
    const last = Math.max(-1, ...(P.entries||[]).map(e => mi(String(e.date||'').slice(0,7))).filter(x => x !== null));
    const maxOrg = Math.max(0, ...(P.experiences||[]).map(e => (e.scale && e.scale.totalOrg) || 0));
    sum.push([
      P.profile.name || r.label, stageOf(r.stage).label, r.note || '', r.tags || '',
      P.profile.headline, visibility, smogGrade(visibility)[1],
      P.profile.totalMonths || null, (P.experiences||[]).length, (P.achievements||[]).length,
      axes.find(a=>a.key==='metric').value, axes.find(a=>a.key==='evidence').value,
      t.count, t.hasHours ? t.hours : null, t.lectures || null, t.audience || null,
      st.current || null, last < 0 ? '기록 없음' : unmi(last), maxOrg || null
    ]);
  });

  const act = [['이름','날짜','주차','유형','한 일','시간','인원','중요','성과 기록']];
  list.forEach(r => {
    const name = r.profile.profile.name || r.label;
    (r.profile.entries || []).slice()
      .sort((a,b) => (a.date < b.date ? 1 : -1))
      .forEach(e => act.push([name, e.date, weekKey(e.date), TYPE_LABEL[e.type] || e.type,
        e.title, e.hours ?? null, e.audience ?? null, e.important ? '★' : '', e.promotedTo ? 'O' : '']));
  });

  const wk = [['주차','기간'].concat(list.map(r => r.profile.profile.name || r.label)).concat(['합계'])];
  const keys = new Set();
  list.forEach(r => (r.profile.entries||[]).forEach(e => { const k = weekKey(e.date); if(k) keys.add(k); }));
  [...keys].sort().reverse().slice(0, 60).forEach(k => {
    const row = [k, weekLabel(k).split('  ')[1] || ''];
    let sumN = 0;
    list.forEach(r => {
      const n = (r.profile.entries||[]).filter(e => weekKey(e.date) === k).length;
      row.push(n || null); sumN += n;
    });
    row.push(sumN);
    wk.push(row);
  });

  return buildXlsx([
    { name:'요약', rows:sum, widths:[14,10,34,14,24,9,11,13,9,9,10,8,9,10,10,11,10,12,11] },
    { name:'활동 원장', rows:act, widths:[14,12,11,8,44,8,8,7,10] },
    { name:'주별 인원', rows:wk, widths:[11,14].concat(list.map(()=>11)).concat([9]) }
  ]);
}

    this.bind();
    if(!this.seenNotice) this.showPrivacyNotice();

    /* 앱은 저장본을 먼저 읽는다. 전에 쓰던 데이터가 그대로 열리는데
       그걸 모르면 "왜 안 바뀌지"가 된다. 무엇을 열었는지 한 번 알려준다. */
    const n = this.P.experiences.length + (this.P.entries || []).length;
    if(n){
      setTimeout(() => toast(
        `저장해 둔 내용을 열었습니다 — ${this.P.profile.name || '이름 없음'} · ` +
        `경력 ${this.P.experiences.length} · 기록 ${(this.P.entries||[]).length}건`), 400);
    }
  },

  /* 파생값은 저장본을 믿지 않고 매번 다시 계산한다 */
  recompute(){
    const P = this.P;
    P.profile.totalMonths = totalMonths(P.experiences);

    const found = detectGaps(P.experiences);
    found.forEach(g => {
      if(!P.gaps.some(x => x.start === g.start && x.end === g.end))
        P.gaps.push(Object.assign({ id:nextId(P.gaps,'gap'), reason:null, explanation:null }, g));
    });
    P.gaps = P.gaps.filter(g => found.some(f => f.start === g.start && f.end === g.end));

    /* 성과·역량 양방향 연결을 맞춰둔다. 한쪽만 고쳐도 어긋나지 않게. */
    P.skills.forEach(sk => {
      sk.achievementIds = P.achievements.filter(a => (a.skillIds||[]).includes(sk.id)).map(a => a.id);
      const fromAch = P.achievements.filter(a => (a.skillIds||[]).includes(sk.id) && a.experienceId)
                                    .map(a => a.experienceId);
      sk.experienceIds = [...new Set((sk.experienceIds||[]).concat(fromAch))]
                          .filter(id => P.experiences.some(e => e.id === id));
      const st = skillStats(P, sk);
      sk.monthsOfUse = st.months;
      sk.evidenceCount = st.evidenceCount;
      if(st.firstUsed) sk.firstUsed = st.firstUsed;
      if(st.lastUsed)  sk.lastUsed  = st.lastUsed;
    });
    P.experiences.forEach(e => {
      e.achievementIds = P.achievements.filter(a => a.experienceId === e.id).map(a => a.id);
      e.skillIds = [...new Set(P.achievements.filter(a => a.experienceId === e.id)
                                .reduce((acc,a) => acc.concat(a.skillIds||[]), []))];
    });
  },

  touch(){
    this.P.updatedAt = new Date().toISOString();
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.persist(), 3000);
    this.renderSaveState('저장 대기 중…');
  },

  async persist(){
    this.saveTimer = null;
    try {
      await this.adapter.save(this.P);
      /* 저장점은 한 시간에 한 번이면 충분하다. 매번 남기면 공간만 잡아먹는다. */
      if(Date.now() - this.lastSnap > 3600000){
        this.lastSnap = Date.now();
        try { await this.adapter.snapshot(this.P, '자동'); } catch(e){}
      }
      this.renderSaveState();
    } catch(e){
      this.renderSaveState('저장 실패 — 내보내기로 보관하세요');
    }
  },

  renderSaveState(msg){
    const n = document.getElementById('savestate');
    if(!n) return;
    if(msg){ n.innerHTML = esc(msg); return; }
    const stale = this.staleDays();
    n.innerHTML = `<b>${esc(this.adapter.label)}</b>` +
      (stale === null ? ' · 아직 내보낸 적 없음'
       : stale >= 30 ? ` · <b style="color:var(--seal)">${stale}일째 내보내지 않음</b>`
       : ` · ${stale === 0 ? '오늘' : stale + '일 전'} 내보냄`);
  },

  staleDays(){
    if(!this.lastExport) return null;
    return Math.floor((Date.now() - new Date(this.lastExport).getTime()) / 86400000);
  },

  render(){
    this.recompute();
    renderLedger(this.P);

    if(this.mode === 'admin' && !adminOn){ this.mode = 'weekly'; this.tab = 'log'; }

    const modes = MODES.filter(([m,, , open]) =>
      (m !== 'admin' || adminOn) && (m === 'admin' || tabOpen(this.P, open)));
    if(!modes.some(m => m[0] === this.mode)){ this.mode = 'weekly'; this.tab = 'log'; }

    const all = (MODES.find(m => m[0] === this.mode) || MODES[0])[2];
    const tabs = all.filter(([, , , open]) => tabOpen(this.P, open));
    if(!tabs.some(t => t[0] === this.tab)) this.tab = tabs[0][0];

    document.getElementById('modes').innerHTML = modes.map(([m, label]) =>
      `<button class="mode" data-mode="${m}" aria-selected="${this.mode===m}">${label}</button>`).join('');

    const hidden = all.length - tabs.length;
    document.getElementById('tabs').innerHTML = tabs.map(([id,label,cnt]) => {
      const c = cnt(this.P);
      return `<button class="tab" role="tab" data-tab="${id}"
        aria-selected="${this.tab===id}">${label}${c ? `<span class="cnt">${c}</span>` : ''}</button>`;
    }).join('') + (hidden || showAllTabs
      ? `<button class="tab more" id="btnShowAll" title="${showAllTabs
          ? '아직 쓸 데이터가 없는 탭을 접습니다' : '지금 숨겨진 탭을 모두 펼칩니다'}">${
          showAllTabs ? '접기' : `+${hidden}개 더`}</button>`
      : '');

    document.body.dataset.viewTab = this.tab;
    /* 클릭 위임 셀렉터에 [data-mode] 가 있으므로 body 에 같은 이름을 쓰면 안 된다.
       화면 아무 데나 클릭할 때 closest 가 body 를 집어 모드가 바뀐다 —
       체크박스 하나 눌렀는데 다른 탭으로 튕겼다. */
    document.body.dataset.viewMode = this.mode;

    const empty = !this.P.experiences.length && !this.P.achievements.length &&
                  !(this.P.entries||[]).length;
    document.getElementById('view').innerHTML =
      (empty && this.mode !== 'admin' && ['timeline','log','smog'].includes(this.tab)
        ? onboardCard(this.P) : '') +
      (VIEWS[this.tab] || viewTimeline)(this.P);

    if(this.tab === 'ach'){
      this.openAch.forEach(id => {
        const n = document.getElementById('ach-' + id);
        if(!n) return;
        n.classList.add('open');
        n.querySelector('.ach-head').setAttribute('aria-expanded','true');
        this.fillAchBody(id);
      });
    }
    const nextUp = (MODES.find(m => m[0] === this.mode) || MODES[0])[2]
      .filter(([, , , open, hint]) => open && hint && !open(this.P))
      .slice(0, 3);
    const gapBox = document.getElementById('gapNudge');
    if(gapBox) gapBox.style.display = (this.tab === 'resume' || this.tab === 'jd') ? 'none' : '';

    const nn = document.getElementById('nextup');
    if(nn) nn.innerHTML = (!showAllTabs && nextUp.length)
      ? `<span>더 채우면 열립니다 —</span>` + nextUp.map(([, label, , , hint]) =>
          `<b>${esc(label)}</b><i>${esc(hint)}</i>`).join('')
      : '';

    /* 유형·시간을 고르면 화면을 다시 그리므로 적던 글자를 되돌려 놓는다 */
    const mq = document.getElementById('mqTitle');
    if(mq && this.mqDraft){ mq.value = this.mqDraft; mq.dataset.keep = '1'; }
    if(this.tab !== 'log') this.mqDraft = '';

    if(this.tab === 'resume') renderResumeOut(this.P);
    if(this.tab === 'report') this.refreshReport();
    this.renderSaveState();
  },

  bind(){
    document.addEventListener('click',  e => this.onClick(e));
    document.addEventListener('input',  e => this.onInput(e));
    document.addEventListener('change', e => this.onChange(e));
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape'){
        if(Modal.kind) Modal.close();
        document.getElementById('exportMenu')?.classList.remove('on');
        return;
      }
      if((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.toggle){
        e.preventDefault(); e.target.click();
      }
      if(e.key === 'Enter' && (e.metaKey || e.ctrlKey) && Modal.kind){ Modal.save(); }
      if(e.key === 'Enter' && e.target.id === 'mqTitle'){ e.preventDefault(); this.mobileAdd(); }
      if(e.key === 'Enter' && e.target.id === 'eTitle'){ e.preventDefault(); this.addEntry(); }
    });
    /* 기록 화면의 파일 넣기. 화면을 다시 그릴 때마다 새로 생기므로 위임으로 받는다. */
    document.addEventListener('change', e => {
      if(!e.target || e.target.id !== 'logFile') return;
      const fs2 = [...e.target.files];
      /* 값을 먼저 비우면 읽기가 끝나기 전에 파일이 사라진다.
         목록을 복사해 두고, 읽기가 시작된 뒤에 비운다. */
      const go = fs2.length > 1 ? this.doImportMany(fs2)
               : fs2.length ? this.doImport(fs2[0]) : null;
      if(go && go.finally) go.finally(() => { e.target.value = ''; });
      else e.target.value = '';
    });

    ['dragover','dragenter'].forEach(ev => document.addEventListener(ev, e => {
      const dz = e.target.closest && e.target.closest('#logDrop');
      if(!dz) return;
      e.preventDefault(); dz.classList.add('on');
    }));
    ['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
      const dz = e.target.closest && e.target.closest('#logDrop');
      if(!dz) return;
      if(ev === 'drop') e.preventDefault();
      dz.classList.remove('on');
    }));
    document.addEventListener('drop', e => {
      const dz = e.target.closest && e.target.closest('#logDrop');
      if(!dz) return;
      e.preventDefault();
      const fs2 = [...(e.dataTransfer ? e.dataTransfer.files : [])];
      if(fs2.length > 1) this.doImportMany(fs2);
      else if(fs2.length) this.doImport(fs2[0]);
    });

    document.getElementById('fileInput').onchange = e => {
      const fs = [...e.target.files];
      if(fs.length > 1) this.doImportMany(fs);
      else this.doImport(fs[0]);
    };
    /* 관리자 화면의 파일 끌어놓기 */
    document.addEventListener('dragover', e => {
      const z = e.target.closest && e.target.closest('#adminDrop');
      if(z){ e.preventDefault(); z.classList.add('over'); }
    });
    document.addEventListener('dragleave', e => {
      const z = e.target.closest && e.target.closest('#adminDrop');
      if(z) z.classList.remove('over');
    });
    document.addEventListener('drop', e => {
      const z = e.target.closest && e.target.closest('#adminDrop');
      if(!z) return;
      e.preventDefault(); z.classList.remove('over');
      this.adminIntake(e.dataTransfer.files);
    });

    window.addEventListener('beforeunload', e => {
      if(this.saveTimer) this.persist();
      if(!this.adapter.durable && this.P.experiences.length + this.P.achievements.length){
        e.preventDefault(); e.returnValue = '';
      }
    });
  },

  onClick(e){
    const menu = document.getElementById('exportMenu');
    if(menu && menu.classList.contains('on') && !e.target.closest('.menu-wrap')) menu.classList.remove('on');

    const t = e.target.closest('[data-mode],[data-wk],[data-range],[data-imode],#btnBulkAdd,#btnGridAdd,[data-promote],[data-editent],[data-delent],'+
      '#btnEntryAdd,#btnRepCopy,#btnRepDocx,#btnRepPreview,#btnPrevNew,#btnRepPromote,'+
      '#btnMergeAdd,#btnMergeReplace,[data-purpose],[data-rprev],[data-rep-unit],[data-rep-shift],[data-rep-goto],[data-rep-detail],'+
      '[data-tab],[data-toggle],[data-add],[data-edit],[data-newach],[data-delach],'+
      '[data-madd],[data-mdel],[data-conf],[data-job],[data-goto],[data-confirm],[data-ver],[data-verdel],'+
      '#btnLoad,#btnSample,#btnExport,#btnProfile,#btnHistory,#btnSnap,#mClose,#mCancel,#mSave,#mDel,'+
      '#btnQuickAdd,#btnCopy,#btnClearPick,#btnDocxPicked,#btnDocxAll,#btnJdGo,#btnJdNew,#btnJdDel,'+
      '#expJson,#expTemplate,#expXlsx,#expXlsxComp,#expDocx,#expDocxAnon,#expPage,#btnPagePreview,#btnPageSave,[data-pageopt],[data-embed],#btnPaste,#btnCopySafe,#btnCopyFull,#btnPasteLoad,#histClose,'+
      '[data-anasort],[data-stage],[data-fstage],[data-pickperson],[data-note],#btnAdminMatch,#btnAdminCompare,'+
      '#btnMatchGo,#btnMatchBack,[data-sample],[data-preset],[data-open-axes],[data-showrec],#btnAxesSave,#btnSlots,#btnDraftSummary,#btnWipe,#btnResetOne,#slotAdd,#noticeOk,#btnLinkFile,#btnUnlinkFile,'+
      '#btnGrantFile,#btnYearCopy,#btnYearDocx,[data-slot],[data-slotdel],[data-onb],[data-jump],'+
      '[data-unit],[data-span],[data-ana-axis],[data-ana-scope],[data-ana-top],[data-ana-merge],'+
      '#btnAnaCopy,#btnAnaPromote,[data-open-person],#btnTeamXlsx,#btnAdminLock,#adminDrop,'+
      '#btnImpApply,#btnImpCancel,#btnMapApply,#btnPdfApply,#btnBlkApply,#btnDocApply,#btnRepDocApply,#btnPapApply,[data-doc-wk],#btnShowAll,.brand,#mqAdd,#mqMore,[data-mqtype],[data-mqh]');
    if(!t) return;
    const d = t.dataset;

    /* 로고 연타 → 관리자 잠금 해제. 보안이 아니라 가림막이다. */
    if(t.classList && t.classList.contains('brand')){
      if(adminTap()) this.adminGate();
      return;
    }
    /* --- 관리자 명부 --- */
    if(d.anasort){ anaSort = d.anasort; this.render(); return; }
    if(d.fstage !== undefined){ adminStage = d.fstage; this.render(); return; }
    if(t.id === 'btnAdminMatch'){ this.mode='admin'; this.tab='match'; this.render(); window.scrollTo(0,0); return; }
    if(t.id === 'btnAdminCompare'){ this.mode='admin'; this.tab='compare'; this.render(); window.scrollTo(0,0); return; }
    if(t.id === 'btnMatchBack'){ this.mode='admin'; this.tab='admin'; this.render(); window.scrollTo(0,0); return; }
    if(t.id === 'btnMatchGo'){
      const txt = document.getElementById('mJd').value;
      const res = runMatch(txt);
      if(!res){ toast('요건을 한 줄에 하나씩 적어주세요'); return; }
      matchJob = { raw:txt, result:res };
      this.render(); return;
    }

    if(t.id === 'btnAdminLock'){
      adminOn = false; roster = [];
      this.mode = 'weekly'; this.tab = 'log';
      this.render(); toast('관리자 화면을 잠갔습니다'); return;
    }
    if(t.id === 'adminDrop'){ document.getElementById('adminFiles').click(); return; }
    if(t.id === 'btnTeamXlsx'){
      if(!roster.length){ toast('등록된 이력이 없습니다'); return; }
      if(!confirm('전체 인원의 요약·활동 원장을 담은 엑셀을 만듭니다.\n남의 이력이 들어 있으니 전달 대상을 확인하세요.\n\n계속할까요?')) return;
      saveBlob(buildTeamXlsx(roster), `명부-${stamp()}.xlsx`,
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      toast('처우 정보는 들어가지 않습니다'); return;
    }
    if(d.openPerson){ this.switchSlot(d.openPerson); adminOn = false; roster = []; return; }
    if(t.id === 'btnImpApply'){ this.applyImport(); return; }
    if(t.id === 'btnMapApply'){ this.applyMapped(); return; }
    if(t.id === 'btnBlkApply'){ this.applyBlocks(); return; }
    if(t.id === 'btnPdfApply'){ this.applyPdf(); return; }
    if(t.id === 'btnDocApply'){ this.applyDocLog(); return; }
    if(t.id === 'btnRepDocApply'){ this.applyDocReport(); return; }
    if(t.id === 'btnPapApply'){ this.applyPapers(); return; }
    if(d.docWk !== undefined){
      this.docWeek = shiftWeek(this.docWeek || thisWeek(), +d.docWk);
      this.renderDocLog(); return;
    }
    if(t.id === 'btnImpCancel'){ Modal.close(); this.pendingPlan = null; return; }

    if(d.mode){
      this.mode = d.mode;
      this.tab = (MODES.find(m => m[0] === d.mode))[2][0][0];
      this.render(); window.scrollTo(0,0); return;
    }
    if(t.id === 'btnShowAll'){ showAllTabs = !showAllTabs; this.render(); return; }
    if(d.tab){ this.tab = d.tab; this.render(); window.scrollTo(0,0); return; }

    /* --- 주간 --- */
    /* --- 보고서 단위·기간 --- */
    if(d.repUnit){
      repUnit = d.repUnit; repKey = repCurrent(repUnit);
      this.render(); return;
    }
    if(d.repShift !== undefined){
      const n = +d.repShift;
      repKey = n === 0 ? repCurrent(repUnit) : shiftPeriod(repKey || repCurrent(repUnit), repUnit, n);
      this.render(); return;
    }
    if(d.repDetail){ reportDetail = d.repDetail; this.render(); return; }
    if(d.repGoto){
      const [u, k] = d.repGoto.split(':');
      repUnit = u; repKey = k;
      this.render(); window.scrollTo(0,0); return;
    }

    if(d.wk !== undefined){
      curWeek = (+d.wk === 0) ? thisWeek() : shiftWeek(curWeek || thisWeek(), +d.wk);
      if(repUnit === 'week') repKey = curWeek;
      this.render(); return;
    }
    if(d.anaAxis){ anaAxis = d.anaAxis; this.render(); return; }
    if(d.anaScope){ anaScope = d.anaScope; this.render(); return; }
    if(d.anaTop){ anaTop = +d.anaTop; this.render(); return; }
    if(d.anaMerge !== undefined){ anaMerge = d.anaMerge === '1'; this.render(); return; }
    if(t.id === 'btnAnaCopy'){
      const o = document.getElementById('anaOut');
      navigator.clipboard.writeText(o.value).then(() => toast('복사했습니다'))
        .catch(() => { o.removeAttribute('readonly'); o.select(); toast('직접 복사하세요'); });
      return;
    }
    if(t.id === 'btnAnaPromote'){
      const a = promoteAnalysis(this.P, anaAxis);
      if(!a){ toast('분석할 기록이 없습니다'); return; }
      this.touch(); this.render();
      toast('성과로 올렸습니다 — 커리어 › 성과에서 다듬으세요');
      return;
    }

    if(d.unit){ statUnit = d.unit; statSpan = SPANS[d.unit][1]; this.render(); return; }
    if(d.span){ statSpan = +d.span; this.render(); return; }
    if(t.id === 'btnYearCopy'){
      const txt = buildAnnualText(this.P, d.year);
      navigator.clipboard.writeText(txt).then(() => toast(d.year + '년 요약을 복사했습니다'))
        .catch(() => toast('복사에 실패했습니다'));
      return;
    }
    if(t.id === 'btnYearDocx'){ Exporter.annual(this.P, d.year); toast(d.year + '년 요약을 내려받습니다'); return; }

    /* --- 파일 직접 저장 --- */
    if(t.id === 'btnLinkFile'){ this.linkFile(); return; }
    if(t.id === 'btnUnlinkFile'){ this.unlinkFile(); return; }
    if(t.id === 'btnGrantFile'){ this.grantFile(); return; }
    if(d.imode){ inputMode = d.imode; this.render(); return; }
    /* --- 모바일 빠른 기록 --- */
    if(t.id === 'mqMore'){ mqOpen = !mqOpen; this.render(); this.focusMq(); return; }
    if(d.mqtype){ mqType = d.mqtype; this.render(); this.focusMq(); return; }
    if(d.mqh !== undefined){ mqHours = d.mqh === '' ? null : Number(d.mqh); this.render(); this.focusMq(); return; }
    if(t.id === 'mqAdd'){ this.mobileAdd(); return; }

    if(t.id === 'btnEntryAdd'){ this.addEntry(); return; }
    if(t.id === 'btnBulkAdd'){ this.addBulk(); return; }
    if(t.id === 'btnGridAdd'){ this.addGrid(); return; }
    if(d.editent){ Modal.open('entries', d.editent); return; }
    if(d.delent){
      const en = this.P.entries.find(x => x.id === d.delent);
      if(!confirm(`"${en.title || '제목 없는 기록'}"을(를) 지웁니다.`)) return;
      this.P.entries = this.P.entries.filter(x => x.id !== d.delent);
      this.touch(); this.render(); toast('지웠습니다'); return;
    }
    if(d.promote){
      const a = promoteEntry(this.P, d.promote);
      if(!a){ toast('기록을 찾지 못했습니다'); return; }
      this.touch(); this.render();
      toast('성과로 올렸습니다 — 커리어 › 성과에서 다듬으세요');
      return;
    }
    if(t.id === 'btnRepCopy'){
      const out = document.getElementById('repOut');
      navigator.clipboard.writeText(out.value).then(() => toast('복사했습니다'))
        .catch(() => { out.removeAttribute('readonly'); out.select(); toast('직접 복사하세요'); });
      return;
    }
    if(t.id === 'btnMergeAdd'){ this.applyMerge('add'); return; }
    if(t.id === 'btnMergeReplace'){
      if(!confirm('지금 내용을 버리고 파일 것으로 바꿉니다. 계속할까요?')) return;
      this.applyMerge('replace'); return;
    }
    if(d.purpose){ resumePurposeId = d.purpose; this.render(); return; }
    if(d.rprev){ resumeView = d.rprev; this.render(); return; }
    if(t.id === 'btnPrevNew'){ this.openPreview(
      buildCareerPage(this.P, { contact:false, stats:true, entries:false, embed:'none',
                                purpose:resumePurposeId, pickedIds:new Set(picked) })); return; }
    if(t.id === 'btnRepPreview'){ this.openPreview(
      buildReportHtml(this.P, repUnit, repKey || repCurrent(repUnit))); return; }
    if(t.id === 'btnRepPromote'){
      const a = promotePeriod(this.P, repUnit, repKey || repCurrent(repUnit));
      if(!a){ toast('이 기간에 기록이 없습니다'); return; }
      this.touch(); this.render();
      toast('성과로 올렸습니다 — 커리어 › 성과에서 다듬으세요');
      return;
    }
    if(t.id === 'btnRepDocx'){
      Exporter.period(this.P, repUnit, repKey || repCurrent(repUnit));
      toast((REPORT_UNITS.find(u => u[0] === repUnit)||[])[1] + ' 보고서를 내려받습니다'); return;
    }

    /* --- 폼 --- */
    if(d.add)  { Modal.open(d.add); return; }
    if(d.edit) { Modal.open(d.edit, d.eid); return; }
    if(t.id === 'btnProfile'){ Modal.open('profile'); return; }
    if(t.id === 'mSave'){ Modal.save(); return; }
    if(t.id === 'mDel'){ Modal.remove(); return; }
    if(t.id === 'mClose' || t.id === 'mCancel'){ Modal.close(); return; }

    /* --- 성과 --- */
    if(d.newach !== undefined){
      const a = newAchievement(this.P, d.newach || null);
      this.openAch.add(a.id); this.touch(); this.render();
      const n = document.getElementById('ach-' + a.id);
      if(n){ n.scrollIntoView({block:'center'}); n.querySelector('input[data-field="title"]')?.focus(); }
      return;
    }
    if(d.delach){
      const a = this.ach(d.delach);
      if(!confirm(`"${a.title || '제목 없는 성과'}"를 지웁니다.\n되돌리려면 변경 이력에서 이전 저장점을 불러오세요.`)) return;
      this.P.achievements = this.P.achievements.filter(x => x.id !== d.delach);
      this.openAch.delete(d.delach);
      this.touch(); this.render(); toast('지웠습니다'); return;
    }
    if(t.id === 'btnQuickAdd'){ this.quickAdd(); return; }

    if(d.toggle){
      const card = document.getElementById('ach-' + d.toggle);
      const on = card.classList.toggle('open');
      t.setAttribute('aria-expanded', on);
      if(on){ this.openAch.add(d.toggle); this.fillAchBody(d.toggle); }
      else this.openAch.delete(d.toggle);
      return;
    }
    if(d.madd){
      const a = this.ach(d.ach);
      (a.metrics = a.metrics || []).push({ name:'', before:null, after:null, unit:'', delta:null });
      this.mark(a); this.render(); return;
    }
    if(d.mdel){
      const a = this.ach(d.ach);
      a.metrics.splice(+d.mdel, 1);
      this.mark(a); this.render(); return;
    }

    /* --- 점검 --- */
    if(d.conf){
      const c = this.P.conflicts.find(x => x.id === d.conf);
      const cd = c.candidates[+d.cand];
      c.resolved = true; c.resolvedValue = cd.value;
      const pool = { experience:this.P.experiences, achievement:this.P.achievements,
                     skill:this.P.skills }[c.targetType] || [];
      const target = pool.find(o => o.id === c.targetId);
      if(target){ target[c.field] = cd.value; target.userEdited = true; }
      this.touch(); this.render(); toast('확정했습니다'); return;
    }
    if(d.confirm){
      const x = this.P.experiences.concat(this.P.achievements).find(o => o.id === d.confirm);
      if(x){ x.confidence = 'stated'; x.userEdited = true; }
      this.touch(); this.render(); return;
    }
    if(d.goto){
      this.tab = 'ach'; this.openAch.add(d.goto); this.render();
      document.getElementById('ach-' + d.goto)?.scrollIntoView({ block:'center' });
      return;
    }

    /* --- 공고 --- */
    if(d.job !== undefined){ activeJob = +d.job; this.render(); return; }
    if(t.id === 'btnJdGo'){ this.addJob(); return; }
    if(t.id === 'btnJdNew'){ activeJob = null; this.render(); return; }
    if(t.id === 'btnJdDel'){
      this.P.jobTargets.splice(activeJob, 1); activeJob = null;
      this.touch(); this.render(); return;
    }

    /* --- 이력서 --- */
    if(t.id === 'btnCopy'){
      const out = document.getElementById('resumeOut');
      if(!out.value.trim()){ toast('먼저 성과를 고르세요'); return; }
      navigator.clipboard.writeText(out.value).then(() => toast('복사했습니다'))
        .catch(() => { out.removeAttribute('readonly'); out.select(); toast('직접 복사하세요'); });
      return;
    }
    if(t.id === 'btnClearPick'){ picked.clear(); this.render(); return; }
    if(t.id === 'btnDocxPicked'){
      if(!picked.size){ toast('먼저 성과를 고르세요'); return; }
      Exporter.docx(this.P, { onlyPicked:true }); toast('Word 파일을 내려받습니다'); return;
    }
    if(t.id === 'btnDocxAll'){ Exporter.docx(this.P, {}); toast('Word 파일을 내려받습니다'); return; }

    /* --- 파일 --- */
    if(t.id === 'btnLoad'){ document.getElementById('fileInput').click(); return; }
    if(t.id === 'btnSample'){ this.showSamples(); return; }
    if(d.sample){ this.loadSample(d.sample); return; }
    if(d.openAxes){ this.showAxes(); return; }
    if(d.showrec !== undefined){ showAllRecords = d.showrec === '1'; this.render(); return; }
    if(d.preset){
      const p = applyPreset(this.P, d.preset);
      if(p){ this.touch(); this.showAxes(); toast(p.label + ' 기준으로 채웠습니다'); }
      return;
    }
    if(t.id === 'btnAxesSave'){ this.saveAxes(); return; }
    if(t.id === 'btnExport'){ document.getElementById('exportMenu').classList.toggle('on'); return; }
    if(t.id === 'expJson'){ this.doExport('json'); return; }
    if(t.id === 'expXlsx'){ this.doExport('xlsx'); return; }
    if(t.id === 'expDocx'){ this.doExport('docx'); return; }
    if(t.id === 'expDocxAnon'){ this.doExport('docxAnon'); return; }
    if(t.id === 'expTemplate'){
      Exporter.template(this.P);
      document.getElementById('exportMenu').classList.remove('on');
      toast('빈 서식을 내려받습니다 — 채워서 불러오기로 넣으세요');
      return;
    }
    if(t.id === 'expPage'){
      document.getElementById('exportMenu').classList.remove('on');
      this.showPageOpts(); return;
    }
    if(d.embed){ PAGE_OPTS.embed = d.embed; this.showPageOpts(); return; }
    if(t.id === 'btnPaste'){ this.showPaste(); return; }
    if(t.id === 'btnCopySafe'){ this.copyProfile('safe'); return; }
    if(t.id === 'btnCopyFull'){ this.copyProfile('full'); return; }
    if(t.id === 'btnPasteLoad'){ this.pasteLoad(); return; }
    if(d.pageopt){
      PAGE_OPTS[d.pageopt] = !PAGE_OPTS[d.pageopt];
      this.showPageOpts(); return;
    }
    if(t.id === 'btnPageSave'){
      Exporter.page(this.P, PAGE_OPTS);
      Modal.close(); toast('이력 페이지를 내려받습니다'); return;
    }
    if(t.id === 'btnPagePreview'){
      const html = buildCareerPage(this.P, PAGE_OPTS);
      this.openPreview(html);
      return;
    }

    /* --- 프로필 슬롯 --- */
    if(t.id === 'btnSlots'){ this.showSlots(); return; }
    if(t.id === 'slotAdd'){ this.addSlotFlow(); return; }
    if(d.slot){ this.switchSlot(d.slot); return; }
    if(d.slotdel){ this.deleteSlot(d.slotdel); return; }
    if(t.id === 'btnWipe'){ this.wipe(); return; }
    if(t.id === 'btnResetOne'){ this.resetCurrent(); return; }
    if(t.id === 'noticeOk'){
      Modal.close();
      this.adapter.setMeta('seenPrivacyNotice', new Date().toISOString()).catch(() => {});
      this.seenNotice = true; return;
    }

    if(d.jump){
      this.mode = TAB_MODE[d.jump] || 'career';
      this.tab = d.jump; this.render(); window.scrollTo(0,0); return;
    }

    /* --- 온보딩 --- */
    if(d.onb === 'profile'){ Modal.open('profile'); return; }
    if(d.onb === 'exp'){ Modal.open('experiences'); return; }
    if(d.onb === 'log'){ this.mode = 'weekly'; this.tab = 'log'; this.render(); return; }
    if(d.onb === 'ach'){ this.mode = 'career'; this.tab = 'ach'; this.render(); window.scrollTo(0,0); return; }
    if(d.onb === 'resume'){ this.mode = 'career'; this.tab = 'resume'; this.render(); window.scrollTo(0,0); return; }

    if(t.id === 'btnDraftSummary'){
      const draft = draftExecutiveSummary(this.P);
      if(!draft){ toast('먼저 경력을 넣어주세요'); return; }
      const box = document.getElementById('m-executiveSummary');
      if(box){ box.value = draft; box.focus(); toast('사실만 이어 붙인 초안입니다 — 다듬어 쓰세요'); }
      return;
    }
    if(t.id === 'expXlsxComp'){ this.doExport('xlsxComp'); return; }

    /* --- 저장점 --- */
    if(t.id === 'btnHistory'){ this.showHistory(); return; }
    if(t.id === 'histClose'){ Modal.close(); return; }
    if(t.id === 'btnSnap'){ this.makeSnapshot(); return; }
    if(d.ver){ this.restoreVersion(d.ver); return; }
    if(d.verdel){ this.adapter.dropVersion(d.verdel).then(() => this.showHistory()); return; }
  },

  onInput(e){
    const ad = e.target.dataset || {};
    if(ad.note !== undefined){
      const r = roster.find(x => x.id === ad.note);
      if(r){ r.note = e.target.value; this.adapter.setSlotMeta(r.id, { note:r.note }); }
      return;
    }
    if(e.target.id === 'adminQ'){
      adminQuery = e.target.value;
      clearTimeout(this._qT);
      this._qT = setTimeout(() => { this.render(); const n = document.getElementById('adminQ');
        if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250);
      return;
    }
    if(e.target.id === 'mqTitle'){ this.mqDraft = e.target.value; return; }
    if(e.target.id === 'bulkIn'){ renderBulkPreview(); return; }
    if(e.target.dataset && e.target.dataset.grid !== undefined){ renderGridPreview(); return; }
    const d = e.target.dataset || {};
    if(d.ach && d.field){
      const a = this.ach(d.ach);
      if(!a) return;
      if(d.field.startsWith('scope.')){
        a.scope = a.scope || {};
        const k = d.field.slice(6);
        a.scope[k] = k === 'teamSize' ? (e.target.value ? +e.target.value : null) : (e.target.value || null);
      } else if(d.field === 'date'){
        a.date = normMonth(e.target.value);
      } else if(d.field === 'experienceId'){
        a.experienceId = e.target.value || null;
      } else {
        a[d.field] = e.target.value.trim() || null;
      }
      this.mark(a);
      e.target.closest('.fld')?.classList.toggle('blank', !e.target.value.trim());
      return;
    }
    if(d.ach && d.metric !== undefined){
      const a = this.ach(d.ach), m = a.metrics[+d.metric];
      const v = e.target.value.trim();
      m[d.mk] = (d.mk === 'before' || d.mk === 'after')
        ? (v === '' ? null : (isFinite(+v) ? +v : v)) : v;
      m.delta = deltaOf(m) || null;
      this.mark(a); return;
    }
    if(d.rep){
      const r = ensureReport(this.P, repUnit, repKey || repCurrent(repUnit));
      r[d.rep] = e.target.value;
      r.userEdited = true;
      this.touch(); this.refreshReport(); return;
    }
    if(d.gap){
      const g = this.P.gaps.find(x => x.id === d.gap);
      if(g){ g[d.gk] = e.target.value.trim() || null; this.touch(); }
      return;
    }
  },

  onChange(e){
    const md = e.target.dataset || {};
    if(md.stage !== undefined){
      const r = roster.find(x => x.id === md.stage);
      if(r){
        r.stage = e.target.value;
        this.adapter.setSlotMeta(r.id, { stage:r.stage });
        /* 화면을 다시 그리면 아직 안 만진 칸까지 되돌아간다.
           여러 명을 연달아 분류하는 일이 흔하므로 색만 바꾸고 둔다. */
        const st = stageOf(r.stage);
        e.target.style.borderColor = st.tone; e.target.style.color = st.tone;
        this.refreshStageBar();
        clearTimeout(this._stT);
        this._stT = setTimeout(() => { if(this.mode === 'admin' && this.tab === 'admin') this.render(); }, 1200);
      }
      return;
    }
    if(md.pickperson !== undefined){
      e.target.checked ? adminPicked.add(md.pickperson) : adminPicked.delete(md.pickperson);
      e.target.closest('.prow').classList.toggle('picked', e.target.checked);
      const b = document.getElementById('btnAdminCompare');
      if(b){ b.disabled = adminPicked.size < 2;
        b.textContent = '비교' + (adminPicked.size ? ` (${adminPicked.size})` : ''); }
      return;
    }
    if(e.target.id === 'adminSort'){ adminSort = e.target.value; this.render(); return; }
    if(md.blktarget !== undefined){
      const i = +md.blktarget, b = this.blocks[i];
      b.target = e.target.value;
      b.map = guessCols(b, b.target);
      this.renderBlocks();
      return;
    }
    if(md.blkkind !== undefined){ this.blocks[+md.blkkind].kind = e.target.value; return; }
    if(md.papuse !== undefined){
      const i = +md.papuse;
      this.papers[i].use = e.target.checked;
      e.target.closest('.paprow').classList.toggle('off', !e.target.checked);
      const b = document.getElementById('btnPapApply');
      if(b) b.textContent = this.papers.filter(p=>p.use).length + '편 가져오기';
      return;
    }
    if(md.paptitle !== undefined){
      const i = +md.paptitle, ci = +e.target.value;
      const box = document.querySelector(`[data-paptext="${i}"]`);
      if(ci >= 0 && box) box.value = this.papers[i].titleCandidates[ci].text;
      if(box) box.focus();
      return;
    }
    if((e.target.dataset || {}).repdoc === 'unit'){
      if(this.repPlan){
        this.repPlan.period = { unit:e.target.value, key:null };
        this.renderDocReport();
      }
      return;
    }
    if(e.target.id === 'docModeSel'){
      this.docMode = e.target.value;
      if(this.docMode === 'resume' && !this.pdfRows){
        this.pdfRows = classifyResume(this.docText); this.pdfName = this.docName;
      }
      this.renderDoc(); return;
    }
    if(md.pdfkind !== undefined){
      const r = this.pdfRows[+md.pdfkind];
      r.kind = e.target.value;
      e.target.closest('.pdfrow').classList.toggle('off', r.kind === 'skip');
      const btn = document.getElementById('btnPdfApply');
      const n = this.pdfRows.filter(x => x.kind !== 'skip').length;
      if(btn){ btn.textContent = n + '건 가져오기'; btn.disabled = !n; }
      return;
    }
    if(md.map !== undefined || md.mapmulti !== undefined){
      const k = md.map;
      if(k === 'sheet'){
        this.mapName = e.target.value;
        this.mapHeader = guessHeaderRow(this.mapSheets[this.mapName]);
        this.mapping = guessMapping(this.mapSheets[this.mapName][this.mapHeader]);
      } else if(k === 'header'){
        this.mapHeader = +e.target.value;
        this.mapping = guessMapping(this.mapSheets[this.mapName][this.mapHeader]);
      } else if(k === 'type'){
        this.mapping.type = e.target.value;
      } else if(k){
        this.mapping[k] = +e.target.value;
      } else {
        const f = md.mapmulti, v = +e.target.value;
        const set = new Set(this.mapping[f]);
        e.target.checked ? set.add(v) : set.delete(v);
        this.mapping[f] = [...set].sort((a,b)=>a-b);
      }
      this.renderMapper();
      return;
    }

    /* 관리자 파일 입력은 화면을 다시 그릴 때마다 새로 생기므로 위임으로 받는다.
       한 번만 붙여두면 재렌더 뒤에 조용히 먹통이 된다. */
    if(e.target.id === 'adminFiles'){ this.adminIntake(e.target.files); return; }
    const d = e.target.dataset || {};
    if(d.achskill){
      const a = this.ach(d.achskill);
      const set = new Set(a.skillIds || []);
      e.target.checked ? set.add(e.target.value) : set.delete(e.target.value);
      a.skillIds = [...set];
      this.mark(a); return;
    }
    if(d.pick){
      e.target.checked ? picked.add(d.pick) : picked.delete(d.pick);
      renderResumeOut(this.P); return;
    }
    if(d.req !== undefined && activeJob !== null){
      this.P.jobTargets[activeJob].requirements[+d.req].status = e.target.value;
      this.touch(); this.render(); return;
    }
    if(d.ach && (d.field || d.metric !== undefined)) this.onInput(e);
  },

  /** 카드 몸통은 펼칠 때 만든다. 접힌 것까지 그리면 목록이 길어질수록 느려진다. */
  fillAchBody(id){
    const box = document.querySelector(`[data-body="${id}"]`);
    if(!box || box.dataset.filled) return;
    const a = this.ach(id);
    if(!a) return;
    box.innerHTML = achCardBody(this.P, a);
    box.dataset.filled = '1';
  },

  ach(id){ return this.P.achievements.find(a => a.id === id); },
  mark(a){ a.userEdited = true; this.touch(); },

  refreshReport(){
    const out = document.getElementById('repOut');
    if(out) out.value = buildPeriodReport(this.P, repUnit, repKey || repCurrent(repUnit));
  },

  focusMq(){
    const n = document.getElementById('mqTitle');
    if(n && n.dataset.keep) n.focus();
  },

  /** 엄지 하나로 끝나야 한다. 없는 값은 묻지 않고 비워둔다. */
  mobileAdd(){
    const box = document.getElementById('mqTitle');
    const title = (box.value || '').trim();
    if(!title){ toast('한 줄만 적어주세요'); box.focus(); return; }

    const audEl = document.getElementById('mqAud');
    const impEl = document.getElementById('mqImp');
    const today = ymd(new Date());

    newEntry(this.P, {
      date: today, dateMode:'day', type: mqType, title,
      hours: mqHours, audience: audEl && audEl.value ? Number(audEl.value) : null,
      important: !!(impEl && impEl.checked)
    });

    curWeek = weekKey(today);
    mqOpen = false; this.mqDraft = '';
    this.touch(); this.render();
    const nb = document.getElementById('mqTitle');
    if(nb){ nb.value = ''; nb.focus(); }
    toast('기록했습니다');
  },

  addEntry(){
    const g = id => document.getElementById(id);
    const title = g('eTitle').value.trim();
    if(!title){ toast('무엇을 했는지 한 줄은 적어주세요'); g('eTitle').focus(); return; }
    let date = normYmd(g('eDate').value) || ymd(new Date());
    const byWeek = g('eWeek').checked;
    /* 주 단위 기록은 그 주 월요일로 저장한다. 집계는 그대로 돌고 표시만 달라진다. */
    if(byWeek){ const mon = weekMonday(weekKey(date)); if(mon) date = ymd(mon); }
    const hours = g('eHours').value.trim(), aud = g('eAud').value.trim();

    const facets = {};
    document.querySelectorAll('.entry-form [data-axis]').forEach(n => {
      const v = n.value.trim();
      if(v) facets[n.dataset.axis] = v;
    });

    newEntry(this.P, {
      date, dateMode: byWeek ? 'week' : 'day',
      type: g('eType').value, title,
      detail: g('eDetail').value.trim() || null,
      experienceId: g('eOrg').value || null,
      hours: hours === '' ? null : Number(hours),
      audience: aud === '' ? null : Number(aud),
      important: g('eImp').checked,
      facets
    });

    /* 적은 주가 보고 있는 주와 다르면 그쪽으로 옮겨준다.
       기록했는데 화면에 안 보이면 저장이 안 된 줄 안다. */
    const k = weekKey(date);
    const jumped = k !== curWeek;
    curWeek = k;

    this.touch(); this.render();
    const t = document.getElementById('eTitle');
    if(t){
      document.getElementById('eDate').value = date;
      /* 축 값은 연달아 같은 걸 넣는 일이 많아 남겨둔다 */
      Object.keys(facets).forEach(k2 => {
        const n = document.querySelector(`.entry-form [data-axis="${k2}"]`);
        if(n) n.value = facets[k2];
      });
      t.focus();
    }
    toast(jumped ? weekLabel(k) + '에 기록했습니다' : '기록했습니다');
  },

  addGrid(){
    const rows = collectGrid();
    if(!rows.length){ toast('표에 적힌 내용이 없습니다'); return; }
    const expId = document.getElementById('gridExp').value || null;

    rows.forEach(r => newEntry(this.P, {
      date:r.date, dateMode:r.dateMode, type:r.type, title:r.title,
      hours:r.hours, audience:r.audience, important:r.important, experienceId:expId
    }));

    this.touch();
    inputMode = 'one';              // 등록 후엔 결과를 바로 보여준다
    this.render();
    toast(rows.length + '건 등록했습니다 — 세부 내용은 편집에서 채우세요');
  },

  addBulk(){
    const box = document.getElementById('bulkIn');
    const wk = curWeek || thisWeek();
    const rows = parseBulk(box.value, wk);
    if(!rows.length){ toast('해석할 줄이 없습니다'); return; }

    const expId = document.getElementById('bulkExp').value || null;
    const mon = weekMonday(wk);
    rows.forEach(r => newEntry(this.P, {
      date: r.dateMode === 'day' ? r.date : (mon ? ymd(mon) : ymd(new Date())),
      dateMode: r.dateMode, type: r.type, title: r.title,
      hours: r.hours, audience: r.audience, facets: r.facets || {},
      important: r.important, experienceId: expId
    }));

    box.value = '';
    this.touch();
    inputMode = 'one';              // 등록 후엔 결과를 바로 보여준다
    this.render();
    toast(rows.length + '건 등록했습니다 — 세부 내용은 편집에서 채우세요');
  },

  quickAdd(){
    const box = document.getElementById('quickIn');
    const expId = document.getElementById('quickExp').value || null;
    const date = normMonth(document.getElementById('quickDate').value) || unmi(nowMi());
    const lines = box.value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!lines.length){ toast('기록할 내용을 적어주세요'); return; }

    lines.forEach(l => newAchievement(this.P, expId, l, date));
    box.value = '';
    this.touch(); this.render();
    toast(lines.length + '건 기록했습니다');
  },

  addJob(){
    const co = document.getElementById('jdCo').value.trim();
    const text = document.getElementById('jdText').value;
    const lines = splitRequirements(text);
    if(!lines.length){ toast('요구사항으로 쪼갤 줄이 없습니다'); return; }

    this.P.jobTargets.push({
      id: nextId(this.P.jobTargets, 'job'),
      company: co, title:'', jdText: text, addedAt: stamp(),
      requirements: lines.map(l => {
        const m = suggestMatch(this.P, l.text);
        return { text:l.text, type:l.type, matchedSkillIds:m.ids,
                 matchedAchievementIds:[], status:m.status, note:m.note };
      })
    });
    activeJob = this.P.jobTargets.length - 1;
    this.touch(); this.render();
    toast('자동 판정은 출발점입니다. 직접 고치세요');
  },

  async doImport(file){
    if(!file) return;

    /* 확장자에 따라 갈라진다. 엑셀·워드는 통째로 바꾸지 않고 붙이기만 한다. */
    if(/\.xlsx$/i.test(file.name)){ await this.importXlsx(file); return; }
    if(/\.docx$/i.test(file.name)){ await this.importDocx(file); return; }
    if(/\.pdf$/i.test(file.name)){ await this.importPdf(file); return; }
    if(/\.html?$/i.test(file.name)){ await this.importPage(file); return; }

    try {
      const raw = await FileAdapter.read(file);
      const { profile, notes } = migrate(raw);
      const has = this.P.experiences.length || this.P.achievements.length || (this.P.entries||[]).length;

      /* 이미 쓰던 내용이 있으면 덮어쓸지 합칠지 고르게 한다.
         묻지 않고 덮어쓰면 여기서 적은 것이 소리 없이 사라진다. */
      if(has){ this.showMergeChoice(profile, notes); return; }

      this.P = profile;
      picked.clear(); activeJob = null; this.openAch.clear();
      await this.persist();
      this.render();
      toast(notes.length ? notes[0] : '불러왔습니다');
    } catch(err){ toast(err.message); }
    document.getElementById('fileInput').value = '';
  },

  async importXlsx(file){
    try {
      const sheets = await readXlsx(await file.arrayBuffer());
      const plan = planXlsxImport(this.P, sheets);

      /* 이 앱이 내보낸 형식이 아니면 표를 찾아 어디로 보낼지 고르게 한다.
         실제 업무 파일은 한 시트에 표를 여럿 늘어놓는 게 흔하다. */
      const known = plan.entries.length + plan.experiences.length + plan.achievements.length;
      if(!known){
        const blocks = [];
        Object.keys(sheets).forEach(name => {
          findBlocks(sheets[name]).forEach(b => {
            const t = guessTarget(b);
            blocks.push(Object.assign(b, { sheet:name, target:t, map:guessCols(b, t) }));
          });
        });
        if(blocks.length > 1 || (blocks.length === 1 && blocks[0].header.length > 1)){
          this.blocks = blocks; this.blockFile = file.name;
          this.renderBlocks();
          document.getElementById('fileInput').value = '';
          return;
        }
        this.openMapper(sheets, file.name); return;
      }
      this.pendingPlan = plan;

      const line = (n, label, dup) => n
        ? `<div class="roster-row"><div class="per">${n}건</div>
             <div class="who">${label}</div>
             <div class="dur">${dup ? `<span class="pill seal">중복 후보 ${dup}</span>` : ''}</div></div>` : '';

      const host = document.getElementById('modal');
      host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="엑셀 가져오기">
        <div class="sheet-head"><h3>엑셀에서 가져오기</h3>
          <button class="btn ghost" id="mClose" aria-label="닫기">×</button></div>
        <p class="hint" style="margin:0 0 12px">${esc(file.name)}에서 읽은 내용입니다.
          기존 데이터는 <b>지우지 않고 뒤에 붙입니다.</b></p>
        ${line(plan.experiences.length, '경력', plan.dupExps)}
        ${line(plan.achievements.length, '성과', plan.dupAchs)}
        ${line(plan.entries.length, '주간 기록', plan.dupEntries)}
        ${plan.notes.length ? `<p class="hint" style="margin-top:12px;color:var(--seal)">${
          plan.notes.map(esc).join('<br>')}</p>` : ''}
        ${(plan.dupEntries + plan.dupExps + plan.dupAchs) ? `
        <label class="chk" style="margin-top:12px">
          <input type="checkbox" id="impSkipDup" checked> 이미 있는 항목은 건너뛰기</label>` : ''}
        <div class="sheet-foot">
          <button class="btn" id="btnImpCancel">취소</button>
          <button class="btn primary" id="btnImpApply"
            ${(plan.entries.length+plan.experiences.length+plan.achievements.length) ? '' : 'disabled'}>가져오기</button>
        </div></div>`;
      host.classList.add('on');
      Modal.kind = 'import';
    } catch(e){ toast('엑셀 읽기 실패: ' + (e.message || e)); }
    document.getElementById('fileInput').value = '';
  },

      const kn = document.querySelector(`[data-blkkind="${i}"]`);
      const n = applyBlock(P, b, b.target, map, { projectKind: kn ? kn.value : null });
      if(n) done[b.target] = (done[b.target] || 0) + n;
    });

    P.sources.push({ id:nextId(P.sources,'src'), filename:this.blockFile,

      extractionMethod:'spreadsheet', extractionQuality:'good', rawText:'' });

    this.blocks = null;

          `${(IMPORT_TARGETS.find(t=>t.id===k)||{}).label} ${v}건`).join(' · ') + ' 추가'
      : '가져올 항목이 없습니다');

    const names = Object.keys(sheets).filter(n => (sheets[n] || []).length > 1);
    if(!names.length){ toast('읽을 수 있는 시트가 없습니다'); return; }
    this.mapSheets = sheets;
    this.mapName = names[0];
    this.mapFile = filename;
    this.mapHeader = guessHeaderRow(sheets[names[0]]);
    this.mapping = guessMapping(sheets[names[0]][this.mapHeader]);
    this.renderMapper();
  },

    const before = this.P.entries.length;
    const seen = new Set(this.P.entries.map(e => e.date + '|' + e.title));
    let dup = 0;
    rows.forEach(r => {
      if(seen.has(r.date + '|' + r.title)){ dup++; return; }

  /** 여러 파일을 한 번에. 논문 여러 편을 넣는 일이 가장 흔하다. */
  async doImportMany(files){
    toast(files.length + '개 파일을 읽는 중입니다…');
    const papers = [], other = [];
    for(const f of files){
      if(!/\.pdf$/i.test(f.name)){ other.push([f.name, 'PDF만 여러 개 처리합니다']); continue; }
      try {
        const lines = await readPdfText(await f.arrayBuffer());
        if(guessDocMode(lines, f.name) !== 'paper'){ other.push([f.name, '논문으로 보이지 않습니다']); continue; }
        papers.push(Object.assign(parseDocPaper(lines, f.name), { file:f.name, use:true }));
      } catch(e){ other.push([f.name, e.message || '읽지 못했습니다']); }
    }
    document.getElementById('fileInput').value = '';
    if(!papers.length){
      toast('논문을 찾지 못했습니다 — 한 개씩 넣어보세요');
      return;
    }
    this.papers = papers; this.papersSkipped = other;
    this.renderPapers();
  },

  applyPapers(){
    const g = (k, i) => { const n = document.querySelector(`[data-${k}="${i}"]`); return n ? n.value.trim() : ''; };
    const P = this.P;
    const have = new Set((P.publications||[]).map(x => (x.title||'').replace(/\s/g,'')));
    let added = 0, dup = 0;

    this.papers.forEach((p, i) => {
      if(!p.use) return;
      const title = g('paptext', i);
      if(!title) return;
      if(have.has(title.replace(/\s/g,''))){ dup++; return; }
      const vol = p.volume ? `${p.volume.vol}(${p.volume.no}) ${p.volume.from}-${p.volume.to}` : null;
      P.publications.push({
        id: nextId(P.publications, 'pub'),
        title, kind: g('papkind', i) || '논문',
        publishedAt: normMonth(g('papdate', i)) || null,
        publisher: g('pappub', i) || null,
        role: g('paprole', i) || '공동저자',
        identifier: p.identifier || null, url: null,
        note: [vol, p.authors.length ? '저자 ' + p.authors.join(', ') : null].filter(Boolean).join(' · ') || null,
        userEdited: true
      });
      have.add(title.replace(/\s/g,''));
      added++;
    });

    P.sources.push({ id:nextId(P.sources,'src'), filename:`논문 ${this.papers.length}편`,
      docType:'other', uploadedAt:stamp(), pageCount:null,
      extractionMethod:'text_layer', extractionQuality:'good', rawText:'' });

    this.papers = null;
    Modal.close(); this.touch();
    this.mode = 'career'; this.tab = 'records';
    this.render();
    toast(`논문 ${added}편 추가${dup ? ` · 중복 ${dup}편 건너뜀` : ''}`);
  },

  /* ---------- 덮어쓰기 / 합치기 ---------- */
  showMergeChoice(incoming, notes){
    this.incoming = incoming;
    const prev = mergeProfiles(this.P, incoming);
    const cnt = o => Object.entries(o).map(([k,v]) =>
      `${({experiences:'경력',achievements:'성과',entries:'기록',skills:'역량',
          reports:'보고서',publications:'저서·논문',projects:'활동',education:'학력',
          certifications:'자격증',awards:'수상',compensation:'처우',
          references:'레퍼런스',sources:'출처'})[k] || k} ${v}`).join(' · ');

    const host = document.getElementById('modal');
    host.innerHTML = `<div class="sheet" style="max-width:600px" role="dialog" aria-modal="true"
        aria-label="불러오기 방식">
      <div class="sheet-head"><h3>어떻게 넣을까요</h3>
        <button class="btn ghost" id="mClose" aria-label="닫기">×</button></div>
      <p class="hint" style="margin:0 0 14px">이미 쓰던 내용이 있습니다.
        <b>클로드와 앱을 오가며 쓸 때는 합치기가 안전합니다.</b>
        덮어쓰면 여기서 적은 것이 사라집니다.</p>

      <button class="mchoice on" id="btnMergeAdd">
        <b>합치기 <span>권장</span></b>
        <span>없는 것만 더합니다. 지금 있는 건 그대로 둡니다.</span>
        <i>${cnt(prev.added) || '더할 것이 없습니다'}</i>
      </button>

      <button class="mchoice" id="btnMergeReplace">
        <b>덮어쓰기</b>
        <span>지금 내용을 버리고 파일 것으로 바꿉니다.</span>
        <i>지금 기록 ${(this.P.entries||[]).length}건 → ${(incoming.entries||[]).length}건</i>
      </button>

      ${prev.conflicts.length ? `<p class="hint" style="margin-top:12px;color:var(--warn)">
        같은 항목을 양쪽에서 고쳤습니다 — 합치면 <b>여기 것이 남습니다</b> (${prev.conflicts.length}건):
        ${esc(prev.conflicts.slice(0,4).map(c => c.label).join(', '))}${
        prev.conflicts.length > 4 ? ' 외' : ''}</p>` : ''}
      ${notes && notes.length ? `<p class="hint">${esc(notes[0])}</p>` : ''}
      <p class="hint">어느 쪽을 고르든 지금 상태를 저장점으로 남깁니다.</p>
    </div>`;
    host.classList.add('on');
    Modal.kind = 'merge';
  },

  async applyMerge(mode){
    const inc = this.incoming;
    if(!inc) return;
    try { await this.adapter.snapshot(this.P, '불러오기 직전'); } catch(e){}

    let msg;
    if(mode === 'replace'){
      this.P = inc;
      msg = '덮어썼습니다';
    } else {
      const r = mergeProfiles(this.P, inc);
      this.P = r.profile;
      const total = Object.values(r.added).reduce((a,b) => a+b, 0);
      const dup = Object.values(r.skipped).reduce((a,b) => a+b, 0);
      msg = total ? `${total}건 더했습니다` + (dup ? ` · 이미 있는 ${dup}건은 건너뜀` : '')
                  : '더할 것이 없었습니다';
    }
    this.incoming = null;
    picked.clear(); activeJob = null; this.openAch.clear();
    Modal.close();
    await this.persist();
    this.recompute(); this.render();
    toast(msg);
  },

  /** 내보낸 이력 페이지를 도로 읽는다. 그 파일 하나가 곧 백업이다. */
  async importPage(file){
    try {
      const html = await file.text();
      const raw = readPageData(html);
      if(!raw){
        toast('이 HTML에는 원본 데이터가 없습니다 — 데이터를 심어 내보낸 파일이어야 합니다');
        return;
      }
      const { profile, notes } = migrate(raw);
      if(this.P.experiences.length || (this.P.entries||[]).length){
        this.showMergeChoice(profile, notes); return;
      }
      this.P = profile;
      picked.clear(); activeJob = null; this.openAch.clear();
      await this.persist();
      this.render();
      toast(`이어서 씁니다 — ${profile.profile.name || '이름 없음'} · 기록 ${(profile.entries||[]).length}건` +
        (mode !== 'full' ? ' (처우 제외 판본)' : ''));
    } catch(e){ toast('페이지를 읽지 못했습니다: ' + (e.message || e)); }
    document.getElementById('fileInput').value = '';
  },

  copyProfile(mode){
    this.recompute();
    const data = pageEmbedData(this.P, mode, mode === 'full');
    const txt = JSON.stringify(data);
    navigator.clipboard.writeText(txt)
      .then(() => toast(`복사했습니다 — ${Math.round(txt.length/1024)}KB` +
        (mode === 'full' ? ' (처우 포함, 전달 주의)' : ' (처우 제외)')))
      .catch(() => toast('복사에 실패했습니다 — 내보내기를 쓰세요'));
  },

  async pasteLoad(){
    const box = document.getElementById('pasteIn');
    const txt = (box.value || '').trim();
    if(!txt){ toast('붙여넣을 내용이 없습니다'); box.focus(); return; }
    let raw;
    try { raw = JSON.parse(txt); }
    catch(e){
      /* 페이지 전체를 통째로 붙여넣는 사람도 있다 */
      raw = readPageData(txt);
      if(!raw){ toast('읽을 수 있는 내용이 아닙니다'); return; }
    }
    try {
      const { profile } = migrate(raw);
      if(this.P.experiences.length || (this.P.entries||[]).length){
        Modal.close(); this.showMergeChoice(profile, []); return;
      }
      this.P = profile;
      picked.clear(); activeJob = null; this.openAch.clear();
      await this.persist();
      Modal.close(); this.render();
      toast('불러왔습니다');
    } catch(e){ toast('불러오지 못했습니다: ' + (e.message || e)); }
  },

  /* ---------- 문서(PDF·Word) ---------- */
  async importPdf(file){
    toast('PDF를 읽는 중입니다…');
    try {
      const lines = await readPdfText(await file.arrayBuffer());
      this.openDoc(lines, file.name);
    } catch(e){
      toast(e.message || 'PDF를 읽지 못했습니다');
    }
    document.getElementById('fileInput').value = '';

  /** 이력서인지 업무 기록인지 짐작해서 화면을 고른다. 사용자가 바꿀 수 있다. */
  openDoc(lines, filename){
    this.docLines = lines;
    this.docText = lines.map(l => (l && typeof l === 'object') ? l.text : l);
    this.docName = filename;
    this.docMode = guessDocMode(this.docText, filename);
    if(this.docMode === 'paper'){
      this.papers = [Object.assign(parseDocPaper(this.docText, filename), { file:filename, use:true })];
      this.papersSkipped = [];
      this.renderPapers();
      return;
    }
    this.docWeek = curWeek || thisWeek();
    if(this.docMode === 'resume'){ this.pdfRows = classifyResume(this.docText); this.pdfName = filename; }
    this.renderDoc();
  },

    if(this.docMode === 'resume'){ this.renderPdfPicker(); return; }

    this.renderDocLog();

  applyDocReport(){
    const r = this.repPlan;
    if(!r) return;
    const g = k => { const n = document.querySelector(`[data-repdoc="${k}"]`); return n ? n.value.trim() : ''; };
    const unit = g('unit') || 'month';
    const key = g('key');
    if(!key){ toast('기간을 적어주세요'); return; }

    const rep = ensureReport(this.P, unit, key);
    rep.summary = g('summary');
    rep.issues = g('issues');
    rep.nextPlan = g('nextPlan');
    rep.userEdited = true;

    let added = 0;
    const chk = document.getElementById('repDocItems');
    if(chk && chk.checked){
      const seen = new Set(this.P.entries.map(e => e.date + '|' + e.title));
      r.items.forEach(it => {
        if(seen.has(it.date + '|' + it.title)) return;
        newEntry(this.P, it); seen.add(it.date + '|' + it.title); added++;
      });
    }

    this.P.sources.push({ id:nextId(this.P.sources,'src'), filename:this.docName,
      docType:'other', uploadedAt:stamp(), pageCount:null,
      extractionMethod:'text_layer', extractionQuality:'good',
      rawText:this.docText.join('\n') });

    repUnit = unit; repKey = key;
    this.repPlan = null; this.docLines = null;
    Modal.close(); this.touch();
    this.mode = 'weekly'; this.tab = 'report';
    this.render();
    toast(`${periodLabel(key, unit)} 보고서를 저장했습니다${added ? ` · 기록 ${added}건 추가` : ''}`);

  axisAssignUI(rows){
    const axes = activeAxes(this.P);

    this.axisAssign = this.axisAssign || [];
    this.axisCommon = this.axisCommon || {};

      <option value="">제목에 그대로</option>
      ${axes.map(a => `<option value="${esc(a)}" ${this.axisAssign[i]===a?'selected':''}>${esc(a)}</option>`).join('')}

  applyPdf(){
    const P = this.P;
    let n = { experiences:0, education:0, certifications:0, publications:0, awards:0, profile:0 };

    this.pdfRows.forEach(r => {
      const d = r.data || {};
      if(r.kind === 'skip') return;
      if(r.kind === 'profile'){
        if(!d.field || !d.value) return;
        if(d.field === 'location'){
          P.profile.contact = Object.assign(P.profile.contact || {}, { location:d.value });
        } else {
          P.profile[d.field] = d.value;
        }
        P.profile.userEdited = true; n.profile++;
        return;
      }
      if(r.kind === 'experiences'){
        if(!d.org) return;
        P.experiences.push(Object.assign(blank('experiences'), {
          id: nextId(P.experiences,'exp'), org:d.org, title:d.title || null,
          start:d.start || null, end:d.end || null, isCurrent:!!d.isCurrent,
          confidence:'stated', userEdited:true
        }));
        n.experiences++; return;
      }
      if(r.kind === 'publications'){
        if(!d.title) return;
        P.publications.push(Object.assign(blank('publications'), {
          id: nextId(P.publications,'pub'), title:d.title, kind:d.kind || '저서',
          publishedAt:d.publishedAt || null, role:d.role || '단독'
        }));
        n.publications++; return;
      }
      if(r.kind === 'education'){
        if(!d.school) return;
        P.education.push({ id:nextId(P.education,'edu'), school:d.school, degree:d.degree || null,
          major:d.major || null, start:null, end:d.end || null, gpa:null, thesis:null,
          sourceIds:[], userEdited:true });
        n.education++; return;
      }
      if(r.kind === 'certifications'){
        if(!d.name) return;
        P.certifications.push({ id:nextId(P.certifications,'crt'), name:d.name,
          issuer:d.issuer || null, issuedAt:d.issuedAt || null, expiresAt:null,
          credentialId:null, sourceIds:[], userEdited:true });
        n.certifications++; return;
      }
      if(r.kind === 'awards'){
        P.awards.push({ id:nextId(P.awards,'awd'), name:r.text, issuer:null,
          date:d.publishedAt || d.issuedAt || null, scope:null, sourceIds:[], userEdited:true });
        n.awards++;
      }
    });

    /* 어디서 왔는지 남겨 둔다. 나중에 "이건 어디서 나온 값이지"를 되짚을 수 있어야 한다. */
    P.sources.push({ id:nextId(P.sources,'src'), filename:this.pdfName, docType:'resume',
      uploadedAt:stamp(), pageCount:null, extractionMethod:'text_layer',
      extractionQuality:'good', rawText:this.pdfRows.map(r => r.text).join('\n') });

    this.pdfRows = null; this.docLines = null;
    Modal.close(); this.touch();
    this.mode = 'career'; this.tab = 'timeline';
    this.render();
    toast(`경력 ${n.experiences} · 학력 ${n.education} · 자격증 ${n.certifications} · 저서 ${n.publications}건 추가`);
  },

  async doExport(kind){
    document.getElementById('exportMenu').classList.remove('on');
    this.recompute();
    this.P.updatedAt = new Date().toISOString();
    try {
      if(kind === 'xlsx'){ Exporter.xlsx(this.P); toast('엑셀 파일을 내려받습니다'); }
      else if(kind === 'xlsxComp'){
        if(!confirm('처우 이력이 포함된 엑셀을 만듭니다.\n연봉 정보가 담기므로 전달 대상을 확인하세요.\n계속할까요?')) return;
        Exporter.xlsx(this.P, { includeComp:true });
        toast('처우 포함 엑셀입니다 — 전달 시 주의하세요');
      }
      else if(kind === 'docx'){ Exporter.docx(this.P, {}); toast('Word 이력서를 내려받습니다'); }
      else if(kind === 'docxAnon'){ Exporter.docx(this.P, { noContact:true }); toast('전달용 이력서를 내려받습니다'); }
      else {
        Exporter.json(this.P);
        this.lastExport = new Date().toISOString();
        try { await this.adapter.setMeta('lastExportedAt', this.lastExport); } catch(e){}
        try { await this.adapter.snapshot(this.P, '내보내기'); } catch(e){}
        toast('JSON을 내려받습니다 — 이게 원본입니다');
      }
    } catch(err){
      toast('내보내기 실패: ' + err.message);
    }
    this.renderSaveState();
  },

  /** 여러 파일을 한 번에. 하나가 실패해도 나머지는 들어가야 한다. */
  async adminIntake(files){
    if(!files || !files.length) return;
    const log = [];
    for(const f of files){
      try {
        let profile;
        if(/\.json$/i.test(f.name)){
          profile = migrate(await FileAdapter.read(f)).profile;
        } else if(/\.xlsx$/i.test(f.name)){
          const sheets = await readXlsx(await f.arrayBuffer());
          profile = emptyProfile();
          const plan = planXlsxImport(profile, sheets);
          if(plan.notes.length && !plan.entries.length && !plan.experiences.length){
            log.push([f.name, '건너뜀', plan.notes[0]]); continue;
          }
          applyXlsxImport(profile, plan, {});
          const first = (sheets['경력']||[])[1];
          profile.profile.name = f.name.replace(/\.[^.]+$/, '');
          if(first) profile.profile.headline = String(first[3] || '');
        } else { log.push([f.name, '건너뜀', '.json 또는 .xlsx만 됩니다']); continue; }

        const label = (profile.profile.name || f.name).slice(0, 40);
        const id = this.adapter.addSlot(label);
        const before = this.adapter.slot;
        this.adapter.switchSlot(id);
        await this.adapter.save(profile);
        this.adapter.switchSlot(before);
        log.push([f.name, '등록', `${label} · 경력 ${profile.experiences.length} · 기록 ${profile.entries.length}`]);
      } catch(e){
        log.push([f.name, '실패', e.message || String(e)]);
      }
    }
    roster = await loadRoster(this.adapter);
    this.render();
    const box = document.getElementById('adminLog');
    if(box) box.innerHTML = `<div class="imp-log">${log.map(([n,st,msg]) =>
      `<div class="imp-row ${st === '실패' ? 'bad' : st === '건너뜀' ? 'skip' : ''}">
        <span class="st">${st}</span><b>${esc(n)}</b><span>${esc(msg)}</span></div>`).join('')}</div>`;
    const inp = document.getElementById('adminFiles');
    if(inp) inp.value = '';
    toast(`${log.filter(l => l[1] === '등록').length}건 등록했습니다`);
  },

  async addSlotFlow(){
    const label = prompt('프로필 이름 (예: 본인 이름)');
    if(label === null) return;
    if(this.saveTimer) await this.persist();
    const id = this.adapter.addSlot(label.trim() || '새 이력');
    this.adapter.switchSlot(id);
    this.P = emptyProfile();
    picked.clear(); activeJob = null; this.openAch.clear();
    this.mode = 'career'; this.tab = 'timeline';
    await this.persist();
    Modal.close(); this.render(); toast('새 프로필로 전환했습니다');
  },

  async switchSlot(id){
    if(this.saveTimer) await this.persist();
    if(!this.adapter.switchSlot(id)){ toast('프로필을 찾지 못했습니다'); return; }
    const saved = await this.adapter.load();
    this.P = saved ? migrate(saved).profile : emptyProfile();
    try { this.lastExport = await this.adapter.getMeta('lastExportedAt'); } catch(e){ this.lastExport = null; }
    picked.clear(); activeJob = null; this.openAch.clear(); curWeek = thisWeek();
    Modal.close(); this.render(); toast('프로필을 전환했습니다');
  },

  async deleteSlot(id){
    const sl = this.adapter.slots().find(x => x.id === id);
    if(!confirm(`프로필 "${sl ? sl.label : id}"을(를) 지웁니다.\n이 프로필의 기록·저장점이 모두 사라지고 되돌릴 수 없습니다.\n\n계속할까요?`)) return;
    const wasCurrent = this.adapter.slot === id;
    this.adapter.removeSlot(id);
    if(wasCurrent){
      const saved = await this.adapter.load();
      this.P = saved ? migrate(saved).profile : emptyProfile();
      this.render();
    }
    this.showSlots(); toast('지웠습니다');
  },

  /** 공용 컴퓨터에서 남의 이력이 남지 않게 하는 마지막 장치. */
  /**
   * 지금 보고 있는 프로필만 비운다.
   * «전부 지우기»는 다른 프로필과 저장점까지 날리므로 다른 사람 이력을 다룰 때 위험하다.
   * 여기서는 이 프로필의 내용만 비우고, 직전 상태를 저장점에 남겨 되돌릴 수 있게 한다.
   */
  async resetCurrent(){
    const P = this.P;
    const n = P.experiences.length + P.achievements.length + (P.entries||[]).length;
    if(n && !confirm(
      `지금 프로필의 내용을 비웁니다.\n\n` +
      `경력 ${P.experiences.length} · 성과 ${P.achievements.length} · 기록 ${(P.entries||[]).length}건\n\n` +
      `직전 상태를 저장점에 남기므로 되돌릴 수 있습니다. 계속할까요?`)) return;

    if(n){ try { await this.adapter.snapshot(P, '비우기 직전'); } catch(e){} }

    const name = P.profile.name;
    const keep = P.profile.terms, axes = P.profile.axes;
    this.P = migrate({ schemaVersion: SCHEMA_VERSION }).profile;
    /* 이름과 용어·축은 남긴다. 다시 적게 하면 같은 일을 두 번 시키는 것이다. */
    if(name) this.P.profile.name = name;
    this.P.profile.terms = Object.assign({}, keep);
    this.P.profile.axes = (axes || []).slice();

    picked.clear(); activeJob = null; this.openAch.clear();
    Modal.close();
    await this.persist();
    this.recompute(); this.render();
    toast(n ? '비웠습니다 — 저장점에서 되돌릴 수 있습니다' : '이미 비어 있습니다');
  },

  loadSample(id){

    const spec = SAMPLE_LIST.find(x => x.id === id);

    const has = this.P.experiences.length || this.P.achievements.length || (this.P.entries||[]).length;
    if(has && !confirm(
      `지금 열려 있는 내용을 샘플로 바꿉니다.\n\n` +
      `현재: ${this.P.profile.name || '이름 없음'} · 경력 ${this.P.experiences.length} · 기록 ${(this.P.entries||[]).length}건\n` +
      `샘플: ${spec.label}\n\n` +
      `되돌릴 수 있게 저장점을 먼저 남깁니다. 계속할까요?`)) return;
    this.adapter.snapshot(this.P, '샘플 열기 직전').catch(() => {});
    this.P = spec.build();
    picked.clear(); activeJob = null; this.openAch.clear();

    /* 기록이 있는 마지막 주로 데려간다.
       샘플을 열었는데 빈 주가 뜨면 아무것도 안 만들어진 줄 안다. */
    const last = (this.P.entries || []).reduce((m, e) => (e.date > m ? e.date : m), '');
    curWeek = last ? weekKey(last) : thisWeek();
    repUnit = 'year'; repKey = last ? String(last).slice(0,4) : repCurrent('year');

    this.mode = 'weekly'; this.tab = 'log';
    Modal.close();
    this.touch(); this.render();
    toast(spec.label + ' 샘플을 열었습니다');

function renderLedger(P){
  const h = holes(P);
  const evid = P.achievements.reduce((n,a) => n + (a.evidence||[]).length, 0);
  const name = (P.profile.name || '').trim();

  const items = [
    ['총 경력', P.profile.totalMonths ? fmtDur(P.profile.totalMonths) : '—'],
    ['소속', P.experiences.length],
    ['성과', P.achievements.length],
    ['역량', P.skills.length],
    ['근거', evid]
  ];

  const todo = [];
  if(h.openConf.length)     todo.push(['문서 충돌', h.openConf.length]);
  if(h.noAction.length)     todo.push(['행동 미기재', h.noAction.length]);
  if(h.noMetric.length)     todo.push(['수치 없음', h.noMetric.length]);
  if(h.noEvid.length)       todo.push(['근거 없음', h.noEvid.length]);
  if(h.gapsNoReason.length) todo.push(['사유 없는 공백기', h.gapsNoReason.length]);
  if(h.inferred.length)     todo.push(['미확인 추론', h.inferred.length]);
  if(h.expiredCerts.length) todo.push(['만료 자격증', h.expiredCerts.length]);

  const has = P.experiences.length + P.achievements.length > 0;

  document.getElementById('ledger').innerHTML = `
    <div>
      <button class="whoami" id="btnProfile">
        ${name ? esc(name) : '이름을 넣어주세요'}
        ${P.profile.headline ? `<em>${esc(P.profile.headline)}</em>` : '<em>인적 사항 입력</em>'}
      </button>
      <div class="tally">${items.map(([k,v]) =>
        `<div class="${String(v) === '0' ? 'zero' : ''}"><div class="n">${esc(v)}</div>
          <div class="k">${k}</div></div>`).join('')}</div>
    </div>
    ${has ? (todo.length
      ? `<div class="holes"><h4>채울 곳</h4><ul>${todo.map(([k,v]) =>
          `<li>${k} <b>${v}</b></li>`).join('')}</ul></div>`
      : `<div class="holes clean"><h4>채울 곳</h4><ul><li>지금은 비어 있는 칸이 없습니다</li></ul></div>`) : ''}`;
}

let toastTimer;
function toast(msg){
  const n = document.getElementById('toast');
  n.textContent = msg; n.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => n.classList.remove('on'), 2600);
}

/** 점검형 업무 표본을 만든다. 연도별 굴곡까지 넣어야 통계 화면이 볼 만해진다. */
function sampleEntries(P){
  const V = INSPECT_VOCAB;
  const rnd = mkRnd(20260807);
  const pk = a => a[Math.floor(rnd() * a.length)];

  /* 해마다 건수를 다르게 둔다 — 코로나 공백, 복귀, 증가 같은 굴곡이 있어야
     "기록이 끊긴 구간"이나 연도 비교가 무엇을 말하는지 보인다. */
  const PLAN = [[2020, 8], [2021, 13], [2022, 35], [2023, 38],
                [2024, 65], [2025, 83], [2026, 46]];
  const now = new Date();

  PLAN.forEach(([year, n]) => {
    for(let i = 0; i < n; i++){
      const mo = 1 + Math.floor(rnd() * 12);
      const da = 1 + Math.floor(rnd() * 27);
      const d = new Date(year, mo - 1, da);
      if(d > now) continue;
      const vio = rnd() < 0.35 ? pk(V.vio) : null;
      const gun = pk(V.gun), san = pk(V.san), up = pk(V.up);
      newEntry(P, {
        date: ymd(d), dateMode:'day', type:'work', experienceId:'exp_001',
        title: [gun, san, up].join(' · '),
        detail: vio ? '위반 적발 — ' + vio : '특이사항 미발견',
        important: !!vio,
        facets:{ '시군':gun, '산업단지':san, '업종':up, '위반내용':vio || '' },
        skillIds: vio ? ['skl_001','skl_002'] : ['skl_001']
      });
    }
  });

  const years = [...new Set(P.entries.map(e => String(e.date).slice(0,4)))].sort();
  years.forEach(y => promotePeriod(P, 'year', y));

  P.reports.push({ id:'rep_001', unit:'year', key:'2025',
    summary:'점검 건수가 전년 대비 28% 늘었고 적발률도 올랐습니다. 방지시설 훼손 방치가 여전히 가장 많습니다.',

    generatedAt:new Date().toISOString(), userEdited:true });
  P.reports.push({ id:'rep_003', unit:'year', key:'2020',
    summary:'현장 점검이 대폭 축소된 해. 두 달치만 기록되어 있습니다.',
    issues:'', nextPlan:'', generatedAt:new Date().toISOString(), userEdited:true });
}

/** 씨앗 고정 난수. 열 때마다 숫자가 달라지면 설명하기 곤란하다. */
function mkRnd(seed){
  let x = seed;
  return () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
}
function pick(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }

/** 지난 N주에 걸쳐 기록을 흩뿌린다. */
function spread(P, rnd, weeks, perWeek, make){
  let k = thisWeek();
  const keys = [];
  for(let i = 0; i < weeks; i++){ keys.unshift(k); k = shiftWeek(k, -1); }

  keys.forEach((wk, wi) => {
    const mon = weekMonday(wk);
    if(!mon) return;
    const n = perWeek[0] + Math.floor(rnd() * (perWeek[1] - perWeek[0] + 1));
    for(let i = 0; i < n; i++){
      const d = new Date(mon);
      d.setDate(mon.getDate() + Math.floor(rnd() * 5));
      if(d > new Date()) continue;
      const e = make(rnd, wi, keys.length);
      if(e) newEntry(P, Object.assign({ date: ymd(d), dateMode:'day' }, e));
    }
  });
}

      hours: 1 + Math.floor(r()*3), important: hired,
      skillIds: hired ? ['skl_001','skl_002'] : ['skl_001'],
      facets:{ '직무':role, '채널':ch, '단계':st,
               '이탈사유': (!hired && r() < 0.3) ? pick(r, DROP) : '' }
    };
  });

  P.reports.push({ id:'rep_001', unit:'month', key: shiftPeriod(currentPeriod('month'),'month',-1),
    summary:'백엔드 채용이 두 건 마감됐습니다. 다이렉트 서칭 비중을 늘린 뒤 서류 통과율이 올랐습니다.',
    issues:'처우 미합의로 이탈하는 사례가 반복됩니다. 밴드 재검토가 필요합니다.',
    nextPlan:'데이터 분석 직군 서칭 착수\n면접관 교육 2회 진행',
    generatedAt:new Date().toISOString(), userEdited:true });
  return P;
}
