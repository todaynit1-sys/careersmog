/* ---------- 2. 스키마 ------------------------------------------------ */
const SCHEMA_VERSION = '1.9';
/* 1.1 entries[] · weeklyReports[]
   1.2 경력자용: compensation[] · references[] · experiences.scale/transition/proof
       profile.executiveSummary
   1.3 reports[] — 주간/월간/연간 보고서를 한 배열로. weeklyReports[]는 여기로 옮겨진다
   1.4 publications[] — 저서·논문·기고. 연구직·전문직에서는 경력의 핵심인데 담을 곳이 없었다
   1.5 entries[].facets — 기록을 쪼개 볼 축(업종·지역·유형 등).
       제목 한 줄로 합쳐 넣으면 나중에 무엇이 많았는지 셀 수가 없다
   1.6 profile.terms — 활동과 결과를 뭐라 부를지. 점검/적발, 영업/수주처럼
       하는 일마다 말이 다른데 "중요 표시"로 뭉뚱그리면 보고서가 남의 말이 된다
   1.7 profile.axes — 이 사람이 쓰는 분석 축 이름.
       축이 엑셀 가져오기로만 들어오면 직접 적는 사람은 분석을 못 쓴다
   1.9 narratives[] 제거 — 만들어만 두고 한 번도 쓰지 않았다.
       쓰지 않는 칸은 스키마를 읽는 사람을 헷갈리게 한다.
       옛 파일에 있으면 그대로 두므로 데이터는 잃지 않는다
   1.8 projects[].kind — 활동 유형(자문·강의·위원…).
       본업 밖 활동이 많은 사람은 이걸 안 나누면 20건이 한 덩어리로 늘어서서
       무엇을 하는 사람인지 오히려 흐려진다 */

function emptyProfile(){
  return {
    schemaVersion: SCHEMA_VERSION,
    updatedAt: new Date().toISOString(),
    profile: { name:'', headline:'', contact:{email:'',phone:'',location:'',links:[]},
               summary:'', executiveSummary:'', totalMonths:0,
               terms:{ activity:'', flag:'' }, axes:[], userEdited:false },
    sources:[], experiences:[], achievements:[], skills:[],
    education:[], certifications:[], projects:[], awards:[],
    gaps:[], conflicts:[], jobTargets:[],
    entries:[], weeklyReports:[],
    compensation:[], references:[], reports:[], publications:[]
  };
}

const ARRAYS = ['sources','experiences','achievements','skills','education',
                'certifications','projects','awards','gaps','conflicts','jobTargets',
                'entries','weeklyReports','compensation','references','reports','publications'];

/* 낯선 버전이라도 열리게 한다. 데이터를 못 열게 막는 게 가장 나쁜 실패다. */
/* 프로필이라고 볼 만한 단서. 하나도 없으면 남의 파일이다. */
const PROFILE_KEYS = ['schemaVersion','profile','experiences','achievements','skills','entries',
  'education','certifications','awards','projects','publications','compensation',
  'references','reports','sources','jobTargets','gaps','conflicts','weeklyReports',
  'narratives'];   /* narratives 는 더 안 쓰지만, 옛 파일을 거부하면 안 되므로 단서로는 남긴다 */

function migrate(raw){
  if(!raw || typeof raw !== 'object') throw new Error('프로필 형식이 아닙니다');
  if(Array.isArray(raw)) throw new Error('프로필이 아니라 목록입니다');

  /* 알아볼 수 있는 항목이 하나도 없으면 받지 않는다.
     그냥 받으면 빈 프로필로 덮여 쓰던 기록이 통째로 사라진다 — 실제로 그랬다. */
  const keys = Object.keys(raw);
  if(keys.length && !keys.some(k => PROFILE_KEYS.includes(k)))
    throw new Error('커리어 스모그에서 내보낸 JSON이 아닙니다');

  /* 깊은 복사. 얕게 복사하면 원본과 배열을 함께 쓰게 되어,
     샘플을 두 번 열면 기록이 두 배가 된다 — 실제로 그랬다. */
  let src;
  try { src = JSON.parse(JSON.stringify(raw)); }
  catch(e){ throw new Error('읽을 수 없는 구조입니다'); }

  const p = Object.assign(emptyProfile(), src);
  p.profile = Object.assign(emptyProfile().profile, src.profile || {});
  p.profile.terms = Object.assign({ activity:'', flag:'' }, p.profile.terms || {});
  if(!Array.isArray(p.profile.axes)) p.profile.axes = [];
  ARRAYS.forEach(k => { if(!Array.isArray(p[k])) p[k] = []; });
  /* 1.2까지의 weeklyReports를 reports로 옮긴다.
     원본 배열은 지우지 않는다 — 옛 버전으로 되돌려 열어도 깨지지 않아야 한다. */
  if(!p.reports.length && p.weeklyReports.length){
    p.reports = p.weeklyReports.map((r, i) => ({
      id: r.id || ('rep_' + String(i+1).padStart(3,'0')),
      unit: 'week', key: r.weekKey,
      summary: r.summary || '', issues: r.issues || '', nextPlan: r.nextPlan || '',
      generatedAt: r.generatedAt || new Date().toISOString(),
      userEdited: r.userEdited !== false
    })).filter(r => r.key);
  }

  const notes = [];
  if(src.schemaVersion !== SCHEMA_VERSION){
    /* 1.0에는 주간 기록이 없었다. 빈 배열로 붙이면 그대로 이어서 쓸 수 있다.
       필드를 지우지 않는 것이 마이그레이션의 첫째 규칙이다. */
    notes.push('스키마 ' + (raw.schemaVersion || '미표기') + ' → ' + SCHEMA_VERSION + ' 로 읽었습니다');
    p.schemaVersion = SCHEMA_VERSION;
  }
  return { profile:p, notes };
}

function nextId(list, prefix){
  let max = 0;
  list.forEach(o => {
    const m = /(\d+)$/.exec(o.id || '');
    if(m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + '_' + String(max + 1).padStart(3, '0');
}

/* ---------- 3. 날짜·기간 계산 ---------------------------------------- */
function pad(n){ return String(n).padStart(2,'0'); }

/** 'YYYY-MM' → 절대 월 인덱스. 잘못된 값은 null. */
function mi(ym){
  if(!ym) return null;
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym).trim());
  if(!m) return null;
  return (+m[1]) * 12 + (+m[2] - 1);
}
function unmi(idx){ return Math.floor(idx/12) + '-' + pad(idx % 12 + 1); }
function nowMi(){ const d = new Date(); return d.getFullYear()*12 + d.getMonth(); }

function spanOf(e){
  const s = mi(e.start);
  if(s === null) return null;
  const en = (e.isCurrent || !e.end) ? nowMi() : mi(e.end);
  if(en === null || en < s) return null;
  return [s, en];
}

function fmtDur(months){
  const y = Math.floor(months/12), m = months % 12;
  if(y && m) return y + '년 ' + m + '개월';
  if(y) return y + '년';
  return m + '개월';
}
function fmtYm(ym){ return ym ? String(ym).replace('-', '.') : '현재'; }

/** 겹치는 기간은 한 번만 센다. 겸직을 두 배로 계산하면 거짓말이 된다. */
function mergeSpans(spans){
  const s = spans.filter(Boolean).slice().sort((a,b) => a[0]-b[0]);
  const out = [];
  s.forEach(sp => {
    const last = out[out.length-1];
    if(last && sp[0] <= last[1] + 1) last[1] = Math.max(last[1], sp[1]);
    else out.push([sp[0], sp[1]]);
  });
  return out;
}

function totalMonths(exps){
  return mergeSpans(exps.map(spanOf)).reduce((a, sp) => a + (sp[1] - sp[0] + 1), 0);
}

/** 3개월 이상 비면 공백기로 본다. 이력서에서 설명이 필요해지는 지점이다. */
function detectGaps(exps){
  const merged = mergeSpans(exps.map(spanOf));
  const gaps = [];
  for(let i = 1; i < merged.length; i++){
    const from = merged[i-1][1] + 1, to = merged[i][0] - 1;
    const months = to - from + 1;
    if(months >= 3) gaps.push({ start:unmi(from), end:unmi(to), months });
  }
  return gaps;
}

/* ---------- 4. 역량 통계 --------------------------------------------- */
/** 저장된 값을 믿지 않고 매번 다시 계산한다. 병합 중 어긋나기 쉬운 값들이다. */
function skillStats(P, sk){
  const exps = P.experiences.filter(e =>
    (sk.experienceIds || []).includes(e.id) ||
    (e.skillIds || []).includes(sk.id));
  const achs = P.achievements.filter(a =>
    (sk.achievementIds || []).includes(a.id) ||
    (a.skillIds || []).includes(sk.id));

  const spans = mergeSpans(exps.map(spanOf));
  const months = spans.reduce((a, sp) => a + (sp[1]-sp[0]+1), 0);
  const first = spans.length ? unmi(spans[0][0]) : (sk.firstUsed || null);
  const lastIdx = spans.length ? spans[spans.length-1][1] : mi(sk.lastUsed);
  const evidenceCount = achs.reduce((n, a) => n + ((a.evidence || []).length || 0), 0);
  const dormant = lastIdx !== null && (nowMi() - lastIdx) >= 18;

  return {
    months: months || sk.monthsOfUse || 0,
    expCount: exps.length,
    achCount: achs.length,
    evidenceCount: evidenceCount || sk.evidenceCount || 0,
    firstUsed: first,
    lastUsed: lastIdx !== null ? unmi(lastIdx) : null,
    dormant
  };
}

/* ---------- 5. 빈 곳 집계 -------------------------------------------- */
/** 이 앱의 관점: 성취를 자랑하는 대신 채울 곳을 먼저 보여준다. */
function holes(P){
  const noMetric = P.achievements.filter(a => !(a.metrics || []).length);
  const noAction = P.achievements.filter(a => !a.action);
  const noRole   = P.achievements.filter(a => !(a.scope && a.scope.role));
  const noEvid   = P.achievements.filter(a => !(a.evidence || []).length);
  const inferred = []
    .concat(P.experiences.filter(e => e.confidence === 'inferred'))
    .concat(P.achievements.filter(a => a.confidence === 'inferred'));
  const openConf = P.conflicts.filter(c => !c.resolved);
  const gapsNoReason = (P.gaps || []).filter(g => !g.reason);
  const expiredCerts = (P.certifications || []).filter(c => {
    const x = mi(c.expiresAt); return x !== null && x < nowMi();
  });
  return { noMetric, noAction, noRole, noEvid, inferred, openConf, gapsNoReason, expiredCerts };
}

/* ---------- 6. 유틸 --------------------------------------------------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ============================================================
   합치기
   두 곳에서 같은 이력을 다루면 한쪽이 조용히 날아간다.
   앱에서 적은 걸 모른 채 클로드가 고친 사본을 불러오면 그렇게 된다 —
   실제로 2건이 사라졌다.

   원칙: 없는 것만 더한다. 있는 것은 손대지 않는다.
   그러면 어느 쪽도 잃지 않는다. 대신 같은 일을 양쪽에서 고쳤다면
   이쪽 것이 남으므로, 무엇이 안 들어왔는지 알려준다.
   ============================================================ */

const MERGE_LISTS = ['experiences','achievements','skills','entries','reports',
  'publications','projects','education','certifications','awards',
  'compensation','references','sources','jobTargets','narratives','gaps','conflicts'];

/** 같은 내용인지. id가 달라도 사람이 보기에 같은 건 한 번만 남긴다. */
function sameItem(kind, a, b){
  const t = x => String(x || '').replace(/\s+/g, '').toLowerCase();
  if(kind === 'entries')       return a.date === b.date && t(a.title) === t(b.title);
  if(kind === 'experiences')   return t(a.org) === t(b.org) && a.start === b.start;
  if(kind === 'achievements')  return t(a.title) === t(b.title) && a.experienceId === b.experienceId;
  if(kind === 'skills')        return t(a.name) === t(b.name);
  if(kind === 'reports')       return a.unit === b.unit && a.key === b.key;
  if(kind === 'publications')  return t(a.title) === t(b.title);
  if(kind === 'projects')      return t(a.name) === t(b.name) && t(a.org) === t(b.org);
  if(kind === 'education')     return t(a.school) === t(b.school) && t(a.major) === t(b.major);
  if(kind === 'certifications')return t(a.name) === t(b.name);
  if(kind === 'awards')        return t(a.name) === t(b.name) && a.date === b.date;
  if(kind === 'compensation')  return a.effective === b.effective && a.kind === b.kind;
  if(kind === 'references')    return t(a.name) === t(b.name) && t(a.org) === t(b.org);
  return false;
}

/**
 * 들어온 프로필에서 이쪽에 없는 것만 골라 더한다.
 * 원본(base)은 건드리지 않고 새 객체를 돌려준다.
 */
function mergeProfiles(base, incoming){
  const out = JSON.parse(JSON.stringify(base));
  const added = {}, skipped = {}, conflicts = [], renumbered = [];

  MERGE_LISTS.forEach(kind => {
    const mine = out[kind] || (out[kind] = []);
    const theirs = incoming[kind] || [];
    const byId = new Map(mine.map(x => [x.id, x]));
    let n = 0, dup = 0;

    theirs.forEach(it => {
      if(!it || typeof it !== 'object') return;

      /* 내용이 같은 것이 이미 있으면 넘어간다. 이게 첫 판단이다.
         id는 갈라진 뒤 양쪽이 따로 매기므로 같은 번호가 다른 항목일 수 있다 —
         실제로 앱과 클로드가 둘 다 ent_082 를 만들었다.
         id를 먼저 보면 서로 다른 항목을 같은 것으로 착각해 하나가 사라진다. */
      const twin = mine.find(x => sameItem(kind, x, it));
      if(twin){
        if(twin.id === it.id && JSON.stringify(twin) !== JSON.stringify(it))
          conflicts.push({ kind, id: it.id,
            label: it.title || it.name || it.org || it.key || it.id });
        dup++;
        return;
      }

      const copy = JSON.parse(JSON.stringify(it));
      /* 번호가 겹치면 새로 매긴다. 내용이 다르니 둘 다 남아야 한다. */
      if(byId.has(copy.id)){
        const pfx = String(copy.id).split('_')[0] || kind.slice(0, 3);
        copy.id = nextId(mine, pfx);
        renumbered.push({ kind, from: it.id, to: copy.id });
      }
      mine.push(copy);
      byId.set(copy.id, copy);
      n++;
    });
    if(n) added[kind] = n;
    if(dup) skipped[kind] = dup;
  });

  /* 프로필 본문은 비어 있는 칸만 채운다 */
  const p = out.profile, q = incoming.profile || {};
  ['name','headline','summary','executiveSummary'].forEach(k => {
    if(!String(p[k] || '').trim() && String(q[k] || '').trim()) p[k] = q[k];
  });
  ['activity','flag'].forEach(k => {
    if(!String((p.terms||{})[k] || '').trim() && (q.terms||{})[k]) p.terms[k] = q.terms[k];
  });
  (q.axes || []).forEach(a => { if(a && !p.axes.includes(a)) p.axes.push(a); });
  ['email','phone','location'].forEach(k => {
    if(!String((p.contact||{})[k] || '').trim() && (q.contact||{})[k]) p.contact[k] = q.contact[k];
  });

  out.updatedAt = new Date().toISOString();
  return { profile: out, added, skipped, conflicts, renumbered };
}


/* ===== 01b-idb.js ===== */
/* ============================================================
   저장소 2세대
   localStorage는 5~10MB에서 막히고, 브라우저가 공간이 부족하면
   말없이 비워버린다. 몇 년치 주간 기록을 담을 그릇이 아니다.

   그래서 두 겹으로 간다.
   1) IndexedDB — 용량 여유가 크고 브라우저가 함부로 지우지 않는다
   2) 파일 직접 저장 — 고른 JSON 파일에 저장할 때마다 이어 쓴다.
      이게 있으면 "내보내기를 깜빡해서 날렸다"가 사라진다.
   둘 다 안 되면 localStorage, 그것도 안 되면 메모리로 내려간다.
   ============================================================ */

const IDB_NAME = 'career-smog';
const IDB_VER = 1;

function idbOpen(){
  return new Promise((res, rej) => {
    if(!self.indexedDB) return rej(new Error('IndexedDB 없음'));
    const rq = indexedDB.open(IDB_NAME, IDB_VER);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error || new Error('IndexedDB 열기 실패'));
  });
}

function idbTx(db, mode, fn){
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode);
    const store = tx.objectStore('kv');
    let out;
    try { out = fn(store); } catch(e){ rej(e); return; }
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('중단됨'));
  });
}
function idbGet(db, key){
  return new Promise((res, rej) => {
    const rq = db.transaction('kv','readonly').objectStore('kv').get(key);
    rq.onsuccess = () => res(rq.result === undefined ? null : rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function idbPut(db, key, val){ return idbTx(db, 'readwrite', s => s.put(val, key)); }
function idbDel(db, key){ return idbTx(db, 'readwrite', s => s.delete(key)); }

class IndexedDBAdapter extends StorageAdapter {
  constructor(db){
    super();
    this.db = db;
    this.MAX_VERSIONS = 40;      // 용량 여유가 크니 저장점을 넉넉히 둔다
    this.slot = null;
    this._slots = [];
    this.fileHandle = null;
  }

  static async create(){
    const db = await idbOpen();
    const a = new IndexedDBAdapter(db);
    await a.init();
    return a;
  }

  async init(){
    this._slots = (await idbGet(this.db, 'slots')) || [];

    /* localStorage에 쌓아둔 게 있으면 한 번만 옮겨 담는다. */
    if(!this._slots.length) await this.importFromLocalStorage();

    if(!this._slots.length){
      this._slots = [{ id:'s' + Date.now(), label:'내 이력', updatedAt:new Date().toISOString() }];
      await idbPut(this.db, 'slots', this._slots);
    }
    let active = await idbGet(this.db, 'active');
    if(!active || !this._slots.some(s => s.id === active)) active = this._slots[0].id;
    this.slot = active;
    await idbPut(this.db, 'active', active);

    try { this.fileHandle = await idbGet(this.db, 'fileHandle:' + this.slot); } catch(e){}
  }

  async importFromLocalStorage(){
    try {
      if(!self.localStorage) return;
      const raw = localStorage.getItem('career-smog:slots');
      const old = raw ? JSON.parse(raw) : [];
      const flat = localStorage.getItem('career-smog:current');

      if(!old.length && !flat) return;
      const slots = old.length ? old
        : [{ id:'s' + Date.now(), label:'내 이력', updatedAt:new Date().toISOString() }];

      for(const sl of slots){
        const body = old.length ? localStorage.getItem('career-smog:' + sl.id + ':current') : flat;
        if(body) await idbPut(this.db, sl.id + ':current', JSON.parse(body));
        const meta = localStorage.getItem('career-smog:' + sl.id + ':meta');
        if(meta) await idbPut(this.db, sl.id + ':meta', JSON.parse(meta));
      }
      this._slots = slots;
      await idbPut(this.db, 'slots', slots);
      await idbPut(this.db, 'migratedFromLocalStorage', new Date().toISOString());
    } catch(e){ /* 옮기기에 실패해도 새로 시작할 수 있어야 한다 */ }
  }

  /* ---- 프로필 ---- */
  async load(){ return await idbGet(this.db, this.slot + ':current'); }

  async save(profile){
    await idbPut(this.db, this.slot + ':current', profile);
    const s = this._slots.find(x => x.id === this.slot);
    if(s){
      s.updatedAt = new Date().toISOString();
      if(profile.profile && profile.profile.name && s.label === '내 이력') s.label = profile.profile.name;
      await idbPut(this.db, 'slots', this._slots);
    }
    if(this.fileHandle) await this.writeFile(profile);   // 파일에도 같이 이어 쓴다
  }

  async getMeta(k){ return ((await idbGet(this.db, this.slot + ':meta')) || {})[k] ?? null; }
  async setMeta(k, v){
    const m = (await idbGet(this.db, this.slot + ':meta')) || {};
    m[k] = v;
    await idbPut(this.db, this.slot + ':meta', m);
  }

  /* ---- 저장점 ---- */
  async listVersions(){ return (await idbGet(this.db, this.slot + ':versions')) || []; }
  async snapshot(profile, label){
    const list = await this.listVersions();
    const id = 'v' + Date.now();
    const body = JSON.stringify(profile);
    list.unshift({ id, savedAt:new Date().toISOString(), label: label || '자동', bytes: body.length });
    while(list.length > this.MAX_VERSIONS){
      await idbDel(this.db, this.slot + ':v:' + list.pop().id);
    }
    await idbPut(this.db, this.slot + ':v:' + id, profile);
    await idbPut(this.db, this.slot + ':versions', list);
    return id;
  }
  async loadVersion(id){ return await idbGet(this.db, this.slot + ':v:' + id); }
  async dropVersion(id){
    const list = (await this.listVersions()).filter(v => v.id !== id);
    await idbDel(this.db, this.slot + ':v:' + id);
    await idbPut(this.db, this.slot + ':versions', list);
  }

  /* ---- 슬롯 ---- */
  get multiSlot(){ return true; }
  slots(){ return this._slots; }
  addSlot(label){
    const id = 's' + Date.now();
    this._slots.push({ id, label: label || '새 이력', updatedAt:new Date().toISOString(),
                       stage:'', note:'', tags:'' });
    idbPut(this.db, 'slots', this._slots);
    return id;
  }

  /**
   * 관리 메모는 슬롯에 둔다. 후보의 프로필(JSON) 안이 아니다.
   * 후보가 갱신한 이력을 다시 받아 덮어써도 내가 적어둔 단계·메모는 남아야 한다.
   */
  setSlotMeta(id, patch){
    const s = this._slots.find(x => x.id === id);
    if(!s) return false;
    Object.assign(s, patch);
    idbPut(this.db, 'slots', this._slots);
    return true;
  }
  switchSlot(id){
    if(!this._slots.some(s => s.id === id)) return false;
    this.slot = id;
    idbPut(this.db, 'active', id);
    this.fileHandle = null;
    idbGet(this.db, 'fileHandle:' + id).then(h => { this.fileHandle = h || null; }).catch(() => {});
    return true;
  }
  renameSlot(id, label){
    const s = this._slots.find(x => x.id === id);
    if(s){ s.label = label; idbPut(this.db, 'slots', this._slots); }
  }
  async removeSlot(id){
    const vers = (await idbGet(this.db, id + ':versions')) || [];
    for(const v of vers) await idbDel(this.db, id + ':v:' + v.id);
    await idbDel(this.db, id + ':current');
    await idbDel(this.db, id + ':meta');
    await idbDel(this.db, id + ':versions');
    await idbDel(this.db, 'fileHandle:' + id);
    this._slots = this._slots.filter(s => s.id !== id);
    await idbPut(this.db, 'slots', this._slots);
    if(this.slot === id){
      this.slot = this._slots.length ? this._slots[0].id
        : this.addSlot('내 이력');
      await idbPut(this.db, 'active', this.slot);
      this.fileHandle = null;
    }
  }
  async wipeAll(){
    await idbTx(this.db, 'readwrite', s => s.clear());
    try {
      Object.keys(localStorage).filter(k => k.startsWith('career-smog:'))
        .forEach(k => localStorage.removeItem(k));
    } catch(e){}
    this._slots = [];
    this.fileHandle = null;
    await this.init();
  }

  /* ---- 파일 직접 저장 (File System Access API) ---- */
  get canFile(){ return typeof self.showSaveFilePicker === 'function'; }

  async linkFile(profile){
    if(!this.canFile) throw new Error('이 브라우저는 파일 직접 저장을 지원하지 않습니다');
    const name = ((profile.profile && profile.profile.name) || 'career')
      .replace(/[\\/:*?"<>|\s]/g, '') || 'career';
    const handle = await self.showSaveFilePicker({
      suggestedName: `${name}-career-smog.json`,
      types: [{ description:'커리어 스모그 데이터', accept:{ 'application/json':['.json'] } }]
    });
    this.fileHandle = handle;
    await idbPut(this.db, 'fileHandle:' + this.slot, handle);
    await this.writeFile(profile);
    return handle.name;
  }

  async unlinkFile(){
    this.fileHandle = null;
    await idbDel(this.db, 'fileHandle:' + this.slot);
  }

  async writeFile(profile){
    if(!this.fileHandle) return false;
    try {
      const perm = await this.fileHandle.queryPermission({ mode:'readwrite' });
      if(perm !== 'granted') return false;      // 새로고침 뒤엔 사용자가 다시 허용해야 한다
      const w = await this.fileHandle.createWritable();
      await w.write(JSON.stringify(profile, null, 2));
      await w.close();
      return true;
    } catch(e){ return false; }
  }

  async fileStatus(){
    if(!this.fileHandle) return null;
    let perm = 'prompt';
    try { perm = await this.fileHandle.queryPermission({ mode:'readwrite' }); } catch(e){}
    return { name: this.fileHandle.name, granted: perm === 'granted' };
  }
  async requestFilePermission(){
    if(!this.fileHandle) return false;
    try { return (await this.fileHandle.requestPermission({ mode:'readwrite' })) === 'granted'; }
    catch(e){ return false; }
  }

  get label(){ return this.fileHandle ? '파일에 이어 쓰는 중' : '이 브라우저에 저장 (IndexedDB)'; }
  get durable(){ return true; }
  get roomy(){ return true; }
}

/** 쓸 수 있는 것 중 가장 튼튼한 저장소를 고른다. */
async function createAdapter(){
  try {
    const a = await IndexedDBAdapter.create();
    /* 브라우저가 공간 회수 대상에서 빼주도록 요청한다. 거절돼도 동작에는 지장 없다. */
    try { if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
    return a;
  } catch(e){ /* 사생활 보호 모드 등에서 IndexedDB가 막힐 수 있다 */ }
  try { if(LocalStorageAdapter.available()) return new LocalStorageAdapter(); } catch(e){}
  return new MemoryAdapter();
}

/** 남은 공간을 사람이 읽는 말로. */
async function storageEstimate(){
  try {
    if(!navigator.storage || !navigator.storage.estimate) return null;
    const { usage, quota } = await navigator.storage.estimate();
    if(!quota) return null;
    return { usage, quota, pct: Math.round(usage / quota * 1000) / 10 };
  } catch(e){ return null; }
}
function fmtBytes(n){
  if(n == null) return '—';
  if(n < 1024) return n + 'B';
  if(n < 1024*1024) return Math.round(n/1024) + 'KB';
  if(n < 1024*1024*1024) return (Math.round(n/1024/1024*10)/10) + 'MB';
  return (Math.round(n/1024/1024/1024*100)/100) + 'GB';
}


/* ===== 02-zip.js ===== */
/* ============================================================
   ZIP 라이터 — xlsx·docx는 둘 다 ZIP 컨테이너다.
   CDN을 쓰지 않는 이유: 이 앱은 인터넷 없이도 열려야 하고,
   남에게 파일 하나로 건네줄 수 있어야 한다.
   압축은 하지 않는다(method 0). 이력서 크기에선 무의미하고,
   deflate를 직접 구현하면 버그 낼 여지만 늘어난다.
   ============================================================ */

const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const UTF8 = new TextEncoder();

function dosTime(d){
  return ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
}
function dosDate(d){
  return (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
}

/** files: [{ name, text }] → Uint8Array (ZIP) */
function zipStore(files){
  const now = new Date();
  const t = dosTime(now), dt = dosDate(now);
  const entries = files.map(f => {
    const name = UTF8.encode(f.name);
    const data = f.text instanceof Uint8Array ? f.text : UTF8.encode(f.text);
    return { name, data, crc: crc32(data), offset: 0 };
  });

  let size = 0;
  entries.forEach(e => { size += 30 + e.name.length + e.data.length + 46 + e.name.length; });
  size += 22;

  const buf = new Uint8Array(size);
  const dv = new DataView(buf.buffer);
  let p = 0;
  const u32 = v => { dv.setUint32(p, v, true); p += 4; };
  const u16 = v => { dv.setUint16(p, v, true); p += 2; };
  const raw = a => { buf.set(a, p); p += a.length; };

  entries.forEach(e => {
    e.offset = p;
    u32(0x04034B50); u16(20); u16(0x0800); u16(0);   // 0x0800 = 파일명 UTF-8
    u16(t); u16(dt);
    u32(e.crc); u32(e.data.length); u32(e.data.length);
    u16(e.name.length); u16(0);
    raw(e.name); raw(e.data);
  });

  const cdStart = p;
  entries.forEach(e => {
    u32(0x02014B50); u16(20); u16(20); u16(0x0800); u16(0);
    u16(t); u16(dt);
    u32(e.crc); u32(e.data.length); u32(e.data.length);
    u16(e.name.length); u16(0); u16(0); u16(0); u16(0);
    u32(0); u32(e.offset);
    raw(e.name);
  });

  /* 중앙 디렉터리 크기는 EOCD를 쓰기 "전에" 확정해야 한다.
     쓰는 도중의 p를 쓰면 EOCD 자기 자신이 크기에 섞여 들어가 압축 파일이 깨진다. */
  const cdSize = p - cdStart;
  u32(0x06054B50); u16(0); u16(0);
  u16(entries.length); u16(entries.length);
  u32(cdSize); u32(cdStart); u16(0);

  return buf.subarray(0, p);
}

function xmlEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');   // XML이 거부하는 제어문자 제거
}

function saveBlob(bytes, filename, mime){
  const blob = new Blob([bytes], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}


/* ===== 02b-read.js ===== */
/* ============================================================
   읽기 — ZIP 해제 · xlsx · docx
   쓸 때와 마찬가지로 라이브러리를 쓰지 않는다.
   압축 해제는 브라우저에 내장된 DecompressionStream을 쓴다.
   (Chrome 80+ / Edge / Safari 16.4+ / Firefox 113+)
   내가 만든 파일은 무압축이라 그것 없이도 읽히고,
   Excel이 저장한 파일은 deflate라 이 API가 필요하다.
   ============================================================ */

const UTF8D = new TextDecoder('utf-8');

async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined')
    throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome·Edge를 쓰거나 JSON으로 가져오세요.');
  /* Blob을 거치지 않고 스트림에 바로 밀어 넣는다.
     환경마다 Blob.stream() 지원이 달라 여기서 깨지는 일이 있었다. */
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();

  const reader = ds.readable.getReader();
  const parts = [];
  let total = 0;
  for(;;){
    const { done, value } = await reader.read();
    if(done) break;
    parts.push(value); total += value.length;
  }
  const out = new Uint8Array(total);
  let at = 0;
  parts.forEach(p => { out.set(p, at); at += p.length; });
  return out;
}

/** ZIP → { 파일명: Uint8Array } */
async function unzip(buf){
  const b = new Uint8Array(buf);
  const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);

  /* 끝에서부터 EOCD 서명을 찾는다. 주석이 붙어 있어도 견디게 뒤에서 훑는다. */
  let eocd = -1;
  for(let i = b.length - 22; i >= Math.max(0, b.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054B50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('ZIP 형식이 아닙니다');

  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};

  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014B50) break;
    const method  = dv.getUint16(p + 10, true);
    const cSize   = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extLen  = dv.getUint16(p + 30, true);
    const cmtLen  = dv.getUint16(p + 32, true);
    const lho     = dv.getUint32(p + 42, true);
    const name    = UTF8D.decode(b.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extLen + cmtLen;

    /* 실제 데이터 위치는 로컬 헤더를 봐야 안다. 중앙 디렉터리의 값과 다를 수 있다. */
    const lNameLen = dv.getUint16(lho + 26, true);
    const lExtLen  = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtLen;
    const raw = b.subarray(start, start + cSize);

    if(method === 0) out[name] = raw;
    else if(method === 8) out[name] = await inflateRaw(raw);
    else throw new Error(`지원하지 않는 압축 방식입니다 (${name})`);
  }
  return out;
}

/* ---------- 작은 XML 훑개 ----------
   전체 DOM을 세우지 않는다. 시트 한 장이 수만 셀이면 그게 더 느리다. */
function xmlUnesc(s){
  return String(s)
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&apos;/g,"'").replace(/&#(\d+);/g, (m,d) => String.fromCharCode(+d))
    .replace(/&amp;/g,'&');
}
/* 속성 부분은 반드시 lazy(*?)로 둔다.
   greedy로 두면 <c r="F2"/> 같은 자기닫힘 태그에서 슬래시까지 삼킨 뒤
   다음 태그의 내용을 자기 몸통으로 가져간다 — 열이 통째로 밀린다. */
function tagTexts(xml, tag){
  const out = [];
  const re = new RegExp(`<${tag}(?:\\s[^>]*?)?(?:/>|>([\\s\\S]*?)</${tag}>)`, 'g');
  let m;
  while((m = re.exec(xml))) out.push(m[1] === undefined ? '' : xmlUnesc(m[1]));
  return out;
}

function colIndex(ref){
  const m = /^([A-Z]+)/.exec(ref || '');
  if(!m) return 0;
  let n = 0;
  for(const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}

/** xlsx → { 시트명: [[셀,...], ...] } */
async function readXlsx(buf){
  const files = await unzip(buf);
  const dec = k => files[k] ? UTF8D.decode(files[k]) : null;

  const wb = dec('xl/workbook.xml');
  if(!wb) throw new Error('엑셀 파일이 아닙니다');
  const rels = dec('xl/_rels/workbook.xml.rels') || '';

  const relMap = {};
  (rels.match(/<Relationship[^>]*>/g) || []).forEach(r => {
    const id = (/Id="([^"]+)"/.exec(r) || [])[1];
    const tgt = (/Target="([^"]+)"/.exec(r) || [])[1];
    if(id && tgt) relMap[id] = tgt.replace(/^\/?xl\//, '').replace(/^\//, '');
  });

  /* 공유 문자열 — Excel이 저장하면 대부분 여기에 들어간다 */
  const shared = [];
  const ss = dec('xl/sharedStrings.xml');
  if(ss){
    const re = /<si>([\s\S]*?)<\/si>/g;
    let m;
    while((m = re.exec(ss))) shared.push(tagTexts(m[1], 't').join(''));
  }

  const sheets = {};
  (wb.match(/<sheet\b[^>]*?\/?>/g) || []).forEach(tag => {
    const name = xmlUnesc((/name="([^"]*)"/.exec(tag) || [])[1] || '');
    const rid = (/r:id="([^"]+)"/.exec(tag) || [])[1];
    const path = relMap[rid];
    const xml = path ? dec('xl/' + path) : null;
    if(!xml){ sheets[name] = []; return; }

    const rows = [];
    const rowRe = /<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g;
    let rm;
    while((rm = rowRe.exec(xml))){
      const cells = [];
      const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      let cm;
      while((cm = cRe.exec(rm[1] || ''))){
        const attr = cm[1] || '', body = cm[2] || '';
        const idx = colIndex((/r="([A-Z]+\d+)"/.exec(attr) || [])[1]);
        const type = (/t="([^"]+)"/.exec(attr) || [])[1];
        let v;
        if(type === 's') v = shared[+(tagTexts(body,'v')[0] || 0)] ?? '';
        else if(type === 'inlineStr') v = tagTexts(body, 't').join('');
        else if(type === 'str') v = tagTexts(body, 'v').join('');
        else {
          const raw = tagTexts(body, 'v')[0];
          v = raw === undefined || raw === '' ? '' : (isFinite(+raw) ? +raw : raw);
        }
        cells[idx] = v;
      }
      for(let i = 0; i < cells.length; i++) if(cells[i] === undefined) cells[i] = '';
      rows.push(cells);
    }
    sheets[name] = rows;
  });
  return sheets;
}

/**
 * docx → 문단 배열.
 * opts.withMeta 를 주면 들여쓰기·스타일까지 함께 돌려준다.
 * 주간보고에서 항목 아래 딸린 설명을 가려내려면 이 정보가 필요하다.
 */
async function readDocxText(buf, opts){
  opts = opts || {};
  const files = await unzip(buf);
  const xml = files['word/document.xml'] ? UTF8D.decode(files['word/document.xml']) : null;
  if(!xml) throw new Error('Word 파일이 아닙니다');

  /* 표가 놓인 구간을 먼저 잡아둔다.
     표 안의 셀은 구역 머리글이 아니다 — "총평"이라는 열 이름 하나 때문에
     그 아래 내용이 통째로 총평으로 빨려 들어간 적이 있다. */
  const tblRanges = [];
  const tRe = /<w:tbl\b[\s\S]*?<\/w:tbl>/g;
  let tm;
  while((tm = tRe.exec(xml))) tblRanges.push([tm.index, tm.index + tm[0].length]);
  const inTable = i => tblRanges.some(([a,b]) => i >= a && i < b);

  const paras = [];
  const pRe = /<w:p\b[^>]*?(?:\/>|>([\s\S]*?)<\/w:p>)/g;
  let m;
  while((m = pRe.exec(xml))){
    const body = m[1] || '';
    const t = tagTexts(body, 'w:t').join('').replace(/\s+/g, ' ').trim();
    if(!t) continue;
    if(!opts.withMeta){ paras.push(t); continue; }
    const ind = /<w:ind\b[^>]*?w:left="(\d+)"/.exec(body);
    const hang = /<w:ind\b[^>]*?w:hanging="(\d+)"/.exec(body);
    const st = /<w:pStyle\b[^>]*?w:val="([^"]+)"/.exec(body);
    paras.push({ text:t, indent: ind ? +ind[1] : 0,
                 hanging: hang ? +hang[1] : 0, style: st ? st[1] : '',
                 table: inTable(m.index) });
  }
  /* 표 안 글자도 위 정규식에 잡힌다 — 국내 이력서는 대부분 표 안에 있다 */
  return paras;
}

/* ============================================================
   엑셀 → 데이터 가져오기
   내보낸 시트를 그대로 다시 읽는다. 헤더 이름으로 열을 찾으므로
   열 순서를 바꾸거나 열을 지워도 읽힌다.
   ============================================================ */

function headerMap(rows){
  const head = (rows[0] || []).map(x => String(x == null ? '' : x).trim());
  const idx = {};
  head.forEach((h, i) => { if(h) idx[h] = i; });
  return idx;
}
function cell(row, idx, name){
  const i = idx[name];
  if(i === undefined) return null;
  const v = row[i];
  if(v === '' || v === undefined || v === null) return null;
  return typeof v === 'string' ? v.trim() : v;
}
function num(row, idx, name){
  const v = cell(row, idx, name);
  if(v === null) return null;
  const n = Number(String(v).replace(/[^\d.\-]/g, ''));
  return isFinite(n) ? n : null;
}

/**
 * 시트를 훑어 무엇을 가져올 수 있는지 미리 보여준다.
 * 바로 집어넣지 않는다 — 남의 파일을 조용히 반영하면 사고가 난다.
 */
function planXlsxImport(P, sheets){
  const plan = { entries:[], experiences:[], achievements:[], notes:[],
                 skills:[], publications:[], projects:[],
                 education:[], certifications:[], awards:[] };

  const ent = sheets['주간 기록'];
  if(ent && ent.length > 1){
    const idx = headerMap(ent);
    if(idx['날짜'] === undefined) plan.notes.push('"주간 기록" 시트에 「날짜」 열이 없어 건너뜁니다');
    else {
      const TYPE_BACK = Object.fromEntries(ENTRY_TYPES.map(([k,l]) => [l, k]));
      ent.slice(1).forEach(r => {
        const date = normYmd(cell(r, idx, '날짜'));
        const title = cell(r, idx, '한 일');
        if(!date || !title) return;
        /* 알려진 열 말고 남은 열은 전부 축이다.
           서식에서 축 이름을 바꿔 적어도 그대로 살아야 한다 —
           축이 안 들어오면 분석 화면이 영영 비어 있다. */
        const KNOWN = ['날짜','요일','주차','유형','한 일','내용·결과','소속',
                       '시간','인원','역량','중요','성과 기록'];
        const facets = {};
        Object.keys(idx).forEach(name => {
          if(KNOWN.indexOf(name) >= 0) return;
          const v = cell(r, idx, name);
          if(v) facets[name] = v;
        });

        plan.entries.push({
          date, dateMode: cell(r, idx, '요일') === '주 단위' ? 'week' : 'day',
          type: TYPE_BACK[cell(r, idx, '유형')] || 'work',
          title, detail: cell(r, idx, '내용·결과'),
          hours: num(r, idx, '시간'), audience: num(r, idx, '인원'),
          important: !!cell(r, idx, '중요'),
          facets
        });
      });
    }
  }

  const exp = sheets['경력'];
  if(exp && exp.length > 1){
    const idx = headerMap(exp);
    exp.slice(1).forEach(r => {
      const org = cell(r, idx, '회사');
      const start = normMonth(cell(r, idx, '시작'));
      if(!org || !start) return;
      const endRaw = cell(r, idx, '종료');
      const isCurrent = String(endRaw || '').includes('재직');
      plan.experiences.push({
        org, team: cell(r, idx, '팀'), title: cell(r, idx, '직함'),
        industry: cell(r, idx, '산업'), employmentType: cell(r, idx, '고용형태') || '정규직',
        start, end: isCurrent ? null : normMonth(endRaw), isCurrent,
        location: cell(r, idx, '근무지'),
        responsibilities: String(cell(r, idx, '담당업무') || '').split('\n').map(s=>s.trim()).filter(Boolean),
        scale: { directReports:num(r,idx,'직접보고'), totalOrg:num(r,idx,'총괄조직'),
                 budgetMan:num(r,idx,'예산(만원)'), revenueMan:num(r,idx,'매출책임(만원)'),
                 note:cell(r,idx,'규모 메모') },
        transition: { reasonJoin:cell(r,idx,'택한 이유'), reasonLeave:cell(r,idx,'떠난 이유') },
        proof: { employmentCert:cell(r,idx,'경력증명'), payslip:cell(r,idx,'원천징수') }
      });
    });
  }

  const ach = sheets['성과'];
  if(ach && ach.length > 1){
    const idx = headerMap(ach);
    ach.slice(1).forEach(r => {
      const title = cell(r, idx, '제목');
      if(!title) return;
      /* 서식은 「한 일」·「결과·수치」로, 내보낸 엑셀은 「행동」·「결과」로 적힌다.
         둘 다 받아야 서식과 왕복이 모두 된다. */
      const resultText = cell(r, idx, '결과\u00b7수치') || cell(r, idx, '결과');
      plan.achievements.push({
        title, date: normMonth(cell(r, idx, '시점')),
        situation:cell(r,idx,'상황'), task:cell(r,idx,'과제'),
        action: cell(r,idx,'한 일') || cell(r,idx,'행동'),
        result: resultText,
        metrics: parseMetricText(resultText),
        orgHint: cell(r, idx, '소속'),
        scope:{ teamSize:num(r,idx,'팀 규모'), role:cell(r,idx,'내 역할'), budget:null }
      });
    });
  }

  if(!plan.entries.length && !plan.experiences.length && !plan.achievements.length){
    plan.notes.push('알아볼 수 있는 시트가 없습니다. 이 앱에서 내보낸 엑셀이거나, ' +
      '「주간 기록」·「경력」·「성과」 시트에 같은 열 이름을 쓴 파일이어야 합니다.');
  }

  /* 이미 있는 것과 겹치는지 미리 세어 둔다 */
  const key = e => e.date + '|' + e.title;
  const have = new Set((P.entries||[]).map(key));
  plan.dupEntries = plan.entries.filter(e => have.has(key(e))).length;
  const haveExp = new Set((P.experiences||[]).map(e => e.org + '|' + e.start));
  plan.dupExps = plan.experiences.filter(e => haveExp.has(e.org + '|' + e.start)).length;
  const haveAch = new Set((P.achievements||[]).map(a => (a.title||'') + '|' + (
a.date||'')));
  plan.dupAchs = plan.achievements.filter(a => haveAch.has((a.title||'') + '|' + (a.date||''))).length;

    /* ── 역량 ── */
  const skl = sheets['역량'];
  if(skl && skl.length > 1){
    const idx = headerMap(skl);
    const CAT_BACK = { '하드 스킬':'hard', '소프트 스킬':'soft', '도메인':'domain',
                       '도구':'tool', '언어':'language' };
    skl.slice(1).forEach(r2 => {
      const name = cell(r2, idx, '역량');
      if(!name) return;
      plan.skills.push({ name,
        category: CAT_BACK[cell(r2, idx, '분류')] || 'hard',
        aliases: String(cell(r2, idx, '다른 이름') || '').split(/[,\u00b7]/)
                   .map(x => x.trim()).filter(Boolean) });
    });
  }

  /* ── 저서·논문 ── */
  const pubSh = sheets['저서\u00b7논문'];
  if(pubSh && pubSh.length > 1){
    const idx = headerMap(pubSh);
    pubSh.slice(1).forEach(r2 => {
      const title = cell(r2, idx, '제목');
      if(!title) return;
      plan.publications.push({ title,
        kind: cell(r2, idx, '종류') || '논문',
        role: cell(r2, idx, '역할') || '공동저자',
        publishedAt: normMonth(cell(r2, idx, '발행')),
        publisher: cell(r2, idx, '학술지\u00b7출판사') || cell(r2, idx, '출판사'),
        identifier: cell(r2, idx, '식별자'), note: cell(r2, idx, '비고') });
    });
  }

  /* ── 활동 ── */
  const prjSh = sheets['활동'] || sheets['프로젝트\u00b7활동'] || sheets['프로젝트'];
  if(prjSh && prjSh.length > 1){
    const idx = headerMap(prjSh);
    prjSh.slice(1).forEach(r2 => {
      const name = cell(r2, idx, '이름') || cell(r2, idx, '내용');
      if(!name) return;
      const kd = cell(r2, idx, '유형');
      const org = cell(r2, idx, '기관'), role = cell(r2, idx, '역할');
      const rg = splitRange(cell(r2, idx, '시작'));
      plan.projects.push({ name,
        kind: (typeof PROJECT_KINDS !== 'undefined' && PROJECT_KINDS.indexOf(kd) >= 0)
              ? kd : (guessProjectKind(name, org, role) || '자문\u00b7심의'),
        org, role, start: rg[0], end: normMonth(cell(r2, idx, '종료')) || rg[1],
        description: cell(r2, idx, '설명') });
    });
  }

  /* ── 학력\u00b7자격\u00b7수상 ──
     한 시트에 종류가 섞여 있으므로 첫 열의 구분을 보고 나눈다. */
  const eduSh = sheets['학력\u00b7자격\u00b7수상'] || sheets['학력'];
  if(eduSh && eduSh.length > 1){
    const idx = headerMap(eduSh);
    eduSh.slice(1).forEach(r2 => {
      const kind = cell(r2, idx, '구분');
      const name = cell(r2, idx, '내용');
      if(!name) return;
      const org = cell(r2, idx, '기관');
      const st = normMonth(cell(r2, idx, '시작'));
      const rawEnd = String(cell(r2, idx, '종료\u00b7취득') || '');
      const en = normMonth(rawEnd.replace(/\s*(만료됨|만료 예정)/, ''));
      const note = cell(r2, idx, '비고');

      if(/학력|학교|대학/.test(kind)){
        const m = /^(.*?)\s+(\S+)\s+(학사|석사|박사|전문학사|수료)$/.exec(name);
        plan.education.push({ school: m ? m[1] : name, major: m ? m[2] : null,
                              degree: m ? m[3] : null, start: st, end: en });
      } else if(/자격|면허/.test(kind)){
        plan.certifications.push({ name, issuer: org, issuedAt: en || st, expiresAt: null });
      } else if(/수상|포상|표창/.test(kind)){
        plan.awards.push({ name, issuer: org, date: en || st, scope: note });
      }
    });
  }

  return plan;
}

/** 실제 반영. 기존 항목은 건드리지 않고 붙이기만 한다. */
function applyXlsxImport(P, plan, opts){
  opts = opts || {};
  let added = { entries:0, experiences:0, achievements:0 };

  const expKey = e => e.org + '|' + e.start;
  const haveExp = new Map((P.experiences||[]).map(e => [expKey(e), e.id]));
  plan.experiences.forEach(x => {
    if(haveExp.has(expKey(x)) && opts.skipDup) return;
    const item = Object.assign(blank('experiences'), x,
      { id: nextId(P.experiences, 'exp'), confidence:'stated', userEdited:true });
    P.experiences.push(item);
    haveExp.set(expKey(x), item.id);
    added.experiences++;
  });

  const entKey = e => e.date + '|' + e.title;
  const haveEnt = new Set((P.entries||[]).map(entKey));
  plan.entries.forEach(x => {
    if(haveEnt.has(entKey(x)) && opts.skipDup) return;
    newEntry(P, x);
    haveEnt.add(entKey(x));
    added.entries++;
  });

  const achKey = a => (a.title||'') + '|' + (a.date||'');
  const haveAch = new Set((P.achievements||[]).map(achKey));
  plan.achievements.forEach(x => {
    if(haveAch.has(achKey(x)) && opts.skipDup) return;
    /* 소속 문자열로 경력을 찾아 붙인다. 못 찾으면 소속 없이 둔다 — 억지로 붙이지 않는다. */
    let expId = null;
    if(x.orgHint){
      const hit = P.experiences.find(e =>
        x.orgHint.startsWith(e.org) || (e.title && x.orgHint.includes(e.title)));
      if(hit) expId = hit.id;
    }
    P.achievements.push({
      id: nextId(P.achievements, 'ach'), experienceId: expId,
      date: x.date, title: x.title,
      situation:x.situation, task:x.task, action:x.action, result:x.result,
      metrics:[], scope:x.scope || { teamSize:null, role:null, budget:null },
      skillIds:[], evidence:[], confidence:'stated', userEdited:true
    });
    haveAch.add(achKey(x));
    added.achievements++;
  });

    /* ── 나머지 종류 ──
     내보낸 엑셀을 고쳐 다시 넣는 게 이 도구의 주요 사용법이다.
     경력\u00b7성과\u00b7기록만 돌아오고 나머지가 사라지면 왕복이 아니다. */
  const norm = v => String(v || '').replace(/\s+/g, '').toLowerCase();
  const bring = (kind, pfx, list, sameAs) => {
    if(!list || !list.length) return;
    const mine = P[kind] || (P[kind] = []);
    list.forEach(x => {
      if(mine.some(y => sameAs(y, x))) return;
      mine.push(Object.assign(blank(kind) || {}, x,
        { id: nextId(mine, pfx), userEdited: true }));
      added[kind] = (added[kind] || 0) + 1;
    });
  };

  bring('skills', 'skl', plan.skills,
        (a, b) => norm(a.name) === norm(b.name));
  bring('publications', 'pub', plan.publications,
        (a, b) => norm(a.title) === norm(b.title));
  bring('projects', 'prj', plan.projects,
        (a, b) => norm(a.name) === norm(b.name) && norm(a.org) === norm(b.org));
  bring('education', 'edu', plan.education,
        (a, b) => norm(a.school) === norm(b.school) && norm(a.major) === norm(b.major));
  bring('certifications', 'crt', plan.certifications,
        (a, b) => norm(a.name) === norm(b.name));
  bring('awards', 'awd', plan.awards,
        (a, b) => norm(a.name) === norm(b.name) && a.date === b.date);

  return added;
}

/* ============================================================
   자유 형식 엑셀 가져오기
   실제 업무 파일은 이 앱 형식을 따르지 않는다.
   열 이름도 다르고 헤더가 첫 줄에 있지도 않다.
   그래서 "어느 열이 무엇인지" 사람이 짚어주는 화면이 필요하다.
   ============================================================ */

/* ENTRY_TYPES는 뒤 파일(07-weekly.js)에서 선언된다.
   최상위 const로 참조하면 이 파일이 먼저 평가되면서 TDZ 오류가 난다.
   쓰는 시점에 부르도록 함수로 감싼다. */
function typeFromLabel(label){
  const hit = ENTRY_TYPES.find(([, l]) => l === label);
  return hit ? hit[0] : null;
}

/** 헤더로 보이는 줄을 찾는다. 병합 제목·로고가 위에 얹힌 파일이 흔하다. */
function guessHeaderRow(rows){
  let best = 0, bestScore = -1;
  for(let i = 0; i < Math.min(8, rows.length); i++){
    const r = rows[i] || [];
    const filled = r.filter(c => String(c == null ? '' : c).trim()).length;
    const texty = r.filter(c => typeof c === 'string' && c.trim() && c.trim().length <= 20).length;
    /* 아래 줄에 값이 있어야 헤더다 */
    const below = (rows[i+1] || []).filter(c => String(c == null ? '' : c).trim()).length;
    const score = filled + texty * 2 + (below >= filled * 0.6 ? 5 : 0);
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return best;
}

const FIELD_HINTS = {
  date:  ['일자','날짜','date','일시','기간','점검일','수행일','작성일'],
  title: ['제목','내용','업무','활동','명','과제','건명','대상','업체','기관','장소','항목'],
  detail:['상세','설명','비고','결과','특이','메모','내역','조치','위반'],
  hours: ['시간','소요','투입','공수','hour'],
  count: ['인원','명','참석','수강','인원수'],
  flag:  ['위반','중요','특이','적발','이슈','비고']
};

function guessMapping(header){
  const H = header.map(h => String(h == null ? '' : h).trim());
  const find = keys => {
    for(const k of keys){
      const i = H.findIndex(h => h && h.toLowerCase().includes(k.toLowerCase()));
      if(i >= 0) return i;
    }
    return -1;
  };
  const dateI = find(FIELD_HINTS.date);
  const map = { date: dateI, title: [], detail: [], hours: -1, count: -1, flag: -1,
                type: 'work', typeCol: -1, facets: [] };

  /* 제목은 여러 열을 이어 붙이는 경우가 많다.
     "화성시 / 발안산단 / 도장업"처럼 흩어져 있는 게 보통이다. */
  H.forEach((h, i) => {
    if(i === dateI || !h) return;
    if(FIELD_HINTS.detail.some(k => h.includes(k))) map.detail.push(i);
    else if(FIELD_HINTS.hours.some(k => h.includes(k))) { if(map.hours < 0) map.hours = i; }
    else if(FIELD_HINTS.count.some(k => h.includes(k))) { if(map.count < 0) map.count = i; }
    else if(map.title.length < 4) map.title.push(i);
  });
  if(!map.title.length && H.length > 1) map.title = [dateI === 0 ? 1 : 0];
  const fi = find(FIELD_HINTS.flag);
  if(fi >= 0 && !map.title.includes(fi)) map.flag = fi;

  /* 분석 축 — 제목으로 합친 열은 그대로 축이기도 하다.
     합쳐서 title에만 넣으면 "어느 업종이 많았나"를 나중에 셀 수 없다. */
  map.facets = map.title.slice();
  if(map.flag >= 0) map.facets.push(map.flag);
  map.detail.forEach(i => { if(!map.facets.includes(i)) map.facets.push(i); });
  return map;
}

function joinCells(row, idxs, sep){
  return (idxs || []).map(i => row[i])
    .map(v => v == null ? '' : (v instanceof Date ? ymd(v) : String(v).trim()))
    .filter(v => v && v !== 'nan' && v !== 'None')
    .join(sep || ' · ');
}

/** 매핑대로 읽어 기록 후보를 만든다. 넣기 전에 반드시 미리 보여준다. */
function planMappedImport(rows, headerIdx, map){
  const out = [], warn = [];
  const header = rows[headerIdx] || [];
  let badDate = 0;

  rows.slice(headerIdx + 1).forEach(r => {
    if(!r || !r.length) return;
    const rawDate = r[map.date];
    let date = null;
    if(rawDate instanceof Date) date = ymd(rawDate);
    else if(typeof rawDate === 'number' && rawDate > 20000 && rawDate < 80000){
      /* 엑셀 시리얼 날짜. 1900년 윤년 버그 때문에 기준일이 1899-12-30이다. */
      const d = new Date(Date.UTC(1899, 11, 30) + rawDate * 86400000);
      date = d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate());
    } else date = normYmd(String(rawDate || '').slice(0, 10));

    if(!date){ badDate++; return; }
    const title = joinCells(r, map.title);
    if(!title) return;

    const flagVal = map.flag >= 0 ? String(r[map.flag] == null ? '' : r[map.flag]).trim() : '';
    const hoursV = map.hours >= 0 ? Number(String(r[map.hours]).replace(/[^\d.]/g,'')) : NaN;
    const cntV   = map.count >= 0 ? Number(String(r[map.count]).replace(/[^\d.]/g,'')) : NaN;

    const facets = {};
    (map.facets || []).forEach(i => {
      const name = String(header[i] == null ? '' : header[i]).trim() || colName(i) + '열';
      const v = r[i];
      const sv = v == null ? '' : (v instanceof Date ? ymd(v) : String(v).trim());
      if(sv && sv !== 'nan' && sv !== 'None') facets[name] = sv;
    });

    out.push({
      date, dateMode:'day', facets,
      type: map.typeCol >= 0 ? (typeFromLabel(String(r[map.typeCol]).trim()) || map.type) : map.type,
      title: title.slice(0, 160),
      detail: joinCells(r, map.detail, ' / ') || null,
      hours: isFinite(hoursV) && hoursV > 0 ? hoursV : null,
      audience: isFinite(cntV) && cntV > 0 ? cntV : null,
      important: !!flagVal
    });
  });

  if(badDate) warn.push(`날짜를 못 읽은 줄 ${badDate}개는 건너뜁니다`);
  return { entries: out, warn };
}


/* ============================================================
   한 시트 안의 여러 표
   실제 업무 엑셀은 한 시트에 표를 여럿 늘어놓는다.
   교육·강의·수상을 가로로 나란히 두는 식이다.
   표가 하나라고 가정하면 서로 다른 표가 한 줄로 붙어
   12건이 3건으로 줄고 내용이 뒤섞인다 — 실제로 그랬다.
   ============================================================ */

function cellStr(v){
  if(v === null || v === undefined) return '';
  if(v instanceof Date) return ymd(v);
  return String(v).trim();
}

/** 빈 열로 세로 분할, 빈 행으로 가로 분할해 표 덩어리를 찾는다. */
function findBlocks(rows){
  const W = rows.reduce((m, r) => Math.max(m, (r || []).length), 0);
  if(!W || !rows.length) return [];

  const colHas = [];
  for(let c = 0; c < W; c++)
    colHas[c] = rows.some(r => cellStr((r || [])[c]));

  /* 연속된 열 묶음 */
  const colGroups = [];
  let c0 = -1;
  for(let c = 0; c <= W; c++){
    if(c < W && colHas[c]){ if(c0 < 0) c0 = c; }
    else if(c0 >= 0){ colGroups.push([c0, c - 1]); c0 = -1; }
  }

  const blocks = [];
  colGroups.forEach(([a, b]) => {
    const rowHas = rows.map(r => {
      for(let c = a; c <= b; c++) if(cellStr((r || [])[c])) return true;
      return false;
    });
    let r0 = -1;
    for(let r = 0; r <= rows.length; r++){
      if(r < rows.length && rowHas[r]){ if(r0 < 0) r0 = r; }
      else if(r0 >= 0){
        const blk = makeBlock(rows, r0, r - 1, a, b);
        if(blk) blocks.push(blk);
        r0 = -1;
      }
    }
  });
  return blocks;
}

/** 덩어리 안에서 제목 줄과 머리글 줄을 가른다. */
function makeBlock(rows, r0, r1, c0, c1){
  const width = c1 - c0 + 1;
  const filled = r => {
    let n = 0;
    for(let c = c0; c <= c1; c++) if(cellStr((rows[r] || [])[c])) n++;
    return n;
  };

  /* 위에서부터 한 칸만 찬 줄은 제목이다 */
  const titles = [];
  let hr = r0;
  while(hr <= r1 && filled(hr) <= 1 && width > 1){
    const t = (rows[hr] || []).slice(c0, c1 + 1).map(cellStr).find(Boolean);
    if(t) titles.push(t);
    hr++;
  }
  if(hr > r1) return null;

  const header = (rows[hr] || []).slice(c0, c1 + 1).map(cellStr);
  const body = [];
  for(let r = hr + 1; r <= r1; r++){
    const line = (rows[r] || []).slice(c0, c1 + 1).map(cellStr);
    if(line.some(Boolean)) body.push(line);
  }
  if(!body.length) return null;

  return { title: titles.length ? titles[titles.length - 1] : '',
           notes: titles.slice(0, -1), header, rows: body,
           at: `${hr + 1}행 · ${width}열 · ${body.length}건` };
}

/** 표 제목과 머리글을 보고 어디로 보낼지 짐작한다. */
function guessTarget(block){
  const t = (block.title || '') + ' ' + block.header.join(' ');
  if(/수상|포상|표창|상금/.test(t)) return 'awards';
  if(/자격|면허|취득/.test(t)) return 'certifications';
  if(/논문|저서|학술|기고|출판/.test(t)) return 'publications';
  if(/학력|학교|전공|학위/.test(t)) return 'education';
  if(/경력|재직|입사|퇴사/.test(t)) return 'experiences';
  if(/성과|실적|업적/.test(t)) return 'achievements';
  if(/날짜|일자/.test(block.header.join(' ')) && /기록|일지|활동/.test(t)) return 'entries';
  return 'projects';
}

function guessCols(block, targetId){
  const spec = IMPORT_TARGETS.find(x => x.id === targetId);
  if(!spec) return {};
  const H = block.header.map(h => String(h || ''));
  const used = new Set(), map = {};
  spec.fields.forEach(f => {
    for(const hint of (f.hint || [])){
      const i = H.findIndex((h, idx) => h && !used.has(idx) && h.includes(hint));
      if(i >= 0){ map[f.k] = i; used.add(i); return; }
    }
    map[f.k] = -1;
  });
  return map;
}

/**
 * "2022.2 ~ 2023.8" 처럼 한 칸에 든 기간을 가른다.
 * 붙여 쓴 하이픈은 범위가 아니라 날짜 구분자다 —
 * 그걸 범위로 보면 2022-10이 2022년부터 10년까지가 된다.
 */
function splitRange(v){
  const s = cellStr(v);
  if(!s) return [null, null];
  let m = /^(.+?)\s*[~–]\s*(.*)$/.exec(s);          // 물결표·엔대시는 언제나 범위
  if(!m) m = /^(.+?)\s+-\s+(.+)$/.exec(s);          // 하이픈은 양옆이 빌 때만
  if(m) return [normMonth(m[1]) || null, normMonth(m[2]) || null];
  return [normMonth(s) || null, null];
}

/** 고른 대상과 열 배정대로 실제 항목을 만든다. */

      P.achievements.push({ id:nextId(P.achievements,'ach'), experienceId:expId,
