/* ============================================================
   커리어 페이지 내보내기
   지금까지 결과물은 전부 파일(docx·xlsx)이었다.
   "이력관리 페이지"라면 페이지가 나와야 한다.

   단일 HTML로 뽑는다. 외부 리소스가 없어서 그대로 링크로 쓰거나
   메일에 붙이거나 인쇄해서 PDF로 만들 수 있다.
   입력을 어느 경로로 했든 이 페이지의 모양은 같다.
   ============================================================ */

const PAGE_OPTS = { contact:false, ledger:false, stats:true, entries:false, embed:'safe' };


/**
 * 페이지에 심을 데이터를 만든다.
 * 'safe'  — 처우·연락처를 뺀 사본. 남에게 보내도 되는 판본
 * 'full'  — 전부. 내 백업용이며 공유하면 안 된다
 * 'none'  — 심지 않음
 *
 * 화면에 안 보인다고 안 들어간 게 아니다. 소스를 열면 보인다.
 * 그래서 기본값을 'safe'로 두고, 'full'은 고를 때 경고한다.
 */
function pageEmbedData(P, mode, keepContact){
  if(mode === 'none') return null;
  const c = JSON.parse(JSON.stringify(P));
  if(mode !== 'full'){
    c.compensation = [];
    if(!keepContact) c.profile.contact = { email:'', phone:'', location:(c.profile.contact||{}).location || '', links:[] };
    (c.references || []).forEach(r => { r.note = r.note || ''; });
  }
  c._embed = { mode, at:new Date().toISOString(), app:'career-smog' };
  return c;
}

/** 페이지 파일에서 심어둔 데이터를 도로 꺼낸다. */
function readPageData(html){
  /* 종료 태그를 소스에 그대로 쓰면 이 파일이 HTML에 인라인될 때 거기서 잘린다.
     주석 안이라도 마찬가지다 — 실제로 앱 전체가 문법 오류로 죽었다.
     그래서 태그 문자열을 두 조각으로 나눠 이어 붙인다. */
  const re = new RegExp('<scr' + 'ipt[^>]+id="smog-data"[^>]*>([\\s\\S]*?)<\\/scr' + 'ipt>', 'i');
  const m = re.exec(String(html));
  if(!m) return null;
  try { return JSON.parse(m[1].trim()); } catch(e){ return null; }
}

function pgEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/** 가로 막대 하나. 인쇄해도 보이도록 색이 아니라 길이로 말한다. */
function pgBar(label, n, max, sub){
  const w = Math.max(2, Math.round(n / max * 100));
  return `<div class="bar">
    <span class="bl">${pgEsc(label)}</span>
    <span class="bt"><i style="width:${w}%"></i></span>
    <span class="bn">${pgEsc(n)}${sub ? `<em>${pgEsc(sub)}</em>` : ''}</span>
  </div>`;
}

function buildCareerPage(P, opts){
  const o = Object.assign({}, PAGE_OPTS, opts || {});
  const pu = (typeof resumePurpose === 'function') ? resumePurpose(o.purpose || 'job') : null;
  const pr = P.profile || {};
  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  const S = [];
  /* 섹션을 바로 이어 붙이지 않고 이름표를 붙여 모은다.
     용도에 따라 순서가 달라져야 미리보기와 Word가 같은 문서가 된다. */
  const SEC = {};
  const push = (key, html) => { (SEC[key] = SEC[key] || []).push(html); };

  /* ---- 머리 ---- */
  const c = pr.contact || {};
  const contactLine = o.contact
    ? [c.email, c.phone, c.location].filter(Boolean).join('  ·  ')
    : (c.location || '');
  S.push(`<header>
    <h1>${pgEsc(pr.name || '이름 미입력')}</h1>
    ${pr.headline ? `<p class="head">${pgEsc(pr.headline)}</p>` : ''}
    <p class="meta">${pr.totalMonths ? '총 경력 ' + fmtDur(pr.totalMonths) : ''}${
      contactLine ? '   ·   ' + pgEsc(contactLine) : ''}</p>
  </header>`);

  const summary = pr.executiveSummary || pr.summary;
  if(summary) push('sum', `<section class="sum"><p>${pgEsc(summary)}</p></section>`);

  /* ---- 실적 ---- */
  const list = P.entries || [];
  if(o.stats && list.length){
    const t = tally(list);
    const first = list.reduce((m,e) => (!m || e.date < m ? e.date : m), null);
    const last  = list.reduce((m,e) => (e.date > m ? e.date : m), '');

    const cards = [[ACT, t.count + '건']];
    if(t.hasHours) cards.push(['투입', fmtHours(t.hours) + '시간']);
    if(t.lectures) cards.push(['강의', t.lectures + '회']);
    if(t.audience) cards.push(['누적 수강', t.audience + '명']);
    if(t.important) cards.push([FLAG, t.important + '건 (' +
      Math.round(t.important / t.count * 1000)/10 + '%)']);
    cards.push(['기간', String(first).slice(0,7).replace('-','.') + ' – ' +
      String(last).slice(0,7).replace('-','.')]);

    push('perf', `<section><h2>실적</h2>
      <div class="cards">${cards.map(([k,v]) =>
        `<div><b>${pgEsc(v)}</b><span>${pgEsc(k)}</span></div>`).join('')}</div>`);

    /* 연도별 */
    const byYear = {};
    list.forEach(e => { const y = String(e.date).slice(0,4);
      if(/^\d{4}$/.test(y)) (byYear[y] = byYear[y] || []).push(e); });
    const ys = Object.keys(byYear).sort();
    if(ys.length > 1){
      const max = Math.max(...ys.map(y => byYear[y].length));
      push('perf', `<h3>연도별</h3><div class="bars">${ys.map(y => {
        const tt = tally(byYear[y]);
        return pgBar(y, tt.count, max, tt.important ? `${FLAG} ${tt.important}` : '');
      }).join('')}</div>`);
    }

    /* 축별.
       예전에는 건수 막대만 8줄씩 늘어놓았다. 읽는 사람은 33.3%가 높은지 낮은지
       알 수 없었고, 그걸 알려면 평균을 직접 계산해야 했다.
       숫자를 늘어놓는 대신 **결론을 먼저 말하고 근거를 뒤에 둔다.** */
    const avg = t.count ? t.important / t.count * 100 : 0;

    facetAxes(P).slice(0, 3).forEach(a => {
      const ft = facetTallyOn(list, a.key);
      if(ft.rows.length < 2) return;

      if(ft.isFlagAxis){
        /* 표시된 건에만 있는 축은 비율을 낼 수 없다. 무엇이 많았는지만 말한다. */
        const max = ft.rows[0].n;
        push('perf', `<h3>${pgEsc(a.key)} <small>${ft.rows.length}종</small></h3>
          <p class="lede">${pgEsc(FLAG)} ${ft.flagged}건의 사유는
            <b>${pgEsc(ft.rows.slice(0,2).map(r => r.value).join(' · '))}</b>가 가장 많았습니다.</p>
          <div class="bars">${ft.rows.slice(0, 6).map(r =>
            pgBar(r.value, r.n, max, '')).join('')}</div>`);
        return;
      }

      const rows = ft.rows.map(r => ({
        v: r.value, n: r.n, imp: r.imp || 0,
        pct: r.n ? (r.imp || 0) / r.n * 100 : 0
      }));
      const byRate = rows.slice().sort((x, y) => y.pct - x.pct || y.n - x.n);
      const byVol = rows.slice().sort((x, y) => y.n - x.n);

      /* 한 줄 결론. 이게 없으면 표를 읽어도 무엇을 봐야 할지 모른다. */
      const lede = [];
      if(t.important && byRate[0] && byRate[0].pct > avg + 5)
        lede.push(`<b>${pgEsc(byRate[0].v)}</b>에서 ${FLAG}율이 ${byRate[0].pct.toFixed(0)}%로 가장 높습니다` +
                  ` (평균 ${avg.toFixed(0)}%)`);
      if(byVol[0]) lede.push(`가장 많이 다룬 곳은 <b>${pgEsc(byVol[0].v)}</b> ${byVol[0].n}건`);
      const zero = rows.filter(r => r.n >= 3 && r.imp === 0);
      if(t.important && zero.length)
        lede.push(`${pgEsc(zero.slice(0,2).map(r => r.v).join('·'))}는 ` +
                  `${zero.reduce((s2,r) => s2 + r.n, 0)}건 모두 ${FLAG}로 이어지지 않았습니다`);

      const show = byRate.slice(0, 6);
      const rest = rows.length - show.length;
      const restN = byRate.slice(6).reduce((s2, r) => s2 + r.n, 0);

      push('perf', `<h3>${pgEsc(a.key)} <small>${ft.rows.length}종</small></h3>
        ${lede.length ? `<p class="lede">${lede.join(' · ')}.</p>` : ''}
        <table class="rate">
          <tr><th>${pgEsc(a.key)}</th><th class="n">건수</th>
            ${t.important ? `<th class="n">${pgEsc(FLAG)}</th><th class="n">비율</th>
              <th colspan="2">평균 ${avg.toFixed(0)}% 대비</th>` : ''}</tr>
          ${show.map(r => {
            const d = r.pct - avg;
            const w2 = Math.min(50, Math.abs(d) / Math.max(avg, 12) * 50);
            return `<tr>
              <td>${pgEsc(r.v)}</td>
              <td class="n">${r.n}</td>
              ${t.important ? `
                <td class="n">${r.imp || '—'}</td>
                <td class="n">${r.imp ? r.pct.toFixed(1) + '%' : '—'}</td>
                <td class="dev"><span class="axis"></span>
                  <i class="${d >= 0 ? 'up' : 'down'}"
                     style="width:${w2.toFixed(1)}%;${d >= 0 ? 'left' : 'right'}:50%"></i></td>
                <td class="n devnum ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d.toFixed(0)}%p</td>` : ''}
            </tr>`;
          }).join('')}
        </table>
        ${rest > 0 ? `<p class="meta">그 외 ${rest}종 ${restN}건</p>` : ''}`);
    });
    push('perf', '</section>');
  }

  /* ---- 경력 ---- */
  const exps = P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0));
  if(exps.length){
    push('career', `<section class="brk"><h2>경력</h2>`);
    exps.forEach((e, i) => {
      const sp = spanOf(e);
      const sc = scaleLine(e);
      /* 고른 것만 싣는다. 안 그러면 왼쪽에서 체크를 풀어도 미리보기가 그대로라
         무엇이 들어가는지 알 수 없다. */
      let achs = P.achievements.filter(a => a.experienceId === e.id)
        .filter(a => !o.pickedIds || o.pickedIds.has(a.id))
        .sort((a,b) => ((b.evidence||[]).length - (a.evidence||[]).length));
      const cap = o.pickedIds ? 99 : (i < 2 ? 6 : 3);
      achs = achs.slice(0, cap);
      push('career', `<article>
        <h3>${pgEsc(e.org)}${e.team ? ' · ' + pgEsc(e.team) : ''}${e.title ? ' · ' + pgEsc(e.title) : ''}</h3>
        <p class="when">${fmtYm(e.start)} – ${e.isCurrent ? '현재' : fmtYm(e.end)}${
          sp ? `  (${fmtDur(sp[1]-sp[0]+1)})` : ''}${
          e.employmentType && e.employmentType !== '정규직' ? '  · ' + pgEsc(e.employmentType) : ''}</p>
        ${sc ? `<p class="scale">${pgEsc(sc)}</p>` : ''}
        ${achs.length ? `<ul>${achs.map(a => `<li>${pgEsc(composeBullet(a))}</li>`).join('')}</ul>` : ''}
      </article>`);
    });
    push('pub', '</section>');
  }

  /* ---- 저서·논문 ---- */
  if((P.publications||[]).length){
    push('pub', `<section><h2>저서 · 논문</h2><ul class="plain">${
      P.publications.slice().sort((a,b) => (mi(b.publishedAt)||0) - (mi(a.publishedAt)||0))
        .map(x => `<li><b>${pgEsc(x.title)}</b>
          <span>${pgEsc([x.kind, x.role !== '단독' ? x.role : null, x.publisher,
            x.publishedAt ? fmtYm(x.publishedAt) : null].filter(Boolean).join(' · '))}</span></li>`).join('')
    }</ul></section>`);
  }

  /* ---- 프로젝트·활동 ----
     유형별로 묶는다. 20건을 시간순으로 늘어놓으면
     활동이 많다는 사실만 남고 무엇을 하는 사람인지가 사라진다. */
  if((P.projects||[]).length){
    const ps = P.projects.slice().sort((a,b) => (mi(b.start)||0) - (mi(a.start)||0));
    const groups = {};
    ps.forEach(x => { const k = x.kind || '기타'; (groups[k] = groups[k] || []).push(x); });
    const order = PROJECT_KINDS.filter(k => groups[k]).concat(
      Object.keys(groups).filter(k => !PROJECT_KINDS.includes(k)));

    const span = list => {
      const ys = list.map(x => String(x.start || '').slice(0,4)).filter(Boolean).sort();
      if(!ys.length) return '';
      return ys[0] === ys[ys.length-1] ? ys[0] : `${ys[0]}–${ys[ys.length-1]}`;
    };
    const orgs = list => new Set(list.map(x => x.org).filter(Boolean)).size;

    push('projects', `<section class="brk"><h2>프로젝트 · 활동 <small>${ps.length}건</small></h2>
      <p class="tally">${order.map(k =>
        `<span><b>${pgEsc(k)}</b> ${groups[k].length}건${
          orgs(groups[k]) > 1 ? ` · 기관 ${orgs(groups[k])}곳` : ''}${
          span(groups[k]) ? ` · ${span(groups[k])}` : ''}</span>`).join('')}</p>
      ${order.map(k => `<h3>${pgEsc(k)} <small>${groups[k].length}건</small></h3>
        <table>${groups[k].map(x => `<tr>
          <td class="m">${pgEsc(x.start ? fmtYm(x.start) + (x.end ? ' – ' + fmtYm(x.end) : '') : '')}</td>
          <td><b>${pgEsc(x.name)}</b>${x.description ? `<span class="d">${pgEsc(x.description)}</span>` : ''}</td>
          <td class="m">${pgEsc([x.org, x.role].filter(Boolean).join(' · '))}</td>
        </tr>`).join('')}</table>`).join('')}
    </section>`);
  }

  /* ---- 학력 · 자격 · 수상 ---- */
  const eduBits = [];
  (P.education||[]).slice().sort((a,b) => (mi(b.end)||0) - (mi(a.end)||0)).forEach(e => {
    const span = e.start && e.end ? `${fmtYm(e.start)} – ${fmtYm(e.end)}`
               : e.end ? `${fmtYm(e.end)} 졸업` : '';
    eduBits.push(['학력', `${e.school || ''} ${e.major || ''} ${e.degree || ''}`.trim(), span]);
  });
  (P.certifications||[]).filter(x => { const ex = mi(x.expiresAt); return ex === null || ex >= nowMi(); })
    .forEach(x => eduBits.push(['자격', x.name, [x.issuer, x.issuedAt ? fmtYm(x.issuedAt) : null].filter(Boolean).join(' · ')]));
  (P.awards||[]).slice().sort((a,b) => (mi(b.date)||0) - (mi(a.date)||0))
    .forEach(a => eduBits.push(['수상', a.name,
      [a.issuer, a.date ? fmtYm(a.date) : null].filter(Boolean).join(' · ')]));
  if(eduBits.length){
    push('edu', `<section><h2>학력 · 자격 · 수상</h2><table>${
      eduBits.map(([k,v,m]) => `<tr><td class="k">${pgEsc(k)}</td><td>${pgEsc(v)}</td>
        <td class="m">${pgEsc(m)}</td></tr>`).join('')}</table></section>`);
  }

  /* ---- 역량 ---- */
  const skl = P.skills.map(s => ({ s, st: skillStats(P, s) }))
    .filter(x => x.st.evidenceCount > 0 || x.st.achCount > 0 || x.st.months > 0)
    .sort((a,b) => (b.st.evidenceCount - a.st.evidenceCount) || (b.st.months - a.st.months));
  if(skl.length){
    push('skills', `<section><h2>역량</h2>`);
    CAT_ORDER.forEach(cat => {
      const g = skl.filter(x => (x.s.category||'hard') === cat);
      if(!g.length) return;
      push('skills', `<p class="skl"><b>${CAT_LABEL[cat]}</b> ${
        g.map(x => `${pgEsc(x.s.name)}<em>${fmtDur(x.st.months)}</em>`).join(' · ')}</p>`);
    });
    push('edu', '</section>');
  }

  /* ---- 레퍼런스 ---- */
  const refs = (P.references||[]).filter(r => r.contactable === '가능');
  if(refs.length) push('ledger', `<section><p class="ref">레퍼런스 ${refs.length}명 확보 — 요청 시 제공</p></section>`);

  /* ---- 활동 원장 ---- */
  if(o.entries && list.length){
    const axes = facetAxes(P).slice(0, 3).map(a => a.key);
    push('ledger', `<section class="brk"><h2>활동 원장 <small>${list.length}건</small></h2>
      <table class="led"><tr><th>날짜</th><th>유형</th><th>내용</th>${
        axes.map(a => `<th>${pgEsc(a)}</th>`).join('')}<th>${pgEsc(FLAG)}</th></tr>${
      list.slice().sort((a,b) => (a.date < b.date ? 1 : -1)).map(e =>
        `<tr><td class="m">${pgEsc(e.date.slice(2))}</td><td class="m">${pgEsc(TYPE_LABEL[e.type]||e.type)}</td>
         <td>${pgEsc(e.title)}</td>${axes.map(a =>
           `<td class="m">${pgEsc((e.facets||{})[a] || '')}</td>`).join('')}
         <td class="m">${e.important ? '●' : ''}</td></tr>`).join('')}
    </table></section>`);
  }

  /* 용도 순서대로 낸다. 정의가 없으면 기본 순서. */
  const ORDER = pu ? pu.order.map(k => ({ summary:'sum', perf:'perf', career:'career',
      pub:'pub', projects:'projects', edu:'edu', cert:'edu', award:'edu', skills:'skills' })[k])
    : ['sum','perf','career','pub','projects','edu','skills'];
  const seen = new Set();
  ORDER.concat(['sum','perf','career','pub','projects','edu','skills','ledger'])
    .forEach(k => {
      if(!k || seen.has(k) || !SEC[k]) return;
      seen.add(k); S.push(SEC[k].join('\n'));
    });

  const embed = pageEmbedData(P, o.embed, o.contact);
  if(embed){
    S.push(`<div class="reopen">
      <b>이 파일에 원본 데이터가 들어 있습니다.</b>
      커리어 스모그에서 <b>불러오기</b>로 이 파일을 열면 이어서 쓸 수 있습니다.
      ${o.embed === 'full'
        ? '<em>처우 정보까지 들어 있으니 남에게 보내지 마세요.</em>'
        : '처우 정보는 빠져 있습니다.'}
    </div>`);
  }
  S.push(`<footer>커리어 스모그로 만들었습니다 · ${stamp()}</footer>`);

  return `<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${pgEsc(pr.name || '커리어')} — 이력</title>
<style>

  box-shadow:0 2px 18px rgba(14,17,22,.08)}

  background:#F1F5F3;border-left:3px solid var(--clear)}

h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);
  font-weight:700;margin:0 0 12px;padding-bottom:5px;border-bottom:1px solid var(--rule)}

/* ============================================================
   문서 미리보기
   파일로 뽑기 전에 눈으로 확인할 수 있어야 한다.
   Word를 열어봐야만 결과를 아는 건 도구가 불친절한 것이다.
   ============================================================ */
function docPreviewCss(){
  return `body{margin:0;background:#F2F4F6;font-size:13px;line-height:1.65;color:#0E1116;
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
.pg{max-width:760px;margin:18px auto;background:#fff;padding:34px 38px;box-shadow:0 1px 10px rgba(14,17,22,.09)}
h1{font-size:25px;margin:0 0 2px;font-weight:800;letter-spacing:-.03em}
h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#6A727C;font-weight:700;
  margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid #DDE2E7}
h3{font-size:13.5px;margin:12px 0 2px;font-weight:700}
p{margin:0 0 6px}
.meta{font-size:11.5px;color:#6A727C;margin:0 0 3px}
.sub{font-size:14px;color:var(--clear);font-weight:600;margin:0 0 5px}
ul{margin:5px 0 0;padding-left:16px}
li{margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:12px;margin:5px 0 8px}
td,th{padding:3px 6px;border-bottom:1px solid #E4EAED;text-align:left;vertical-align:top}
th{font-size:10.5px;color:#fff;background:#0F5F57;font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.k{color:#6A727C;font-size:11.5px}
@media print{body{background:#fff} .pg{margin:0;box-shadow:none;padding:0;max-width:none} @page{margin:16mm 14mm}}`;
}

/** 기간 보고서를 문서 모양으로. Word와 같은 순서·같은 내용. */
function buildReportHtml(P, unit, key, opts){
  opts = opts || {};
  const detail = opts.detail || reportDetail || 'full';
  const full = detail === 'full', brief = detail === 'brief';
  const pf = perf(P, unit, key);
  const rep = getReport(P, unit, key) || {};
  const unitName = (REPORT_UNITS.find(u => u[0] === unit) || ['',''])[1];
  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  const S = [];
  const T = (rows, num) => `<table>${rows.map((r, ri) =>
    `<tr>${r.map((c, ci) => ri === 0
      ? `<th>${pgEsc(c)}</th>`
      : `<td class="${(num||[]).includes(ci) ? 'n' : ''}">${pgEsc(c)}</td>`).join('')}</tr>`).join('')}</table>`;

  const range = (unit === 'all' && pf.list.length)
    ? ` (${String(pf.list[0].date).slice(0,7).replace('-','.')} – ${String(pf.list[pf.list.length-1].date).slice(0,7).replace('-','.')})` : '';
  S.push(`<h1>${unitName} 업무 보고</h1>
    <p class="sub">${pgEsc(periodLabel(key, unit) + range)}</p>
    <p class="meta">${pgEsc(P.profile.name || '')}${P.profile.headline ? ' · ' + pgEsc(P.profile.headline) : ''} · 작성 ${stamp()}</p>`);

  const cmp = unit !== 'all';
  const sum = cmp ? [['항목','이번 ' + unitName,'직전 ' + unitName,'증감']] : [['항목','값']];
  const row = (label, now, before, fmt) => {
    const f = fmt || (v => v);
    if(!cmp){ sum.push([label, f(now)]); return; }
    const dd = (before || before === 0) ? now - before : null;
    sum.push([label, f(now), (before || before === 0) ? f(before) : '',
      dd === null || !before ? '' : (dd > 0 ? '+' : '') + (Math.round(dd*10)/10) +
        ` (${dd > 0 ? '+' : ''}${Math.round(dd / before * 100)}%)`]);
  };
  row(ACT + ' 건수', pf.t.count, pf.prev.count);
  if(pf.t.hasHours || pf.prev.hasHours) row('투입 시간', pf.t.hours, pf.prev.hours, fmtHours);
  if(pf.t.lectures || pf.prev.lectures) row('강의 회차', pf.t.lectures, pf.prev.lectures);
  if(pf.important.length || pf.prev.important) row(FLAG, pf.important.length, pf.prev.important);
  S.push('<h2>요약</h2>' + T(sum, [1,2,3]));
  const ong = ongoingNote(unit, key);
  if(ong) S.push(`<p class="meta">${pgEsc(ong)} — 직전 기간과의 비교는 기간이 끝난 뒤에 봐야 정확합니다.</p>`);

  const axes = facetAxes(P);
  if(!brief && axes.length){
    S.push('<h2>내용 분석</h2>');
    contentLines(P, pf.list).forEach(c =>
      S.push(`<p><b>${pgEsc(c.axis)}</b>  ${pgEsc(c.text)}</p>`));
    if(full) axes.forEach(a => {
      const at = axisTable(P, pf.list, a.key, 25);
      if(at.rows.length <= 1) return;
      S.push(`<h3>${pgEsc(a.key)}별 <span class="k">${at.kinds}종</span></h3>` + T(at.rows, [1,2,3]));
    });
  }

  if(unit === 'week'){
    S.push(`<h2>${pgEsc(ACT)} 목록 <span class="k">${pf.list.length}건</span></h2>` +
      T(fullTable(P, pf.list, { detail:true })));
  } else {
    const kids = childDetail(P, unit, key);
    if(kids.length){
      const chName = { week:'주차별', month:'월별', year:'연도별' }[kids[0].unit] || '기간별';
      const rows = [[{ week:'주차', month:'월', year:'연도' }[kids[0].unit] || '기간',
        '건수','시간','강의',FLAG,'총평']];
      kids.forEach(k => rows.push([periodShort(k.key, k.unit), k.perf.t.count,
        k.perf.t.hasHours ? fmtHours(k.perf.t.hours) : '', k.perf.t.lectures || '',
        k.perf.t.important || '', (k.report && k.report.summary || '').slice(0, 60)]));
      S.push(`<h2>${chName}</h2>` + T(rows, [1,2,3,4]));
    }
  }

  if(pf.important.length){
    S.push(`<h2>${pgEsc(FLAG)} <span class="k">${pf.important.length}건</span></h2>`);
    contentLines(P, pf.important, { topN:3, axes:2 }).forEach(c =>
      S.push(`<p class="meta"><b>${pgEsc(c.axis)}</b> — ${pgEsc(c.text)}</p>`));
    S.push(T(fullTable(P, pf.important, { detail:true })));
  }

  if(full && pf.list.length && unit !== 'week')
    S.push(`<h2>${pgEsc(ACT)} 전체 목록 <span class="k">${pf.list.length}건</span></h2>` +
      T(fullTable(P, pf.list)));

  const nw = unit === 'week' ? '주' : unit === 'month' ? '달' : '해';
  [['총평', rep.summary], ['공유·논의', rep.issues], [`다음 ${nw} 계획`, rep.nextPlan]]
    .forEach(([label, text]) => {
      if(!text) return;
      S.push(`<h2>${label}</h2>` + String(text).split(/\n/).filter(x => x.trim())
        .map(l => `<p>${pgEsc(l)}</p>`).join(''));
    });

  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>${pgEsc(periodLabel(key, unit))} ${unitName} 보고</title>
<style>${docPreviewCss()}</style></head><body><div class="pg">${S.join('\n')}</div></body></html>`;
}

</script>
</body>
</html>
