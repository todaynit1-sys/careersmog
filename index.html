/* ---------- 누적 곡선 ---------- */
/* ── 차트 공통 ──────────────────────────────────
   눈금은 사람이 읽는 숫자로 끊는다. 3.3건·6.7건 같은 축은 뜻이 없다.
   건수는 정수이므로 1·2·5·10·20·50… 단위로만 올라간다. */
function niceStep(max, want){
  const raw = max / Math.max(1, want);
  const pow = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
  const n = raw / pow;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
  return Math.max(1, Math.round(step));
}

function axisTicks(max, want){
  const step = niceStep(max, want || 4);
  const top = Math.ceil(max / step) * step;
  const out = [];
  for(let v = 0; v <= top + 1e-9; v += step) out.push(v);
  return { ticks: out, top: Math.max(top, step) };
}

const CHART = { ink:'#12171A', mute:'#7C858A', grid:'#E6E9E5',
                clear:'#0F5F57', clearSoft:'#0F5F57', warn:'#8A6A1F' };

/**
 * 누적 곡선.
 * "한 번 쌓인 것은 줄지 않는다"가 이 화면의 주장이므로
 * 선 하나로 끝내지 않고 면으로 채워 부피가 보이게 한다.
 */
function chartCumulative(cum, unit, useHours){
  const W = Math.max(680, cum.length * 26), H = 210;
  const L = 54, R = 20, T = 18, B = 30;
  const val = c => useHours ? c.hours : c.count;
  const { ticks, top } = axisTicks(Math.max(1, val(cum[cum.length-1])), 4);
  const x = i => L + (W - L - R) * (cum.length === 1 ? 0 : i / (cum.length - 1));
  const y = v => T + (H - T - B) * (1 - v / top);
  const id = 'cg' + Math.random().toString(36).slice(2, 7);

  let g = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${CHART.clear}" stop-opacity=".22"/>
      <stop offset="1" stop-color="${CHART.clear}" stop-opacity="0"/>
    </linearGradient></defs>`;

  ticks.forEach(v => {
    const yy = y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="${CHART.grid}"/>
          <text x="${L-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="${CHART.mute}"
            style="font-family:ui-monospace,monospace">${v}</text>`;
  });

  const line = cum.map((c,i) => `${x(i).toFixed(1)},${y(val(c)).toFixed(1)}`).join(' ');
  g += `<polygon points="${L},${y(0)} ${line} ${x(cum.length-1)},${y(0)}" fill="url(#${id})"/>`;
  g += `<polyline points="${line}" fill="none" stroke="${CHART.clear}" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>`;

  const step = Math.ceil(cum.length / 9);
  cum.forEach((c,i) => {
    if(i % step === 0 || i === cum.length - 1)
      g += `<text x="${x(i)}" y="${H-B+17}" text-anchor="middle" font-size="10" fill="${CHART.mute}"
              style="font-family:ui-monospace,monospace">${esc(periodShort(c.key, unit))}</text>`;
  });

  const last = cum[cum.length-1];
  const lx = x(cum.length-1), ly = y(val(last));
  g += `<circle cx="${lx}" cy="${ly}" r="4.5" fill="#fff" stroke="${CHART.clear}" stroke-width="2.4"/>
        <text x="${lx - 8}" y="${ly - 11}" text-anchor="end" font-size="13" font-weight="800"
          fill="${CHART.clear}" letter-spacing="-.02em">${
          useHours ? fmtHours(last.hours) + '시간' : last.count + '건'}</text>`;

  return `<div class="tl-scroll" style="margin-top:var(--s4)"><div class="tl">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      style="width:100%;height:${H}px;min-width:${cum.length > 26 ? W + 'px' : '100%'}"
      role="img" aria-label="누적 활동량">${g}</svg></div></div>`;
}

/* ---------- 기간별 막대 ---------- */
function chartPeriods(series, useHours){
  const W = Math.max(680, series.length * 46), H = 220;
  const L = 46, B = 34, T = 16, RGT = 10;
  const val = s => useHours ? s.t.hours : s.t.count;
  const raw = Math.max(1, ...series.map(val));
  const { ticks, top } = axisTicks(raw, 4);
  const step = (W - L - RGT) / series.length;
  const bw = Math.min(26, step * 0.6);
  const y = v => T + (H - T - B) * (1 - v / top);
  const r = Math.min(3, bw / 2);

  let g = '';
  ticks.forEach(v => {
    const yy = y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-RGT}" y2="${yy}" stroke="${CHART.grid}"/>
          <text x="${L-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="${CHART.mute}"
            style="font-family:ui-monospace,monospace">${useHours ? (Math.round(v*10)/10) : v}</text>`;
  });

  const peak = series.reduce((m, s2) => val(s2) > val(m) ? s2 : m, series[0]);

  series.forEach((s2, i) => {
    const bx = L + i * step + (step - bw) / 2;
    const total = val(s2);
    let acc = 0;
    ENTRY_TYPES.forEach(([k,, tone]) => {
      const v = useHours ? s2.t.byType[k].hours : s2.t.byType[k].count;
      if(!v) return;
      const h = (H - T - B) * v / top;
      const yy = y(acc + v); acc += v;
      /* 맨 위 조각만 모서리를 둥글린다. 전부 둥글면 쌓인 것이 끊겨 보인다. */
      const isTop = Math.abs(acc - total) < 1e-9;
      g += `<g><title>${esc(periodLabel(s2.key, s2.unit))}\n${TYPE_LABEL[k]} ${
              useHours ? fmtHours(v)+'시간' : v+'건'}</title>
            <rect x="${bx.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}"
              height="${Math.max(1.5,h).toFixed(1)}" fill="${tone}"
              ${isTop ? `rx="${r}" ry="${r}"` : ''}/></g>`;
    });
    /* 가장 높은 기간에만 숫자를 얹는다. 전부 적으면 아무것도 안 읽힌다. */
    if(total && s2.key === peak.key)
      g += `<text x="${(bx + bw/2).toFixed(1)}" y="${(y(total) - 7).toFixed(1)}" text-anchor="middle"
              font-size="11.5" font-weight="800" fill="${CHART.clear}"
              letter-spacing="-.02em">${useHours ? fmtHours(total) : total}</text>`;

    if(i % Math.ceil(series.length / 12) === 0 || i === series.length - 1)
      g += `<text x="${(bx + bw/2).toFixed(1)}" y="${H - B + 17}" text-anchor="middle"
              font-size="10" fill="${CHART.mute}"
              style="font-family:ui-monospace,monospace">${esc(periodShort(s2.key, s2.unit))}</text>`;
  });
  g += `<line x1="${L}" y1="${H-B}" x2="${W-RGT}" y2="${H-B}" stroke="${CHART.grid}"/>`;

  return `<div class="tl-scroll"><div class="tl"><svg viewBox="0 0 ${W} ${H}"
    preserveAspectRatio="none"
    style="width:100%;height:${H}px;min-width:${series.length > 16 ? W + 'px' : '100%'}"
    role="img" aria-label="기간별 활동량">${g}</svg></div></div>`;
}

/* ---------- 활동 히트맵 ---------- */
function heatmapPanel(P){
  const weeks = 53;
  const series = bucketize(P, 'week', weeks);
  const vals = series.map(s => s.t.hasHours ? s.t.hours : s.t.count);
  const max = Math.max(1, ...vals);
  const CW = 15, CH = 22, PAD = 2;
  const W = weeks * CW + 8, H = CH + 26;

  let g = '', lastMonth = -1;
  series.forEach((s, i) => {
    const v = s.t.hasHours ? s.t.hours : s.t.count;
    const lv = v === 0 ? 0 : Math.min(4, Math.ceil(v / max * 4));
    const fill = ['#E6E9E5','#C3D6CF','#8FBAAB','#4E9080','#0F5F57'][lv];
    const x = i * CW + 4;
    g += `<g><title>${esc(weekLabel(s.key))}\n${s.t.count}건${s.t.hasHours ? ' · ' + fmtHours(s.t.hours) + '시간' : ''}</title>
          <rect x="${x}" y="4" width="${CW-PAD}" height="${CH}" rx="2" fill="${fill}"/></g>`;
    const mon = weekMonday(s.key);
    if(mon && mon.getMonth() !== lastMonth && i % 2 === 0){
      lastMonth = mon.getMonth();
      g += `<text x="${x}" y="${H-6}" font-size="9.5" fill="#6A727C"
              style="font-family:ui-monospace,monospace">${mon.getMonth()+1}월</text>`;
    }
  });

  const done = series.filter(s => s.t.count > 0).length;
  return `<div class="panel">
    <h2 class="sec">최근 1년 활동</h2>
    <div class="tl-scroll"><div class="tl"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
      role="img" aria-label="주별 활동 히트맵">${g}</svg></div></div>
    <div class="heat-legend">
      <span>${weeks}주 중 <b>${done}주</b> 기록</span>
      <span class="scale">적음
        ${['#E6E9E5','#C3D6CF','#8FBAAB','#4E9080','#0F5F57'].map(c =>
          `<i style="background:${c}"></i>`).join('')} 많음</span>
    </div>
  </div>`;
}

/* ---------- 연도별 ---------- */
function yearPanel(P){
  const years = cumulative(P, 'year');
  if(years.length < 1) return '';

  const rows = years.slice().reverse().map((y, i, arr) => {
    const prev = arr[i+1];
    const d = (a, b) => {
      if(!prev || !b) return '';
      const diff = a - b;
      if(!diff) return '<em>—</em>';
      return `<em class="${diff>0?'up':'down'}">${diff>0?'+':''}${Math.round(diff*10)/10}</em>`;
    };
    return `<div class="yrow">
      <span class="yk">${esc(y.key)}년</span>
      <span>${y.add.count}${d(y.add.count, prev && prev.add.count)}</span>
      <span>${y.add.hasHours ? fmtHours(y.add.hours) : '—'}${d(y.add.hours, prev && prev.add.hours)}</span>
      <span>${y.add.lectures || '—'}${d(y.add.lectures, prev && prev.add.lectures)}</span>
      <span>${y.add.audience || '—'}${d(y.add.audience, prev && prev.add.audience)}</span>
      <span>${y.add.promoted || '—'}</span>
    </div>`;
  }).join('');

  const cur = years[years.length-1];
  return `<div class="panel">
    <div class="wk-head">
      <h2 class="sec" style="margin:0">연도별</h2>
      <div class="wk-nav">
        <button class="btn sm" id="btnYearCopy" data-year="${cur.key}">${cur.key}년 요약 복사</button>
        <button class="btn sm" id="btnYearDocx" data-year="${cur.key}">Word</button>
      </div>
    </div>
    <div class="ytable">
      <div class="yrow head"><span>연도</span><span>건수</span><span>시간</span>
        <span>강의</span><span>수강</span><span>성과</span></div>
      ${rows}
    </div>
    <p class="hint" style="margin-top:10px">작은 숫자는 전년 대비 증감입니다.
      기록을 시작한 첫 해는 비교 대상이 없어 비어 있습니다.</p>
  </div>`;
}




/* ===== 07c-report.js ===== */
/* ============================================================
   보고서 — 주간 → 월간 → 연간
   아래 단계에서 사람이 쓴 총평이 위 단계로 딸려 올라간다.
   그래야 연말에 1년치를 처음부터 떠올리지 않아도 된다.

   집계는 저장하지 않는다. entries[]에서 매번 다시 계산한다.
   사람이 쓴 글(총평·이슈·계획)만 reports[]에 남는다.
   ============================================================ */

const REPORT_UNITS = [
  ['week',  '주간'],
  ['month', '월간'],
  ['year',  '연간'],
  ['all',   '전체']     // 쌓인 전부를 한 문서로. 이력서·평가 자료에 그대로 쓴다
];

let repUnit = 'week';
let repKey = null;

function repCurrent(unit){ return currentPeriod(unit); }

function periodEntries(P, unit, key){
  if(unit === 'all') return (P.entries || []).slice()
    .sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return (P.entries || []).filter(e => periodKey(e.date, unit) === key)
    .sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

/** 한 단계 아래 기간들. 데이터가 있는 것만 — 빈 달을 12개 늘어놓아 봐야 읽히지 않는다. */
function childKeys(P, unit, key){
  const child = unit === 'all' ? 'year'
              : unit === 'year' ? 'month'
              : unit === 'month' ? 'week' : null;
  if(!child) return [];
  const set = new Set();
  (P.entries || []).forEach(e => {
    if(unit === 'all' || periodKey(e.date, unit) === key){
      const k = periodKey(e.date, child);
      if(k) set.add(k);
    }
  });
  (P.reports || []).forEach(r => {
    if(r.unit !== child || !r.key) return;
    if(unit === 'all' || periodKey(childAnchor(r.unit, r.key), unit) === key) set.add(r.key);
  });
  return { unit: child, keys: [...set].sort() };
}

/** 기간 키를 대표 날짜로 바꾼다. 상위 기간을 되짚을 때 쓴다. */
function childAnchor(unit, key){
  if(unit === 'all') return ymd(new Date());
  if(unit === 'week'){ const m = weekMonday(key); return m ? ymd(m) : null; }
  if(unit === 'month') return key + '-15';
  if(unit === 'quarter'){ const [y,q] = key.split('-Q'); return y + '-' + pad((+q-1)*3+2) + '-15'; }
  return key + '-06-15';
}

function getReport(P, unit, key){
  return (P.reports || []).find(r => r.unit === unit && r.key === key) || null;
}
function ensureReport(P, unit, key){
  let r = getReport(P, unit, key);
  if(!r){
    r = { id: nextId(P.reports, 'rep'), unit, key,
          summary:'', issues:'', nextPlan:'',
          generatedAt: new Date().toISOString(), userEdited:true };
    P.reports.push(r);
  }
  return r;
}

/* ---------- 실적 집계 ---------- */
function perf(P, unit, key){
  const list = periodEntries(P, unit, key);
  const t = tally(list);
  const prevKey = shiftPeriod(key, unit, -1);
  const prev = tally(periodEntries(P, unit, prevKey));

  const promoted = list.filter(e => e.promotedTo).map(e => {
    const a = P.achievements.find(x => x.id === e.promotedTo);
    return { title: a ? (a.title || e.title) : e.title, date: e.date, metrics: a ? (a.metrics||[]) : [] };
  });

  const lecAud = list.filter(e => e.type === 'lecture' && e.audience).map(e => Number(e.audience));
  return {
    list, t, prev, prevKey, promoted,
    avgAudience: lecAud.length ? Math.round(lecAud.reduce((a,b)=>a+b,0) / lecAud.length) : null,
    important: list.filter(e => e.important)
  };
}

/** 진행 중인 기간인지. 아직 안 끝난 달을 지난달 전체와 견주면 항상 폭락으로 보인다. */
function isOngoing(unit, key){ return unit !== 'all' && key === currentPeriod(unit); }

function ongoingNote(unit, key){
  if(!isOngoing(unit, key)) return null;
  const now = new Date();
  if(unit === 'week'){
    const left = 7 - ((now.getDay() || 7));
    return left > 0 ? `이번 주는 아직 ${left}일 남았습니다` : '이번 주 마지막 날입니다';
  }
  if(unit === 'month'){
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const left = end - now.getDate();
    return left > 0 ? `이번 달은 아직 ${left}일 남았습니다 (${now.getDate()}/${end}일 경과)` : '이번 달 마지막 날입니다';
  }
  const doy = Math.floor((now - new Date(now.getFullYear(),0,1)) / 86400000) + 1;
  return `올해는 아직 진행 중입니다 (${doy}일 경과)`;
}

/**
 * 그 기간에 "무엇을 했는지"를 축별로 요약한다.
 * 건수만 적힌 보고서는 읽는 사람에게 아무것도 말해주지 않는다.
 */
function contentLines(P, list, opt){
  opt = opt || {};
  const topN = opt.topN || 3;
  const axes = facetAxes(P).slice(0, opt.axes || 4);
  const out = [];

  axes.forEach(a => {
    const t = facetTallyOn(list, a.key);
    if(!t.rows.length) return;
    const top = t.rows.slice(0, topN).map(r => {
      /* 근거축(위반내용 등)은 비율이 늘 100%라 적을 이유가 없다 */
      if(t.isFlagAxis || !r.imp) return `${r.value} ${r.n}건`;
      return `${r.value} ${r.n}건(${r.imp}건 ${r.pct}%)`;
    });
    const restN = t.rows.length - top.length;
    out.push({ axis:a.key, text: top.join(', ') + (restN > 0 ? ` … 외 ${restN}종` : ''),
               kinds: t.rows.length, rows: t.rows, isFlagAxis: t.isFlagAxis });
  });
  return out;
}

function delta(now, before){
  if(!before) return null;
  const d = now - before;
  if(!d) return { txt:'전기와 같음', dir:0 };
  const pct = Math.round(d / before * 100);
  return { txt: (d > 0 ? '+' : '') + (Math.round(d*10)/10) + ' (' + (pct>0?'+':'') + pct + '%)', dir: d > 0 ? 1 : -1 };
}

/* ---------- 본문 조립 ---------- */
function buildPeriodReport(P, unit, key){
  const p = perf(P, unit, key);
  const rep = getReport(P, unit, key) || {};
  const L = [];
  const unitName = (REPORT_UNITS.find(u => u[0] === unit) || ['', ''])[1];

  const rangeTxt = (unit === 'all' && p.list.length)
    ? ` (${String(p.list[0].date).replace(/-/g,'.').slice(0,7)} – ${String(p.list[p.list.length-1].date).replace(/-/g,'.').slice(0,7)})`
    : '';
  L.push(`■ ${periodLabel(key, unit)}${rangeTxt} ${unitName} 보고`);
  if(P.profile.name) L.push(`   ${P.profile.name}`);
  L.push('');

  /* 요약 줄 */
  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  const head = [`${ACT} ${p.t.count}건`];
  if(p.t.hasHours) head.push(`${fmtHours(p.t.hours)}시간`);
  ENTRY_TYPES.forEach(([k,l]) => { if(p.t.byType[k].count) head.push(`${l} ${p.t.byType[k].count}`); });
  if(p.t.lectures) head.push(`강의 ${p.t.lectures}회${p.t.audience ? ` (수강 ${p.t.audience}명)` : ''}`);
  /* 중요 표시 건수는 요약 첫 줄에 있어야 한다. 아래까지 내려가서 세게 하면 안 읽는다. */
  if(p.important.length) head.push(`${FLAG} ${p.important.length}건(${
    Math.round(p.important.length / p.t.count * 1000)/10}%)`);
  L.push('[요약] ' + head.join(' · '));

  const ongoing = ongoingNote(unit, key);
  const dC = unit === 'all' ? null : delta(p.t.count, p.prev.count);
  const dH = unit === 'all' ? null : delta(p.t.hours, p.prev.hours);
  if(dC || dH){
    const bits = [];
    if(dC) bits.push(`건수 ${dC.txt}`);
    if(dH && p.t.hasHours) bits.push(`시간 ${dH.txt}`);
    L.push(`       직전 ${unitName} 대비 — ${bits.join(' · ')}` +
           (ongoing ? '  ※ 진행 중이라 아직 적게 잡힙니다' : ''));
  }
  if(ongoing) L.push(`       ${ongoing}`);
  L.push('');

  if(unit === 'week'){
    const cw = contentLines(P, p.list, { topN:4 });
    if(cw.length){
      L.push('[내용]');
      const w = Math.max(...cw.map(c => c.axis.length));
      cw.forEach(c => L.push(`  ${c.axis.padEnd(w)}  ${c.text}`));
      L.push('');
    }
    /* 주간은 한 건씩 그대로 싣는다 */
    ENTRY_TYPES.forEach(([k, label]) => {
      const g = p.list.filter(e => e.type === k);
      if(!g.length) return;
      L.push(`[${label}]`);
      g.forEach(e => {
        const d = parseYmd(e.date);
        const bits = [];
        if(e.hours) bits.push(fmtHours(e.hours) + 'h');
        if(k === 'lecture' && e.audience) bits.push(e.audience + '명');
        const when = e.dateMode === 'week' ? '주중 ' : (d ? (d.getMonth()+1)+'/'+d.getDate() : e.date);
        L.push(`  · ${when}  ${e.title || ''}` + (bits.length ? `  (${bits.join(', ')})` : '') +
               (e.important ? '  ★' : ''));
        if(e.detail) L.push(`      ${e.detail.replace(/\n/g, '\n      ')}`);
      });
      L.push('');
    });
  } else {
    /* 무엇을 했는지부터 적는다. 건수만 있는 보고서는 읽을 이유가 없다. */
    const cont = contentLines(P, p.list, reportDetail === 'full' ? { topN:6 } : {});
    if(cont.length){
      L.push('[내용 분석]');
      const w = Math.max(...cont.map(c => c.axis.length));
      cont.forEach(c => L.push(`  ${c.axis.padEnd(w)}  ${c.text}`));
      L.push('');
    }

    /* 월간·연간은 아래 단계를 접어서 싣는다. 전부 나열하면 읽히지 않는다. */
    const ch = childKeys(P, unit, key);
    if(ch.keys && ch.keys.length){
      const chName = { week:'주차별', month:'월별', year:'연도별' }[ch.unit] || '기간별';
      L.push(`[${chName}]`);
      ch.keys.forEach(ck => {
        const cp = perf(P, ch.unit, ck);
        const bits = [`${cp.t.count}건`];
        if(cp.t.hasHours) bits.push(`${fmtHours(cp.t.hours)}시간`);
        if(cp.t.lectures) bits.push(`강의 ${cp.t.lectures}회`);
        if(cp.t.important) bits.push(`${FLAG} ${cp.t.important}`);
        L.push(`  · ${periodShort(ck, ch.unit)}  ${bits.join(' · ')}`);
      });
      L.push('');

      /* 아래 단계에서 사람이 쓴 총평을 끌어올린다 — 이게 이 화면의 핵심이다 */
      const notes = ch.keys.map(ck => ({ ck, r: getReport(P, ch.unit, ck) }))
                           .filter(x => x.r && (x.r.summary || '').trim());
      if(notes.length){
        L.push(`[${chName} 총평 모음]`);
        notes.forEach(({ck, r}) => {
          L.push(`  · ${periodShort(ck, ch.unit)}  ${r.summary.replace(/\n/g, ' ')}`);
        });
        L.push('');
      }

      const issues = ch.keys.map(ck => ({ ck, r: getReport(P, ch.unit, ck) }))
                            .filter(x => x.r && (x.r.issues || '').trim());
      if(issues.length){
        L.push('[아래 단계에서 올라온 이슈]');
        issues.forEach(({ck, r}) => L.push(`  · ${periodShort(ck, ch.unit)}  ${r.issues.replace(/\n/g, ' ')}`));
        L.push('');
      }
    }

    /* 상세에서는 축별 전체 순위와 전수 목록까지 글로도 낸다. 복사해서 쓰는 사람이 있다. */
    if(reportDetail === 'full'){
      facetAxes(P).forEach(a => {
        const at = axisTable(P, p.list, a.key, 999);
        if(at.rows.length <= 1) return;
        L.push(`[${a.key}별] ${at.kinds}종`);
        at.rows.slice(1).forEach(r =>
          L.push(`  ${String(r[0]).padEnd(2)}  ${r[1]}건` +
                 (r[2] ? ` · ${FLAG} ${r[2]}` : '') + (r[3] ? ` (${r[3]})` : '')));
        L.push('');
      });
    }

    if(p.important.length){
      L.push(`[${FLAG}] ${p.important.length}건`);
      /* 20건을 그냥 늘어놓으면 아무도 안 읽는다. 무엇이 많았는지부터 말한다. */
      /* 위쪽 [내용 분석]과 겹치니 여기서는 가장 말이 되는 두 축만 */
      const impCont = contentLines(P, p.important, { topN:2, axes:2 });
      impCont.forEach(c => L.push(`  ${c.axis} — ${c.text}`));
      const CAP = reportDetail === 'full' ? 999 : 8;
      p.important.slice(0, CAP).forEach(e =>
        L.push(`  · ${String(e.date).slice(5).replace('-','/')}  ${e.title}` +
          (e.type === 'lecture' && e.audience ? `  (${e.audience}명)` : '')));
      if(p.important.length > CAP) L.push(`  … 외 ${p.important.length - CAP}건`);
      L.push('');
    }
  }

  if(p.promoted.length){
    L.push('[커리어 성과로 기록한 것]');
    p.promoted.forEach(a => {
      const nums = (a.metrics||[]).filter(m => m.name).map(m =>
        `${m.name} ${m.before ?? ''}${m.before != null ? '→' : ''}${m.after ?? ''}${m.unit || ''}`).join(', ');
      L.push(`  · ${a.title}${nums ? `  (${nums})` : ''}`);
    });
    L.push('');
  }

  if(unit === 'year' && p.t.lectures){
    L.push('[강의 실적]');
    L.push(`  회차 ${p.t.lectures}회 · 누적 수강 ${p.t.audience || 0}명` +
           (p.avgAudience ? ` · 평균 ${p.avgAudience}명` : ''));
    const byQ = ['Q1','Q2','Q3','Q4'].map(q => {
      const g = p.list.filter(e => e.type === 'lecture' && periodKey(e.date,'quarter') === `${key}-${q}`);
      return g.length ? `${q} ${g.length}회` : null;
    }).filter(Boolean);
    if(byQ.length) L.push('  ' + byQ.join(' · '));
    L.push('');
  }

  if(rep.summary){ L.push('[총평]'); L.push('  ' + rep.summary.replace(/\n/g,'\n  ')); L.push(''); }
  if(rep.issues){ L.push('[공유·논의]'); L.push('  ' + rep.issues.replace(/\n/g,'\n  ')); L.push(''); }
  if(rep.nextPlan){
    L.push(`[다음 ${unitName === '주간' ? '주' : unitName === '월간' ? '달' : '해'} 계획]`);
    L.push('  ' + rep.nextPlan.replace(/\n/g,'\n  ')); L.push('');
  }

  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* 기존 호출부 호환 */
function buildReportText(P, key){ return buildPeriodReport(P, 'week', key); }

/* ---------- 뷰 ---------- */
function viewReport(P){
  if(repUnit === 'all') repKey = 'ALL';
  else if(!repKey || repKey === 'ALL' ||
     periodKey(childAnchor(repUnit, repKey), repUnit) !== repKey) repKey = repCurrent(repUnit);
  const key = repKey;
  const p = perf(P, repUnit, key);
  const rep = getReport(P, repUnit, key) || {};
  const unitName = (REPORT_UNITS.find(u => u[0] === repUnit) || [])[1];
  const ch = childKeys(P, repUnit, key);

  const nav = `<div class="wk-nav">
    ${repUnit === 'all' ? '<span class="hint" style="padding-top:6px">쌓인 전부</span>' : `
    <button class="btn sm" data-rep-shift="-1">←</button>
    <button class="btn sm" data-rep-shift="0" ${key === repCurrent(repUnit) ? 'disabled' : ''}>이번 ${
      repUnit === 'week' ? '주' : repUnit === 'month' ? '달' : '해'}</button>
    <button class="btn sm" data-rep-shift="1">→</button>`}
  </div>`;

  const head = `<div class="wk-head">
      <h2 class="sec" style="margin:0">${esc(periodLabel(key, repUnit))} ${unitName} 보고</h2>
      <div class="unit-sw">${REPORT_UNITS.map(([k,l]) =>
        `<button class="btn sm" data-rep-unit="${k}" ${repUnit===k?'disabled':''}>${l}</button>`).join('')}</div>
      ${nav}
    </div>`;

  if(!p.list.length && !rep.summary){
    return `<div class="panel">${head}<div class="empty">
      <strong>이 ${unitName === '주간' ? '주' : unitName === '월간' ? '달' : '해'}에는 기록이 없습니다</strong>
      보고서는 기록에서 만들어집니다. 먼저 기록 탭에서 채우세요.</div></div>`;
  }

  /* 실적 카드 */
  const cmp = repUnit !== 'all';
  const dC = cmp && delta(p.t.count, p.prev.count), dH = cmp && delta(p.t.hours, p.prev.hours);
  const dL = cmp && delta(p.t.lectures, p.prev.lectures), dA = cmp && delta(p.t.audience, p.prev.audience);
  const card = (label, val, d) => `<div><div class="n">${esc(val)}</div><div class="k">${esc(label)}</div>
    ${d ? `<div class="dl ${d.dir>0?'up':d.dir<0?'down':''}">${esc(d.txt)}</div>` : ''}</div>`;

  const ongoing = ongoingNote(repUnit, key);
  const stats = (ongoing ? `<div class="notice" style="margin-bottom:12px">
      <b>${esc(ongoing)}</b> 직전 ${unitName}과의 비교는 기간이 끝난 뒤에 봐야 정확합니다.</div>` : '') +
    `<div class="stat-cards" style="margin-bottom:16px">
    ${card(termOf(P,'activity'), p.t.count + '건', dC)}
    ${card('투입', p.t.hasHours ? fmtHours(p.t.hours) + '시간' : '미기재', p.t.hasHours ? dH : null)}
    ${card('강의', (p.t.lectures || 0) + '회', dL)}
    ${card('수강', p.t.audience ? p.t.audience + '명' : '—', dA)}
    ${p.important.length ? card(termOf(P,'flag'), p.important.length + '건', null) : ''}
    ${card('성과 기록', p.promoted.length + '건', null)}
    ${repUnit === 'year' && p.avgAudience ? card('강의 평균', p.avgAudience + '명', null) : ''}
  </div>`;

  /* 아래 단계 롤업 */
  let rollup = '';
  if(ch.keys && ch.keys.length){
    const chName = { week:'주차', month:'월', year:'연도' }[ch.unit] || '기간';
    rollup = `<div class="panel">
      <h2 class="sec">${chName}별 — 합쳐서 올라온 것</h2>
      <div class="rollup">
        ${ch.keys.map(ck => {
          const cp = perf(P, ch.unit, ck);
          const cr = getReport(P, ch.unit, ck);
          return `<div class="ru">
            <div class="ru-k">${esc(periodShort(ck, ch.unit))}</div>
            <div class="ru-n">${cp.t.count}건${cp.t.hasHours ? ` · ${fmtHours(cp.t.hours)}h` : ''}${
              cp.t.lectures ? ` · 강의 ${cp.t.lectures}` : ''}</div>
            <div class="ru-s">${cr && cr.summary ? esc(cr.summary)
              : '<em>총평 없음</em>'}</div>
            <button class="btn ghost sm" data-rep-goto="${ch.unit}:${ck}">열기</button>
          </div>`;
        }).join('')}
      </div>
      <p class="hint" style="margin-top:10px">${chName}별 총평은 위 ${unitName} 보고서 본문에 자동으로 실립니다.
        아래에서 채워두면 여기서 다시 쓸 필요가 없습니다.</p>
    </div>`;
  }

  return `<div class="panel">
    ${head}
    ${stats}
    <div class="two">
      <div>
        <div class="fld"><label for="repSum">${unitName} 총평</label>
          <textarea id="repSum" rows="4" data-rep="summary"
            placeholder="집계로는 안 드러나는 맥락. 비워도 보고서는 나옵니다.">${esc(rep.summary||'')}</textarea></div>
        <div class="fld"><label for="repNext">다음 ${
          repUnit === 'week' ? '주' : repUnit === 'month' ? '달' : '해'} 계획</label>
          <textarea id="repNext" rows="3" data-rep="nextPlan"
            placeholder="한 줄에 하나씩">${esc(rep.nextPlan||'')}</textarea></div>
        <div class="fld"><label for="repIssue">공유·논의가 필요한 것</label>
          <textarea id="repIssue" rows="3" data-rep="issues"
            placeholder="막힌 것, 결정이 필요한 것">${esc(rep.issues||'')}</textarea></div>
        <div class="fld"><label>보고서 분량</label>
          <div class="unit-sw" style="display:inline-flex">
            ${[['brief','요약'],['normal','표준'],['full','상세']].map(([k,l]) =>
              `<button class="btn sm" data-rep-detail="${k}" ${reportDetail===k?'disabled':''}>${l}</button>`).join('')}
          </div>
          <span class="fhint">상세는 축별 전체 순위·교차 분석·전수 목록까지 싣습니다.
            분량은 기록 양이 정합니다 — 없는 내용을 지어내 채우지 않습니다.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" id="btnRepPreview">미리보기</button>
          <button class="btn" id="btnRepDocx">Word로 내보내기</button>
          <button class="btn" id="btnRepCopy">본문 복사</button>
          ${repUnit !== 'week' && p.list.length ? (periodPromoted(P, repUnit, key)
            ? '<button class="btn" disabled>성과로 기록됨</button>'
            : `<button class="btn" id="btnRepPromote">이 기간 실적을 성과로</button>`) : ''}
        </div>
        ${repUnit !== 'week' && p.list.length && !periodPromoted(P, repUnit, key)
          ? `<p class="hint" style="margin:8px 0 0">낱개 기록으로는 의미가 없고 합쳐야 실적이 되는 일이 있습니다.
             "${esc(periodLabel(key, repUnit))} ${p.t.count}건 수행" 같은 성과가 집계에서 바로 나옵니다.</p>` : ''}
      </div>
      <div>
        <label class="rep-label">미리보기</label>
        <textarea class="out" id="repOut" readonly>${esc(buildPeriodReport(P, repUnit, key))}</textarea>
      </div>
    </div>
  </div>
  ${rollup}`;
}

/* ============================================================
   기간 실적 → 성과
   개별 기록 하나를 성과로 올리는 것만으로는 부족하다.
   점검 387건처럼 낱개로는 의미가 없고 합쳐야 실적이 되는 일이 있다.
   "2025년 83개소 점검, 위반 32건 적발(38.6%)" — 이건 집계에서 바로 나온다.

   여기서도 없는 숫자는 만들지 않는다. 기록에 있는 것만 지표로 넣는다.
   ============================================================ */
function promotePeriod(P, unit, key){
  const pf = perf(P, unit, key);
  if(!pf.list.length) return null;

  const unitWord = unit === 'year' ? '연간' : unit === 'month' ? '월간' : '주간';
  const parts = [];
  ENTRY_TYPES.forEach(([k, l]) => {
    const n = pf.t.byType[k].count;
    if(n) parts.push(`${l} ${n}건`);
  });

  /* 건수는 제목에 이미 들어간다. 지표로 또 넣으면 이력서 불릿에서 두 번 나온다. */
  /* 이력서에 실릴 문장을 여기서 만든다.
     "업무 65건"만 남으면 무엇을 한 건지 읽는 사람은 알 수 없다.
     축 분석이 있으면 그게 가장 좋은 재료다. */
  const cont = contentLines(P, pf.list, { topN:2, axes:2 });
  /* 축 이름은 앱 안에서 쓰는 말이다. "시군 이천시·남동구 중심"은 이력서 문장이 아니다.
     값만 남기고 이름은 뺀다. */
  const where = cont.filter(c => !c.isFlagAxis)
    .map(c => c.rows.slice(0,2).map(r => r.value).join('·') + ' 중심').slice(0,1);
  const why = cont.filter(c => c.isFlagAxis)
    .map(c => '주요 사유 ' + c.rows.slice(0,2).map(r => r.value).join('·')).slice(0,1);

  const metrics = [];
  if(pf.t.hasHours)
    metrics.push({ name:'투입 시간', internal:true, before:null,
                   after:Math.round(pf.t.hours*10)/10, unit:'시간', delta:null });
  if(pf.t.lectures)
    metrics.push({ name:'강의 회차', before:null, after:pf.t.lectures, unit:'회', delta:null });
  if(pf.t.audience)
    metrics.push({ name:'누적 수강', before:null, after:pf.t.audience, unit:'명', delta:null });
  if(pf.important.length){
    metrics.push({ name:termOf(P,'flag'), internal:true, before:null,
                   after:pf.important.length, unit:'건',
                   delta: Math.round(pf.important.length / pf.t.count * 1000)/10 + '%' });
  }
  /* 직전 기간과 견줄 수 있으면 변화를 함께 남긴다 */
  if(pf.prev.count){
    metrics.push({ name:`직전 ${unitWord} 대비 건수`, internal:true, before:pf.prev.count, after:pf.t.count,
                   delta: (pf.t.count >= pf.prev.count ? '+' : '') +
                          Math.round((pf.t.count/pf.prev.count - 1) * 100) + '%' });
  }

  const rep = getReport(P, unit, key);
  const a = {
    id: nextId(P.achievements, 'ach'),
    experienceId: dominantExperience(P, pf.list),
    date: unit === 'year' ? key + '-12' : (unit === 'month' ? key : unmi(mi(String(key).slice(0,4) + '-01') || nowMi())),
    title: `${periodLabel(key, unit)} ${termOf(P,'activity')} ${pf.t.count}건 수행`,
    situation: null, task: null,
    /* 불릿은 그 자체로 읽혀야 한다. 언제·무엇을·어디에서가 한 줄에 있어야
       "시군 서구·안양시 중심, 적발 33건"처럼 언제 건지 모를 문장이 안 나온다. */
    action: (() => {
      const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
      let head = `${periodLabel(key, unit)} ${ACT} ${pf.t.count}건 수행`;
      if(pf.important.length)
        head += `, ${FLAG} ${pf.important.length}건(${Math.round(pf.important.length/pf.t.count*1000)/10}%)`;
      const tail = [where[0], why[0]].filter(Boolean).join(', ');
      return tail ? `${head} — ${tail}` : head;
    })(),
    /* 보고서 총평은 그 기간의 맥락이지 이력서 문장이 아니다.
       불릿에 그대로 붙으면 두 문체가 섞인다. 성과 화면에서만 보이게 둔다. */
    result: null,
    note: rep && rep.summary ? rep.summary : null,
    metrics,
    scope: { teamSize:null, role:null, budget:null },
    skillIds: [...new Set(pf.list.reduce((acc,e) => acc.concat(e.skillIds||[]), []))],
    evidence: [{ sourceId:'period:' + unit + ':' + key,
                 quote:`${periodLabel(key, unit)} 기록 ${pf.t.count}건 집계`,
                 location: periodLabel(key, unit) }],
    confidence: 'stated', userEdited: true
  };
  if(unit === 'year') a.date = key + '-12';
  P.achievements.push(a);
  return a;
}

function dominantExperience(P, list){
  const cnt = {};
  list.forEach(e => { if(e.experienceId) cnt[e.experienceId] = (cnt[e.experienceId]||0) + 1; });
  const top = Object.keys(cnt).sort((a,b) => cnt[b] - cnt[a])[0];
  return top || null;
}

function periodPromoted(P, unit, key){
  return P.achievements.some(a => (a.evidence||[]).some(v => v.sourceId === 'period:' + unit + ':' + key));
}

/* ============================================================
   상세 보고서용 집계
   "50장 분량"은 데이터가 정한다. 없는 내용을 지어내서 채우지는 않는다.
   대신 기록에 들어 있는 건 남김없이 꺼낸다 —
   전수 목록, 축별 전체 순위, 교차표, 하위 기간 상세까지.
   ============================================================ */

let reportDetail = 'full';      // 'brief' | 'normal' | 'full'

/** 요일별(주간) 또는 하위 기간별 표 */
function dayTable(P, list){
  const by = {};
  list.forEach(e => { (by[e.date] = by[e.date] || []).push(e); });
  const rows = [['날짜','요일','건수','시간', termOf(P,'flag'), '주요 내용']];
  Object.keys(by).sort().forEach(dt => {
    const d = parseYmd(dt), t = tally(by[dt]);
    rows.push([
      dt.slice(5).replace('-','/'), d ? DOW[d.getDay()] : '',
      t.count, t.hasHours ? fmtHours(t.hours) : '',
      t.important || '',
      by[dt].map(e => e.title).join(' / ').slice(0, 60)
    ]);
  });
  return rows;
}

/** 축별 전체 순위. 상세 보고서에서는 상위 3개가 아니라 전부 싣는다. */
function axisTable(P, list, axis, cap){
  const t = facetTallyOn(list, axis);
  const FLAG = termOf(P, 'flag');
  const rows = [[axis, '건수', t.isFlagAxis ? '비중' : FLAG, t.isFlagAxis ? '' : '비율']];
  t.rows.slice(0, cap || 40).forEach(r => rows.push([
    r.value, r.n,
    t.isFlagAxis ? Math.round(r.n / (t.flagged || 1) * 1000)/10 + '%' : (r.imp || ''),
    t.isFlagAxis ? '' : (r.imp ? r.pct + '%' : '')
  ]));
  const rest = t.rows.length - (cap || 40);
  if(rest > 0) rows.push([`그 외 ${rest}종`,
    t.rows.slice(cap || 40).reduce((a,r) => a + r.n, 0), '', '']);
  return { rows, kinds: t.rows.length, isFlagAxis: t.isFlagAxis };
}

/** 교차표 — 하위 기간 × 축. "언제 무엇이 많았나"는 이 표에서만 보인다. */
function crossTable(P, list, unit, key, axis, topN){
  const ch = childKeys(P, unit, key);
  if(!ch.keys || !ch.keys.length) return null;

  const t = facetTallyOn(list, axis);
  const cols = t.rows.slice(0, topN || 6).map(r => r.value);
  if(!cols.length) return null;

  const norm = v => anaMerge ? normKey(v) : v;
  const colKey = cols.map(norm);

  const rows = [[ch.unit === 'week' ? '주차' : '월'].concat(cols).concat(['합계'])];
  ch.keys.forEach(ck => {
    const sub = list.filter(e => periodKey(e.date, ch.unit) === ck);
    const cnt = colKey.map(k => sub.filter(e => norm((e.facets||{})[axis] || '') === k).length);
    rows.push([periodShort(ck, ch.unit)].concat(cnt.map(n => n || '')).concat([sub.length]));
  });
  const totals = ['합계'].concat(colKey.map(k =>
    list.filter(e => norm((e.facets||{})[axis] || '') === k).length)).concat([list.length]);
  rows.push(totals);
  return rows;
}

/** 전수 목록 */
function fullTable(P, list, opt){
  opt = opt || {};
  const axes = facetAxes(P).slice(0, 3).map(a => a.key);
  const head = ['날짜','유형','내용'];
  axes.forEach(a => head.push(a));
  if(list.some(e => e.hours)) head.push('시간');
  if(list.some(e => e.audience)) head.push('인원');
  head.push(termOf(P,'flag'));

  const rows = [head];
  list.slice().sort((a,b) => (a.date < b.date ? -1 : 1)).forEach(e => {
    const r = [e.date.slice(2), TYPE_LABEL[e.type] || e.type,
               (opt.detail && e.detail) ? `${e.title} — ${e.detail}` : e.title];
    axes.forEach(a => r.push((e.facets||{})[a] || ''));
    if(head.includes('시간')) r.push(e.hours ? fmtHours(e.hours) : '');
    if(head.includes('인원')) r.push(e.audience || '');
    r.push(e.important ? '●' : '');
    rows.push(r);
  });
  return rows;
}

/** 하위 기간마다의 상세 묶음 */
function childDetail(P, unit, key){
  const ch = childKeys(P, unit, key);
  if(!ch.keys || !ch.keys.length) return [];
  return ch.keys.map(ck => {
    const cp = perf(P, ch.unit, ck);
    return { key:ck, unit:ch.unit, perf:cp, report:getReport(P, ch.unit, ck) };
  });
}

/* ---------- 축 × 축 교차 ----------
   "어느 업종에서 어떤 위반이 많았나"는 축 하나만 봐서는 알 수 없다.
   두 축을 겹쳐야 비로소 원인 쪽에 가까워진다. */
function crossAxes(P, list, axisA, axisB, topA, topB){
  const norm = v => anaMerge ? normKey(v) : v;
  const ta = facetTallyOn(list, axisA), tb = facetTallyOn(list, axisB);
  const rowsA = ta.rows.slice(0, topA || 10);
  const colsB = tb.rows.slice(0, topB || 6);
  if(!rowsA.length || !colsB.length) return null;

  const colKey = colsB.map(c => norm(c.value));
  const out = [[axisA + ' \\ ' + axisB].concat(colsB.map(c => c.value)).concat(['합계'])];

  rowsA.forEach(ra => {
    const ka = norm(ra.value);
    const sub = list.filter(e => norm((e.facets||{})[axisA] || '') === ka);
    const cells = colKey.map(kb => sub.filter(e => norm((e.facets||{})[axisB] || '') === kb).length);
    if(!cells.some(Boolean) && !sub.length) return;
    out.push([ra.value].concat(cells.map(n => n || '')).concat([sub.length]));
  });
  if(out.length <= 1) return null;

  const tot = ['합계'].concat(colKey.map(kb =>
    list.filter(e => norm((e.facets||{})[axisB] || '') === kb).length)).concat([list.length]);
  out.push(tot);
  return out;
}

/** 축의 상위 값마다 그 값에 해당하는 기록을 따로 보여준다. */
function axisSections(P, list, axis, topN){
  const t = facetTallyOn(list, axis);
  const norm = v => anaMerge ? normKey(v) : v;
  return t.rows.slice(0, topN || 8).map(r => ({
    value: r.value, n: r.n, imp: r.imp, pct: r.pct,
    variants: r.variants, isFlagAxis: t.isFlagAxis,
    list: list.filter(e => norm((e.facets||{})[axis] || '') === norm(r.value))
  }));
}

/** 역량별 투입 — 기록에 연결해 둔 역량이 여기서 실적이 된다. */
function skillTable(P, list){
  const map = {};
  list.forEach(e => (e.skillIds || []).forEach(id => {
    const m = map[id] || (map[id] = { n:0, h:0, imp:0 });
    m.n++; if(e.hours) m.h += Number(e.hours); if(e.important) m.imp++;
  }));
  const rows = [['역량','건수','시간', termOf(P,'flag')]];
  Object.keys(map).map(id => ({ id, ...map[id],
    name: (P.skills.find(s => s.id === id) || {}).name || id }))
    .sort((a,b) => b.n - a.n)
    .forEach(r => rows.push([r.name, r.n, r.h ? fmtHours(r.h) : '', r.imp || '']));
  return rows.length > 1 ? rows : null;
}

/** 기록이 끊긴 구간 — 보고서에서 설명이 필요한 지점이다. */
function quietSpans(P, list, unit){
  if(!list.length) return [];
  const child = unit === 'all' ? 'year' : unit === 'year' ? 'month' : 'week';
  const has = {};
  list.forEach(e => { const k = periodKey(e.date, child); if(k) has[k] = true; });
  const keys = Object.keys(has).sort();
  const out = [];
  let k = keys[0], guard = 0;
  while(k !== keys[keys.length-1] && guard++ < 400){
    if(!has[k]){
      const start = k;
      let n = 0;
      while(!has[k] && guard++ < 400){ n++; k = shiftPeriod(k, child, 1); }
      out.push({ from:start, to:shiftPeriod(k, child, -1), n, unit:child });
    } else k = shiftPeriod(k, child, 1);
  }
  return out;
}


/* ===== 07d-analyze.js ===== */
/* ============================================================
   분석 — 넣은 내용을 쪼개 보기
   건수만 세는 통계로는 "무엇이 많았는지"를 알 수 없다.
   387건 점검했다는 사실보다 "도장업이 19건 중 8건 적발"이 실적이다.

   축(facet)은 가져올 때 열에서 그대로 온다.
   제목으로 합쳐 넣기만 하면 나중에 쪼갤 수 없어서, 원래 열 값을 따로 남긴다.
   ============================================================ */

let anaAxis = null;
let anaScope = 'all';       // 'all' 또는 'YYYY'
let anaTop = 12;

/** 이 사람이 쓰는 축 이름. 설정해 둔 것 + 실제 기록에 들어 있는 것. */
function activeAxes(P){
  const set = [];
  ((P.profile && P.profile.axes) || []).forEach(a => { if(a && !set.includes(a)) set.push(a); });
  facetAxes(P).forEach(a => { if(!set.includes(a.key)) set.push(a.key); });
  return set;
}

/** 축마다 이미 쓰인 값들 — 입력할 때 제안해 주면 표기가 덜 흔들린다. */
function axisValues(P, axis){
  const seen = {};
  (P.entries || []).forEach(e => {
    const v = (e.facets || {})[axis];
    if(v) seen[v] = (seen[v] || 0) + 1;
  });
  return Object.keys(seen).sort((a,b) => seen[b] - seen[a]).slice(0, 60);
}

/** 어떤 축들이 있는지, 얼마나 채워져 있는지 */
function facetAxes(P){
  const cnt = {};
  (P.entries || []).forEach(e => {
    const f = e.facets || {};
    Object.keys(f).forEach(k => { if(f[k]) cnt[k] = (cnt[k] || 0) + 1; });
  });
  return Object.keys(cnt)
    .map(k => ({ key:k, n:cnt[k], uniq:new Set((P.entries||[])
      .map(e => (e.facets||{})[k]).filter(Boolean)).size }))
    /* 값이 전부 다르면 축이 아니라 그냥 메모다 (예: 상세 설명) */
    .filter(a => a.uniq >= 2 && a.uniq <= Math.max(60, a.n * 0.9))
    .sort((a,b) => b.n - a.n);
}

function scopedEntries(P){
  const list = P.entries || [];
  if(anaScope === 'all') return list;
  return list.filter(e => String(e.date || '').slice(0,4) === anaScope);
}

/**
 * 표기가 흔들리는 값을 하나로 본다.
 * "도장 및 기타피막처리업" / "도장및기타피막처리업" / "도장 및 기타 피막처리업"은
 * 사람 눈엔 같은 업종인데 그대로 세면 셋으로 흩어진다.
 * 공백·문장부호만 지워서 맞춰보고, 이름은 가장 많이 쓰인 표기를 쓴다.
 */
function normKey(v){
  return String(v).replace(/[\s.,·\-_/()\[\]]/g, '').toLowerCase();
}

let anaMerge = true;
let anaSort = 'count';   // 'count' | 'rate'

/** 축 값별 집계. 중요 표시(적발 등)와 교차해서 비율까지 낸다. */
function facetTally(P, axis){ return facetTallyOn(scopedEntries(P), axis); }

/** 아무 기록 목록에나 쓸 수 있는 판. 보고서는 그 기간 목록을 그대로 넘긴다. */
function facetTallyOn(list, axis){
  const map = {};
  let total = 0, flagged = 0, blank = 0;

  list.forEach(e => {
    const v = (e.facets || {})[axis];
    total++;
    if(e.important) flagged++;
    if(!v){ blank++; return; }
    const k = anaMerge ? normKey(v) : v;
    const m = map[k] || (map[k] = { value:v, n:0, imp:0, spellings:{} });
    m.n++;
    m.spellings[v] = (m.spellings[v] || 0) + 1;
    if(e.important) m.imp++;
  });

  const rows = Object.values(map).sort((a,b) => (b.n - a.n) || (b.imp - a.imp));
  rows.forEach(r => {
    /* 대표 이름은 가장 많이 쓰인 표기 */
    const sp = Object.keys(r.spellings).sort((a,b) => r.spellings[b] - r.spellings[a]);
    r.value = sp[0];
    r.variants = sp.length;
    r.allSpellings = sp;
    r.pct = r.n ? Math.round(r.imp / r.n * 1000)/10 : 0;
  });

  const merged = rows.reduce((a,r) => a + (r.variants > 1 ? r.variants - 1 : 0), 0);

  /* 이 축의 값이 있는 기록이 전부 중요 표시라면, 그 축이 곧 중요 표시의 근거다.
     "위반내용별 적발률 100%"는 당연한 소리라 보여줄 이유가 없다. */
  const isFlagAxis = rows.length > 0 && flagged > 0 && rows.every(r => r.imp === r.n);

  return { rows, total, flagged, blank, merged, isFlagAxis,
           flagPct: total ? Math.round(flagged / total * 1000)/10 : 0 };
}

function anaYears(P){
  return [...new Set((P.entries||[]).map(e => String(e.date||'').slice(0,4)).filter(Boolean))].sort();
}

/** 분석 결과를 문장으로. 이력서·보고서에 그대로 옮길 수 있어야 한다. */
function analysisSentence(P, axis){
  const t = facetTally(P, axis);
  if(!t.total) return '';
  const period = anaScope === 'all' ? '전체 기간' : anaScope + '년';
  const top = t.rows.slice(0, 3);
  const parts = [];

  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  parts.push(`${period} ${ACT} ${t.total}건`);
  if(t.flagged) parts.push(`${FLAG} ${t.flagged}건(${t.flagPct}%)`);

  if(t.isFlagAxis){
    /* 이 축은 표시된 건에만 있다. 비율 대신 그 안의 분포를 말한다. */
    parts.push(`${axis} 분포 — ` + top.map(r => `${r.value} ${r.n}건`).join(', '));
    return parts.join('. ') + '.';
  }

  if(top.length) parts.push(`${axis} 상위 — ` + top.map(r =>
    `${r.value} ${r.n}건${r.imp ? `(${r.imp}건 ${r.pct}%)` : ''}`).join(', '));

  /* 비율이 높은 쪽은 건수 상위와 다를 수 있다. 그게 더 쓸모 있는 정보다. */
  const risky = t.rows.filter(r => r.n >= Math.max(3, t.total * 0.02))
                      .sort((a,b) => b.pct - a.pct).slice(0, 2);
  if(risky.length && risky[0].pct > t.flagPct){
    parts.push(`비율이 높은 ${axis} — ` + risky.map(r => `${r.value} ${r.pct}%`).join(', '));
  }
  return parts.join('. ') + '.';
}

/* ---------- 뷰 ---------- */

      '직접 입력한 기록은 아직 축이 없습니다.',

  const t = facetTally(P, anaAxis);
  const years = anaYears(P);
  const max = Math.max(1, ...t.rows.map(r => r.n));
  /* 건수순만 보면 "많이 한 것"만 보인다.
     "잘 된 것"을 보려면 비율순이 필요하다 — 둘은 다른 질문이다. */
  const sorted = anaSort === 'rate' && !t.isFlagAxis
    ? t.rows.slice().sort((a, b) => (b.pct - a.pct) || (b.n - a.n))
    : t.rows;
  const shown = sorted.slice(0, anaTop);
  const restN = t.rows.slice(anaTop).reduce((a,r) => a + r.n, 0);

      <div class="wk-nav">

    <div class="axis-sw">

        ${anaAxis===a.key?'disabled':''}>${esc(a.key)}<i>${a.uniq}</i></button>`).join('')}
    </div>

    <div class="stat-cards" style="margin:14px 0">
      <div><div class="n">${t.total}</div><div class="k">${anaScope==='all'?'전체':anaScope+'년'} 기록</div></div>
      <div><div class="n">${t.flagged}</div><div class="k">${esc(termOf(P,'flag'))}</div>
        <div class="dl">${t.flagPct}%</div></div>
      <div><div class="n">${t.rows.length}</div><div class="k">${esc(anaAxis)} 종류</div></div>
      ${t.blank ? `<div><div class="n">${t.blank}</div><div class="k">${esc(anaAxis)} 미기재</div></div>` : ''}
    </div>

    ${t.isFlagAxis ? '' : `<div class="wk-nav" style="margin:0 0 10px">
      <span class="hint" style="margin-right:6px">정렬</span>
      <button class="btn sm" data-anasort="count" ${anaSort==='count'?'disabled':''}>많이 한 순</button>
      <button class="btn sm" data-anasort="rate" ${anaSort==='rate'?'disabled':''}>${
        esc(termOf(P,'flag'))}율 높은 순</button>
    </div>`}

    <div class="frow head">
      <div>${esc(anaAxis)}</div><div class="num">건수</div><div></div>
      <div class="num">${t.isFlagAxis ? '' : esc(termOf(P,'flag'))}</div>
      <div class="num">${t.isFlagAxis ? '비중' : `비율 <em>평균 ${t.flagPct}%</em>`}</div>
    </div>
    ${shown.map(r => `<div class="frow">
      <div class="fv">${esc(r.value)}${r.variants > 1
        ? `<em title="${esc(r.allSpellings.join(' / '))}">표기 ${r.variants}종</em>` : ''}</div>
      <div class="num mono">${r.n}</div>
      <div class="fbar">
        <i style="width:${Math.round(r.n/max*100)}%"></i>
        ${r.imp ? `<b style="width:${Math.round(r.imp/max*100)}%"></b>` : ''}
      </div>
      <div class="num mono">${t.isFlagAxis ? '' : (r.imp || '—')}</div>
      <div class="num mono ${!t.isFlagAxis && r.pct > t.flagPct && r.imp ? 'hot' : ''}">${
        t.isFlagAxis ? Math.round(r.n / (t.flagged || 1) * 1000)/10 + '%'
        : (r.imp ? r.pct + '%' : '—')}</div>
    </div>`).join('')}
    ${restN ? `<div class="frow rest">
      <div class="fv">그 외 ${t.rows.length - anaTop}종</div>
      <div class="num mono">${restN}</div><div></div>
      <div class="num mono">${restImp || '—'}</div>

  </div>

  <div class="panel">

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn primary" id="btnAnaCopy">복사</button>
      <button class="btn" id="btnAnaPromote">이 분석을 성과로</button>
    </div>
    <p class="hint" style="margin-top:10px">보고서나 이력서에 그대로 옮길 수 있는 형태입니다.
      숫자는 전부 기록에서 나온 것이고, 없는 값은 넣지 않습니다.</p>
  </div>`;
}

/** 분석 결과를 성과로. 상위 항목이 지표가 된다. */
function promoteAnalysis(P, axis){
  const t = facetTally(P, axis);
  if(!t.total) return null;
  const period = anaScope === 'all' ? '전체 기간' : anaScope + '년';

  const metrics = [];
  if(t.flagged) metrics.push({ name:termOf(P,'flag'), before:null, after:t.flagged, unit:'건',
                               delta: t.flagPct + '%' });
  metrics.push({ name:axis + ' 종류', internal:true, before:null, after:t.rows.length, unit:'종', delta:null });
  t.rows.slice(0, 3).forEach(r => metrics.push({
    name: axis + ' · ' + r.value, before:null, after:r.n, unit:'건',
    delta: r.imp ? `${r.imp}건 ${r.pct}%` : null }));

  const a = {
    id: nextId(P.achievements, 'ach'),
    experienceId: dominantExperience(P, scopedEntries(P)),
    date: anaScope === 'all' ? unmi(nowMi()) : anaScope + '-12',
    title: `${period} ${termOf(P,'activity')} ${t.total}건 — ${axis}별 정리`,
    situation:null, task:null,
    action: `${period} ${termOf(P,'activity')} ${t.total}건 수행` +
            (t.flagged ? `, ${termOf(P,'flag')} ${t.flagged}건(${t.flagPct}%)` : '') +
            ' — ' + t.rows.slice(0,3).map(r => r.value).join('·') + ' 중심',
    result: analysisSentence(P, axis),
    metrics,
    scope:{ teamSize:null, role:null, budget:null },
    skillIds: [...new Set(scopedEntries(P).reduce((acc,e) => acc.concat(e.skillIds||[]), []))],
    evidence: [{ sourceId:'analysis:' + axis + ':' + anaScope,
                 quote: analysisSentence(P, axis),
                 location: period + ' · ' + t.total + '건 집계' }],
    confidence:'stated', userEdited:true
  };
  P.achievements.push(a);
  return a;
}

/* ============================================================

function applyPreset(P, id){
  const p = JOB_PRESETS.find(x => x.id === id);
  if(!p) return null;
  P.profile.terms = Object.assign({}, p.terms);
  /* 이미 쓰던 축은 지우지 않는다. 프리셋은 출발점일 뿐이다. */
  const keep = (P.profile.axes || []).filter(a => !p.axes.includes(a));
  P.profile.axes = p.axes.concat(keep);
  P.profile.userEdited = true;
  return p;
}

function getPath(obj, path){
  return path.split('.').reduce((o,k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val){
  const ks = path.split('.');
  let o = obj;
  for(let i = 0; i < ks.length - 1; i++){ if(o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks[ks.length-1]] = val;
}

const Modal = {
  kind:null, id:null,

  open(kind, id){
    /* 없는 폼 이름으로 부르면 여기서 죽는다.
       화면 하나가 아니라 앱 전체가 멈추므로 반드시 막는다. */
    if(!FORMS[kind]){
      toast('아직 만들지 않은 화면입니다 (' + kind + ')');
      return;
    }
    this.kind = kind; this.id = id || null;
    const spec = FORMS[kind];
    const P = App.P;
    const item = spec.single ? P.profile
      : (id ? P[kind].find(x => x.id === id) : {});

    const body = spec.fields.map(f => f.section
      ? `<div class="span2 fsection"><b>${esc(f.section)}</b>${f.hint ? `<span>${esc(f.hint)}</span>` : ''}</div>`
      : this.field(f, item, P)).join('');
    const host = document.getElementById('modal');
    host.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(spec.title)}">
      <div class="sheet-head">
        <h3>${esc(spec.title)}${!spec.single ? (id ? ' 편집' : ' 추가') : ''}</h3>
        <button class="btn ghost" id="mClose" aria-label="닫기">×</button>
      </div>
      ${spec.subtitle ? `<p class="hint" style="margin:0 0 14px">${esc(spec.subtitle)}</p>` : ''}
      <div class="grid2">${body}</div>
      <div class="sheet-foot">
        ${kind === 'profile' ? `<button class="btn" id="btnDraftSummary">요약 초안 만들기</button>`
          : (!spec.single && id) ? `<button class="btn danger" id="mDel">삭제</button>` : '<span></span>'}
        <div style="display:flex;gap:8px">
          <button class="btn" id="mCancel">취소</button>
          <button class="btn primary" id="mSave">저장</button>
        </div>
      </div>
    </div>`;
    host.classList.add('on');
    setTimeout(() => { const f = host.querySelector('input,textarea,select'); if(f) f.focus(); }, 30);
  },

  field(f, item, P){
    const id = 'm-' + f.k.replace(/\./g,'-');
    const v = getPath(item, f.k);
    const hint = f.hint ? `<span class="fhint">${esc(f.hint)}</span>` : '';
    let input;

    switch(f.type){
      case 'textarea':
        input = `<textarea id="${id}" data-fk="${f.k}" rows="${f.rows||3}">${esc(v||'')}</textarea>`; break;
      case 'lines':
        input = `<textarea id="${id}" data-fk="${f.k}" data-t="lines" rows="${f.rows||3}">${esc((v||[]).join('\n'))}</textarea>`; break;
      case 'csv':
        input = `<input id="${id}" data-fk="${f.k}" data-t="csv" value="${esc((v||[]).join(', '))}">`; break;
      case 'check':
        input = `<label class="chk"><input type="checkbox" id="${id}" data-fk="${f.k}" data-t="bool" ${v?'checked':''}> 예</label>`; break;
      case 'select':
        input = `<select id="${id}" data-fk="${f.k}">${f.options.map(o =>
          `<option value="${esc(o)}" ${v===o?'selected':''}>${esc(f.display ? (f.display[o]||o) : (o||'— 선택 —'))}</option>`).join('')}</select>`; break;
      case 'month':
        input = `<input id="${id}" data-fk="${f.k}" data-t="month" value="${esc(v||'')}" placeholder="2024-08" inputmode="numeric">`; break;
      case 'day':
        input = `<input id="${id}" data-fk="${f.k}" data-t="day" value="${esc(v||'')}" placeholder="2026-08-06" inputmode="numeric">`; break;
      case 'num':
        input = `<input id="${id}" data-fk="${f.k}" data-t="num" type="number" step="0.5" min="0" value="${v==null?'':esc(v)}">`; break;
      case 'pickOneExp':
        input = `<select id="${id}" data-fk="${f.k}"><option value="">— 없음 —</option>${P.experiences.map(e =>
          `<option value="${e.id}" ${v===e.id?'selected':''}>${esc(e.org)}${e.title?' · '+esc(e.title):''}</option>`).join('')}</select>`; break;
      case 'pickSkill':
        input = `<div class="chips" data-fk="${f.k}" data-t="ids">${P.skills.map(sk =>
          `<label class="chip"><input type="checkbox" value="${sk.id}" ${(v||[]).includes(sk.id)?'checked':''}>
            ${esc(sk.name)}</label>`).join('') ||
          '<span class="hint">역량 탭에서 먼저 등록하세요</span>'}</div>`; break;
      case 'pickExp':
        input = `<div class="chips" data-fk="${f.k}" data-t="ids">${P.experiences.map(e =>
          `<label class="chip"><input type="checkbox" value="${e.id}" ${(v||[]).includes(e.id)?'checked':''}>
            ${esc(e.org)}${e.title?' · '+esc(e.title):''}</label>`).join('') ||
          '<span class="hint">먼저 경력을 등록하세요</span>'}</div>`; break;
      default:
        input = `<input id="${id}" data-fk="${f.k}" value="${esc(v==null?'':v)}">`;
    }
    return `<div class="fld span${f.w||1}">
      <label for="${id}">${esc(f.label)}${f.required?' <b style="color:var(--seal)">*</b>':''}</label>
      ${input}${hint}</div>`;
  },

  collect(){
    const spec = FORMS[this.kind];
    const out = {};
    document.querySelectorAll('#modal [data-fk]').forEach(n => {
      const k = n.dataset.fk, t = n.dataset.t;
      let v;
      if(t === 'ids'){
        v = [...n.querySelectorAll('input:checked')].map(c => c.value);
      } else if(t === 'bool'){
        v = n.checked;
      } else if(t === 'lines'){
        v = n.value.split('\n').map(s => s.trim()).filter(Boolean);
      } else if(t === 'csv'){
        v = n.value.split(',').map(s => s.trim()).filter(Boolean);
      } else if(t === 'month'){
        v = normMonth(n.value);
      } else if(t === 'day'){
        v = normYmd(n.value);
      } else if(t === 'num'){
        v = n.value.trim() === '' ? null : Number(n.value);
      } else {
        v = n.value.trim();
        if(v === '') v = null;
      }
      setPath(out, k, v);
    });
    return { spec, data: out };
  },

  save(){
    const { spec, data } = this.collect();
    const P = App.P;

    const bad = spec.fields.find(f => f.k && f.required && !getPath(data, f.k));
    if(bad){ toast(bad.label + ' 은(는) 비울 수 없습니다'); return; }

    if(spec.single){
      Object.keys(data).forEach(k => {
        if(k === 'contact') Object.assign(P.profile.contact, data.contact);
        else P.profile[k] = data[k];
      });
      P.profile.userEdited = true;
    } else if(this.id){
      const item = P[this.kind].find(x => x.id === this.id);
      Object.assign(item, data);
      item.userEdited = true;
      if(item.confidence === 'inferred') item.confidence = 'stated';
    } else {
      const item = Object.assign(blank(this.kind), data,
        { id: nextId(P[this.kind], spec.prefix), userEdited:true });
      P[this.kind].push(item);
    }

    /* 날짜가 어긋나면 저장은 하되 바로 알려준다. 조용히 넘기면 타임라인이 이상해진다. */
    if(this.kind === 'experiences'){
      const it = P.experiences[P.experiences.length-1];
      const s = mi(data.start), e = mi(data.end);
      if(s !== null && e !== null && e < s) toast('종료가 시작보다 빠릅니다 — 확인하세요');
      else if(s !== null && s > nowMi()) toast('시작이 미래로 되어 있습니다 — 확인하세요');
    }

    App.touch(); this.close(); App.render();
    toast('저장했습니다');
  },

  remove(){
    const spec = FORMS[this.kind], P = App.P;
    const item = P[this.kind].find(x => x.id === this.id);
    const name = spec.label ? spec.label(item) : this.id;

    /* 경력을 지우면 딸린 성과가 갈 곳을 잃는다. 미리 말해준다. */
    let extra = '';
    if(this.kind === 'experiences'){
      const n = P.achievements.filter(a => a.experienceId === this.id).length;
      if(n) extra = `\n\n이 경력에 달린 성과 ${n}건은 지워지지 않고 "소속 없음"으로 남습니다.`;
    }
    if(!confirm(`"${name}"을(를) 지웁니다.${extra}\n\n되돌리려면 변경 이력에서 이전 저장점을 불러오세요.`)) return;

    P[this.kind] = P[this.kind].filter(x => x.id !== this.id);
    App.touch(); this.close(); App.render();
    toast('지웠습니다');
  },

  close(){
    const host = document.getElementById('modal');
    host.classList.remove('on'); host.innerHTML = '';
    this.kind = null; this.id = null;
  }
};

/** "2024.8", "24-8", "2024년 8월" 같은 입력을 YYYY-MM으로 맞춘다. */
/**
 * 사람이 적은 날짜를 YYYY-MM으로.
 * 연도만 적힌 경우를 따로 다뤄야 한다. 안 그러면 "2023"에서
 * 정규식이 되돌아가며 "202"+"3"으로 쪼개 2023년이 202년이 된다 — 실제로 그랬다.
 */
function normMonth(s){
  s = String(s || '').trim();
  if(!s) return null;
  const mo = v => pad(Math.min(12, Math.max(1, +v)));

  let m = /^(\d{4})\s*[-./년]\s*(\d{1,2})\b/.exec(s);
  if(m) return m[1] + '-' + mo(m[2]);

  m = /^(\d{2})\s*[-./]\s*(\d{1,2})\b/.exec(s);
  if(m){ const y = +m[1]; return (y + (y > 60 ? 1900 : 2000)) + '-' + mo(m[2]); }

  m = /(^|\D)(\d{4})\s*년/.exec(s);
  if(m){
    const mm = /년\s*(\d{1,2})\s*월/.exec(s);
    return m[2] + '-' + (mm ? mo(mm[1]) : '01');
  }

  m = /^(\d{4})\b/.exec(s);          // 연도만 적은 경우
  if(m) return m[1] + '-01';
  return null;
}

function blank(kind){
  const base = { userEdited:true, sourceIds:[] };
  if(kind === 'experiences') return Object.assign(base, {

  if(kind === 'publications') return Object.assign(base, {

/* ============================================================
   경력자용 항목
   취준생 이력관리와 경력자 이력관리는 필요한 게 다르다.
   스펙·대외활동이 아니라 처우 이력 · 관리 규모 · 이직 사유 ·
   레퍼런스가 협상 재료다.

   처우는 이 앱에서 가장 민감한 데이터다. 그래서:
   - 이 기기 밖으로 나가지 않는다 (서버 전송 코드가 없다)
   - 내보내기에서 기본 제외된다. 포함하려면 따로 골라야 한다
   - 헤드헌터 전달용 이력서에는 어떤 경우에도 들어가지 않는다
   ============================================================ */

/* ---------- 금액 표기 ---------- */
/** 만원 단위로 받는다. 국내 연봉 이야기는 "5,200만원"이 기본 단위다. */
function fmtMan(v){
  if(v == null || v === '' || !isFinite(Number(v))) return '—';
  const n = Number(v);
  if(n >= 10000){
    const eok = Math.floor(n / 10000), man = n % 10000;
    return eok + '억' + (man ? ' ' + man.toLocaleString() + '만' : '');
  }
  return n.toLocaleString() + '만';
}
function compTotal(c){
  const n = x => (x == null || x === '' || !isFinite(Number(x))) ? 0 : Number(x);
  return n(c.base) + n(c.bonus) + n(c.other);
}

/* ---------- 처우 이력 계산 ---------- */
function compSeries(P){
  return (P.compensation || []).slice()
    .filter(c => mi(c.effective) !== null)
    .sort((a,b) => mi(a.effective) - mi(b.effective))
    .map(c => Object.assign({}, c, { total: compTotal(c) }));
}

/** 연평균 상승률(CAGR). 계산 근거가 분명한 숫자라서 협상 자리에서 쓸 수 있다. */
function compGrowth(series){
  const pts = series.filter(c => c.total > 0);
  if(pts.length < 2) return null;
  const a = pts[0], b = pts[pts.length - 1];
  const months = mi(b.effective) - mi(a.effective);
  if(months < 12) return null;
  const years = months / 12;
  const cagr = Math.pow(b.total / a.total, 1 / years) - 1;
  return {
    from: a, to: b, years: Math.round(years * 10) / 10,
    totalPct: Math.round((b.total / a.total - 1) * 1000) / 10,
    cagrPct: Math.round(cagr * 1000) / 10
  };
}

function viewComp(P){
  const series = compSeries(P);
  const g = compGrowth(series);

  const warn = `<div class="notice seal">
    <b>처우 정보는 이 브라우저에만 저장됩니다.</b>
    서버로 보내는 코드가 없습니다. 내보내기에서도 기본 제외되며,
    포함하려면 <span class="mono">내보내기 › 처우 포함</span>을 따로 골라야 합니다.
    헤드헌터 전달용 이력서에는 어떤 경우에도 들어가지 않습니다.
    공용 컴퓨터라면 다 쓰고 <span class="mono">이 기기에서 지우기</span>를 누르세요.
  </div>`;

  if(!series.length){
    return warn + emptyState('처우 이력이 없습니다',
      '연봉·성과급 변동을 시점별로 남겨두면 이직 협상에서 근거가 됩니다. 총액만 적어도 됩니다.',
      '<button class="btn primary" data-add="compensation">처우 기록 추가</button>');
  }

  const rows = series.slice().reverse().map((c, i, arr) => {
    const prev = arr[i + 1];
    const diff = prev && prev.total ? (c.total / prev.total - 1) * 100 : null;
    const exp = P.experiences.find(e => e.id === c.experienceId);
    return `<div class="crow">
      <div class="mono">${fmtYm(c.effective)}</div>
      <div>${exp ? esc(exp.org) + (exp.title ? ' · ' + esc(exp.title) : '') : (c.note ? esc(c.note) : '—')}
        ${c.kind && c.kind !== '연봉조정' ? `<span class="pill">${esc(c.kind)}</span>` : ''}</div>
      <div class="mono num">${fmtMan(c.base)}</div>
      <div class="mono num">${c.bonus ? fmtMan(c.bonus) : '—'}</div>
      <div class="mono num strong">${fmtMan(c.total)}</div>
      <div class="mono num ${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${
        diff === null ? '—' : (diff > 0 ? '+' : '') + (Math.round(diff * 10) / 10) + '%'}</div>
      <div><button class="btn ghost sm" data-edit="compensation" data-eid="${c.id}">편집</button></div>
    </div>`;
  }).join('');

  const summary = g ? `<div class="stat-cards" style="margin-bottom:16px">
      <div><div class="n">${fmtMan(g.to.total)}</div><div class="k">최근 총액 (${fmtYm(g.to.effective)})</div></div>
      <div><div class="n">${g.totalPct > 0 ? '+' : ''}${g.totalPct}%</div><div class="k">${g.years}년간 누적 변동</div></div>
      <div><div class="n">${g.cagrPct > 0 ? '+' : ''}${g.cagrPct}%</div><div class="k">연평균 상승률 (CAGR)</div></div>
      <div><div class="n">${series.length}</div><div class="k">기록 시점</div></div>
    </div>` : `<p class="hint" style="margin-bottom:14px">시점이 2개 이상이고 1년 이상 간격이 되면
      누적 변동과 연평균 상승률이 계산됩니다.</p>`;

  return warn + `<div class="panel">
    <div class="wk-head">
      <h2 class="sec" style="margin:0">처우 이력</h2>
      <div class="wk-nav"><button class="btn sm" data-add="compensation">시점 추가</button></div>
    </div>
    ${summary}
    ${series.length > 1 ? chartComp(series) : ''}
    <div class="crow head">
      <div>시점</div><div>소속 · 직함</div><div class="num">기본급</div>
      <div class="num">성과급</div><div class="num">총액</div><div class="num">전기 대비</div><div></div>
    </div>
    ${rows}
    <p class="hint" style="margin-top:12px">단위는 만원입니다. 연평균 상승률은
      첫 시점과 마지막 시점의 총액으로만 계산합니다 — 중간 값을 섞어 좋게 보이도록 만들지 않습니다.</p>
  </div>`;
}

function chartComp(series){
  const W = Math.max(620, series.length * 92), H = 190;
  const L = 62, R = 16, T = 16, B = 30;
  const max = Math.max(...series.map(c => c.total)) * 1.15 || 1;
  const x = i => L + (W - L - R) * (series.length === 1 ? 0.5 : i / (series.length - 1));
  const y = v => T + (H - T - B) * (1 - v / max);

  let g = '';
  for(let i = 0; i <= 3; i++){
    const v = max * i / 3, yy = y(v);
    g += `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#E4EAED"/>
          <text x="${L-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="#6B7A85"
            style="font-family:ui-monospace,monospace">${fmtMan(Math.round(v))}</text>`;
  }
  const pts = series.map((c,i) => `${x(i)},${y(c.total)}`).join(' ');
  g += `<polyline points="${pts}" fill="none" stroke="#0F5F57" stroke-width="2"/>`;
  series.forEach((c,i) => {
    g += `<g><title>${fmtYm(c.effective)} · ${fmtMan(c.total)}</title>
          <circle cx="${x(i)}" cy="${y(c.total)}" r="4" fill="#fff" stroke="#0F5F57" stroke-width="2"/></g>
          <text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="#6B7A85"
            style="font-family:ui-monospace,monospace">${esc(fmtYm(c.effective))}</text>`;
  });
  return `<div class="tl-scroll"><div class="tl"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
    role="img" aria-label="처우 추이">${g}</svg></div></div>`;
}

/* ---------- 관리 규모 ---------- */
/** 경력자 이력서에서 가장 강한 한 줄. 없는 숫자는 만들지 않는다. */
function scaleLine(e){
  const s = e.scale || {};
  const bits = [];
  if(s.directReports) bits.push('직접 보고 ' + s.directReports + '명');
  if(s.totalOrg)      bits.push('조직 ' + s.totalOrg + '명');
  if(s.budgetMan)     bits.push('예산 ' + fmtMan(s.budgetMan));
  if(s.revenueMan)    bits.push('매출 책임 ' + fmtMan(s.revenueMan));
  if(s.note)          bits.push(s.note);
  return bits.join(' · ');
}

/* ---------- 경력 요약 초안 ---------- */
/**
 * 저장된 사실만 이어 붙인다. 형용사를 붙이지 않는다.
 * "탁월한", "풍부한" 같은 말은 읽는 사람이 판단할 몫이다.
 */
function draftExecutiveSummary(P){
  const parts = [];
  const months = totalMonths(P.experiences);
  if(!months) return '';

  const head = P.profile.headline ? P.profile.headline + ' ' : '';
  parts.push(`${head}총 경력 ${fmtDur(months)}.`);

  /* 도메인은 근거가 있는 순으로 둘까지 */
  const dom = P.skills.filter(s => (s.category||'') === 'domain')
    .map(s => ({ s, st: skillStats(P, s) }))
    .sort((a,b) => (b.st.evidenceCount - a.st.evidenceCount) || (b.st.months - a.st.months))
    .slice(0, 2);
  if(dom.length) parts.push(dom.map(x => `${x.s.name} ${fmtDur(x.st.months)}`).join(', ') + '.');

  const maxOrg = Math.max(0, ...P.experiences.map(e => (e.scale && e.scale.totalOrg) || 0));
  const maxRep = Math.max(0, ...P.experiences.map(e => (e.scale && e.scale.directReports) || 0));
  if(maxOrg) parts.push(`최대 조직 ${maxOrg}명 총괄.`);
  else if(maxRep) parts.push(`최대 ${maxRep}명 직접 관리.`);

  const pubs = (P.publications||[]).length;
  if(pubs) parts.push(`저서·논문 ${pubs}건.`);

  /* 본업 밖 활동이 많은 사람은 그게 이력의 절반이다. 요약에서 빠지면 안 된다. */
  const pj = P.projects || [];
  if(pj.length >= 3){
    const g = {};
    pj.forEach(x => { const k = x.kind || '활동'; g[k] = (g[k]||0) + 1; });
    parts.push(Object.keys(g).sort((a,b) => g[b]-g[a]).slice(0,3)
      .map(k => `${k} ${g[k]}건`).join(', ') + '.');
  }

  /* 실적은 기록에서 뽑는다.
     "정리된 성과 7건, 출처 7건" 같은 앱 내부 상태를 요약에 쓰면 안 된다 —
     그건 읽는 사람에게 아무 뜻이 없다. */
  const t = tally(P.entries || []);
  if(t.count){
    const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
    const bits = [`${ACT} ${t.count}건`];
    if(t.important) bits.push(`${FLAG} ${t.important}건(${Math.round(t.important/t.count*1000)/10}%)`);
    if(t.lectures) bits.push(`강의 ${t.lectures}회${t.audience ? ` 수강 ${t.audience}명` : ''}`);
    parts.push(bits.join(' · ') + '.');

    /* 무엇을 다뤘는지 — 축이 있으면 그게 가장 구체적이다 */
    if(typeof facetAxes === 'function'){
      const ax = facetAxes(P).filter(a => !facetTallyOn(P.entries, a.key).isFlagAxis)[0];
      if(ax){
        const ft = facetTallyOn(P.entries, ax.key);
        const top = ft.rows.slice(0, 3).map(r => r.value);
        if(top.length) parts.push(`주요 ${ax.key}: ${top.join(', ')}.`);
      }
    }
  }
  return parts.join(' ');
}

/* ---------- 레퍼런스 ---------- */
function referenceRows(P){
  const list = P.references || [];
  if(!list.length) return `<p class="hint" style="margin:0">
    경력자 채용에서는 레퍼런스 체크가 표준 절차입니다. 누구에게 부탁할지 미리 정리해 두면
    급하게 연락처를 찾느라 헤매지 않습니다.</p>`;

  return list.map(r => `<div class="roster-row">
    <div class="per">${esc(r.relation || '관계 미기재')}</div>
    <div class="who"><b>${esc(r.name || '(이름 없음)')}</b>
      ${r.org ? ` <em>/ ${esc(r.org)}${r.title ? ' ' + esc(r.title) : ''}</em>` : ''}
      ${r.contactable === '가능' ? '<span class="pill ok">연락 가능</span>'
        : r.contactable === '불가' ? '<span class="pill seal">연락 불가</span>'
        : '<span class="pill">미확인</span>'}</div>
    <div class="dur"><button class="btn ghost sm" data-edit="references" data-eid="${r.id}">편집</button></div>
  </div>`).join('');
}

/* ---------- 증빙 상태 ---------- */
function proofSummary(P){
  const rows = P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0));
  if(!rows.length) return '';
  const mark = v => v === '보유' ? '<span class="pill ok">보유</span>'
                  : v === '발급가능' ? '<span class="pill">발급 가능</span>'
                  : v === '불가' ? '<span class="pill seal">어려움</span>'
                  : '<span class="pill">미확인</span>';
  return rows.map(e => {
    const p = e.proof || {};
    return `<div class="roster-row">
      <div class="per">${fmtYm(e.start)} – ${e.isCurrent ? '현재' : fmtYm(e.end)}</div>
      <div class="who"><b>${esc(e.org)}</b>
        경력증명 ${mark(p.employmentCert)} · 원천징수 ${mark(p.payslip)}</div>
      <div class="dur"><button class="btn ghost sm" data-edit="experiences" data-eid="${e.id}">편집</button></div>
    </div>`;
  }).join('');
}


/* ===== 08c-smog.js ===== */
/* ============================================================
   스모그 지수
   책 제목이 말하는 상태 — "열심히 일하는데 앞이 보이지 않는" —
   를 그대로 재는 화면이다.

   중요한 전제: 이건 사람의 커리어 가치를 매기는 점수가 아니다.
   기록이 얼마나 또렷한지를 잴 뿐이다. 같은 경력이라도
   기록이 흐리면 이력서에서 흐리게 보인다. 그걸 보여주는 것이다.

   여섯 축 전부 계산식이 한 줄로 설명된다.
   근거를 설명할 수 없는 숫자는 이 앱에서 만들지 않는다.
   ============================================================ */

const SMOG_GRADES = [
  [80, '맑음',      '#2F6B4F'],
  [60, '옅은 안개',  '#3F6B70'],
  [40, '보통',      '#8A6A1F'],
  [20, '짙음',      '#B4562A'],
  [0,  '매우 짙음',  '#B23A2E']
];

function smogGrade(v){
  return SMOG_GRADES.find(g => v >= g[0]) || SMOG_GRADES[SMOG_GRADES.length - 1];
}
function pct(n, d){ return d > 0 ? Math.round(n / d * 100) : 0; }

/** 여섯 축. 각 축은 값(0~100) · 근거 문장 · 다음에 할 일을 함께 돌려준다. */
function smogAxes(P){
  const A = P.achievements || [], E = P.experiences || [], N = P.entries || [];
  const months = totalMonths(E);
  const out = [];

  /* 1. 사실 밀도 — 경력 6개월당 성과 1건을 기준선으로 본다.
        절대 기준이 아니라 "이 정도는 남아 있어야 이력서를 쓸 수 있다"는 실무 감각이다. */
  const expected = Math.max(1, Math.round(months / 6));
  out.push({
    key:'density', label:'사실 밀도',
    value: Math.min(100, pct(A.length, expected)),
    basis: `경력 ${fmtDur(months)} · 성과 ${A.length}건 (6개월당 1건을 기준선으로 봄, 기준 ${expected}건)`,
    todo: A.length < expected
      ? `성과 ${expected - A.length}건이 더 있어야 기준선입니다. 주간 기록에서 올리거나 직접 넣으세요.`
      : null,
    goto: 'ach'
  });

  /* 2. 수치 근거 */
  const withMetric = A.filter(a => (a.metrics||[]).length).length;
  out.push({
    key:'metric', label:'수치 근거',
    value: pct(withMetric, A.length || 1),
    basis: `성과 ${A.length}건 중 수치가 붙은 것 ${withMetric}건`,
    todo: A.length && withMetric < A.length
      ? `수치 없는 성과 ${A.length - withMetric}건. 없으면 비워두되, 기억나는 건 채우세요.` : null,
    goto: 'ach'
  });

  /* 3. 출처 */
  const withEv = A.filter(a => (a.evidence||[]).length).length;
  out.push({
    key:'evidence', label:'출처',
    value: pct(withEv, A.length || 1),
    basis: `성과 ${A.length}건 중 출처 문서·기록이 연결된 것 ${withEv}건`,
    todo: A.length && withEv < A.length
      ? `출처 없는 성과 ${A.length - withEv}건. 면접에서 물으면 근거를 대야 합니다.` : null,
    goto: 'ach'
  });

  /* 4. 최신성 — 최근 3개월 안에 기록이 있으면 100, 12개월 넘으면 0 */
  const lastIdx = Math.max(
    ...A.map(a => mi(a.date)).filter(x => x !== null),
    ...N.map(e => mi(String(e.date||'').slice(0,7))).filter(x => x !== null),
    -1);
  const gapM = lastIdx < 0 ? 99 : (nowMi() - lastIdx);
  out.push({
    key:'fresh', label:'최신성',
    value: lastIdx < 0 ? 0 : Math.max(0, Math.min(100, Math.round((12 - Math.max(0, gapM - 3)) / 12 * 100))),
    basis: lastIdx < 0 ? '기록이 없습니다'
      : `마지막 기록이 ${gapM === 0 ? '이번 달' : gapM + '개월 전'} (${unmi(lastIdx).replace('-','.')})`,
    todo: gapM > 3 ? '이번 주에 한 일부터 기록하세요. 쌓이는 속도가 곧 가시도입니다.' : null,
    goto: 'log'
  });

  /* 5. 증빙 */
  const proofOk = E.filter(e => {
    const p = e.proof || {};
    return p.employmentCert === '보유' || p.employmentCert === '발급가능';
  }).length;
  out.push({
    key:'proof', label:'증빙',
    value: pct(proofOk, E.length || 1),
    basis: `경력 ${E.length}곳 중 경력증명 확보·발급 가능이 확인된 곳 ${proofOk}곳`,
    todo: E.length && proofOk < E.length
      ? `${E.length - proofOk}곳이 미확인입니다. 오래될수록 발급이 까다로워집니다.` : null,
    goto: 'records'
  });

  /* 6. 서사 — 경력 요약 + 이직 사유 + 공백 사유 */
  let narrSlots = 1, narrDone = (P.profile.executiveSummary || P.profile.summary) ? 1 : 0;
  E.forEach((e, i) => {
    if(i === 0 && e.isCurrent) return;          // 재직 중인 곳은 떠난 이유가 없다
    narrSlots++;
    if((e.transition || {}).reasonLeave) narrDone++;
  });
  (P.gaps || []).forEach(g => { narrSlots++; if(g.reason) narrDone++; });
  out.push({
    key:'story', label:'서사',
    value: pct(narrDone, narrSlots),
    basis: `설명이 필요한 지점 ${narrSlots}곳 중 ${narrDone}곳 작성 (경력 요약 · 이직 사유 · 공백 사유)`,
    todo: narrDone < narrSlots
      ? `${narrSlots - narrDone}곳이 비어 있습니다. 면접에서 반드시 묻는 자리입니다.` : null,
    goto: 'timeline'
  });

  return out;
}

function smogScore(P){
  const axes = smogAxes(P);
  return { axes, visibility: Math.round(axes.reduce((s,a) => s + a.value, 0) / axes.length) };
}

/* ---------- 정체 신호 ----------
   판단하지 않는다. 사실만 꺼내 놓고 해석은 본인이 한다.
   "이직하세요" 같은 말을 이 앱이 할 자리는 아니다. */
function stallSignals(P){
  const out = [];
  const E = P.experiences.slice().filter(spanOf).sort((a,b) => spanOf(b)[0] - spanOf(a)[0]);
  const cur = E[0];

  if(cur){
    const held = nowMi() - spanOf(cur)[0];
    if(held >= 48) out.push({ t:'같은 직함 유지', v:fmtDur(held),
      d:`${cur.org} ${cur.title || ''} 시작 이후 직함 변화가 기록되지 않았습니다. 승진·직무 변경이 있었다면 별도 경력으로 나눠 넣으세요.`,
      goto:'timeline' });
  }

  const lastAch = Math.max(-1, ...P.achievements.map(a => mi(a.date)).filter(x => x !== null));
  if(lastAch >= 0 && nowMi() - lastAch >= 12){
    out.push({ t:'최근 성과 공백', v:(nowMi() - lastAch) + '개월',
      d:'마지막으로 정리된 성과가 1년 이상 전입니다. 실제로 없었을 수도, 기록만 안 된 것일 수도 있습니다.',
      goto:'ach' });
  }

  const comp = compSeries(P);
  if(comp.length){
    const gap = nowMi() - mi(comp[comp.length-1].effective);
    if(gap >= 24) out.push({ t:'처우 변동 없음', v:gap + '개월',
      d:'마지막 처우 기록 이후 변동이 남아 있지 않습니다. 조정이 있었다면 기록해 두세요.',
      goto:'comp' });
  }

  /* 최근 2년 안에 처음 쓰기 시작한 역량이 하나도 없으면 신호 */
  const newSkills = P.skills.filter(s => {
    const f = mi(skillStats(P, s).firstUsed);
    return f !== null && (nowMi() - f) < 24;
  });
  if(P.skills.length >= 3 && !newSkills.length){
    out.push({ t:'새 역량 없음', v:'최근 2년',
      d:'최근 2년 안에 새로 시작한 역량이 기록되어 있지 않습니다. AI로 업무가 바뀌는 속도를 생각하면 확인해 볼 지점입니다.',
      goto:'skills' });
  }

  const dormant = P.skills.map(s => ({ s, st:skillStats(P, s) })).filter(x => x.st.dormant);
  if(dormant.length >= 3){
    out.push({ t:'휴면 역량', v:dormant.length + '개',
      d:`${dormant.slice(0,3).map(x => x.s.name).join(', ')}${dormant.length>3?' 외':''} — 18개월 이상 쓰지 않았습니다. 이력서에 그대로 둘지 판단이 필요합니다.`,
      goto:'skills' });
  }
  return out;
}

/* ---------- 뷰 ---------- */
function viewSmog(P){
  const has = P.experiences.length || P.achievements.length || (P.entries||[]).length;
  if(!has) return emptyState('아직 잴 것이 없습니다',
    '경력과 기록이 들어오면 여기서 무엇이 흐린지 보여드립니다.',
    '<button class="btn primary" data-onb="exp">경력 추가</button>');

  const { axes, visibility } = smogScore(P);
  const [, gradeName, gradeTone] = smogGrade(visibility);
  const worst = axes.slice().sort((a,b) => a.value - b.value).filter(a => a.todo);
  const stalls = stallSignals(P);

  return `<div class="panel smog-hero">
    <div class="smog-gauge">
      ${gauge(visibility, gradeTone)}
      <div class="smog-num"><b>${visibility}<i>%</i></b><span>가시도</span></div>
    </div>
    <div class="smog-say">
      <h2 style="color:${gradeTone}">스모그 ${esc(gradeName)}</h2>
      <p>이 숫자는 <b>커리어의 가치가 아니라 기록의 또렷함</b>을 잽니다.
        같은 경력이라도 기록이 흐리면 이력서에서 흐리게 보이고, 면접에서 설명이 막힙니다.
        여섯 축 모두 계산식이 아래에 적혀 있습니다 — 근거를 댈 수 없는 숫자는 만들지 않습니다.</p>
    </div>
  </div>

  <div class="panel">
    <h2 class="sec">무엇이 가리고 있나</h2>
    ${axes.map(a => {
      const [, , tone] = smogGrade(a.value);
      return `<div class="ax">
        <div class="ax-h"><b>${a.label}</b><span style="color:${tone}">${a.value}%</span></div>
        <div class="ax-bar"><i style="width:${a.value}%;background:${tone}"></i></div>
        <div class="ax-b">${esc(a.basis)}</div>
        ${a.todo ? `<div class="ax-t">${esc(a.todo)}
          <button class="btn sm" data-jump="${a.goto}">가기</button></div>` : ''}
      </div>`;
    }).join('')}
  </div>

  ${worst.length ? `<div class="panel">
    <h2 class="sec">지금 가장 효과가 큰 일</h2>
    <ol class="todo-list">${worst.slice(0,3).map(a =>
      `<li><b>${a.label}</b> ${esc(a.todo)}</li>`).join('')}</ol>
    <p class="hint" style="margin:10px 0 0">가장 낮은 축부터 손대는 게 가장 빨리 걷힙니다.</p>
  </div>` : `<div class="panel"><div class="empty">
    <strong>지금 채울 곳이 없습니다</strong>여섯 축 모두 채워져 있습니다. 이 상태를 유지하는 건 주간 기록입니다.</div></div>`}

  ${stalls.length ? `<div class="panel">
    <h2 class="sec">눈여겨볼 신호</h2>
    ${stalls.map(s => `<div class="sig">
      <div class="sig-v">${esc(s.v)}</div>
      <div><b>${esc(s.t)}</b><p>${esc(s.d)}</p></div>
      <button class="btn ghost sm" data-jump="${s.goto}">보기</button>
    </div>`).join('')}
    <p class="hint" style="margin:12px 0 0">신호일 뿐 문제가 아닙니다.
      이 앱은 "이직하세요" 같은 말을 하지 않습니다 — 판단 재료만 드리고 결정은 본인이 합니다.</p>
  </div>` : ''}`;
}

/**
 * 가시도 게이지.
 * 이 앱의 주장은 "기록이 흐리면 이력서도 흐리다"이므로, 게이지도 그 말을 한다.
 * 채워진 만큼은 또렷하고 나머지는 흐리게 번진다 — 안개가 덜 걷힌 자리다.
 * 점수가 낮을수록 번짐이 굵어져서, 숫자를 읽기 전에 눈이 먼저 안다.
 */
function gauge(v, tone){
  const R = 52, C = 2 * Math.PI * R, S = 124;
  const on = C * (v / 100) * 0.75;
  const blur = (1 - v / 100) * 5 + 0.6;      // 흐릴수록 굵게 번진다
  const id = 'gz' + Math.random().toString(36).slice(2, 7);

  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img"
    aria-label="가시도 ${v}퍼센트">
    <defs>
      <filter id="${id}" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="${blur.toFixed(2)}"/>
      </filter>
    </defs>
    <g transform="translate(${S/2},${S/2}) rotate(135)">
      <!-- 아직 안 걷힌 안개 -->
      <circle r="${R}" fill="none" stroke="#D5DAD6" stroke-width="10"
        stroke-dasharray="${C*0.75} ${C}" stroke-linecap="round"/>
      <!-- 걷힌 만큼. 번짐을 깔고 그 위에 또렷한 선을 얹는다 -->
      <circle r="${R}" fill="none" stroke="${tone}" stroke-width="11" opacity=".42"
        stroke-dasharray="${on} ${C}" stroke-linecap="round" filter="url(#${id})"/>
      <circle r="${R}" fill="none" stroke="${tone}" stroke-width="9"
        stroke-dasharray="${on} ${C}" stroke-linecap="round"/>
    </g></svg>`;
}


/* ===== 08d-admin.js ===== */
/* ============================================================
   관리자 모드
   여러 사람의 이력 파일을 한 번에 올려 모아 보는 화면.

   분명히 해둘 것 — 이 잠금은 보안이 아니다.
   코드가 이 파일 안에 들어 있으므로 마음먹고 보는 사람은 본다.
   일반 사용자 화면에서 관리자 기능을 치워두는 가림막일 뿐이다.
   진짜 접근 통제가 필요하면 서버와 로그인이 있어야 한다.

   그리고 이 화면은 남의 이력을 다룬다.
   처우는 기본적으로 가리고, 본인 동의 없이 모으지 않는다는 안내를 항상 띄운다.
   ============================================================ */

const ADMIN_TAP_NEED = 5;      // 로고 5회 연타
const ADMIN_TAP_WINDOW = 3000;

/* 헤드헌팅 파이프라인. 후보가 어디까지 왔는지가 명부의 첫 정보다. */
const STAGES = [
  { id:'',      label:'미분류', tone:'#A9B0B3' },
  { id:'pool',  label:'풀',     tone:'#7C858A' },
  { id:'touch', label:'접촉',   tone:'#6FA894' },
  { id:'review',label:'검토',   tone:'#4E9080' },
  { id:'submit',label:'제안',   tone:'#2E7D70' },
  { id:'iv',    label:'면접',   tone:'#0F5F57' },
  { id:'offer', label:'처우협의', tone:'#0A4640' },
  { id:'done',  label:'성사',   tone:'#1E6E3A' },
  { id:'hold',  label:'보류',   tone:'#8A6A1F' },
  { id:'drop',  label:'종결',   tone:'#B23A2E' }
];
const stageOf = id => STAGES.find(s => s.id === (id || '')) || STAGES[0];

let adminOn = false;
let adminQuery = '';
let adminStage = '';
let adminSort = 'recent';
let adminPicked = new Set();
let adminShowComp = false;
let adminTaps = [];
let roster = [];               // [{ id, label, profile }]

function adminTap(){
  const now = Date.now();
  adminTaps = adminTaps.filter(t => now - t < ADMIN_TAP_WINDOW);
  adminTaps.push(now);
  if(adminTaps.length < ADMIN_TAP_NEED) return false;
  adminTaps = [];
  return true;
}

async function adminCode(adapter){
  return (await adapter.getMeta('adminCode')) || null;
}

/** 명부는 어댑터의 슬롯을 그대로 쓴다. 한 사람 = 한 슬롯. */
async function loadRoster(adapter){
  const out = [];
  const cur = adapter.slot;
  for(const sl of adapter.slots()){
    try {
      adapter.switchSlot(sl.id);
      const raw = await adapter.load();
      if(raw) out.push({ id:sl.id, label:sl.label, updatedAt:sl.updatedAt,
                         stage: sl.stage || '', note: sl.note || '', tags: sl.tags || '',
                         profile: migrate(raw).profile });
    } catch(e){ /* 한 사람이 깨져도 나머지는 봐야 한다 */ }
  }
  adapter.switchSlot(cur);
  return out;
}

function rosterFiltered(){
  let list = roster.slice();
  const q = adminQuery.trim().toLowerCase();
  if(q) list = list.filter(r => {
    const P = r.profile;
    const hay = [P.profile.name, P.profile.headline, r.note, r.tags,
      ...P.experiences.map(e => e.org + ' ' + (e.title||'')),
      ...P.skills.map(s => s.name)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  if(adminStage) list = list.filter(r => (r.stage || '') === adminStage);

  const key = {
    recent: r => -(new Date(r.updatedAt || 0).getTime()),
    name:   r => (r.profile.profile.name || r.label),

/* ---------- 포지션 매칭 ----------
   공고 하나를 전원과 대조한다. 종합점수는 내지 않는다.
   요건별로 누가 강한지·비었는지를 보여주고 판단은 사람이 한다. */
let matchJob = null;

function runMatch(text){
  const reqs = String(text || '').split(/\n+/).map(l => l.trim())
    .filter(l => l.length >= 4 && !/^[-·•*\s]*$/.test(l))
    .map(l => l.replace(/^[-·•*\d.)\s]+/, ''))
    .filter(Boolean).slice(0, 20);
  if(!reqs.length) return null;

  const rows = roster.map(r => ({
    person: r,
    cells: reqs.map(q => suggestMatch(r.profile, q))
  }));
  rows.forEach(x => {
    x.strong = x.cells.filter(c => c.status === 'strong').length;
    x.partial = x.cells.filter(c => c.status === 'partial').length;
  });
  rows.sort((a,b) => (b.strong - a.strong) || (b.partial - a.partial));
  return { reqs, rows };
}
