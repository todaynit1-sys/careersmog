/**
 * 이력서 문서를 만든다.
 * opts.onlyPicked = true 면 이력서 탭에서 고른 성과만 넣는다.
 * 없는 사실은 만들지 않는다. 비어 있는 항목은 그냥 빠진다.
 */
/**
 * 이력서.
 * 용도에 따라 섹션 순서와 분량이 달라진다.
 * 같은 데이터라도 이직·평가·학술은 앞에 놓을 것이 다르다.
 */
function buildResumeDocx(P, opts){
  opts = opts || {};
  const pu = resumePurpose(opts.purpose || 'job');
  const cap = pu.caps;
  const pr = P.profile || {};
  const body = [];
  const H1 = t => body.push(p(t, 'Heading1'));

  /* ---- 머리 ---- */
  body.push(p(pr.name || '(이름 미입력)', 'Title'));
  if(pr.headline) body.push(p(pr.headline, 'Subtitle'));
  const c = pr.contact || {};
  const contact = opts.noContact
    ? (c.location || '')
    : [c.email, c.phone, c.location].filter(Boolean).join('  ·  ');
  if(contact) body.push(p(contact, 'Meta'));
  if(pr.totalMonths) body.push(p('총 경력 ' + fmtDur(pr.totalMonths), 'Meta'));

  const SEC = {};

  SEC.summary = () => {
    const sum = pr.executiveSummary || pr.summary;
    if(!sum) return;
    H1('경력 요약');
    body.push(p(sum));
    if(pr.executiveSummary && pr.summary && pr.summary !== pr.executiveSummary)
      body.push(p(pr.summary));
  };

  SEC.perf = () => {
    const pb = perfBlock(P);
    if(!pb) return;
    H1('실적 요약');
    body.push(tbl(pb.rows, [3000, 3200], { num:[1] }));
    if(pb.byYear) body.push(tbl(pb.byYear, [1400, 1600, 1600], { num:[1,2] }));
    pb.axes.forEach(a => body.push(p([
      { t:a.axis + `(${a.kinds}종)   `, b:true }, { t:a.top }
    ], 'Meta', { indent:200, hanging:200 })));
  };

  SEC.career = () => {
    if(!P.experiences.length) return;
    H1('경력');
    P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0))
      .forEach((e, i) => {
        const sp = spanOf(e);
        body.push(p(`${e.org}${e.team ? ' · ' + e.team : ''}${e.title ? ' · ' + e.title : ''}`, 'Heading2'));
        body.push(p(`${fmtYm(e.start)} – ${e.isCurrent ? '현재' : fmtYm(e.end)}` +
          (sp ? `  (${fmtDur(sp[1]-sp[0]+1)})` : '') +
          (e.employmentType && e.employmentType !== '정규직' ? '  · ' + e.employmentType : ''), 'Meta'));
        const sc = scaleLine(e);
        if(sc) body.push(p(sc, 'Meta'));
        const lim = opts.pickedIds ? 99 : (i < 2 ? cap.achFirst : cap.achRest);
        P.achievements.filter(a => a.experienceId === e.id)
          .filter(a => !opts.pickedIds || opts.pickedIds.has(a.id))
          .sort((a,b) => ((b.evidence||[]).length + (b.metrics||[]).length)
                       - ((a.evidence||[]).length + (a.metrics||[]).length))
          .slice(0, lim)
          .forEach(a => body.push(p('• ' + composeBullet(a), null,
            { indent:220, hanging:220, after:20 })));
      });
  };

  SEC.pub = () => {
    if(!(P.publications||[]).length) return;
    const list = P.publications.slice()
      .sort((a,b) => (mi(b.publishedAt)||0) - (mi(a.publishedAt)||0));
    const roles = {};
    list.forEach(x => { const r = x.role || '공동저자'; roles[r] = (roles[r]||0) + 1; });
    H1('저서 · 논문');
    body.push(p(`${list.length}편   ·   ` + Object.keys(roles)
      .map(r => `${r} ${roles[r]}편`).join('   ·   '), 'Meta'));
    list.slice(0, cap.pub).forEach(x => body.push(p([
      { t:'• ' + (x.title || ''), b:true },
      { t:'   ' + [x.kind, x.role !== '단독' ? x.role : null, x.publisher,
          x.publishedAt ? fmtYm(x.publishedAt) : null, x.note].filter(Boolean).join(' · '),
        color:'6A727C' }
    ], null, { indent:220, hanging:220, after:20 })));
    if(list.length > cap.pub) body.push(p(`… 외 ${list.length - cap.pub}편`, 'Meta', { indent:220 }));
  };

  SEC.projects = () => {
    if(!(P.projects||[]).length) return;
    const ps = P.projects.slice().sort((a,b) => (mi(b.start)||0) - (mi(a.start)||0));
    const groups = {};
    ps.forEach(x => { const k = x.kind || '기타'; (groups[k] = groups[k] || []).push(x); });
    const order = (typeof PROJECT_KINDS !== 'undefined' ? PROJECT_KINDS : []).filter(k => groups[k])
      .concat(Object.keys(groups).filter(k => !(typeof PROJECT_KINDS !== 'undefined' ? PROJECT_KINDS : []).includes(k)));

    H1('프로젝트 · 활동');
    body.push(p(order.map(k => {
      const g = groups[k];
      const ys = g.map(x => String(x.start||'').slice(0,4)).filter(Boolean).sort();
      const sp = ys.length ? (ys[0] === ys[ys.length-1] ? ys[0] : ys[0]+'–'+ys[ys.length-1]) : '';
      return `${k} ${g.length}건${sp ? ' (' + sp + ')' : ''}`;
    }).join('   ·   '), 'Meta'));

    order.forEach(k => {
      if(cap.projPerKind < 99) body.push(p(`${k}  ${groups[k].length}건`, 'Heading2'));
      else body.push(p(`${k}  ${groups[k].length}건`, 'Heading2'));
      groups[k].slice(0, cap.projPerKind).forEach(x => {
        const when = x.start ? fmtYm(x.start) + (x.end ? ' – ' + fmtYm(x.end) : '') : '';
        body.push(p([
          { t:'• ' + (x.name || ''), b:true },
          { t:'   ' + [x.org, x.role, when].filter(Boolean).join(' · '), color:'6A727C' }
        ], null, { indent:220, hanging:220, after:20 }));
      });
      if(groups[k].length > cap.projPerKind)
        body.push(p(`… 외 ${groups[k].length - cap.projPerKind}건`, 'Meta', { indent:220 }));
    });
  };

  SEC.edu = () => {
    if(!(P.education||[]).length) return;
    H1('학력');
    P.education.slice().sort((a,b) => (mi(b.end)||0) - (mi(a.end)||0)).forEach(e => {
      const span = e.start && e.end ? `${fmtYm(e.start)} – ${fmtYm(e.end)}`
                 : e.end ? `${fmtYm(e.end)} 졸업`
                 : e.start ? `${fmtYm(e.start)} 입학` : '';
      body.push(p(`${e.school || ''}  ${e.major || ''} ${e.degree || ''}`.trim() +
        (span ? `   (${span})` : '')));
    });
  };

  SEC.cert = () => {
    const list = (P.certifications||[]).filter(x => {
      const ex = mi(x.expiresAt); return ex === null || ex >= nowMi();
    });
    if(!list.length) return;
    H1('자격증');
    list.forEach(x => body.push(p(`${x.name}` +
      (x.issuer ? `  ·  ${x.issuer}` : '') + (x.issuedAt ? `  (${fmtYm(x.issuedAt)})` : ''))));
  };

  SEC.award = () => {
    if(!(P.awards||[]).length) return;
    H1('수상');
    P.awards.slice().sort((a,b) => (mi(b.date)||0) - (mi(a.date)||0)).forEach(a =>
      body.push(p(`${a.name}` + (a.issuer ? `  ·  ${a.issuer}` : '') +
        (a.date ? `  (${fmtYm(a.date)})` : ''))));
  };

  SEC.skills = () => {
    const skl = P.skills.map(s2 => ({ s:s2, st:skillStats(P, s2) }))
      .filter(x => x.st.evidenceCount > 0 || x.st.achCount > 0 || x.st.months > 0)
      .sort((a,b) => (b.st.evidenceCount - a.st.evidenceCount) || (b.st.months - a.st.months));
    if(!skl.length) return;
    H1('역량');
    CAT_ORDER.forEach(cat => {
      const g = skl.filter(x => (x.s.category||'hard') === cat);
      if(!g.length) return;
      body.push(p([
        { t:CAT_LABEL[cat] + '   ', b:true },
        { t:g.map(x => `${x.s.name} (${fmtDur(x.st.months)})`).join(', ') }
      ], null, { indent:220, hanging:220, after:20 }));
    });
  };

  pu.order.forEach(k => { if(SEC[k]) SEC[k](); });

  const refs = (P.references||[]).filter(r => r.contactable === '가능');
  if(refs.length) body.push(p(`레퍼런스 ${refs.length}명 확보 — 요청 시 제공`, 'Meta'));

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body.join('')}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>
</w:sectPr></w:body></w:document>`;
  return docxPackage(doc);
}

function docxPackage(doc, withFooter){
  const files = [
    { name:'[Content_Types].xml', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
${withFooter ? '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' : ''}
</Types>` },
    { name:'_rels/.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>` },
    { name:'word/_rels/document.xml.rels', text:
`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
${withFooter ? '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>' : ''}
</Relationships>` },
    { name:'word/document.xml', text: doc },
    { name:'word/styles.xml', text: DOCX_STYLES }
  ];
  if(withFooter) files.push({ name:'word/footer1.xml', text: DOCX_FOOTER });
  return zipStore(files);
}

/* ---------- 표·쪽나눔 ---------- */
function pageBreak(){
  return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
}

/**
 * 간단한 표. 긴 목록은 문단으로 늘어놓는 것보다 표가 훨씬 읽힌다.
 * rows[0]은 머리글로 본다. widths는 dxa(1/20 pt) 단위.
 */
function tbl(rows, widths, opt){
  opt = opt || {};
  const W = widths || rows[0].map(() => Math.floor(9060 / rows[0].length));
  const border = c => `<w:${c} w:val="single" w:sz="4" w:space="0" w:color="D5DCE0"/>`;

  const cell = (v, i, head) => {
    const align = (opt.num || []).includes(i) ? '<w:jc w:val="right"/>' : '';
    const runs = `<w:r><w:rPr>${head ? '<w:b/>' : ''}<w:sz w:val="${head ? 17 : 17}"/>` +
      `${head ? '<w:color w:val="FFFFFF"/>' : ''}</w:rPr>` +
      `<w:t xml:space="preserve">${xmlEsc(v == null ? '' : String(v))}</w:t></w:r>`;
    return `<w:tc><w:tcPr><w:tcW w:w="${W[i] || 1200}" w:type="dxa"/>` +
      (head ? '<w:shd w:val="clear" w:fill="22407F"/>' : '') +
      `</w:tcPr><w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/>${align}</w:pPr>${runs}</w:p></w:tc>`;
  };

  const body = rows.map((r, ri) =>
    `<w:tr>${(opt.head === false ? r : r).map((v, i) => cell(v, i, ri === 0 && opt.head !== false)).join('')}</w:tr>`
  ).join('');

  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>` +
    ['top','left','bottom','right','insideH','insideV'].map(border).join('') +
    `</w:tblBorders></w:tblPr>${body}</w:tbl>` +
    '<w:p><w:pPr><w:spacing w:after="120"/></w:pPr></w:p>';
}

/* ---------- 기간 보고서 docx ----------
   분량은 데이터가 정한다. 없는 내용을 지어내 채우지 않는다.
   대신 기록에 들어 있는 건 남김없이 싣는다 —
   전수 목록, 축별 전체 순위, 교차표, 하위 기간 상세까지. */
function buildPeriodDocx(P, unit, key, opts){
  opts = opts || {};
  const detail = opts.detail || reportDetail || 'full';
  const full = detail === 'full', brief = detail === 'brief';

  const pf = perf(P, unit, key);
  const rep = getReport(P, unit, key) || {};
  const unitName = (REPORT_UNITS.find(u => u[0] === unit) || ['',''])[1];
  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  const body = [];
  const H1 = t => body.push(p(t, 'Heading1'));
  const H2 = t => body.push(p(t, 'Heading2'));

  /* ---- 머리 ---- */
  body.push(p(`${unitName} 업무 보고`, 'Title'));
  const rangeTxt = (unit === 'all' && pf.list.length)
    ? ` (${String(pf.list[0].date).replace(/-/g,'.')} – ${String(pf.list[pf.list.length-1].date).replace(/-/g,'.')})`
    : '';
  body.push(p(periodLabel(key, unit) + rangeTxt + (P.profile.name ? '   ·   ' + P.profile.name : ''), 'Subtitle'));
  if(P.profile.headline) body.push(p(P.profile.headline, 'Meta'));
  body.push(p(`작성 ${stamp()}`, 'Meta'));

  /* ---- 요약 지표 ---- */
  const cmp = unit !== 'all';
  const sum = cmp ? [['항목','이번 ' + unitName, '직전 ' + unitName, '증감']] : [['항목','값']];
  const row = (label, now, before, fmt) => {
    const f = fmt || (v => v);
    const d = (before || before === 0) ? now - before : null;
    if(!cmp){ sum.push([label, f(now)]); return; }
    sum.push([label, f(now), (before || before === 0) ? f(before) : '',
      d === null || !before ? '' : (d > 0 ? '+' : '') + (Math.round(d*10)/10) +
        ` (${d > 0 ? '+' : ''}${Math.round(d / before * 100)}%)`]);
  };
  row(ACT + ' 건수', pf.t.count, pf.prev.count);
  if(pf.t.hasHours || pf.prev.hasHours) row('투입 시간', pf.t.hours, pf.prev.hours, fmtHours);
  if(pf.t.lectures || pf.prev.lectures) row('강의 회차', pf.t.lectures, pf.prev.lectures);
  if(pf.t.audience || pf.prev.audience) row('누적 수강', pf.t.audience, pf.prev.audience);
  if(pf.important.length || pf.prev.important) row(FLAG, pf.important.length, pf.prev.important);
  ENTRY_TYPES.forEach(([k,l]) => {
    if(pf.t.byType[k].count || pf.prev.byType[k].count)
      row('· ' + l, pf.t.byType[k].count, pf.prev.byType[k].count);
  });

  H1('요약');
  body.push(tbl(sum, cmp ? [2400, 1900, 1900, 2200] : [3400, 2400], { num:[1,2,3] }));
  if(pf.t.count && pf.important.length)
    body.push(p(`${FLAG} 비율 ${Math.round(pf.important.length / pf.t.count * 1000)/10}%`, 'Meta'));
  const ong = ongoingNote(unit, key);
  if(ong) body.push(p(ong + ' — 직전 기간과의 비교는 기간이 끝난 뒤에 봐야 정확합니다.', 'Meta'));

  /* ---- 내용 분석 ---- */
  const axes = facetAxes(P);
  if(!brief && axes.length){
    H1('내용 분석');
    contentLines(P, pf.list).forEach(c => body.push(p([
      { t:c.axis + '   ', b:true }, { t:c.text }
    ], null, { indent:220, hanging:220, after:20 })));

    if(full){
      /* 상세에서는 상위 몇 개가 아니라 전부 싣는다. 근거가 되려면 전수여야 한다. */
      axes.forEach(a => {
        const at = axisTable(P, pf.list, a.key, 999);
        if(at.rows.length <= 1) return;
        H2(`${a.key}별 (${at.kinds}종)`);
        body.push(tbl(at.rows, [4200, 1300, 1600, 1300], { num:[1,2,3] }));
      });
    }
  }

  /* ---- 분기별 (연간만) ---- */
  if(full && unit === 'year'){
    const qs = ['Q1','Q2','Q3','Q4'].map(q => ({ q, list: pf.list.filter(e =>
      periodKey(e.date, 'quarter') === `${key}-${q}`) })).filter(x => x.list.length);
    if(qs.length){
      H1('분기별');
      const rows = [['분기','건수','시간','강의','수강',FLAG,'비율']];
      qs.forEach(({q, list}) => {
        const t = tally(list);
        rows.push([q, t.count, t.hasHours ? fmtHours(t.hours) : '', t.lectures || '',
          t.audience || '', t.important || '',
          t.count ? Math.round(t.important / t.count * 1000)/10 + '%' : '']);
      });
      body.push(tbl(rows, [900, 900, 900, 900, 900, 900, 1000], { num:[1,2,3,4,5,6] }));
      qs.forEach(({q, list}) => {
        H2(`${key}년 ${q}  ${list.length}건`);
        contentLines(P, list, { topN:4, axes:4 }).forEach(c =>
          body.push(p([{ t:c.axis + ' — ', b:true }, { t:c.text }], 'Meta', { indent:180 })));
      });
    }
  }

  /* ---- 교차 분석 ---- */
  if(full && unit !== 'week' && axes.length){
    body.push(pageBreak());
    H1('교차 분석 — 기간별');
    body.push(p('언제 무엇이 많았는지는 이 표에서만 보입니다.', 'Meta'));
    axes.forEach(a => {
      const ct = crossTable(P, pf.list, unit, key, a.key, 6);
      if(!ct) return;
      H2(`기간 × ${a.key}`);
      body.push(tbl(ct, null, { num:[1,2,3,4,5,6,7] }));
    });

    /* 축 하나만 봐서는 원인에 닿지 못한다. 두 축을 겹쳐야 보이는 게 있다. */
    if(axes.length >= 2){
      body.push(pageBreak());
      H1('교차 분석 — 축 조합');
      body.push(p('"어느 쪽에서 무엇이 많았나"는 두 축을 겹쳐야 보입니다.', 'Meta'));
      const flagAxis = axes.find(a => facetTallyOn(pf.list, a.key).isFlagAxis);
      const others = axes.filter(a => !flagAxis || a.key !== flagAxis.key);
      const pairs = [];
      if(flagAxis) others.slice(0, 3).forEach(o => pairs.push([o.key, flagAxis.key]));
      for(let i = 0; i < Math.min(3, others.length); i++)
        for(let j = i + 1; j < Math.min(4, others.length); j++)
          pairs.push([others[i].key, others[j].key]);
      pairs.slice(0, 6).forEach(([A, B]) => {
        const cx = crossAxes(P, pf.list, A, B, 12, 6);
        if(!cx) return;
        H2(`${A} × ${B}`);
        body.push(tbl(cx, null, { num:[1,2,3,4,5,6,7] }));
      });
    }

    /* 축별 상세 — 상위 값마다 그 값의 기록을 따로 */
    body.push(pageBreak());
    H1('축별 상세');
    body.push(p('상위 항목마다 어떤 기록이 있었는지 그대로 폅니다.', 'Meta'));
    axes.slice(0, 3).forEach(a => {
      H2(a.key);
      axisSections(P, pf.list, a.key, unit === 'all' ? 10 : 8).forEach(sec => {
        body.push(p([
          { t:`${sec.value}  ${sec.n}건`, b:true },
          { t: sec.isFlagAxis ? '' : (sec.imp ? `   ${FLAG} ${sec.imp}건 (${sec.pct}%)` : ''),
            color:'6A727C' },
          { t: sec.variants > 1 ? `   표기 ${sec.variants}종` : '', color:'8A6A1F' }
        ], null, { indent:180, hanging:180, after:20 }));
        body.push(tbl(fullTable(P, sec.list), null, {}));
      });
    });
  }

  /* ---- 하위 기간 ---- */
  if(unit === 'week'){
    /* 주간은 한 장에 담기는 게 목적이다.
       일자별 요약과 전수 목록을 따로 두면 같은 말을 두 번 하게 된다. */
    H1(`${ACT} 목록  ${pf.list.length}건`);
    body.push(tbl(fullTable(P, pf.list, { detail:true }), null, {}));
    const dayRows = dayTable(P, pf.list);
    if(dayRows.length > 2){
      H2('일자별 합계');
      body.push(tbl(dayRows.map(r => r.slice(0, 5)), [1100, 800, 900, 1000, 1000], { num:[2,3,4] }));
    }
  } else {
    const kids = childDetail(P, unit, key);
    if(kids.length){
      const chName = { week:'주차별', month:'월별', year:'연도별' }[kids[0].unit] || '기간별';
      H1(chName);
      const rows = [[{ week:'주차', month:'월', year:'연도' }[kids[0].unit] || '기간',
                      '건수', '시간', '강의', FLAG, '총평']];
      kids.forEach(k => rows.push([
        periodShort(k.key, k.unit), k.perf.t.count,
        k.perf.t.hasHours ? fmtHours(k.perf.t.hours) : '',
        k.perf.t.lectures || '', k.perf.t.important || '',
        (k.report && k.report.summary || '').slice(0, 70)
      ]));
      body.push(tbl(rows, [1000, 800, 900, 800, 900, 4600], { num:[1,2,3,4] }));

      if(full){
        body.push(pageBreak());
        H1(chName + ' 상세');
        kids.forEach(k => {
          const kp = k.perf;
          H2(periodLabel(k.key, k.unit) + `  ${kp.t.count}건` +
             (kp.t.hasHours ? ` · ${fmtHours(kp.t.hours)}시간` : '') +
             (kp.important.length ? ` · ${FLAG} ${kp.important.length}` : ''));
          if(k.report && k.report.summary) body.push(p(k.report.summary, 'Meta', { indent:180 }));
          if(k.report && k.report.issues) body.push(p('이슈 — ' + k.report.issues, 'Meta', { indent:180 }));
          contentLines(P, kp.list, { topN:3, axes:3 }).forEach(c =>
            body.push(p([{ t:c.axis + ' — ', b:true }, { t:c.text }], 'Meta', { indent:180 })));
          /* 그 달·주의 전부를 싣는다. 상위 기간 보고서에서 아래로 파고들 수 있어야 한다. */
          if(kp.list.length) body.push(tbl(fullTable(P, kp.list, { detail:true }), null, {}));
        });
      }
    }
  }

  /* ---- 표시한 일 ---- */
  if(pf.important.length && unit !== 'week'){
    if(full) body.push(pageBreak());
    H1(`${FLAG}  ${pf.important.length}건`);
    contentLines(P, pf.important, { topN:3, axes:3 }).forEach(c =>
      body.push(p([{ t:c.axis + ' — ', b:true }, { t:c.text }], 'Meta', { indent:220 })));
    if(full || unit === 'week'){
      body.push(tbl(fullTable(P, pf.important, { detail:true }), null, {}));
    } else {
      pf.important.slice(0, 8).forEach(e => body.push(p([
        { t:String(e.date).slice(5).replace('-','/') + '   ', color:'6A727C' },
        { t:e.title || '', b:true }
      ], null, { indent:180, hanging:180, after:20 })));
    }
  }

  /* ---- 전수 목록 ---- */
  if(full && pf.list.length && unit !== 'week'){
    body.push(pageBreak());
    H1(`${ACT} 전체 목록  ${pf.list.length}건`);
    body.push(p('이 기간에 기록된 전부입니다. 집계 숫자의 근거가 여기 있습니다.', 'Meta'));
    body.push(tbl(fullTable(P, pf.list, { detail: unit === 'week' }), null, {}));
  }

  /* ---- 역량별 투입 ---- */
  if(full){
    const st = skillTable(P, pf.list);
    if(st){
      H1('역량별 투입');
      body.push(p('기록에 연결해 둔 역량이 여기서 실적이 됩니다.', 'Meta'));
      body.push(tbl(st, [3600, 1200, 1400, 1400], { num:[1,2,3] }));
    }

    const qs = quietSpans(P, pf.list, unit);
    if(qs.length){
      H1('기록이 끊긴 구간');
      body.push(p('실제로 활동이 없었는지, 기록만 안 된 것인지 확인이 필요한 지점입니다.', 'Meta'));
      body.push(tbl([['구간','길이']].concat(qs.map(q =>
        [`${periodShort(q.from, q.unit)} – ${periodShort(q.to, q.unit)}`,
         `${q.n}${q.unit === 'week' ? '주' : q.unit === 'month' ? '개월' : '년'}`])),
        [3000, 1600], { num:[1] }));
    }
  }

  /* ---- 성과 ---- */
  if(pf.promoted.length){
    H1('커리어 성과로 기록');
    pf.promoted.forEach(a => {
      const nums = (a.metrics||[]).filter(m => m.name).map(m =>
        `${m.name} ${m.before ?? ''}${m.before != null ? '→' : ''}${m.after ?? ''}${m.unit || ''}`).join(', ');
      body.push(p([{ t:'• ' + a.title, b:true }, { t:nums ? `   (${nums})` : '', color:'6A727C' }],
        null, { indent:180, hanging:180 }));
    });
  }

  if(unit === 'year' && pf.t.lectures){
    H1('강의 실적');
    body.push(p(`회차 ${pf.t.lectures}회 · 누적 수강 ${pf.t.audience || 0}명` +
      (pf.avgAudience ? ` · 평균 ${pf.avgAudience}명` : '')));
  }

  /* ---- 사람이 쓴 부분 ---- */
  const nextWord = unit === 'week' ? '주' : unit === 'month' ? '달' : '해';
  [['총평', rep.summary], ['공유·논의', rep.issues], [`다음 ${nextWord} 계획`, rep.nextPlan]]
    .forEach(([label, text]) => {
      if(!text) return;
      H1(label);
      String(text).split(/\n/).filter(x => x.trim()).forEach(l => body.push(p(l)));
    });

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body.join('')}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/>
</w:sectPr></w:body></w:document>`;
  return docxPackage(doc);
}

function buildAnnualText(P, year){ return buildPeriodReport(P, 'year', String(year)); }

function stamp(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function safeName(P){
  const n = (P.profile && P.profile.name || '').replace(/[\\/:*?"<>|\s]/g, '');
  return n || 'career';
}

  json(P){
    saveBlob(UTF8.encode(JSON.stringify(P, null, 2)),
      `career-profile-${stamp()}.json`, 'application/json');

};

/** 실적 요약 — 평가용 이력서의 첫 장. 기록에서 바로 뽑는다. */
function perfBlock(P){
  const t = tally(P.entries || []);
  if(!t.count) return null;
  const ACT = termOf(P, 'activity'), FLAG = termOf(P, 'flag');
  const rows = [['항목', '값']];
  rows.push([ACT + ' 건수', t.count + '건']);
  if(t.important) rows.push([FLAG, `${t.important}건 (${Math.round(t.important/t.count*1000)/10}%)`]);
  if(t.hasHours) rows.push(['투입 시간', fmtHours(t.hours) + '시간']);
  if(t.lectures) rows.push(['강의', `${t.lectures}회${t.audience ? ` · 수강 ${t.audience}명` : ''}`]);

  const years = {};
  (P.entries||[]).forEach(e => { const y = String(e.date).slice(0,4);
    if(/^\d{4}$/.test(y)) (years[y] = years[y] || []).push(e); });
  const ys = Object.keys(years).sort();
  const byYear = ys.length > 1
    ? [['연도', ACT, FLAG]].concat(ys.map(y => {
        const tt = tally(years[y]);
        return [y, tt.count, tt.important || ''];
      }))
    : null;

  const axes = (typeof facetAxes === 'function' ? facetAxes(P) : []).slice(0, 3)
    .map(a => {
      const ft = facetTallyOn(P.entries, a.key);
      return { axis:a.key, kinds:ft.rows.length,
        top: ft.rows.slice(0, 4).map(r => `${r.value} ${r.n}`).join(' · ') };
    });
  return { rows, byYear, axes };
}

function buildTemplateXlsx(P){
  const axes = (P && P.profile && P.profile.axes) || [];
  const sheets = [];

  /* 첫 장은 안내. 서식만 주고 설명이 없으면 무엇을 어디에 적을지 모른다. */
  const help = [['커리어 스모그 — 입력 서식'], [],
    ['시트마다 한 종류만 적습니다. 2행은 예시이니 지우고 3행부터 채우세요.'],
    ['빈 칸은 그대로 두면 됩니다 — 모르는 값을 지어내는 것보다 낫습니다.'],
    ['다 채우면 앱에서 «불러오기»로 이 파일을 넣으세요.'], [],
    ['시트','무엇을 적나']];
  TEMPLATE_SHEETS.forEach(t => help.push([t.name, t.tip]));
  help.push([], ['날짜 형식'], ['월까지', 'YYYY-MM  (예: 2025-06)'],
    ['일까지', 'YYYY-MM-DD  (예: 2025-06-14)'], ['다니는 중', '종료 칸에 "재직 중"']);
  sheets.push({ name:'읽어주세요', rows:help, widths:[18, 92] });

  TEMPLATE_SHEETS.forEach(t => {
    const head = t.head.slice();
    const ex = t.ex.slice();
    /* 축 이름을 정해 뒀으면 서식에도 그 이름으로 적어준다 */
    if(t.name === '주간 기록' && axes.length){
      for(let i = 0; i < 3; i++){
        const at = head.indexOf('축' + (i+1));
        if(at >= 0) head[at] = axes[i] || head[at];
      }
    }
    sheets.push({ name:t.name, rows:[head, ex], widths:t.widths });
  });

  return buildXlsx(sheets);
}


/* ===== 04-views-a.js ===== */
/* ---------- 뷰: 연대기 타임라인 -------------------------------------- */
/* 소속 색. 무지개로 칠하면 회사가 몇 곳인지보다 색이 먼저 보인다.
   맑음 계열에서 밝기만 달리해 순서가 읽히게 한다. */
const ORG_TONES = ['#0F5F57','#2E7D70','#4E9A88','#6FB3A0','#8FC7B6','#A9D3C6','#C0DED4'];

function orgTone(P, org){
  const orgs = [];
  P.experiences.forEach(e => { if(!orgs.includes(e.org)) orgs.push(e.org); });
  return ORG_TONES[Math.max(0, orgs.indexOf(org)) % ORG_TONES.length];
}

function viewTimeline(P){
  const exps = P.experiences.filter(spanOf).sort((a,b) => spanOf(a)[0] - spanOf(b)[0]);
  if(!exps.length) return emptyState('아직 경력이 없습니다',
    '직접 입력하거나, 이미 만들어 둔 JSON을 불러오면 됩니다.',
    '<button class="btn primary" data-add="experiences">경력 추가</button>');

  const gaps = detectGaps(exps);
  const lo = Math.min.apply(null, exps.map(e => spanOf(e)[0]));
  const hi = Math.max.apply(null, exps.map(e => spanOf(e)[1]));
  const span = hi - lo + 1;

  const PX = Math.max(5, Math.min(14, Math.round(900 / span)));
  const L = 12, R = 12, TOP = 14, ROW = 36, BAR = 24, AXIS = 34;
  const W = L + span * PX + R;
  const H = TOP + exps.length * ROW + AXIS;
  const x = idx => L + (idx - lo) * PX;

  let s = '';

  /* 공백기 — 부정적 라벨 없이 기간만 (outputs.md 규칙) */
  gaps.forEach(g => {
    const gx = x(mi(g.start)), gw = Math.max(2, (mi(g.end) - mi(g.start) + 1) * PX);
    s += `<rect x="${gx}" y="${TOP}" width="${gw}" height="${exps.length*ROW}"
            fill="#F3F6F7"/>
          <line x1="${gx}" y1="${TOP}" x2="${gx}" y2="${TOP+exps.length*ROW}"
            stroke="#C9D2D8" stroke-dasharray="3 3"/>
          <line x1="${gx+gw}" y1="${TOP}" x2="${gx+gw}" y2="${TOP+exps.length*ROW}"
            stroke="#C9D2D8" stroke-dasharray="3 3"/>`;
  });

  /* 연도 눈금 */
  const y0 = Math.ceil(lo/12), y1 = Math.floor(hi/12);
  for(let y = y0; y <= y1; y++){
    const gx = x(y*12);
    s += `<line x1="${gx}" y1="${TOP}" x2="${gx}" y2="${TOP+exps.length*ROW+6}"
            stroke="#E4EAED"/>
          <text x="${gx+3}" y="${TOP+exps.length*ROW+22}" style="font-family:ui-monospace,monospace" font-size="10.5" fill="#6B7A85">${y}</text>`;
  }

  /* 경력 막대 + 성과 점 */
  exps.forEach((e, i) => {
    const [a, b] = spanOf(e);
    const bx = x(a), bw = Math.max(PX, (b - a + 1) * PX);
    const by = TOP + i * ROW + (ROW - BAR)/2;
    const tone = orgTone(P, e.org);
    const label = e.org + (e.title ? ' · ' + e.title : '');

    s += `<g><title>${esc(label)}\n${fmtYm(e.start)} ~ ${e.isCurrent?'현재':fmtYm(e.end)} (${fmtDur(b-a+1)})</title>
          <rect x="${bx}" y="${by}" width="${bw}" height="${BAR}" rx="2" fill="${tone}"/>`;

    if(bw > 74){
      const room = Math.floor((bw - 16) / 6.6);   // 한글 기준 대략치
      const shown = label.length > room ? label.slice(0, Math.max(1, room-1)) + '…' : label;
      s += `<text x="${bx+8}" y="${by+16}" font-size="11.5" font-weight="600" fill="#fff"
              >${esc(shown)}</text>`;
    }
    s += `</g>`;

    /* 성과: 근거 있으면 채운 점, 없으면 빈 점 — 이 앱의 signature */
    P.achievements.filter(ac => ac.experienceId === e.id && mi(ac.date) !== null)
      .forEach(ac => {
        const px = x(mi(ac.date)), py = by + BAR + 6;
        const has = (ac.evidence || []).length > 0;
        s += `<g><title>${esc(ac.title || '(제목 없음)')} · ${fmtYm(ac.date)}${has?'':'\n근거 없음'}</title>
              <circle cx="${px}" cy="${py}" r="3.6"
                fill="${has ? '#A8322A' : '#fff'}" stroke="#A8322A" stroke-width="1.4"/></g>`;
      });

    if(bw <= 74){
      s += `<text x="${bx+bw+6}" y="${by+16}" font-size="11.5" fill="#3A4A57">${esc(label)}</text>`;
    }
  });

  const svg = `<div class="tl-scroll"><div class="tl">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
        aria-label="경력 연대기 타임라인">${s}</svg></div></div>`;

  /* 표 — 색만으로 정보를 전달하지 않기 위해 같은 내용을 글로도 준다 */
  const rows = [];
  exps.forEach((e, i) => {
    const [a,b] = spanOf(e);
    rows.push({ k:a, html:`<div class="roster-row">
      <div class="per">${fmtYm(e.start)} – ${e.isCurrent ? '현재' : fmtYm(e.end)}</div>
      <div class="who"><b>${esc(e.org)}</b>${e.team ? ' <em>/ '+esc(e.team)+'</em>' : ''}
        ${e.title ? ' <em>/ '+esc(e.title)+'</em>' : ''}
        ${e.employmentType && e.employmentType !== '정규직' ? ' <span class="pill">'+esc(e.employmentType)+'</span>' : ''}
        ${e.confidence === 'inferred' ? ' <span class="pill seal">추론</span>' : ''}
        ${scaleLine(e) ? `<div class="hint" style="margin-top:2px">${esc(scaleLine(e))}</div>` : ''}</div>
      <div class="dur">${fmtDur(b-a+1)}
        <button class="btn ghost sm" data-edit="experiences" data-eid="${e.id}"
          aria-label="${esc(e.org)} 편집">편집</button></div></div>` });
  });
  gaps.forEach(g => {
    rows.push({ k:mi(g.start), html:`<div class="roster-row gap">
      <div class="per">${fmtYm(g.start)} – ${fmtYm(g.end)}</div>
      <div class="who">기록 없는 기간</div>
      <div class="dur">${fmtDur(g.months)}</div></div>` });
  });
  rows.sort((x1,x2) => x1.k - x2.k);

  return `<div class="panel">
    <h2 class="sec">연대기<button class="btn sm" data-add="experiences"
      style="float:right;text-transform:none;letter-spacing:0">경력 추가</button></h2>
    ${svg}
    <div class="tl-legend">
      <span><i class="filled"></i>근거가 붙은 성과</span>
      <span><i class="hollow"></i>근거 없는 성과</span>
      <span>회색 구간 — 기록 없는 기간</span>
    </div>
    <div class="roster">${rows.map(r => r.html).join('')}</div>
  </div>`;
}

/* ---------- 뷰: 역량 맵 ---------------------------------------------- */
const CAT_LABEL = { hard:'하드 스킬', domain:'도메인', tool:'도구',
                    soft:'소프트 스킬', language:'언어', certification:'자격' };
const CAT_ORDER = ['hard','domain','tool','language','soft','certification'];

function viewSkills(P){
  if(!P.skills.length) return emptyState('아직 역량이 없습니다',
    '경력에서 쓴 기술·도메인을 등록해 두면 공고 매칭이 여기서부터 돌아갑니다.',
    '<button class="btn primary" data-add="skills">역량 추가</button>');

  const rows = P.skills.map(sk => Object.assign({}, sk, { st: skillStats(P, sk) }));
  const maxM = Math.max.apply(null, rows.map(r => r.st.months).concat([1]));

  let out = '';
  CAT_ORDER.forEach(cat => {
    let group = rows.filter(r => (r.category || 'hard') === cat);
    if(!group.length) return;

    /* 소프트 스킬은 근거가 있는 것만 남긴다 (outputs.md 규칙).
       "커뮤니케이션 능력"처럼 아무나 쓸 수 있는 말은 이력서에서 무게가 없다. */
    let dropped = 0;
    if(cat === 'soft'){
      const kept = group.filter(r => r.st.achCount > 0);
      dropped = group.length - kept.length;
      group = kept;
      if(!group.length) return;
    }

    /* 정렬: 근거 개수 우선, 그다음 기간 */
    group.sort((a,b) => (b.st.evidenceCount - a.st.evidenceCount) || (b.st.months - a.st.months));

    out += `<div class="skgroup"><h2 class="sec">${CAT_LABEL[cat]}</h2>` +
      group.map(r => `<div class="skrow">
        <div class="nm">${esc(r.name)}
          ${(r.aliases||[]).length ? '<span>' + esc(r.aliases.join(' · ')) + '</span>' : ''}
          ${r.st.dormant ? ' <span class="pill warn">' + monthsSince(r.st.lastUsed) + '개월 미사용</span>' : ''}
          ${r.st.evidenceCount === 0 ? ' <span class="pill seal">근거 없음</span>' : ''}
        </div>
        <div class="skbar"><i style="width:${Math.round(r.st.months/maxM*100)}%"></i></div>
        <div class="skmeta">${fmtDur(r.st.months)} · 근거 ${r.st.evidenceCount}
          <button class="btn ghost sm" data-edit="skills" data-eid="${r.id}"
            aria-label="${esc(r.name)} 편집">편집</button></div>
      </div>`).join('') +
      (dropped ? `<p class="hint" style="margin-top:8px">성과 근거가 없어 숨긴 항목 ${dropped}개.
        해당 역량을 보여준 일이 있으면 성과 탭에서 연결하세요.</p>` : '') +
      `</div>`;
  });

  return `<div class="panel">
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
      <button class="btn sm" data-add="skills">역량 추가</button></div>
    ${out}
    <p class="hint" style="border-top:1px solid var(--rule-soft);padding-top:12px;margin-bottom:0">
      별점을 매기지 않습니다. 근거 개수와 사용 기간이 자기평가보다 설득력이 있습니다.
      정렬은 근거 개수, 그다음 기간 순입니다.</p></div>`;
}

function monthsSince(ym){
  const x = mi(ym); return x === null ? '?' : (nowMi() - x);
}

function emptyState(title, body, action){
  return `<div class="panel"><div class="empty"><strong>${esc(title)}</strong>${esc(body)}
    ${action ? '<div style="margin-top:16px">' + action + '</div>' : ''}</div></div>`;
}


/* ===== 05-views-b.js ===== */
/* ---------- 뷰: 성과 편집기 (F4) ------------------------------------- */
const STAR = [
  ['situation','상황'], ['task','과제'], ['action','행동'], ['result','결과']
];

function quickBox(P){
  const opts = P.experiences.slice()
    .sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0))
    .map(e => `<option value="${e.id}">${esc(e.org)}${e.title?' · '+esc(e.title):''}</option>`).join('');
  return `<div class="panel quick">
    <h2 class="sec">빠른 기록</h2>
    <p class="hint">떠오른 걸 한 줄씩 던져두세요. 여러 줄을 넣으면 줄마다 하나씩 만들어집니다.
      세부 내용은 나중에 채우면 됩니다 — 지금 안 적으면 몇 달 뒤엔 기억나지 않습니다.</p>
    <textarea id="quickIn" rows="3"
      placeholder="예)\n검사 라인에 이미지 분류 모델 연동해서 리드타임 줄임\n협력사 리포트 양식 통일"></textarea>
    <div class="quick-row">
      <select id="quickExp" aria-label="어느 소속의 일인가">${opts || '<option value="">소속 없음</option>'}</select>
      <input id="quickDate" value="${unmi(nowMi())}" aria-label="시점" placeholder="2026-08">
      <button class="btn primary" id="btnQuickAdd">기록</button>
    </div>
  </div>`;
}

function viewAchievements(P){
  if(!P.achievements.length) return quickBox(P) + emptyState('아직 성과가 없습니다',
    '성과는 이력서·자소서·공고 매칭이 모두 딛고 서는 바닥입니다. 위에 한 줄만 던져도 시작됩니다.');

  const byExp = {};
  P.achievements.forEach(a => { (byExp[a.experienceId] = byExp[a.experienceId] || []).push(a); });

  const order = P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0));
  const orphan = P.achievements.filter(a => !P.experiences.some(e => e.id === a.experienceId));

  let out = '';
  order.forEach(e => {
    const list = byExp[e.id];
    if(!list || !list.length) return;
    out += `<div class="panel"><h2 class="sec">${esc(e.org)}${e.title ? ' · ' + esc(e.title) : ''}
      <span style="float:right;text-transform:none;letter-spacing:0">
        <button class="btn sm" data-newach="${e.id}">성과 추가</button>
        <span style="margin-left:8px">${list.length}건</span></span></h2>` +
      list.sort((a,b) => (mi(b.date)||0) - (mi(a.date)||0)).map(a => achCard(P, a)).join('') + `</div>`;
  });
  if(orphan.length){
    out += `<div class="panel"><h2 class="sec">소속이 연결되지 않은 성과
      <span style="float:right;text-transform:none;letter-spacing:0">${orphan.length}건</span></h2>` +
      orphan.map(a => achCard(P, a)).join('') + `</div>`;
  }
  return quickBox(P) + out;
}

function achCard(P, a){
  const missing = [];
  if(!a.action) missing.push('행동');
  if(!(a.metrics||[]).length) missing.push('수치');
  if(!(a.scope && a.scope.role)) missing.push('역할');
  if(!(a.evidence||[]).length) missing.push('근거');

  return `<div class="ach ${missing.length ? 'holey' : ''}" id="ach-${a.id}">
    <div class="ach-head" data-toggle="${a.id}" role="button" tabindex="0" aria-expanded="false">
      <span class="ttl">${esc(a.title || '(제목 없음)')}</span>
      ${missing.map(m => `<span class="pill seal">${m} 없음</span>`).join('')}
      ${a.confidence === 'inferred' ? '<span class="pill seal">추론</span>' : ''}
      ${a.userEdited ? '<span class="pill ok">직접 수정</span>' : ''}
      <span class="meta">${fmtYm(a.date)}</span>
      <button class="btn ghost sm" data-delach="${a.id}" aria-label="이 성과 지우기">×</button>
    </div>
    <div class="ach-body" data-body="${a.id}"></div>
  </div>`;
}

/**
 * 카드 몸통은 펼칠 때만 만든다.
 * 성과 200건 × 역량 40개면 체크박스가 8천 개다.
 * 접힌 채로 다 그리면 화면 하나 여는 데 3초가 걸린다 — 실측했다.
 */
function achCardBody(P, a){
  const fields = STAR.map(([k, label]) => `
    <div class="fld ${a[k] ? '' : 'blank'}">
      <label for="f-${a.id}-${k}">${label}</label>
      <textarea id="f-${a.id}-${k}" rows="2" data-ach="${a.id}" data-field="${k}"
        placeholder="${a[k] ? '' : '원본에 없던 항목입니다. 기억나는 대로 채우세요 — 비워두는 편이 지어내는 것보다 낫습니다.'}"
      >${esc(a[k] || '')}</textarea>
    </div>`).join('');

  const metrics = (a.metrics || []).map((m, i) => `
    <div class="metric-row">
      <input value="${esc(m.name||'')}"   data-ach="${a.id}" data-metric="${i}" data-mk="name"   placeholder="지표명">
      <input value="${esc(m.before??'')}" data-ach="${a.id}" data-metric="${i}" data-mk="before" placeholder="이전">
      <input value="${esc(m.after??'')}"  data-ach="${a.id}" data-metric="${i}" data-mk="after"  placeholder="이후">
      <input value="${esc(m.unit||'')}"   data-ach="${a.id}" data-metric="${i}" data-mk="unit"   placeholder="단위">
      <button class="btn ghost sm" data-ach="${a.id}" data-mdel="${i}" title="이 지표 삭제">×</button>
    </div>`).join('');

  const ev = (a.evidence || []).length
    ? a.evidence.map(v => `<div class="ev"><q>${esc(v.quote || '(인용 없음)')}</q>
          <cite>${esc(sourceLabel(P, v.sourceId))}${v.location ? ' · ' + esc(v.location) : ''}</cite></div>`).join('')
    : `<p class="ev-none">이 성과에는 출처 문서가 없습니다. 기억에만 있는 내용이라면
       뒷받침할 자료를 찾아두세요 — 면접에서 물어봅니다.</p>`;

  return `
      <div>
        <div class="fld">
          <label for="f-${a.id}-title">제목</label>
          <input id="f-${a.id}-title" value="${esc(a.title||'')}" data-ach="${a.id}" data-field="title">
        </div>
        <div class="fld" style="display:grid;grid-template-columns:1fr 130px;gap:10px">
          <div><label for="f-${a.id}-exp">소속</label>
            <select id="f-${a.id}-exp" data-ach="${a.id}" data-field="experienceId">
              <option value="">— 소속 없음 —</option>
              ${P.experiences.map(e => `<option value="${e.id}" ${a.experienceId===e.id?'selected':''}>${esc(e.org)}${e.title?' · '+esc(e.title):''}</option>`).join('')}
            </select></div>
          <div><label for="f-${a.id}-date">시점</label>
            <input id="f-${a.id}-date" value="${esc(a.date||'')}" data-ach="${a.id}" data-field="date"
              placeholder="2024-08" inputmode="numeric"></div>
        </div>
        ${fields}
        <div class="fld ${(a.metrics||[]).length ? '' : 'blank'}">
          <label>정량 지표</label>
          ${metrics || '<p class="hint" style="margin:0 0 6px">수치가 없으면 비워두세요. 그럴듯한 숫자를 넣는 것이 이 도구에서 가장 위험한 행동입니다.</p>'}
          <button class="btn sm" data-ach="${a.id}" data-madd="1">지표 추가</button>
        </div>
        <div class="fld ${(a.scope&&a.scope.role) ? '' : 'blank'}" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label for="f-${a.id}-role">내 역할</label>
            <select id="f-${a.id}-role" data-ach="${a.id}" data-field="scope.role">
              <option value="">— 선택 —</option>
              ${['주도','참여','지원'].map(r =>
                `<option ${a.scope&&a.scope.role===r?'selected':''}>${r}</option>`).join('')}
            </select></div>
          <div><label for="f-${a.id}-team">팀 규모(명)</label>

/** 사실만 잇는다. 문장을 새로 쓰지 않는다 — 그건 Claude 스킬의 몫이다. */
function composeBullet(a){
  const parts = [];
  const body = a.action || a.result || a.title || '';
  if(body) parts.push(String(body).replace(/[.\s]+$/,''));

  /* internal 로 표시한 지표는 보고서용이다.
     "직전 연간 대비 +63%"는 이력서에 쓸 말이 아니다. */
  const nums = (a.metrics || [])
    .filter(m => m.name && !m.internal && (m.before != null || m.after != null))
    .map(m => {
      const u = m.unit || '';
      if(m.before != null && m.after != null){
        const d = deltaOf(m);
        return `${m.name} ${m.before}${u} → ${m.after}${u}${d ? ' (' + d + ')' : ''}`;
      }
      return `${m.name} ${m.after != null ? m.after : m.before}${u}`;
    });
  if(nums.length) parts.push(nums.join(', '));

  if(a.action && a.result && a.result !== a.action && !nums.length){
    parts.splice(1, 0, String(a.result).replace(/[.\s]+$/,''));
  }
  /* 범위는 괄호로 뒤에 붙인다 — outputs.md의 "(4인 팀 주도)" 형식 */
  const sc = a.scope || {};
  const tag = (sc.teamSize && sc.role) ? `${sc.teamSize}인 팀 ${sc.role}` : (sc.role || '');
  return parts.join(', ') + (tag ? ` (${tag})` : '');
}

function deltaOf(m){
  const b = parseFloat(m.before), af = parseFloat(m.after);
  if(!isFinite(b) || !isFinite(af) || b === 0) return m.delta || '';
  const pct = Math.round((af - b) / Math.abs(b) * 100);
  return (pct > 0 ? '+' : '') + pct + '%';
}

 * 실제로 그랬다. 빼는 게 고르는 것보다 쉽다.
 */
function fillPickedDefault(P){
  if(picked.size) return;
  const order = P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0));
  order.forEach((e, i) => {
    P.achievements.filter(a => a.experienceId === e.id)
      .sort((a,b) => ((b.evidence||[]).length + (b.metrics||[]).length)
                   - ((a.evidence||[]).length + (a.metrics||[]).length))
      .slice(0, i < 2 ? 5 : 3)
      .forEach(a => picked.add(a.id));
  });
  /* 소속이 안 붙은 성과도 넣는다. 안 그러면 어디에도 안 실린다. */
  P.achievements.filter(a => !a.experienceId).slice(0, 3).forEach(a => picked.add(a.id));
}

function renderResumePreview(P){

  if(!host) return;
  const html = buildCareerPage(P, { contact:false, stats:false, entries:false, embed:'none',

    html.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></iframe>`;

  const order = P.experiences.slice().sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0));

  order.forEach(e => {
    const list = P.achievements.filter(a => a.experienceId === e.id && picked.has(a.id));
    if(!list.length) return;
    const sp = spanOf(e);
    lines.push(`## ${e.org}${e.team ? ' / ' + e.team : ''}${e.title ? ' / ' + e.title : ''}`);
    lines.push(`${fmtYm(e.start)} – ${e.isCurrent ? '현재' : fmtYm(e.end)}${sp ? '  (' + fmtDur(sp[1]-sp[0]+1) + ')' : ''}`);
    list.forEach(a => lines.push('- ' + composeBullet(a)));

function sourceLabel(P, sourceId){
  if(!sourceId) return '출처 미상';
  if(String(sourceId).startsWith('entry:')) return '주간 기록에서 올림';
  if(String(sourceId).startsWith('period:')) return '기간 실적 집계';
  const src = P.sources.find(s => s.id === sourceId);
  return src ? src.filename : sourceId;
}

/** 종합 점수를 만들지 않는다. 근거 없는 숫자는 판단을 왜곡한다. */
const SECTION = /^[\[\(\<【■◆▶●○*\-–—\s]*(자격\s*요건|지원\s*자격|필수\s*요건|필수\s*자격|자격\s*조건|주요\s*업무|담당\s*업무|모집\s*부문|이런\s*분을\s*찾습니다|우대\s*사항|우대\s*요건|이런\s*분이면\s*더\s*좋습니다|근무\s*조건|복리\s*후생|전형\s*절차|제출\s*서류|기타\s*사항|Requirements?|Qualifications?|Responsibilities|Preferred|Nice\s*to\s*have|Benefits)[\]\)\>】\s:：·]*$/i;
const PREF_HEAD = /우대|더\s*좋습니다|Preferred|Nice\s*to\s*have|Plus/i;
const SKIP_HEAD = /근무\s*조건|복리\s*후생|전형\s*절차|제출\s*서류|기타\s*사항|Benefits/i;

/** 줄을 훑으면서 지금 어느 섹션에 있는지 기억한다. 헤더 자체는 요구사항이 아니다. */
function splitRequirements(text){
  let section = 'required';
  const out = [];
  String(text).split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/^\s*[-•·*▪◦○●o]\s*/, '').replace(/^\s*\d+[.)]\s*/, '').trim();
    if(!line) return;
    if(SECTION.test(line)){
      section = PREF_HEAD.test(line) ? 'preferred' : (SKIP_HEAD.test(line) ? 'skip' : 'required');
      return;
    }
    if(section === 'skip') return;
    if(line.length < 6 || line.length > 200) return;
    out.push({ text: line, type: section });
  });
  return out;
}

/* 어느 공고에나 걸리는 낱말. 이걸로 매칭하면 전부 '강함'이 되어 표가 쓸모없어진다. */
const GENERIC = ['관리','개발','운영','분석','활용','경험','능력','업무','설계','구축',
                 '시스템','데이터','서비스','수행','담당','기반','이해','작성'];

function suggestMatch(P, text){
  const hay = text.toLowerCase();
  const exact = [], loose = [];

  P.skills.forEach(sk => {
    /* 근거 없는 소프트 스킬은 매칭에서 뺀다. '커뮤니케이션'은 모든 공고에 들어 있다. */
    if((sk.category || 'hard') === 'soft' && !(sk.achievementIds || []).length) return;

    const names = [sk.name].concat(sk.aliases || []).filter(Boolean).map(String);
    if(names.some(n => n.length >= 2 && hay.includes(n.toLowerCase()))){ exact.push(sk); return; }

    const toks = names.reduce((acc, n) => acc.concat(n.split(/[\s/·,()]+/)), [])
                      .filter(t => t.length >= 2 && GENERIC.indexOf(t) === -1);
    if(toks.some(t => hay.includes(t.toLowerCase()))) loose.push(sk);
  });

  if(exact.length){
    const evid = exact.reduce((n, sk) => n + skillStats(P, sk).evidenceCount, 0);
    return { status: evid > 0 ? 'strong' : 'partial', ids: exact.map(s => s.id), note: null };
  }
  /* 이름 일부만 겹친 건 절대 '강함'으로 올리지 않는다. 틀린 확신이 공백보다 위험하다. */
  if(loose.length){
    return { status:'partial', ids: loose.map(s => s.id), note:'역량 이름이 일부만 겹칩니다 — 직접 확인하세요' };
  }
  return { status:'gap', ids:[], note:null };
}

  if((P.gaps || []).length){
    out += `<div class="panel"><h2 class="sec">기록 없는 기간</h2>` +
      P.gaps.map(g => `<div class="conf">
        <div class="q">${fmtYm(g.start)} – ${fmtYm(g.end)} · ${fmtDur(g.months)}</div>
        <div style="display:grid;grid-template-columns:200px 1fr;gap:10px">
          <div class="fld" style="margin:0"><label>사유</label>
            <input value="${esc(g.reason||'')}" data-gap="${g.id}" data-gk="reason"
              placeholder="예: 이직 준비"></div>
          <div class="fld" style="margin:0"><label>이력서에 쓸 한 줄</label>
            <input value="${esc(g.explanation||'')}" data-gap="${g.id}" data-gk="explanation"
              placeholder="예: 데이터 엔지니어링 전환 준비 및 학습"></div>
        </div></div>`).join('') +
      `<p class="hint">공백 자체는 문제가 아닙니다. 설명이 준비되지 않은 공백이 문제입니다.</p></div>`;
  }

  /* 추론 항목 */
  if(h.inferred.length){
    out += `<div class="panel"><h2 class="sec">확인이 필요한 추론 항목</h2>
      <p class="hint">원본 문서에 명시되지 않아 추론으로 들어온 값입니다. 맞는지 확인하고 고치세요.</p>` +
      h.inferred.map(x => `<div class="roster-row">
        <div class="per">${esc(x.id)}</div>
        <div class="who">${esc(x.title || x.org || '')}${x.team ? ' / ' + esc(x.team) : ''}</div>
        <div class="dur"><button class="btn sm" data-confirm="${x.id}">확인함</button></div>
      </div>`).join('') + `</div>`;
  }

  /* 추출 품질 */
  const bad = P.sources.filter(s => s.extractionQuality && s.extractionQuality !== 'good');
  if(bad.length){
    out += `<div class="panel"><h2 class="sec">제대로 읽히지 않은 문서</h2>` +
      bad.map(s => `<div class="roster-row">
        <div class="per">${esc(s.extractionQuality)}</div>
        <div class="who">${esc(s.filename)}</div>
        <div class="dur">${esc(s.extractionMethod||'')}</div></div>`).join('') +
      `<p class="hint">이 문서들에 들어 있던 경력이 통째로 빠졌을 수 있습니다. 원본을 다시 확인하세요.</p></div>`;
  }

  /* 만료 자격증 */
  if(h.expiredCerts.length){
    out += `<div class="panel"><h2 class="sec">만료된 자격증</h2>` +
      h.expiredCerts.map(c => `<div class="roster-row">
        <div class="per">${fmtYm(c.expiresAt)} 만료</div>
        <div class="who">${esc(c.name)}${c.issuer ? ' <em>/ ' + esc(c.issuer) + '</em>' : ''}</div>
        <div class="dur"></div></div>`).join('') +
      `<p class="hint">만료된 자격증을 이력서에 그대로 두는 건 흔한 사고입니다.</p></div>`;
  }

  /* 빈 성과 필드 */
  const fill = [];
  if(h.noAction.length) fill.push(['행동이 비어 있는 성과', h.noAction]);
  if(h.noMetric.length) fill.push(['수치가 없는 성과', h.noMetric]);
  if(h.noRole.length)   fill.push(['내 역할이 안 적힌 성과', h.noRole]);
  if(h.noEvid.length)   fill.push(['출처 없는 성과', h.noEvid]);
  if(fill.length){
    out += `<div class="panel"><h2 class="sec">채우면 이력서가 강해지는 곳</h2>` +
      fill.map(([label, list]) => `<div class="roster-row">
        <div class="per">${list.length}건</div>
        <div class="who">${label}</div>
        <div class="dur"><button class="btn sm" data-goto="${list[0].id}">첫 항목으로</button></div>
      </div>`).join('') + `</div>`;
  }

  return out || `<div class="panel"><div class="empty">
    <strong>지금 점검할 게 없습니다</strong>충돌도 없고, 빈 칸도 없고, 설명 없는 공백기도 없습니다.</div></div>`;
}

function findTarget(P, c){
  const pool = { experience:P.experiences, achievement:P.achievements, skill:P.skills }[c.targetType] || [];
  const t = pool.find(o => o.id === c.targetId);
  if(!t) return c.targetId;
  return t.org ? t.org + (t.title ? ' · ' + t.title : '') : (t.title || t.name || t.id);
}

/* ---------- 뷰: 이력 사항 (학력·자격·수상·프로젝트·출처) -------------- */
/* 보통 직장인이 쓰는 순서. 저서·논문·활동은 있는 사람만 쓴다. */

  ['education',      '학력',      e => `${e.school||''} ${e.major||''} ${e.degree||''}`.trim(),
                                  e => `${fmtYm(e.start)} – ${fmtYm(e.end)}`],

                                  a => (a.issuer ? a.issuer + ' · ' : '') + fmtYm(a.date)],

/* 학력·자격증은 누구나 쓴다. 나머지는 넣은 사람에게만 보이면 된다.
   보통 직장인에게 저서·논문 칸이 맨 앞에 있으면 남의 도구처럼 느껴진다. */

let showAllRecords = false;

        <div class="wk-nav"><button class="btn sm" data-add="references">추가</button></div></div>
      ${referenceRows(P)}

    ${P.experiences.length ? `<div class="panel">

      ${proofSummary(P)}
      <p class="hint" style="margin-top:10px">경력증명서는 퇴사 후 시간이 지나면 발급이 까다로워집니다.
        지금 확인해 두는 편이 낫습니다.</p>
    </div>` : ''}`;

  const hidden = RECORD_KINDS.filter(([k]) =>

  const kinds = RECORD_KINDS.filter(([k]) => !hidden.some(h => h[0] === k))

    const list = P[kind] || [];
    const rows = list.map(x => {
      let flag = '';
      if(kind === 'certifications'){
        const ex = mi(x.expiresAt);
        if(ex !== null) flag = ex < nowMi()
          ? ` <span class="pill seal">${fmtYm(x.expiresAt)} 만료됨</span>`
          : ` <span class="pill">${fmtYm(x.expiresAt)}까지</span>`;
      }
      return `<div class="roster-row">
        <div class="per">${esc(sub(x) || '')}</div>
        <div class="who"><b>${esc(main(x) || '(제목 없음)')}</b>${flag}</div>
        <div class="dur"><button class="btn ghost sm" data-edit="${kind}" data-eid="${x.id}">편집</button></div>
      </div>`;
    }).join('');

    return `<div class="panel">
      <h2 class="sec">${label}
        <button class="btn sm" data-add="${kind}"
          style="float:right;text-transform:none;letter-spacing:0">추가</button></h2>
      ${rows || `<p class="hint" style="margin:0">아직 없습니다.</p>`}
      ${kind === 'certifications' && list.length
        ? '<p class="hint" style="margin-top:10px">만료된 자격증은 Word 이력서에서 자동으로 빠집니다.</p>' : ''}
      ${kind === 'sources' && list.length
        ? '<p class="hint" style="margin-top:10px">성과의 근거 인용은 이 문서들을 가리킵니다. 지우면 근거가 끊깁니다.</p>' : ''}
    </div>`;
  }).join('');

  /* 레퍼런스·증빙은 이직을 준비할 때 쓴다. 처음 오는 사람에게 맨 위일 이유가 없다. */
  return kinds + senior + (hidden.length ? `<p class="hint" style="margin-top:4px">
    ${hidden.map(h => esc(h[1])).join(' · ')}는 넣은 내용이 없어 접어 뒀습니다 —
    <b data-showrec="1" style="cursor:pointer;text-decoration:underline">펼치기</b></p>`
    : (showAllRecords ? `<p class="hint" style="margin-top:4px">
    <b data-showrec="0" style="cursor:pointer;text-decoration:underline">빈 항목 접기</b></p>` : ''));
}


/* ===== 07-weekly.js ===== */
/* ============================================================
   주간 운영 — 기록 · 보고서 · 통계
   entries[]가 원자 단위다. 여기 한 번 넣으면
   보고서와 통계는 집계로 나오고, 중요한 것만 성과로 올라간다.
   같은 내용을 두 번 적게 만들면 아무도 앱을 쓰지 않는다.
   ============================================================ */

/* 유형 색.
   빨강·파랑을 섞으면 경고인지 분류인지 헷갈린다.
   맑음(청록)에서 갈라져 나오는 한 색조로 두고, 밝기와 채도로만 구분한다. */
const ENTRY_TYPES = [
  ['work',          '업무',   '#0F5F57'],
  ['lecture',       '강의',   '#3E8C74'],
  ['participation', '참여',   '#6FA894'],
  ['learning',      '학습',   '#9BC0B2'],
  ['other',         '기타',   '#B9C3BE']
];
const TYPE_LABEL = Object.fromEntries(ENTRY_TYPES.map(t => [t[0], t[1]]));
const TYPE_TONE  = Object.fromEntries(ENTRY_TYPES.map(t => [t[0], t[2]]));

/* ---------- 주 계산 (ISO 8601) ----------
   월요일 시작, 목요일이 속한 해가 그 주의 연도다.
   연말·연초에 주차가 어긋나는 사고를 막으려면 이 규칙을 지켜야 한다. */
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseYmd(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim());
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function normYmd(s){
  s = String(s || '').trim();
  if(!s) return null;
  const m = /^(\d{2,4})\s*[-./년]?\s*(\d{1,2})\s*[-./월]?\s*(\d{1,2})/.exec(s);
  if(!m) return null;
  let y = +m[1]; if(y < 100) y += 2000;
  return y + '-' + pad(Math.min(12, Math.max(1, +m[2]))) + '-' + pad(Math.min(31, Math.max(1, +m[3])));
}
function weekKey(dateStr){
  const d = parseYmd(dateStr);
  if(!d) return null;
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - y0) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + '-W' + pad(wk);
}
function weekMonday(key){
  const m = /^(\d{4})-W(\d{1,2})$/.exec(key || '');
  if(!m) return null;
  const jan4 = new Date(+m[1], 0, 4);
  const mon1 = new Date(jan4); mon1.setDate(jan4.getDate() - ((jan4.getDay() || 7) - 1));
  const d = new Date(mon1); d.setDate(mon1.getDate() + (+m[2] - 1) * 7);
  return d;
}
function weekLabel(key){
  const mon = weekMonday(key);
  if(!mon) return key;
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const f = d => (d.getMonth()+1) + '.' + d.getDate();
  return `${mon.getFullYear()}년 ${(+key.split('W')[1])}주  ${f(mon)} – ${f(sun)}`;
}
function shiftWeek(key, n){
  const mon = weekMonday(key);
  if(!mon) return key;
  mon.setDate(mon.getDate() + n * 7);
  return weekKey(ymd(mon));
}
function thisWeek(){ return weekKey(ymd(new Date())); }

const DOW = ['일','월','화','수','목','금','토'];

/* ---------- 용어 ----------
   점검/적발, 영업/수주, 면접/채용확정 — 하는 일마다 말이 다르다.
   "중요 표시"로 뭉뚱그리면 보고서가 남의 말처럼 읽힌다. */
function termOf(P, key){
  const t = (P && P.profile && P.profile.terms) || {};
  if(key === 'activity') return (t.activity || '').trim() || '기록';
  if(key === 'flag')     return (t.flag || '').trim() || '중요 표시';
  return '';
}

/* ---------- 집계 ---------- */
function entriesOfWeek(P, key){
  return (P.entries || []).filter(e => weekKey(e.date) === key)
    .sort((a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

function tally(list){
  const t = { count:list.length, hours:0, byType:{}, lectures:0, audience:0,
              hasHours:false, promoted:0, important:0 };
  ENTRY_TYPES.forEach(([k]) => t.byType[k] = { count:0, hours:0 });
  list.forEach(e => {
    const ty = t.byType[e.type] || (t.byType[e.type] = { count:0, hours:0 });
    ty.count++;
    const h = Number(e.hours);
    if(isFinite(h) && h > 0){ t.hours += h; ty.hours += h; t.hasHours = true; }
    if(e.type === 'lecture'){
      t.lectures++;
      const a = Number(e.audience);
      if(isFinite(a) && a > 0) t.audience += a;
    }
    if(e.promotedTo) t.promoted++;
    if(e.important) t.important++;
  });
  t.hours = Math.round(t.hours * 10) / 10;
  return t;
}

function fmtHours(h){
  if(!h) return '0';
  return (Math.round(h * 10) / 10).toString().replace(/\.0$/, '');
}

/* ---------- 뷰: 주간 기록 ---------- */
let curWeek = null;

function viewLog(P){
  if(!curWeek) curWeek = thisWeek();
  const list = entriesOfWeek(P, curWeek);
  const t = tally(list);
  const isNow = curWeek === thisWeek();

  const expOpts = P.experiences.slice()
    .sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0))
    .map(e => `<option value="${e.id}">${esc(e.org)}${e.title?' · '+esc(e.title):''}</option>`).join('');

  if(inputMode === 'file') return fileBox(P) + logBody(P, list, t, isNow) + mobileQuickBar(P);
  if(inputMode === 'bulk') return bulkBox(P) + logBody(P, list, t, isNow) + mobileQuickBar(P);
  if(inputMode === 'grid') return gridBox(P) + logBody(P, list, t, isNow) + mobileQuickBar(P);

  const form = `<div class="panel quick">
    <div class="wk-head">
      <h2 class="sec" style="margin:0">기록 추가</h2>
      ${modeSwitch('one')}
    </div>
    <p class="pc-note">자세한 칸은 화면이 넓을 때 편합니다.
      휴대폰에서는 <b>아래 입력줄</b>로 한 줄씩 적고, 나머지는 PC에서 채우세요.</p>
    <div class="entry-form pc-only">
      <div class="ef ef-date"><label for="eDate">날짜</label>
        <input id="eDate" value="${ymd(new Date())}" placeholder="2026-08-06" inputmode="numeric"></div>
      <div class="ef ef-type"><label for="eType">유형</label>
        <select id="eType">${ENTRY_TYPES.map(([k,l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="ef ef-hours"><label for="eHours">시간</label>
        <input id="eHours" type="number" step="0.5" min="0" placeholder="2.5"></div>
      <div class="ef ef-aud"><label for="eAud">인원</label>
        <input id="eAud" type="number" min="0" placeholder="강의 시"></div>
      <div class="ef ef-title"><label for="eTitle">한 일</label>
        <input id="eTitle" placeholder="예: ○○기업 데이터 분석 실무 강의 3차시"></div>
      <div class="ef ef-detail"><label for="eDetail">내용 · 결과</label>
        <textarea id="eDetail" rows="2" placeholder="세부 내용이나 결과. 나중에 채워도 됩니다"></textarea></div>
      <div class="ef ef-org"><label for="eOrg">소속</label>
        <select id="eOrg"><option value="">— 없음 —</option>${expOpts}</select></div>
      ${axisInputs(P)}
      <div class="ef ef-act">
        <label class="chk"><input type="checkbox" id="eWeek"> 날짜 대신 주 단위로</label>
        <label class="chk"><input type="checkbox" id="eImp"> ${esc(termOf(P,'flag'))}</label>
        <button class="btn primary" id="btnEntryAdd">기록</button></div>
    </div>
    <p class="hint" style="margin:10px 0 0">시간과 인원은 통계에 쓰입니다. 모르면 비워두세요 —
      빈 칸은 통계에서 빠질 뿐이고, 대충 넣은 숫자는 보고서를 망칩니다.</p>
  </div>`;

  return form + logBody(P, list, t, isNow) + mobileQuickBar(P);
}

function logBody(P, list, t, isNow){
  if(!list.length){
    return `<div class="panel"><div class="empty">
      <strong>${esc(weekLabel(curWeek))}</strong>이 주에는 기록이 없습니다.
      <div style="margin-top:16px">${weekNav(isNow)}</div></div></div>`;
  }

  /* 날짜를 지정한 것은 날짜별로, 주 단위로 적은 것은 따로 묶는다. */
  const weekly = list.filter(e => e.dateMode === 'week');
  const dated  = list.filter(e => e.dateMode !== 'week');
  const days = {};
  dated.forEach(e => (days[e.date] = days[e.date] || []).push(e));

  let rows = '';
  if(weekly.length){
    const wt = tally(weekly);
    rows += `<div class="day"><div class="day-h"><b>주중</b>
      <span>날짜 미지정</span>
      <i>${wt.count}건${wt.hasHours ? ' · ' + fmtHours(wt.hours) + '시간' : ''}</i></div>
      ${weekly.map(e => entryRow(P, e)).join('')}</div>`;
  }
  rows += Object.keys(days).sort().map(dt => {
    const d = parseYmd(dt);
    const dayT = tally(days[dt]);
    return `<div class="day">
      <div class="day-h"><b>${d ? (d.getMonth()+1)+'.'+d.getDate() : dt}</b>
        <span>${d ? DOW[d.getDay()] : ''}</span>
        <i>${dayT.count}건${dayT.hasHours ? ' · ' + fmtHours(dayT.hours) + '시간' : ''}</i></div>
      ${days[dt].map(e => entryRow(P, e)).join('')}
    </div>`;
  }).join('');

  const sum = `<div class="wk-sum">
    ${ENTRY_TYPES.filter(([k]) => t.byType[k].count).map(([k,l]) =>
      `<div><span class="dot" style="background:${TYPE_TONE[k]}"></span>${l}
        <b>${t.byType[k].count}</b>${t.byType[k].hours ? `<i>${fmtHours(t.byType[k].hours)}h</i>` : ''}</div>`).join('')}
    ${t.hasHours ? `<div class="tot">합계 <b>${fmtHours(t.hours)}</b>시간</div>` : ''}
    ${t.lectures ? `<div class="tot">강의 <b>${t.lectures}</b>회${t.audience ? ` · 수강 <b>${t.audience}</b>명` : ''}</div>` : ''}
  </div>`;

  return `<div class="panel">
    <div class="wk-head">
      <h2 class="sec" style="margin:0">${esc(weekLabel(curWeek))}</h2>
      ${weekNav(isNow)}
    </div>
    ${sum}
    ${rows}
  </div>`;
}

/**
 * 분석 축 입력칸.
 * 축이 엑셀 가져오기로만 들어오면 직접 적는 사람은 분석 화면을 영영 못 쓴다.

/* 통계 뷰는 07b-stats.js로 옮겼다. 역량별 투입만 여기 남긴다. */
function chartSkills(P){
  const map = {};
  (P.entries || []).forEach(e => (e.skillIds || []).forEach(id => {
    const h = Number(e.hours);
    map[id] = map[id] || { h:0, n:0 };
    map[id].n++;
    if(isFinite(h) && h > 0) map[id].h += h;
  }));
  const rows = Object.keys(map).map(id => ({
    name: (P.skills.find(s => s.id === id) || {}).name || id,
    h: map[id].h, n: map[id].n
  })).sort((a,b) => (b.h - a.h) || (b.n - a.n)).slice(0, 12);

  if(!rows.length) return `<div class="panel"><h2 class="sec">역량별 투입</h2>
    <p class="hint" style="margin:0">기록에 역량을 연결하면 여기 쌓입니다.
      기록 편집에서 "이 일이 쓴 역량"을 고르세요. 이게 쌓이면 이력서에서 "몇 시간 했다"고 말할 수 있게 됩니다.</p></div>`;

  const max = Math.max(1, ...rows.map(r => r.h || r.n));
  return `<div class="panel"><h2 class="sec">역량별 투입</h2>
    ${rows.map(r => `<div class="skrow">
      <div class="nm">${esc(r.name)}</div>
      <div class="skbar"><i style="width:${Math.round((r.h||r.n)/max*100)}%"></i></div>
      <div class="skmeta">${r.h ? fmtHours(r.h)+'시간 · ' : ''}${r.n}건</div>
    </div>`).join('')}</div>`;
}

function promoteEntry(P, entryId){
  const e = (P.entries || []).find(x => x.id === entryId);
  if(!e) return null;

  const a = {
    id: nextId(P.achievements, 'ach'),
    experienceId: e.experienceId || null,
    date: String(e.date || '').slice(0,7) || unmi(nowMi()),
    title: e.title || '',
    situation: null, task: null,
    action: e.detail || null,
    result: e.outcome || null,
    metrics: (e.metrics || []).slice(),
    scope: { teamSize:null, role:null, budget:null },
    skillIds: (e.skillIds || []).slice(),
    evidence: [{ sourceId:'entry:' + e.id,
                 quote: [e.title, e.detail].filter(Boolean).join(' — '),
                 location: e.dateMode === 'week' ? weekLabel(weekKey(e.date)) : e.date }],
    confidence: 'stated',
    userEdited: true
  };

  return a;
}

/* ============================================================
   주간 일괄 입력
   금요일 오후에 한 주를 몰아 적는 게 실제 패턴이다.
   그때 사람은 "화요일이었나 수요일이었나"를 기억하지 못한다.
   그래서 날짜 없이도 기록되게 하고, 대신 파싱 결과를 반드시 보여준다.
   조용히 잘못 해석하는 것이 입력을 조금 불편하게 하는 것보다 나쁘다.
   ============================================================ */

const TYPE_WORDS = {
  '업무':'work', '작업':'work', '개발':'work',
  '강의':'lecture', '강연':'lecture', '교육':'lecture', '강좌':'lecture', '수업':'lecture',
  '참여':'participation', '참석':'participation', '회의':'participation',
  '미팅':'participation', '행사':'participation', '면담':'participation',
  '학습':'learning', '공부':'learning', '스터디':'learning', '독서':'learning',
  '기타':'other'
};

/**
 * 한 줄을 기록 하나로 해석한다. 못 알아본 부분은 제목에 그대로 남긴다.
 * opts.keepDate — 날짜 해석을 건너뛴다. 표 입력처럼 칸이 날짜를 정하는 경우에 쓴다.
 *   이걸 켜지 않으면 "8/7 릴리스 준비" 같은 제목에서 8/7이 사라진다.
 */
function parseEntryLine(raw, weekKeyStr, opts){
  opts = opts || {};
  let s = String(raw).replace(/\s+/g, ' ').trim();
  if(!s) return null;

  const out = { type:null, title:'', hours:null, audience:null,
                important:false, date:null, dateMode:'week', warn:[] };

  if(/^[*★•·]\s*/.test(s)){ out.important = true; s = s.replace(/^[*★•·]\s*/, ''); }

  /* 파이프로 나눠 적었으면 그 구획을 살려 읽는다 */
  if(s.includes('|')){
    const parts = s.split('|').map(x => x.trim()).filter(Boolean);
    const rest = [];
    parts.forEach(seg => {
      const t = TYPE_WORDS[seg];
      if(t && !out.type){ out.type = t; return; }
      rest.push(seg);
    });
    s = rest.join(' ');
  }

  /* 날짜: 8/4, 8.4, 08-04, 4일 — 단 "이 주 안의 날짜"만 인정한다.
     이 제한이 없으면 "Airflow 3.0"의 3.0을 3월 0일로 읽는다.
     주 단위로 몰아 적는 화면이니, 이 주 밖의 날짜는 날짜가 아닐 확률이 높다. */
  const mon = weekMonday(weekKeyStr);
  const sun = mon ? new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6) : null;
  const inWeek = dt => mon && sun && dt >= mon && dt <= sun;

  const tryDate = (mm, dd) => {
    if(!mon || mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
    let y = mon.getFullYear();
    if(mon.getMonth() === 11 && mm === 1) y += 1;          // 연말 주에 1월 날짜
    else if(mon.getMonth() === 0 && mm === 12) y -= 1;     // 연초 주에 12월 날짜
    const d = new Date(y, mm - 1, dd);
    if(d.getMonth() !== mm - 1) return null;               // 2월 30일 같은 값 걸러내기
    return d;
  };

  let m = opts.keepDate ? null : /(?:^|\s)(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?=\s|$)/.exec(s);
  if(m){
    const d = tryDate(+m[1], +m[2]);
    if(d && inWeek(d)){ out.date = ymd(d); out.dateMode = 'day'; s = s.replace(m[0], ' '); }
    else if(d){ out.warn.push('날짜가 이 주 밖 → 주 단위로 둠'); }
  }
  if(!opts.keepDate && out.dateMode === 'week'){
    m = /(?:^|\s)(\d{1,2})\s*일(?=\s|$)/.exec(s);
    if(m && mon){
      const d = tryDate(mon.getMonth() + 1, +m[1]) ||
                tryDate(sun.getMonth() + 1, +m[1]);
      if(d && inWeek(d)){ out.date = ymd(d); out.dateMode = 'day'; s = s.replace(m[0], ' '); }
      else if(d){ out.warn.push('날짜가 이 주 밖 → 주 단위로 둠'); }
    }
  }

  /* 시간: 3h / 3시간 / 2.5시간 / 1.5H */
  m = /(?:^|\s)(\d+(?:\.\d+)?)\s*(?:h|H|시간)(?=\s|$)/.exec(s);
  if(m){ out.hours = Number(m[1]); s = s.replace(m[0], ' '); }

  /* 인원: 28명 */
  m = /(?:^|\s)(\d+)\s*명(?=\s|$)/.exec(s);
  if(m){ out.audience = Number(m[1]); s = s.replace(m[0], ' '); }

  /* 유형 키워드는 "맨 앞 한 단어"만 본다.
     "컨설턴트 스터디 — 제조 직군" 같은 제목에서 스터디를 빼앗아가지 않으려면 이 제한이 필요하다. */
  if(!out.type){
    const words = s.trim().split(' ');
    const head = (words[0] || '').replace(/[\[\]():·]/g, '');
    if(TYPE_WORDS[head]){ out.type = TYPE_WORDS[head]; words.shift(); s = words.join(' '); }
  }

  out.title = s.replace(/\s+/g, ' ').trim();
  if(!out.type){ out.type = 'work'; out.warn.push('유형 없음 → 업무로 봄'); }
  if(!out.title){ return null; }
  if(out.type === 'lecture' && !out.audience) out.warn.push('인원 없음');
  if(out.hours === null) out.warn.push('시간 없음');
  return out;
}

  return String(text || '').split(/\r?\n/).map(l => parseEntryLine(l, weekKeyStr)).filter(Boolean);

/* ============================================================
   주간 표 입력
   요일 칸에 한 줄씩 적는 방식. 한 주를 한눈에 보며 채울 수 있다.
   추가만 한다 — 기존 기록까지 표에 올려 편집하게 만들면
   어느 줄이 어느 기록인지 추적해야 하고, 거기서 기록이 조용히 사라진다.
   ============================================================ */
function gridBox(P){
  const wk = curWeek || thisWeek();
  const mon = weekMonday(wk);
  const existing = entriesOfWeek(P, wk);

  const expOpts = P.experiences.slice()
    .sort((a,b) => (spanOf(b)?.[0]||0) - (spanOf(a)?.[0]||0))
    .map(e => `<option value="${e.id}">${esc(e.org)}${e.title?' · '+esc(e.title):''}</option>`).join('');

  const cell = (slot, label, sub, cls) => {
    let has = 0;
    if(slot === 'w') has = existing.filter(e => e.dateMode === 'week').length;
    else {
      const d = new Date(mon); d.setDate(mon.getDate() + slot);
      has = existing.filter(e => e.dateMode !== 'week' && e.date === ymd(d)).length;
    }
    return `<div class="gcell ${cls||''}">
      <label for="g-${slot}"><b>${label}</b><span>${sub}</span>
        ${has ? `<i>기록 ${has}</i>` : ''}</label>
      <textarea id="g-${slot}" data-grid="${slot}" rows="4"
        placeholder="한 줄에 하나"></textarea>
    </div>`;
  };

  const wd = [];
  for(let i = 0; i < 5; i++){
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    const today = ymd(d) === ymd(new Date());
    wd.push(cell(i, DOW[d.getDay()], (d.getMonth()+1)+'.'+d.getDate(), today ? 'today' : ''));
  }
  const we = [];
  for(let i = 5; i < 7; i++){
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    we.push(cell(i, DOW[d.getDay()], (d.getMonth()+1)+'.'+d.getDate(), 'wknd'));
  }
  we.push(cell('w', '주중', '날짜 기억 안 날 때', 'wk'));

  return `<div class="panel quick">
    <div class="wk-head">
      <h2 class="sec" style="margin:0">주간 표 입력 — ${esc(weekLabel(wk))}</h2>
      ${modeSwitch('grid')}
    </div>
    <p class="hint" style="margin:0 0 10px">칸마다 한 줄에 하나씩 적으세요.
      <b>강의 3h 28명</b> 같은 표기를 그대로 쓸 수 있습니다. 날짜는 칸이 정해주니 적지 않아도 됩니다.</p>
    <div class="grid-week">${wd.join('')}</div>
    <div class="grid-week grid-tail">${we.join('')}</div>
    <div class="quick-row">
      <select id="gridExp" aria-label="소속 (전체 적용)">
        <option value="">— 소속 없음 —</option>${expOpts}</select>
      <button class="btn primary" id="btnGridAdd">미리보기 확인 후 등록</button>
    </div>
    <div id="gridPreview"></div>
    <p class="hint" style="margin:10px 0 0">이 표는 <b>추가만</b> 합니다.
      이미 들어간 기록은 아래 목록에서 편집하세요. ${weekNav(wk === thisWeek()).replace(/class="wk-nav"/,'class="wk-nav" style="display:inline-flex;margin-left:6px;vertical-align:-4px"')}</p>
  </div>`;
}

/** 표에서 읽어낸 것들. 날짜는 칸이 결정하므로 줄에서 읽은 날짜는 무시한다. */
function collectGrid(){
  const wk = curWeek || thisWeek();
  const mon = weekMonday(wk);
  const rows = [];
  document.querySelectorAll('[data-grid]').forEach(n => {
    const slot = n.dataset.grid;
    let date, dateMode;
    if(slot === 'w'){ date = ymd(mon); dateMode = 'week'; }
    else { const d = new Date(mon); d.setDate(mon.getDate() + (+slot)); date = ymd(d); dateMode = 'day'; }

    String(n.value || '').split(/\r?\n/).forEach(line => {
      const r = parseEntryLine(line, wk, { keepDate:true });
      if(!r) return;
      r.date = date; r.dateMode = dateMode;
      r.slot = slot;
      rows.push(r);
    });
  });
  rows.sort((a,b) => (a.dateMode === 'week' ? 1 : 0) - (b.dateMode === 'week' ? 1 : 0)
                     || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return rows;

/* ============================================================
   통계 2세대
   "이어가고 덧붙여진다"를 눈에 보이게 만드는 게 목적이다.
   한 주치 막대만 보면 쌓인다는 감각이 오지 않는다.
   그래서 누적 곡선 · 연속 기록 · 활동 히트맵 · 연도별 비교를 둔다.

   집계는 저장하지 않는다. entries[]에서 매번 다시 계산한다.
   저장된 합계는 원본이 바뀌면 조용히 틀려진다.
   ============================================================ */

const UNITS = [
  ['week',    '주',   '주간'],
  ['month',   '월',   '월간'],
  ['quarter', '분기', '분기'],
  ['year',    '연',   '연간']
];

function periodKey(dateStr, unit){
  if(unit === 'all') return 'ALL';          // 전체 기간은 칸이 하나뿐이다
  const d = parseYmd(dateStr);
  if(!d) return null;
  if(unit === 'week')  return weekKey(dateStr);
  if(unit === 'month') return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  if(unit === 'quarter') return d.getFullYear() + '-Q' + (Math.floor(d.getMonth() / 3) + 1);
  return String(d.getFullYear());
}

function periodLabel(key, unit){
  if(unit === 'all') return '전체 기간';
  if(unit === 'week') return weekLabel(key);
  if(unit === 'month') return key.replace('-', '년 ') + '월';
  if(unit === 'quarter') return key.replace('-Q', '년 ') + '분기';
  return key + '년';
}
function periodShort(key, unit){
  if(unit === 'all') return '전체';
  if(unit === 'week'){
    const m = weekMonday(key);
    return m ? (m.getMonth() + 1) + '/' + m.getDate() : key;
  }
  if(unit === 'month') return key.slice(2).replace('-', '.');
  if(unit === 'quarter') return key.slice(2);
  return key;
}

function shiftPeriod(key, unit, n){
  if(unit === 'all') return 'ALL';
  if(unit === 'week') return shiftWeek(key, n);
  if(unit === 'month'){
    const [y, m] = key.split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  if(unit === 'quarter'){
    const [y, q] = key.split('-Q').map(Number);
    let t = (y * 4 + (q - 1)) + n;
    return Math.floor(t / 4) + '-Q' + (t % 4 + 1);
  }
  return String(Number(key) + n);
}
function currentPeriod(unit){
  return unit === 'all' ? 'ALL' : periodKey(ymd(new Date()), unit);
}

/** 기간별로 묶는다. 기록이 없는 기간도 빈 칸으로 채워야 흐름이 끊겨 보인다. */
function bucketize(P, unit, count){
  const map = {};
  (P.entries || []).forEach(e => {
    const k = periodKey(e.date, unit);
    if(k) (map[k] = map[k] || []).push(e);
  });

  const keys = [];
  let k = currentPeriod(unit);
  for(let i = 0; i < count; i++){ keys.unshift(k); k = shiftPeriod(k, unit, -1); }

  return keys.map(key => ({ key, unit, list: map[key] || [], t: tally(map[key] || []) }));
}

/** 처음 기록부터 지금까지 누적. 쌓인다는 감각은 이 곡선에서만 나온다. */
function cumulative(P, unit){
  const map = {};
  (P.entries || []).forEach(e => {
    const k = periodKey(e.date, unit);
    if(k) (map[k] = map[k] || []).push(e);
  });
  const keys = Object.keys(map).sort();
  if(!keys.length) return [];

  let k = keys[0];
  const last = currentPeriod(unit);
  const out = [];
  let accCount = 0, accHours = 0, accAud = 0, accProm = 0, guard = 0;

  while(guard++ < 800){
    const t = tally(map[k] || []);
    accCount += t.count; accHours += t.hours; accAud += t.audience; accProm += t.promoted;
    out.push({ key:k, unit, count:accCount, hours:Math.round(accHours*10)/10,
               audience:accAud, promoted:accProm, add:t });
    if(k === last) break;
    k = shiftPeriod(k, unit, 1);
  }
  return out;
}

/** 연속 기록. 이어가는 것 자체가 이 앱에서 가장 중요한 습관이다. */
function streaks(P, unit){
  const has = {};
  (P.entries || []).forEach(e => { const k = periodKey(e.date, unit); if(k) has[k] = true; });
  const keys = Object.keys(has);
  if(!keys.length) return { current:0, best:0, total:0 };

  const cur = currentPeriod(unit);
  const prev = shiftPeriod(cur, unit, -1);

  /* 이번 기간이 아직 비어 있어도 직전까지 이어졌으면 끊긴 것으로 보지 않는다.
     월요일 아침에 "연속 0주"라고 뜨면 그만두게 된다. */
  let start = has[cur] ? cur : (has[prev] ? prev : null);
  let current = 0;
  if(start){
    let k = start;
    while(has[k]){ current++; k = shiftPeriod(k, unit, -1); }
  }

  const sorted = keys.sort();
  let best = 0, run = 0, prevK = null;
  sorted.forEach(k => {
    run = (prevK && shiftPeriod(prevK, unit, 1) === k) ? run + 1 : 1;
    best = Math.max(best, run);
    prevK = k;
  });
  return { current, best, total: keys.length };
}
